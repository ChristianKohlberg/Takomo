<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>takomo · inbox</title>
<style>
  /* ---- Aquarelle tokens (shared with the board; light default + dark) ---- */
  :root {
    --bg: #eef1f4; --panel: #ffffff; --col-bg: #f7fafc; --text: #14202a;
    --muted: #6e7c88; --muted2: #93a2ac; --ink2: #3a4a56; --border: #e6ecf0; --border-soft: #eef2f5;
    --accent: #1f4e78; --accent2: #2f6ba0; --accent-ink: #173d5e;
    --shadow: 0 18px 50px -26px rgba(20,40,55,.28);
    --crit: #b4543f; --crit-border: #e3cdc6; --ok: #3f7a5f; --warn: #c99a3a;
    --ok-tint: rgba(63,122,95,.15); --ok-tint-0: rgba(63,122,95,0);
    --high: #2f6ba0; --normal: #5b8bb5; --low: #7d8a95; --gaugeoff: #cfd9e2;
    --chip-bg: #eaf2f9; --chip-text: #2f6ba0; --sel: #eef5fb; --sel-border: #cfe0ee; --hover: #f2f6fa;
    --dark: #14202a; --dark-ink: #eaf0f4; --dark-sub: #9db8d4;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e141b; --panel: #141d27; --col-bg: #101821; --text: #e6eef5;
      --muted: #8ba0b0; --muted2: #6f8291; --ink2: #c3d2de; --border: #26313d; --border-soft: #1e2833;
      --accent: #4c8dff; --accent2: #6ea8ff; --accent-ink: #7fb2ff;
      --shadow: 0 18px 50px -26px rgba(0,0,0,.6);
      --crit: #e0836f; --crit-border: #5c3a33; --ok: #5fbf8f; --warn: #d8b25e;
      --ok-tint: rgba(95,191,143,.18); --ok-tint-0: rgba(95,191,143,0);
      --high: #6ea8ff; --normal: #7fa8d4; --low: #8494a1; --gaugeoff: #33414f;
      --chip-bg: #1a2836; --chip-text: #8fb6dc; --sel: #16263a; --sel-border: #2b4a63; --hover: #17212c;
      --dark: #05090e; --dark-ink: #e6eef5; --dark-sub: #7fa8d4;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; height: 100vh;
  }
  .tk-scroll::-webkit-scrollbar { width: 9px; height: 9px; }
  .tk-scroll::-webkit-scrollbar-thumb { background: var(--gaugeoff); border-radius: 6px; }
  .tk-scroll::-webkit-scrollbar-track { background: transparent; }
  @keyframes tkSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes tkPulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  @keyframes tkFade { from { opacity: 0; } to { opacity: 1; } }
  /* Answer → next: the finished item slides out to the left, then the next one
     slides in from the right — a clear directional "this one's done, moving on". */
  @keyframes tkOut { to { opacity: 0; transform: translateX(-30px) scale(.985); } }
  @keyframes tkIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
  .readscroll.outgoing { animation: tkOut .18s ease forwards; pointer-events: none; }
  .readscroll.advance { animation: tkIn .26s cubic-bezier(.2,.7,.3,1); }
  /* A brief "✓ done" badge over the pane during the hand-off. */
  @keyframes tkDone { 0% { opacity: 0; transform: translate(-50%, -6px) scale(.9); } 22% { opacity: 1; transform: translate(-50%, 0) scale(1); } 78% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -6px); } }
  .donecue { position: absolute; top: 46%; left: 50%; transform: translate(-50%,0); z-index: 40; display: inline-flex; align-items: center; gap: 9px; background: var(--dark); color: var(--dark-ink); padding: 10px 16px; border-radius: 999px; box-shadow: 0 18px 40px -16px rgba(0,0,0,.5); font-size: 13.5px; font-weight: 680; pointer-events: none; animation: tkDone .42s ease forwards; }
  .donecue .chk { width: 18px; height: 18px; border-radius: 50%; background: var(--ok); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
  /* "It landed": when the answer is actually written, the confirmation happens in
     the data rather than in a floating toast — the answered row and the Answered
     folder tint green for a moment and carry a ✓. Uses an inset box-shadow rather
     than background-color so it composites over whatever the row's own resting
     background is (selected, active, hover) and fades back to it cleanly. */
  @keyframes tkLand { 0%, 55% { box-shadow: inset 0 0 0 200px var(--ok-tint); } 100% { box-shadow: inset 0 0 0 200px var(--ok-tint-0); } }
  @keyframes tkLandOut { 0%, 55% { opacity: 1; } 100% { opacity: 0; } }
  .qrow.landed, .folder.landed { animation: tkLand 1.9s ease forwards; }
  .landed .landtick { color: var(--ok); font-weight: 700; animation: tkLandOut 1.9s ease forwards; }
  .qrow.landed .qt .landtick { margin-right: 6px; }
  .folder.landed .n .landtick { margin-left: 5px; }
  @media (prefers-reduced-motion: reduce) {
    .readscroll.outgoing, .readscroll.advance { animation: none; }
    .donecue { animation: tkFade .2s ease forwards; }
    .qrow.landed, .folder.landed { animation: none; box-shadow: inset 0 0 0 200px var(--ok-tint); }
    .landed .landtick { animation: none; }
  }

  /* ---- header ---- */
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px; flex: 0 0 auto;
    min-height: 58px; padding: 9px 20px; background: var(--panel); border-bottom: 1px solid var(--border-soft);
  }
  .brand { display: flex; align-items: center; gap: 9px; color: var(--accent2); }
  .brand span { font-size: 16px; font-weight: 750; letter-spacing: -.02em; color: var(--text); }
  .nav { display: flex; gap: 4px; margin-left: 4px; }
  .nav a, .nav .navpill { font-size: 13px; font-weight: 650; color: var(--muted); text-decoration: none; padding: 6px 13px; border-radius: 8px; cursor: pointer; }
  .nav a:hover { color: var(--accent); background: var(--hover); }
  .nav .active { color: var(--accent); background: var(--chip-bg); font-weight: 680; }
  .projpick, .tickpick { position: relative; display: inline-flex; align-items: center; }
  .projpick select, .tickpick select {
    appearance: none; -webkit-appearance: none;
    font: inherit; font-weight: 650; font-size: 13px; color: var(--ink2);
    background: var(--col-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 30px 7px 12px; max-width: 220px; cursor: pointer; text-overflow: ellipsis;
  }
  .projpick select:hover, .tickpick select:hover { border-color: var(--sel-border); color: var(--accent); }
  .projpick::after, .tickpick::after { content: "▾"; position: absolute; right: 11px; color: var(--muted); font-size: 11px; pointer-events: none; }
  /* Only meaningful once some question carries a ticket — hidden when empty. */
  .tickpick select { font-family: var(--mono); font-size: 12.5px; max-width: 190px; }
  .grow { flex: 1 1 auto; }
  .hint { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .langtoggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .langtoggle span { font-size: 12px; font-weight: 680; padding: 5px 10px; cursor: pointer; color: var(--muted); }
  .langtoggle span.on { background: var(--accent); color: #fff; }
  .iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 32px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--muted); cursor: pointer; }
  .iconbtn:hover { border-color: var(--sel-border); color: var(--accent); }

  /* ---- 3-pane layout ---- */
  main { flex: 1 1 auto; display: grid; grid-template-columns: 214px 400px 1fr; min-height: 0; }
  .rail { border-right: 1px solid var(--border-soft); background: var(--col-bg); overflow-y: auto; padding: 18px 12px; display: flex; flex-direction: column; gap: 1px; }
  .rail h3 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 8px; padding: 0 12px; }
  .folder { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-radius: 8px; font-size: 14px; color: var(--ink2); cursor: pointer; }
  .folder:hover { background: var(--hover); }
  .folder.active { background: var(--chip-bg); color: var(--accent); font-weight: 680; }
  .folder .n { font-size: 13px; color: var(--muted); }
  .folder.active .n { color: var(--accent); }
  .rail .tagfilter { width: 100%; margin-top: 6px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--ink2); font-size: 13px; cursor: pointer; }
  .rail .tagfilter:hover { border-color: var(--sel-border); color: var(--accent); }
  .rail .divider { height: 1px; background: var(--border); margin: 14px 12px; }
  .rail .scope { padding: 12px; border-radius: 10px; background: var(--hover); }
  .rail .scope .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .rail .scope .tag { font-family: var(--mono); font-size: 11px; color: var(--accent2); }
  .rail .spacer { flex: 1 1 auto; }

  /* ---- list ---- */
  .listpane { border-right: 1px solid var(--border-soft); background: var(--panel); overflow-y: auto; }
  .listhead { padding: 16px 22px 12px; display: flex; align-items: baseline; justify-content: space-between; position: sticky; top: 0; background: var(--panel); z-index: 2; border-bottom: 1px solid var(--border-soft); }
  .listhead .t { font-size: 15px; font-weight: 700; }
  .listhead .s { font-size: 12px; color: var(--muted); }
  .grouphd { display: flex; align-items: center; gap: 9px; padding: 11px 22px 9px; background: var(--col-bg); }
  .grouphd .lbl { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .grouphd .cnt { font-size: 12px; color: var(--muted2); }
  .bars { display: flex; gap: 2px; }
  .bars .bar { width: 5px; height: 11px; border-radius: 2px; background: var(--gaugeoff); }
  .qrow { padding: 13px 22px; border-bottom: 1px solid var(--border-soft); cursor: pointer; }
  .qrow:hover { background: var(--hover); }
  .qrow.active { background: var(--sel); }
  .qrow .qt { font-size: 15px; line-height: 1.35; margin-bottom: 4px; color: var(--text); font-weight: 680; overflow-wrap: anywhere; }
  .qrow.read .qt { font-weight: 600; color: var(--ink2); }
  .qrow .qc { font-size: 13px; line-height: 1.45; color: var(--muted); margin-bottom: 8px; overflow-wrap: anywhere; }
  .qrow.answered .qc { color: var(--ok); }
  .qrow .qm { display: flex; align-items: center; justify-content: space-between; }
  .qrow .qm .who { font-family: var(--mono); font-size: 11.5px; color: var(--muted2); }
  .qrow .qm .age { font-size: 12px; color: var(--low); }
  .listempty { padding: 60px 30px; text-align: center; color: var(--muted); }
  .listempty .t { font-size: 17px; font-weight: 700; color: var(--text); margin: 10px 0 6px; }
  .listempty p { font-size: 13px; line-height: 1.6; margin: 0; }

  /* ---- reading pane ---- */
  .readpane { position: relative; background: var(--panel); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .readempty { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px; }
  .readempty .t { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .readempty p { font-size: 13.5px; line-height: 1.6; color: var(--muted); margin: 0; max-width: 340px; }
  .readscroll { flex: 1; min-height: 0; overflow-y: auto; }
  .rhead { padding: 24px 34px 18px; border-bottom: 1px solid var(--border-soft); position: relative; }
  .rhead .toprow { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .rhead .toprow .age { font-size: 12px; color: var(--low); }
  .ticketbtn { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; background: var(--panel); cursor: pointer; }
  .ticketbtn:hover { border-color: var(--sel-border); color: var(--accent2); }
  .ticketbtn .mono { font-family: var(--mono); }
  .rhead h2 { margin: 0; font-size: 25px; line-height: 1.25; letter-spacing: -.02em; font-weight: 700; overflow-wrap: anywhere; }
  .popover { position: absolute; top: 62px; right: 34px; width: 250px; background: var(--dark); color: var(--dark-ink); border-radius: 12px; padding: 15px 16px; box-shadow: 0 20px 44px -16px rgba(0,0,0,.55); z-index: 15; }
  .popover .h { font-size: 11px; color: var(--dark-sub); margin-bottom: 10px; }
  .popover .kv { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; margin-bottom: 8px; }
  .popover .kv .k { color: var(--dark-sub); } .popover .kv .mono { font-family: var(--mono); }
  .popover .open { font-size: 12px; color: #6ea3d8; font-weight: 600; margin-top: 6px; cursor: pointer; }
  .rbody { padding: 20px 34px; }
  .md { font-size: 14.5px; color: var(--ink2); max-width: 600px; }
  .md p { margin: 0 0 12px; line-height: 1.65; } .md ul { margin: 0 0 12px; padding-left: 20px; } .md li { margin: 4px 0; line-height: 1.6; }
  .md b { color: var(--text); } .md code { font-family: var(--mono); font-size: 12px; background: var(--hover); padding: 1px 5px; border-radius: 4px; color: var(--accent-ink); }
  /* markdown blocks — shared vocabulary with the other surface (see mdNode) */
  .md h3, .md h4, .md h5, .md h6 { color: var(--text); margin: 18px 0 8px; line-height: 1.35; }
  .md h3 { font-size: 15px; font-weight: 700; } .md h4 { font-size: 13.5px; font-weight: 700; }
  .md h5, .md h6 { font-size: 12.5px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md ol { margin: 0 0 12px; padding-left: 22px; }
  .md blockquote { margin: 0 0 12px; padding: 2px 0 2px 12px; border-left: 2px solid var(--border); color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
  .md a { color: var(--accent2); text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
  /* Fenced code: scrolls in its own box so a long line never widens the page. */
  .md pre { margin: 0 0 12px; padding: 10px 12px; background: var(--hover); border: 1px solid var(--border); border-radius: 6px; overflow-x: auto; }
  .md pre code { font-family: var(--mono); font-size: 12px; background: none; padding: 0; border-radius: 0; color: var(--ink2); white-space: pre; }
  /* Tables likewise: the wrapper scrolls, the page does not. */
  .md-table { overflow-x: auto; margin: 0 0 12px; }
  .md table { border-collapse: collapse; font-size: 12.5px; }
  .md th, .md td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; vertical-align: top; }
  .md th { color: var(--text); font-weight: 700; background: var(--hover); white-space: nowrap; }

  .timeline { margin-top: 22px; max-width: 600px; }
  .timeline h3 { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted2); margin: 0 0 13px; }
  .tevents { display: flex; flex-direction: column; gap: 13px; }
  .tev { display: flex; gap: 12px; }
  .tev .tdot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; margin-top: 5px; }
  .tev .tt { font-size: 13.5px; color: var(--text); line-height: 1.5; overflow-wrap: anywhere; }
  /* A thread message is markdown now, so it brings its own block spacing; the
     row must not add another layer of it. */
  .tev .tt .md { font-size: 13.5px; color: var(--text); max-width: none; }
  .tev .tt .md > :last-child { margin-bottom: 0; }
  /* Clamp long replies. The text stays in the DOM — this only limits height, so
     ctrl-F and copy still see the whole thing. */
  .tclip.clamped { max-height: 13em; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 72%, transparent); mask-image: linear-gradient(to bottom, #000 72%, transparent); }
  .tmore { margin-top: 4px; font: inherit; font-size: 12px; font-weight: 650; color: var(--accent2); background: transparent; border: 0; padding: 2px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .tmore:hover { color: var(--text); }
  .tev .tm { font-size: 11.5px; color: var(--muted2); margin-top: 2px; } .tev .tm .mono { font-family: var(--mono); }
  .tev.pend .tdot { background: var(--warn); animation: tkPulse 1.4s ease-in-out infinite; }
  .tev.pend .tt { color: var(--muted); }

  .decision { border: 1px solid color-mix(in srgb, var(--ok) 30%, var(--panel)); background: color-mix(in srgb, var(--ok) 8%, var(--panel)); border-radius: 12px; padding: 18px 20px; max-width: 600px; margin-top: 22px; }
  .decision .h { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ok); margin-bottom: 9px; }
  .decision .h .chk { width: 18px; height: 18px; border-radius: 50%; background: var(--ok); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
  .decision .v { font-size: 19px; font-weight: 700; color: var(--text); letter-spacing: -.01em; line-height: 1.3; overflow-wrap: anywhere; }
  /* The decision is one big display line; markdown inside it must not add
     paragraph spacing on top of that. */
  .decision .v p { margin: 0; line-height: 1.3; }
  .decision .sub { margin-top: 12px; font-size: 12px; color: var(--muted); }

  /* answer area */
  .answer { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-soft); max-width: 600px; }
  .gatenote { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .opts { display: flex; flex-direction: column; gap: 9px; }
  /* "write your own" custom answer (single-select choose) */
  .customwrap { display: flex; flex-direction: column; gap: 10px; margin-top: 11px; }
  .orsep { display: flex; align-items: center; gap: 12px; }
  .orsep .ln { flex: 1; height: 1px; background: var(--border-soft); }
  .orsep .lbl { font-size: 11.5px; color: var(--muted2); white-space: nowrap; }
  .customopt { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 12px; cursor: text; border: 1.5px dashed var(--border); background: transparent; }
  .customopt.sel { border: 1.5px solid var(--accent); background: var(--sel); }
  .customopt svg { flex: 0 0 auto; color: var(--muted2); }
  .customopt.sel svg { color: var(--accent); }
  .customopt input { flex: 1; min-width: 0; border: none; background: transparent; font: inherit; font-size: 14px; color: var(--accent-ink); outline: none; }
  .customopt input::placeholder { color: var(--muted); }
  .opt { display: flex; align-items: flex-start; gap: 13px; padding: 14px 16px; border-radius: 12px; cursor: pointer; border: 1px solid var(--border); background: var(--panel); }
  .opt:hover { border-color: var(--sel-border); }
  .opt.sel { border: 1.5px solid var(--accent); background: var(--sel); }
  .opt .mark { width: 16px; height: 16px; flex: 0 0 auto; margin-top: 2px; border-radius: 50%; border: 1.5px solid var(--gaugeoff); }
  .opt.sel .mark { border: 5px solid var(--accent); }
  .opt.multi .mark { border-radius: 5px; }
  .opt.multi.sel .mark { border: 1.5px solid var(--accent); background: var(--accent); }
  .opt .ol { font-size: 14.5px; font-weight: 680; color: var(--text); overflow-wrap: anywhere; }
  .opt .od { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.5; overflow-wrap: anywhere; }
  .opt .rec { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .opt .rec .bars .bar { width: 15px; height: 5px; }
  .opt .rec .rl { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent2); }
  .clarify { width: 100%; height: 84px; resize: vertical; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font: inherit; font-size: 14px; color: var(--text); background: var(--panel); outline: none; }
  .suggest { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .suggest button { font-family: var(--mono); font-size: 12px; color: var(--accent2); background: var(--chip-bg); border: none; padding: 3px 9px; border-radius: 6px; cursor: pointer; }
  .lang-nudge { font-size: 12.5px; color: var(--high); background: color-mix(in srgb, var(--high) 10%, transparent); border: 1px solid color-mix(in srgb, var(--high) 34%, transparent); border-radius: 8px; padding: 8px 11px; margin-bottom: 12px; }

  /* footer */
  .rfoot { flex: 0 0 auto; border-top: 1px solid var(--border-soft); padding: 14px 34px 16px; background: var(--col-bg); }
  .compose { display: flex; align-items: center; gap: 8px; border: 1px solid var(--sel-border); border-radius: 11px; padding: 6px 6px 6px 13px; background: var(--panel); margin-bottom: 12px; animation: tkSlide .18s ease; }
  .compose .to { font-size: 12px; color: var(--muted2); white-space: nowrap; } .compose .to .mono { font-family: var(--mono); color: var(--muted); }
  .compose input { flex: 1 1 auto; min-width: 0; border: none; outline: none; font: inherit; font-size: 13.5px; background: transparent; height: 32px; color: var(--text); }
  .compose .send { flex: 0 0 auto; width: 34px; height: 34px; border: none; border-radius: 8px; background: var(--gaugeoff); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .compose .send.on { background: var(--accent); }
  .footrow { display: flex; align-items: center; gap: 12px; }

  // Pass a qid to clear only that question's tint: undoing one answer must not wipe
  // the tint of a different one answered moments later. No argument clears whatever
  // is showing (sign-out, project switch).
  function clearLanded(id) {
    if (id != null && state.landedId !== id) return;
    clearTimeout(landTimer); state.landedId = null;
  }

  // Newest on top, so the answer you just gave is always in the same place. Capped
  // so a fast run through the inbox cannot bury the app under its own snackbars;
  // the overflow is stated rather than hidden silently, and surfaces as the older
  // windows close.
  var SNACK_VISIBLE = 5;
  // Unlike every other render function here, this one runs on a TIMER — once a
  // second for up to 30s per pending answer — and the only thing that changes
  // between ticks is one number. Clearing and rebuilding the subtree would
  // therefore destroy the Undo button under the pointer and, worse, under the
  // keyboard: a reader who tabs to Undo lost focus every second and could not
  // activate the escape hatch at all. It also replayed `.snackbar`'s entry
  // animation each tick, which is what made it read as flashing.
  //
  // So rows are built once, when the SET of pending answers changes, and a tick
  // only writes into a text node the row kept a reference to. Nothing is
  // destroyed, so node identity — and focus, hover, and the animation's
  // finished state — survives a tick.
  var snackNodes = {};   // qid -> { row: <div.snackbar>, label: Text inside .undo }
  var snackMore = null;  // the "+n more pending" line, kept and re-texted the same way
  function snackRow(s) {
    var row = el("div", "snackbar");
    row.appendChild(el("span", "chk", "✓"));
    var d = el("div", "txt"); d.appendChild(el("div", "d1", s.decision)); d.appendChild(el("div", "d2", s.detail));
    row.appendChild(d);
    // Bound to the question id, not to this row's position in the list.
    var u = el("button", "undo");
    var label = document.createTextNode("");
    u.appendChild(label);
    u.addEventListener("click", function () { undoSnack(s.qid); });
    row.appendChild(u);
    return { row: row, label: label };
  }
  function renderSnackbar() {
    var root = $("snackbar-root");
    var shown = state.snacks.slice(-SNACK_VISIBLE).reverse();
    // Retire rows whose answer is no longer pending (committed, undone) or which
    // the cap has pushed out of sight.
    var live = {};
    shown.forEach(function (s) { live[s.qid] = true; });
    Object.keys(snackNodes).forEach(function (qid) {
      if (live[qid]) return;
      var gone = snackNodes[qid].row;
      if (gone.parentNode) gone.parentNode.removeChild(gone);
      delete snackNodes[qid];
    });
    // Build once per answer; from then on only the label text changes. The whole
    // label (not just the digits) is rewritten so a language switch mid-window
    // still lands, exactly as the full rebuild used to give for free.
    var prev = null;
    shown.forEach(function (s) {
      var n = snackNodes[s.qid] || (snackNodes[s.qid] = snackRow(s));
      n.label.nodeValue = t().undo + " · " + s.remaining + "s";
      // Re-inserting a node restarts its animation, so only place a row that is
      // not already where it belongs — which is add/remove, never a tick.
      var want = prev ? prev.nextSibling : root.firstChild;
      if (n.row !== want) root.insertBefore(n.row, want);
      prev = n.row;
    });
    var hidden = state.snacks.length - shown.length;
    if (hidden > 0) {
      if (!snackMore) snackMore = el("div", "snackmore");
      var more = "+" + hidden + " " + t().morePending;
      if (snackMore.textContent !== more) snackMore.textContent = more;
      if (snackMore.parentNode !== root) root.appendChild(snackMore);
    } else if (snackMore && snackMore.parentNode) {
      snackMore.parentNode.removeChild(snackMore);
    }
  }

  function renderModal() {
    var root = $("modal-root"); root.innerHTML = "";
    if (state.linkModal) { root.appendChild(linkModalNode()); return; }
    if (!state.withdrawOpen) return;
    var scrim = el("div", "modal-scrim"); scrim.addEventListener("click", function () { state.withdrawOpen = false; render(); });
    var modal = el("div", "modal"); modal.addEventListener("click", function (e) { e.stopPropagation(); });
    modal.appendChild(el("div", "t", t().withdrawTitle));
    modal.appendChild(el("p", null, t().withdrawBody));
    var row = el("div", "row");
    var cancel = el("button", "cancel", t().cancel); cancel.addEventListener("click", function () { state.withdrawOpen = false; render(); });
    var danger = el("button", "danger", t().withdraw); danger.addEventListener("click", confirmWithdraw);
    row.appendChild(cancel); row.appendChild(danger); modal.appendChild(row);
    scrim.appendChild(modal); root.appendChild(scrim);
  }
  function closeLinkModal() { state.linkModal = null; render(); }
  function linkModalNode() {
    var m = state.linkModal;
    var scrim = el("div", "modal-scrim"); scrim.addEventListener("click", closeLinkModal);
    var modal = el("div", "modal"); modal.addEventListener("click", function (e) { e.stopPropagation(); });
    var badge = el("div", "linkbadge"); badge.appendChild(el("span", "chk", "✓")); badge.appendChild(document.createTextNode(t().linkOnce)); modal.appendChild(badge);
    modal.appendChild(el("div", "t", t().linkTitle));
    modal.appendChild(el("p", null, t().linkBody));
    var field = el("div", "linkfield");
    var inp = el("input"); inp.type = "text"; inp.readOnly = true; inp.value = m.url; inp.addEventListener("focus", function () { inp.select(); });
    var copy = el("button", "copy", t().copy); copy.addEventListener("click", function () { copyText(m.url, copy); inp.focus(); });
    field.appendChild(inp); field.appendChild(copy); modal.appendChild(field);
    if (m.expires_at) {
      var meta = el("div", "linkmeta");
      meta.appendChild(document.createTextNode(t().validUntil + " "));
      meta.appendChild(el("span", "mono", fmtWhen(m.expires_at)));
      modal.appendChild(meta);
    }
    var row = el("div", "row");
    var done = el("button", "primary", t().done); done.addEventListener("click", closeLinkModal);
    row.appendChild(done); modal.appendChild(row);
    scrim.appendChild(modal);
    // auto-select the URL so ⌘C works immediately
    setTimeout(function () { try { inp.focus(); inp.select(); } catch (_) {} }, 30);
    return scrim;
  }
  function confirmWithdraw() {
    var q = selected(); if (!q) return;
    state.withdrawOpen = false; render();
    api("/questions/" + encodeURIComponent(q.id) + "/withdraw", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reason: "withdrawn from inbox" }) })
      .then(function () { toast(t().withdrawn2, "success"); fetchAll(); })
      .catch(function (e) { toast((e && e.message) || "error", "error"); });
  }

  // Take back an answered question (conditional undo beyond the 30s window). The
  // server refuses with a teaching 409 if the ticket already relies on it.
  function reopenQuestion(q) {
    api("/questions/" + encodeURIComponent(q.id) + "/reopen", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })
      .then(function () { toast(t().reopened, "success"); state.folder = "open"; state.selectedId = q.id; state.advanced = true; fetchAll(); })
      .catch(function (e) { toast((e && e.message) ? e.message : "error", "error"); });
  }

  function mintLink(id) {
    api("/questions/" + encodeURIComponent(id) + "/answer-link", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({}) })
      .then(function (res) {
        var url = res.url || (window.location.origin + (res.path || ""));
        state.linkModal = { url: url, expires_at: res.expires_at || null, actor: res.actor || "" };
        render();
      })
      .catch(function (e) { toast((e && e.message ? e.message : "error") + (e && e.status === 403 ? " (needs human + expert:<tag>)" : ""), "error"); });
  }
  function fmtWhen(ms) {
    var d = new Date(ms); if (isNaN(d.getTime())) return "";
    try { return d.toLocaleString(state.lang === "de" ? "de-DE" : "en-US", { dateStyle: "medium", timeStyle: "short" }); }
    catch (_) { return d.toISOString().slice(0, 16).replace("T", " "); }
  }
  function copyText(text, btn) {
    function ok() { if (btn) { btn.textContent = t().copied; btn.classList.add("ok"); setTimeout(function () { btn.textContent = t().copy; btn.classList.remove("ok"); }, 1600); } }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok).catch(function () { legacyCopy(text, btn, ok); });
    } else { legacyCopy(text, btn, ok); }
  }
  function legacyCopy(text, btn, ok) {
    var ta = el("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    var done = false; try { done = document.execCommand("copy"); } catch (_) {}
    document.body.removeChild(ta);
    if (done) { ok(); } else { toast(t().copyFail, "error"); }
  }

  // ---- keyboard ----
  document.addEventListener("keydown", function (e) {
    if ($("gate") && !$("gate").classList.contains("hidden")) return;
    if (e.key === "Escape") { if (state.linkModal) { state.linkModal = null; render(); return; } if (state.withdrawOpen) { state.withdrawOpen = false; render(); return; } if (state.drawerOpen) { state.drawerOpen = false; render(); return; } if (state.ticketOpen) { state.ticketOpen = false; render(); return; } }
    var tag = (e.target && e.target.tagName) || ""; if (tag === "INPUT" || tag === "TEXTAREA") return;
    var list = inFolder(); if (!list.length) return;
    var idx = list.findIndex(function (q) { return q.id === state.selectedId; });
    if (e.key === "j") { idx = Math.min(list.length - 1, idx < 0 ? 0 : idx + 1); selectQ(list[idx].id); e.preventDefault(); }
    else if (e.key === "k") { idx = Math.max(0, idx < 0 ? 0 : idx - 1); selectQ(list[idx].id); e.preventDefault(); }
    else if (e.key === "Enter") { var q = list[idx < 0 ? 0 : idx]; if (q && q.status === "open" && state.me && state.me.canAnswer) { submitAnswer(q); e.preventDefault(); } }
  });

  // ---- errors ----
  function handleErr(e) {
    if (e && e.auth) { showGate((state.lang === "de" ? "Token abgelehnt (" : "Token rejected (") + (e.status || "") + ")."); return; }
    $("list").innerHTML = ""; $("list").appendChild(el("div", "listempty", (state.lang === "de" ? "Ladefehler: " : "Could not load: ") + (e && e.message ? e.message : "error")));
  }

  // ---- chrome (i18n-applied static bits) ----
  function applyChrome() {
    $("brand").innerHTML = LOGO + '<span>takomo</span>';
    $("gate-brand").innerHTML = LOGO;
    $("nav-inbox").textContent = t().inbox; $("nav-board").textContent = t().board;
    $("kbd-hint").textContent = t().kbd;
    $("lang-de").className = state.lang === "de" ? "on" : ""; $("lang-en").className = state.lang === "en" ? "on" : "";
    document.documentElement.lang = state.lang;
  }

  // ---- start ----
  applyChrome(); applyGateStrings();
  applyHash(true); // restore folder/project/selection from a bookmarked URL before first load
  if (state.token) { hideGate(); boot(); } else { showGate(""); }
})();
</script>
</body>
</html>
