<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>takomo board</title>
<style>
  /* ---- theme tokens (light default, dark via prefers-color-scheme) ---- */
  /* Aquarelle palette — shared with /inbox. --accent = deep blue (primary /
     critical emphasis); --high/--normal/--low = urgency scale; --crit = warm
     error/reject/bug. Each attribute is encoded once: priority is a single
     colored word, identifiers are monospace, the important card is a tinted
     field (no left stripe). */
  :root {
    --bg: #eef1f4; --panel: #ffffff; --col-bg: #f7fafc; --text: #14202a;
    --muted: #6e7c88; --cap: #5b6b78; --ink2: #3a4a56; --border: #e6ecf0; --border-soft: #eef2f5;
    --accent: #1f4e78; --accent2: #2f6ba0; --accent-ink: #173d5e;
    --shadow: 0 18px 50px -26px rgba(20,40,55,.28);
    --crit: #b4543f; --ok: #3f7a5f;
    --high: #2f6ba0; --normal: #5b8bb5; --low: #7d8a95; --gaugeoff: #cfd9e2;
    --chip-bg: #eaf2f9; --chip-text: #2f6ba0; --sel: #eef5fb; --sel-border: #cfe0ee; --hover: #f2f6fa;
    --overlay: rgba(20,40,55,.5);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e141b; --panel: #141d27; --col-bg: #101821; --text: #e6eef5;
      --muted: #8ba0b0; --cap: #9aabb8; --ink2: #c3d2de; --border: #26313d; --border-soft: #1e2833;
      --accent: #4c8dff; --accent2: #6ea8ff; --accent-ink: #7fb2ff;
      --shadow: 0 18px 50px -26px rgba(0,0,0,.6);
      --crit: #e0836f; --ok: #5fbf8f;
      --high: #6ea8ff; --normal: #7fa8d4; --low: #8494a1; --gaugeoff: #33414f;
      --chip-bg: #1a2836; --chip-text: #8fb6dc; --sel: #16263a; --sel-border: #2b4a63; --hover: #17212c;
      --overlay: rgba(1,4,9,.72);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }

  /* ---- shared header ---- */
  header {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    padding: 0 20px; min-height: 58px; background: var(--panel);
    border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 9px; color: var(--accent2); }
  .brand svg { display: block; }
  .brand span { font-size: 16px; font-weight: 750; letter-spacing: -.02em; color: var(--text); }
  .nav { display: flex; gap: 4px; }
  .nav a, .nav span.navpill {
    font-size: 13px; font-weight: 650; color: var(--muted); text-decoration: none;
    padding: 6px 12px; border-radius: 8px;
  }
  .nav a:hover { color: var(--accent); background: var(--hover); }
  .nav .active { color: var(--accent); background: var(--chip-bg); font-weight: 680; }
  header .grow { flex: 1 1 auto; }
  select, input, button {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
  }
  header select { max-width: 220px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  button.primary:hover { background: var(--accent-ink); }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.ghost:hover { color: var(--accent); background: var(--hover); }
  .status { font-size: 12px; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; }
  .share-banner { font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; }
  .share-banner:empty { display: none; }
  .share-exp:empty { display: none; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.live { background: var(--ok); }
  .dot.err { background: var(--crit); }
  .archtoggle { font-size: 12.5px; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .iconbtn { position: relative; font-weight: 650; color: var(--accent2); }
  .iconbtn:hover { background: var(--hover); }
  .badge {
    display: inline-block; min-width: 17px; padding: 0 5px; border-radius: 9px;
    background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
    text-align: center; margin-left: 6px; line-height: 17px;
  }
  .badge.zero { display: none; }

  .langtoggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .langtoggle span { font-size: 12px; font-weight: 680; padding: 5px 10px; cursor: pointer; color: var(--muted); }
  .langtoggle span.on { background: var(--accent); color: #fff; }
  .bars { display: inline-flex; gap: 2px; vertical-align: middle; }
  .bars .bar { width: 11px; height: 4px; border-radius: 2px; background: var(--gaugeoff); }

  /* ---- board ---- */
  #board {
    display: flex; gap: 16px; align-items: flex-start;
    padding: 18px 18px 40px; overflow-x: auto; min-height: calc(100vh - 58px);
  }
  .column { flex: 0 0 270px; max-width: 270px; display: flex; flex-direction: column; gap: 10px; }
  .column h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 750;
    margin: 0; padding: 0 2px 2px; color: var(--cap); display: flex; align-items: center; gap: 8px;
  }
  .column h2 .count { color: var(--low); font-size: 12px; font-weight: 600; }
  .column.done h2 { color: var(--muted); }
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .epicsel { max-width: 190px; }
  .grouptoggle { font-size: 12.5px; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .subhd { display: flex; align-items: baseline; gap: 7px; padding: 4px 2px 0; margin-top: 2px; }
  .subhd .slbl { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .subhd .scount { font-size: 11px; color: var(--low); font-weight: 600; flex: 0 0 auto; }
  .morebtn { border: 1px dashed var(--border); background: transparent; color: var(--accent2); border-radius: 9px; padding: 8px 10px; font: inherit; font-size: 12px; font-weight: 650; cursor: pointer; text-align: center; }
  .morebtn:hover { border-color: var(--sel-border); background: var(--hover); color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 10px; padding: 13px 14px; cursor: pointer; }
  .card:hover { border-color: var(--sel-border); }
  .card.tint { background: var(--sel); border-color: var(--sel-border); box-shadow: 0 10px 24px -14px rgba(31,78,120,.45); }
  .card.done { background: transparent; }
  .card.archived { opacity: .55; }
  .card .ctop { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
  .card .cid { font-family: var(--mono); font-size: 12px; color: var(--low); }
  .card.bug .cid { color: var(--crit); }
  .card.tint .cid { color: var(--muted); font-weight: 600; }
  .card .qflag { font-size: 12px; font-weight: 600; color: var(--accent2); white-space: nowrap; }
  .card .qflag.blocking { color: var(--accent); font-weight: 700; }
  .card .ctitle { font-size: 13.5px; font-weight: 650; line-height: 1.4; margin-bottom: 10px; word-break: break-word; color: var(--text); }
  .card.tint .ctitle { font-weight: 700; }
  .card.done .ctitle { font-weight: 550; color: var(--muted); margin-bottom: 0; }
  .card .cbot { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .card .holder { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .arch-tag { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .card .promo { display: flex; align-items: center; gap: 6px; margin-top: 9px; font-size: 12px; color: var(--ok); }
  .card .promo .pdot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: 0 0 auto; }
  .card .promo .ptarget { font-family: var(--mono); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .promo .page { color: var(--muted); flex: 0 0 auto; }
  /* Commit proof — quieter than the promotion badge: it says "verifiable",
     not "shipped", and must not compete with the deploy signal. */
  .card .proof { display: flex; align-items: center; gap: 5px; margin-top: 7px; font-size: 12px; color: var(--muted); min-width: 0; }
  .card .proof .pmark { flex: 0 0 auto; opacity: .75; }
  .card .proof .psha { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty-col { color: var(--muted); font-size: 12px; text-align: center; padding: 14px 4px; opacity: .6; }
  .promo-list { display: flex; flex-direction: column; gap: 8px; }
  .promo-row { display: flex; flex-direction: column; gap: 3px; border-left: 2px solid var(--ok); padding: 2px 0 4px 10px; }
  .promo-row .pr-head { display: flex; align-items: baseline; gap: 8px; }
  .promo-row .pr-target { font-family: var(--mono); font-weight: 700; color: var(--ok); }
  .promo-row .pr-when { font-size: 12px; color: var(--muted); }
  .promo-row .pr-meta { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .promo-row .pr-meta a { font-family: var(--mono); }

  /* priority/urgency as a single colored word */
  .uw { font-size: 12px; }
  .uw-critical { color: var(--accent); font-weight: 700; }
  .uw-high { color: var(--high); font-weight: 600; }
  .uw-normal { color: var(--normal); font-weight: 600; }
  .uw-low { color: var(--low); font-weight: 600; }

  /* ---- detail panel ---- */
  #overlay { position: fixed; inset: 0; background: var(--overlay); display: none; z-index: 20; }
  #overlay.open { display: block; }
  #detail {
    position: fixed; top: 0; right: 0; height: 100%; width: min(480px, 100%);
    background: var(--panel); border-left: 1px solid var(--border); z-index: 21;
    transform: translateX(100%); transition: transform .18s ease; overflow-y: auto;
    box-shadow: -24px 0 60px -30px rgba(20,40,55,.5);
  }
  #detail.open { transform: translateX(0); }
  #detail .dhead { display: flex; align-items: flex-start; gap: 8px; padding: 20px 24px 16px; border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; background: var(--panel); }
  #detail .dhead h2 { font-size: 20px; margin: 0; flex: 1; word-break: break-word; letter-spacing: -.02em; line-height: 1.3; }
  #detail .close { background: transparent; border: none; font-size: 20px; line-height: 1; color: var(--muted); padding: 2px 6px; }
  #detail .dbody { padding: 16px 24px; }
  #detail section { margin-bottom: 20px; }
  #detail h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
  #detail .body-text { white-space: pre-wrap; word-break: break-word; font-size: 13.5px; line-height: 1.65; color: var(--ink2); }
  #detail .kv { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: 12.5px; color: var(--muted); }
  #detail .kv .mono { font-family: var(--mono); color: var(--text); }
  .callout { background: var(--chip-bg); border-radius: 11px; padding: 14px 16px; }
  .callout .ct { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .callout .cs { font-size: 13px; color: var(--ink2); line-height: 1.5; margin-bottom: 11px; }
  .callout a.answer-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 680; color: #fff; background: var(--accent); padding: 8px 14px; border-radius: 8px; text-decoration: none; }
  .comment { border-left: 2px solid var(--border); padding: 2px 0 2px 10px; margin-bottom: 10px; }
  .comment .who { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .comment .txt { white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  .dep-item, .link-item { padding: 3px 0; word-break: break-all; font-size: 13px; color: var(--ink2); }
  .dep-item .mono, .link-item .mono { font-family: var(--mono); font-size: 12px; }
  a { color: var(--accent2); }
  .mono { font-family: var(--mono); }

  /* ---- ask-a-human drawer ---- */
  #inbox {
    position: fixed; top: 0; right: 0; height: 100%; width: min(520px, 100%);
    background: var(--panel); border-left: 1px solid var(--border); z-index: 21;
    transform: translateX(100%); transition: transform .18s ease; overflow-y: auto;
    box-shadow: -24px 0 60px -30px rgba(20,40,55,.5);
  }
  #inbox.open { transform: translateX(0); }
  #inbox .dhead { display: flex; align-items: center; gap: 10px; padding: 18px 22px; border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; background: var(--panel); }
  #inbox .dhead h2 { font-size: 18px; margin: 0; flex: 1; font-weight: 720; }
  #inbox .dhead a.full { font-size: 12px; color: var(--accent2); text-decoration: none; }
  #inbox .close { background: transparent; border: none; font-size: 20px; line-height: 1; color: var(--muted); padding: 2px 6px; }
  #inbox .ibody { padding: 14px 22px; }
  .mine-toggle { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .q-item { border: 1px solid var(--border-soft); border-radius: 10px; padding: 13px 14px; margin-bottom: 12px; }
  .q-item.blocking { background: var(--sel); border-color: var(--sel-border); }
  .q-item .q-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .q-item .q-title { font-weight: 680; margin: 4px 0; word-break: break-word; }
  .q-item .q-meta { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-bottom: 6px; overflow-wrap: anywhere; }
  .q-item .q-body { color: var(--ink2); white-space: pre-wrap; word-break: break-word; margin: 6px 0 8px; font-size: 13px; line-height: 1.55; }
  .q-item .q-rec { font-size: 12.5px; color: var(--muted); background: var(--col-bg); border-radius: 8px; padding: 8px 11px; margin: 6px 0; }
  .q-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .q-actions button { max-width: 100%; overflow-wrap: anywhere; text-align: left; border-radius: 9px; }
  .q-actions input[type=text] { flex: 1 1 160px; min-width: 0; border-radius: 9px; }
  .q-note { width: 100%; margin-top: 8px; border-radius: 9px; }
  .q-empty { color: var(--muted); text-align: center; padding: 40px 6px; }
  .q-readonly { font-size: 12.5px; color: var(--high); margin-bottom: 12px; }
  .q-err { color: var(--crit); font-size: 12px; margin-top: 6px; min-height: 14px; }

  /* ---- setup gate ---- */
  #gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 30; padding: 16px; }
  #gate .card2 { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 26px; width: min(420px, 100%); box-shadow: var(--shadow); }
  #gate .brand { justify-content: center; margin-bottom: 6px; }
  #gate h1 { font-size: 20px; margin: 6px 0 6px; text-align: center; font-weight: 750; }
  #gate p { color: var(--muted); margin: 0 0 16px; font-size: 13px; text-align: center; line-height: 1.6; }
  #gate label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  #gate input { width: 100%; }
  #gate #g-token { font-family: var(--mono); }
  #gate button { width: 100%; margin-top: 18px; height: 46px; }
  #gate .err { color: var(--crit); font-size: 13px; margin-top: 12px; min-height: 18px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- setup gate: token + project -->
<div id="gate">
  <div class="card2">
    <div class="brand" id="gate-brand"></div>
    <h1>takomo · board</h1>
    <p id="gate-sub">Read-only kanban. Paste a read token to view a project's tickets.</p>
    <label for="g-token" id="gate-tokenlabel">Read token</label>
    <input id="g-token" type="password" placeholder="tk_live_••••••••" autocomplete="off">
    <label for="g-project" id="gate-projectlabel">Project</label>
    <input id="g-project" type="text" placeholder="load token first, then pick" list="g-projlist">
    <datalist id="g-projlist"></datalist>
    <button class="primary" id="g-go">Open board</button>
    <div class="err" id="g-err"></div>
  </div>
</div>

<header class="hidden" id="topbar">
  <div class="brand" id="brand"></div>
  <nav class="nav" id="nav"><span class="navpill active" id="nav-board">Board</span><a href="/inbox" id="nav-inbox">Inbox</a></nav>
  <select id="projsel" title="project"></select>
  <select id="epicsel" class="epicsel hidden" title="filter by epic"></select>
  <label class="grouptoggle hidden" id="group-wrap" title="Group cards by their epic"><input type="checkbox" id="groupepic"> <span id="group-label">by epic</span></label>
  <span class="share-banner" id="share-scope"></span>
  <span class="grow"></span>
  <span class="status share-exp" id="share-exp"></span>
  <label class="archtoggle"><input type="checkbox" id="showarch"> <span id="arch-label">archived</span></label>
  <button class="iconbtn ghost" id="inbox-btn"><span id="askhuman-label">Ask a human</span><span class="badge zero" id="inbox-count">0</span></button>
  <div class="langtoggle"><span id="lang-de">DE</span><span id="lang-en">EN</span></div>
  <button class="ghost" id="refresh"><span id="refresh-label">Refresh</span></button>
  <button class="ghost" id="signout"><span id="signout-label">Sign out</span></button>
</header>

<div id="board"></div>

<div id="overlay"></div>
<aside id="inbox" aria-hidden="true">
  <div class="dhead">
    <h2>Ask a human</h2>
    <a class="full" href="/inbox" title="Open the full inbox">full inbox →</a>
    <label class="mine-toggle hidden" id="mine-wrap" title="Only questions routed to your expertise"><input type="checkbox" id="mine-toggle"> mine</label>
    <button class="close" id="inbox-close" aria-label="Close">&times;</button>
  </div>
  <div class="ibody" id="inbox-body"></div>
</aside>
<aside id="detail" aria-hidden="true">
  <div class="dhead">
    <h2 id="d-title">—</h2>
    <button class="close" id="d-close" aria-label="Close">&times;</button>
  </div>
  <div class="dbody" id="d-body"></div>
</aside>

<script>
"use strict";
(function () {
  // Same-origin API root. All calls carry the Bearer token via fetch headers,
  // which is why we poll GET /v1/events instead of using EventSource: the SSE
  // stream at /v1/events/stream needs the Authorization header too, and the
  // browser EventSource API cannot set request headers. Polling with fetch is
  // the correct auth-carrying live-update path here.
  var API = "/v1";
  var POLL_MS = 5000;

  var LS_TOKEN = "takomo.board.token";
  var LS_PROJECT = "takomo.board.project";
  var LS_LANG = "takomo.lang";
  var LS_EPIC = "takomo.board.epic";
  var LS_GROUP = "takomo.board.groupepic";
  var COLLAPSE_LIMIT = 6; // cards shown per column/epic-group before "show more"

  // ---- i18n (shared vocabulary with /inbox) ----

    // Commit proof badge (e.g. "⌗ 5caea2a") — the ticket carries a checkable
    // commit, so its state is more than someone's word.
    var commit = t.links && typeof t.links === "object" ? t.links.commit : null;
    if (typeof commit === "string" && commit.trim()) {
      var cb = el("div", "proof");
      cb.title = L().proofCommit + ": " + commit;
      cb.appendChild(el("span", "pmark", "⌗"));
      cb.appendChild(el("span", "psha", shortCommit(commit)));
      c.appendChild(cb);
    }
    // Latest promotion badge (e.g. "● production · 2h").
    var pr = state.promoByTicket[t.id];
    if (pr) {
      var pb = el("div", "promo");
      pb.appendChild(el("span", "pdot"));
      pb.appendChild(el("span", "ptarget", pr.target));

  // ---- ask-a-human inbox ----
  function questionsQuery() {
    var q = "/questions?project=" + encodeURIComponent(state.project) + "&status=open";
    if (state.mineOnly && state.me && state.me.expertise.length) q += "&mine=true";

  function refreshInboxCount() {
    if (state.shareMode) return;
    api(questionsQuery()).then(function (res) {
      var items = res.items || [];
      var b = $("inbox-count");
      b.textContent = String(items.length);
      b.classList.toggle("zero", items.length === 0);
      // Build the per-ticket open-question map so cards can show an indicator
      // and the detail drawer can offer "Answer in Inbox".
      var map = {};
      items.forEach(function (q) {
        var m = map[q.ticket] || (map[q.ticket] = { count: 0, blocking: false, advisory: false });
        m.count++;
        if (q.mode && q.mode !== "blocking") m.advisory = true; else m.blocking = true;
      });
      state.openQByTicket = map;
      render(); // paint per-card question indicators
    }).catch(function () { /* count is best-effort */ });

  function openInbox() {

  function renderInbox() {
    var body = $("inbox-body");
    api(questionsQuery()).then(function (res) {
      var items = res.items || [];
      body.innerHTML = "";
      if (state.me && !state.me.canAnswer) {
        body.appendChild(el("div", "q-readonly", L().cantAnswer));
      }
      if (items.length === 0) {
        body.appendChild(el("div", "q-empty", L().allClear));
        return;
      }
      items.forEach(function (q) { body.appendChild(qItemEl(q)); });
    }).catch(function (e) {

  function qItemEl(q) {
    var blocking = !(q.mode && q.mode !== "blocking");
    var item = el("div", "q-item" + (blocking ? " blocking" : ""));
    var urg = q.urgency || "normal";
    var head = el("div", "q-head");
    head.appendChild(el("span", "uw uw-" + urg, cap(urg)));
    head.appendChild(el("span", "uw", blocking ? L().blocking : L().advisory));
    item.appendChild(head);
    item.appendChild(el("div", "q-title", q.title || "(untitled question)"));
    // one monospace identity line: agent · kind · ticket
    item.appendChild(el("div", "q-meta", [q.asked_by || "—", q.kind, q.ticket].join(" · ")));
    if (q.awaiting === "agent") {
      var aw = el("div", "q-rec", "⤺ " + L().awaiting + (q.asked_by || "agent") + L().awaitingSub);
      item.appendChild(aw);
    }
    if (q.body) item.appendChild(mdBody("q-body", q.body));
    if (q.recommended != null && q.recommended !== "") {
      item.appendChild(el("div", "q-rec", (q.asked_by || "agent") + " " + L().recommends + " " + (typeof q.recommended === "string" ? q.recommended : JSON.stringify(q.recommended))));
    }

    var err = el("div", "q-err");
    var note = el("input", "q-note"); note.type = "text"; note.placeholder = L().notePlaceholder;

    if (state.me && state.me.canAnswer) {
      var actions = el("div", "q-actions");
      var send = function (value) { submitAnswer(q.id, value, note.value.trim(), err); };
      if (q.kind === "confirm" || q.kind === "approve") {
        var yes = el("button", "primary", q.kind === "approve" ? L().approve : L().yes);
        var no = el("button", null, q.kind === "approve" ? L().reject : L().no);
        yes.addEventListener("click", function () { send("yes"); });
        no.addEventListener("click", function () { send("no"); });
        actions.appendChild(yes); actions.appendChild(no);
      } else if (q.kind === "choose") {
        (q.options || []).forEach(function (opt) {
          var btn = el("button", null, opt);
          btn.addEventListener("click", function () { send(opt); });
          actions.appendChild(btn);
        });
      } else { // clarify
        var input = el("input"); input.type = "text"; input.placeholder = L().answerPlaceholder;
        var go = el("button", "primary", L().send);
        var submit = function () { var v = input.value.trim(); if (v) send(v); };
        go.addEventListener("click", submit);
        input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
        actions.appendChild(input); actions.appendChild(go);
      }
      item.appendChild(actions);
      item.appendChild(note);
    }
    item.appendChild(err);
    return item;
  }

  function submitAnswer(id, value, noteText, errEl) {
    errEl.textContent = "";
    var payload = noteText ? { value: value, note: noteText } : value;
    api("/questions/" + encodeURIComponent(id) + "/answer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ answer: payload })
    }).then(function () {
      renderInbox();
      refreshInboxCount();
      fullLoad(); // the ticket resumed — refresh the board
    }).catch(function (e) {
      errEl.textContent = "Failed: " + (e && e.message ? e.message : "error") + (e && e.status === 403 ? " (needs a token with the 'human' scope)" : "");
    });
  }

  $("inbox-btn").addEventListener("click", openInbox);
  $("inbox-close").addEventListener("click", closeInbox);
  $("mine-toggle").addEventListener("change", function () {

          } else if (p.url) {

          if (p.note) { if (meta.childNodes.length) meta.appendChild(document.createTextNode(" · ")); meta.appendChild(document.createTextNode(p.note)); }
          row.appendChild(meta);

        plist.appendChild(row);

  // ---- status pill + errors ----
  function setLive(kind, text) {
    // The live indicator was removed from the navbar; keep this tolerant so the
    // many call sites (incl. share mode) don't need touching.
    var dot = $("live-dot");
    if (dot) dot.className = "dot" + (kind === "live" ? " live" : kind === "err" ? " err" : "");
    var txt = $("live-text");
    if (txt) txt.textContent = text;
  }
  function handleErr(e) {
    if (e && e.auth) { showGate("Token was rejected (" + (e.status || "") + "). Enter a valid read token."); return; }
    setLive("err", "error");
    var board = $("board");
    board.innerHTML = "";
    var m = el("div", "empty-col", "Could not load: " + (e && e.message ? e.message : "unknown error"));
    m.style.margin = "40px auto"; m.style.maxWidth = "400px";
    board.appendChild(m);
  }

  // ---- share mode ----------------------------------------------------------
  // A shared link carries its token in the URL FRAGMENT (#s=<token>), which the
  // browser never sends to the server (kept out of logs/referrers). In share
  // mode the board skips the token gate and project picker entirely and talks
  // only to the read-only, scope-bounded /v1/shares/self* endpoints.
  function parseShareToken() {
    var h = window.location.hash || "";
    if (h.charAt(0) === "#") h = h.slice(1);
    var out = "";
    h.split("&").forEach(function (part) {
      var i = part.indexOf("=");
      if (i > 0 && part.slice(0, i) === "s") out = decodeURIComponent(part.slice(i + 1));
    });
    return out;
  }

  // Like api(), but for the share endpoints: carries the share token and maps an
  // expired/revoked share (410) to a friendly terminal error.
  function shareApi(path, opts) {
    opts = opts || {};
    var headers = opts.headers || {};
    headers["Authorization"] = "Bearer " + state.share.token;
    return fetch(API + "/shares" + path, { headers: headers, method: opts.method || "GET" })
      .then(function (r) {
        if (r.status === 410) { var g = new Error("expired"); g.expired = true; throw g; }
        if (r.status === 401 || r.status === 403) { var e = new Error("auth"); e.expired = true; throw e; }
        if (!r.ok) {
          return r.text().then(function (t) {
            var msg = t;
            try { var j = JSON.parse(t); msg = j.message || (j.error && j.error.message) || t; } catch (_) {}
            var e2 = new Error(msg || ("HTTP " + r.status)); e2.status = r.status; throw e2;
          });
        }
        return r.json();
      });
  }

  function fmtExpiry(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString();
  }

  function showExpired() {
    stopPolling();
    $("gate").classList.add("hidden");
    $("topbar").classList.add("hidden");
    closeDetail();
    var board = $("board");
    board.innerHTML = "";
    var wrap = el("div", "card2");
    wrap.style.margin = "60px auto"; wrap.style.maxWidth = "440px"; wrap.style.textAlign = "center";
    wrap.appendChild(el("h1", null, "This shared link has expired"));
    wrap.appendChild(el("p", null, "The link is no longer valid — it has expired or been revoked. Ask whoever shared it for a fresh link."));
    board.appendChild(wrap);
  }

  function bootShare(token) {
    state.shareMode = true;
    state.share = { token: token, meta: null };
    $("gate").classList.add("hidden");
    // Reveal a trimmed header: no project picker, no sign-out, no nav; just a
    // title, the expiry notice, and a manual refresh.
    var bar = $("topbar");
    bar.classList.remove("hidden");
    $("nav").classList.add("hidden");
    $("projsel").classList.add("hidden");
    $("signout").classList.add("hidden");
    $("inbox-btn").classList.add("hidden"); // questions are not part of a read-only share
    setLive("loading", "loading…");
    shareLoad().catch(handleShareErr);
  }

  function shareLoad() {
    setLive("loading", "loading…");
    return shareApi("/self")
      .then(function (meta) {
        state.share.meta = meta;
        state.workflow = meta.workflow;
        // Header: scope + expiry.
        var scope = meta.kind === "project" ? ("project " + meta.project) : ("subtree " + meta.ref);
        $("share-scope").textContent = "Shared view — " + scope;
        $("share-exp").textContent = "expires " + fmtExpiry(meta.expires_at);
        return shareApi("/self/tickets" + (state.showArchived ? "?include_archived=true" : ""));
      })
      .then(function (res) {
        var all = {};
        (res.items || []).forEach(function (t) { all[t.id] = t; });
        state.tickets = all;
        render();
        setLive("live", "read-only");
      });
  }

  function handleShareErr(e) {
    if (e && e.expired) { showExpired(); return; }
    setLive("err", "error");
    var board = $("board");
    board.innerHTML = "";
    var m = el("div", "empty-col", "Could not load the shared view: " + (e && e.message ? e.message : "unknown error"));
    m.style.margin = "40px auto"; m.style.maxWidth = "400px";
    board.appendChild(m);
  }

  // ---- answer-link mode ---------------------------------------------------
  // An answer link carries a per-question grant token in the URL FRAGMENT
  // (#a=<token>) — never sent to the server automatically. It talks only to the
  // write-once /v1/answer/self endpoints and lets an outside expert answer ONE
  // question without any standing token.
  function parseHashKey(key) {
    var h = window.location.hash || "";
    if (h.charAt(0) === "#") h = h.slice(1);
    var out = "";
    h.split("&").forEach(function (part) {
      var i = part.indexOf("=");
      if (i > 0 && part.slice(0, i) === key) out = decodeURIComponent(part.slice(i + 1));
    });
    return out;
  }

  function answerApi(path, opts) {
    opts = opts || {};
    var headers = opts.headers || {};
    headers["Authorization"] = "Bearer " + state.answerToken;
    var init = { headers: headers, method: opts.method || "GET" };
    if (opts.body != null) init.body = opts.body;
    return fetch(API + "/answer" + path, init).then(function (r) {
      if (r.status === 410) { var g = new Error("expired"); g.expired = true; throw g; }
      if (!r.ok) {
        return r.text().then(function (t) {
          var msg = t;
          try { var j = JSON.parse(t); msg = j.message || (j.error && j.error.message) || t; } catch (_) {}
          var e = new Error(msg || ("HTTP " + r.status)); e.status = r.status; throw e;
        });
      }
      return r.json();
    });
  }

  function bootAnswer(token) {
    state.answerToken = token;
    $("gate").classList.add("hidden");
    $("topbar").classList.add("hidden");
    answerApi("/self").then(renderAnswerPage).catch(function (e) {
      if (e && e.expired) { answerCard("This link is no longer valid", "It has expired, been used, or been revoked. Ask whoever sent it for a fresh link."); return; }
      answerCard("Could not load the question", (e && e.message) ? e.message : "unknown error");
    });
  }

  function answerCard(title, msg) {

    wrap.appendChild(brand);

    if (msg) wrap.appendChild(el("p", null, msg));
    board.appendChild(wrap);
    return wrap;
  }

  function renderAnswerPage(data) {
    var q = data.question || {};
    var t = data.ticket;
    if (q.status && q.status !== "open") {
      answerCard("Already answered", "This question is '" + q.status + "'. Nothing more to do — thanks.");
      return;
    }
    var wrap = answerCard("A human decision is needed", null);
    var h1 = wrap.querySelector("h1");
    // outside-expert intro: one question, scoped to an expertise
    var intro = el("div");
    intro.style.background = "var(--col-bg)"; intro.style.borderRadius = "10px";
    intro.style.padding = "12px 15px"; intro.style.margin = "0 0 20px";
    intro.style.fontSize = "12.5px"; intro.style.color = "var(--muted)"; intro.style.lineHeight = "1.55";
    intro.appendChild(document.createTextNode("You've been asked one question as an outside expert"));
    if ((q.expertise || []).length) {
      intro.appendChild(document.createTextNode(" for "));
      var etag = el("span", "mono", q.expertise.join(" ")); etag.style.color = "var(--accent2)";
      intro.appendChild(etag);
    }
    intro.appendChild(document.createTextNode(". You'll see only this — no board, no other tickets."));
    wrap.insertBefore(intro, h1);

    // kind label / badge
    var kindWrap = el("div"); kindWrap.style.marginBottom = "8px";
    if (q.kind === "approve") {
      var kb = el("span", "uw uw-critical", "APPROVE");
      kb.style.textTransform = "uppercase"; kb.style.letterSpacing = ".05em";
      kindWrap.appendChild(kb);
    } else {
      var kl = el("span"); kl.textContent = cap(q.kind || "question");
      kl.style.fontSize = "12px"; kl.style.fontWeight = "700"; kl.style.textTransform = "uppercase";
      kl.style.letterSpacing = ".05em"; kl.style.color = "var(--muted)";
      kindWrap.appendChild(kl);
    }
    wrap.insertBefore(kindWrap, h1);
    // DOM order is now: brand, intro, kindWrap, h1 (title) — meta/body/actions append below.
    h1.textContent = q.title || "A human decision is needed";
    h1.style.fontSize = "22px"; h1.style.letterSpacing = "-.02em"; h1.style.lineHeight = "1.28"; h1.style.margin = "0 0 8px";

    var meta = el("div"); meta.style.fontSize = "12.5px"; meta.style.color = "var(--muted)"; meta.style.marginBottom = "16px";
    meta.appendChild(document.createTextNode("asked by "));
    meta.appendChild(el("span", "mono", q.asked_by || (t && t.id) || "agent"));
    wrap.appendChild(meta);

    if (q.body) { var body = el("div", null, q.body); body.style.whiteSpace = "pre-wrap"; body.style.fontSize = "14px"; body.style.lineHeight = "1.65"; body.style.color = "var(--ink2)"; body.style.margin = "0 0 20px"; wrap.appendChild(body); }
    if (q.recommended != null && q.recommended !== "") {
      var rec = el("div"); rec.style.background = "var(--col-bg)"; rec.style.borderRadius = "10px"; rec.style.padding = "12px 14px"; rec.style.margin = "0 0 16px"; rec.style.fontSize = "13.5px"; rec.style.color = "var(--text)";
      rec.appendChild(el("span", null, (q.asked_by || "agent") + " " + L().recommends + " "));
      rec.appendChild(document.createTextNode(typeof q.recommended === "string" ? q.recommended : JSON.stringify(q.recommended)));
      wrap.appendChild(rec);
    }

    var err = el("div", "q-err");
    var note = el("input", "q-note"); note.type = "text"; note.placeholder = L().notePlaceholder;
    var actions = el("div", "q-actions");
    var send = function (value) {
      err.textContent = "";
      var payload = note.value.trim() ? { value: value, note: note.value.trim() } : value;
      answerApi("/self", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answer: payload }) })
        .then(function () { answerCard("Thank you", "Your answer was recorded."); })
        .catch(function (e) {
          if (e && e.expired) { answerCard("This link is no longer valid", "It may have just been used or expired."); return; }
          err.textContent = "Failed: " + ((e && e.message) ? e.message : "error");
        });
    };
    if (q.kind === "confirm" || q.kind === "approve") {
      var yes = el("button", "primary", q.kind === "approve" ? L().approve : L().yes);
      var no = el("button", null, q.kind === "approve" ? L().reject : L().no);
      yes.addEventListener("click", function () { send("yes"); });
      no.addEventListener("click", function () { send("no"); });
      actions.appendChild(yes); actions.appendChild(no);
    } else if (q.kind === "choose") {
      (q.options || []).forEach(function (opt) {
        var btn = el("button", null, opt);
        btn.addEventListener("click", function () { send(opt); });
        actions.appendChild(btn);
      });
    } else {
      var input = el("input"); input.type = "text"; input.placeholder = L().answerPlaceholder; input.style.flex = "1 1 200px";
      var go = el("button", "primary", L().send);
      var submit = function () { var v = input.value.trim(); if (v) send(v); };
      go.addEventListener("click", submit);
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
      actions.appendChild(input); actions.appendChild(go);
    }
    wrap.appendChild(actions);
    wrap.appendChild(note);
    wrap.appendChild(err);
    var lock = el("div"); lock.style.marginTop = "16px"; lock.style.paddingTop = "16px"; lock.style.borderTop = "1px solid var(--border-soft)"; lock.style.fontSize = "12px"; lock.style.color = "var(--muted)";
    lock.textContent = "🔒 This link answers one question, then expires.";
    wrap.appendChild(lock);
  }

  // ---- i18n chrome + language toggle ----
  function applyChrome() {
    $("brand").innerHTML = LOGO + '<span>takomo</span>';
    $("gate-brand").innerHTML = LOGO;
    $("nav-board").textContent = L().board; $("nav-inbox").textContent = L().inbox;
    $("gate-sub").textContent = L().gateSub; $("gate-tokenlabel").textContent = L().gateTokenLabel;
    $("gate-projectlabel").textContent = L().gateProjectLabel; $("g-go").textContent = L().gateOpen;
    $("arch-label").textContent = L().archived; $("askhuman-label").textContent = L().askHuman;
    var gl = $("group-label"); if (gl) gl.textContent = L().groupEpic;
    $("refresh-label").textContent = L().refresh; $("signout-label").textContent = L().signout;
    var fi = document.querySelector("#inbox .full"); if (fi) fi.textContent = L().fullInbox;
    $("lang-de").className = state.lang === "de" ? "on" : ""; $("lang-en").className = state.lang === "en" ? "on" : "";
    document.documentElement.lang = state.lang;
  }
  function setLang(l) {
    state.lang = l; localStorage.setItem(LS_LANG, l); applyChrome();
    if (state.workflow) render();
    if (state.inboxOpen) renderInbox();
    if (state.openTicketId) openDetail(state.openTicketId);
  }
  activate($("lang-de"), function () { setLang("de"); });
  activate($("lang-en"), function () { setLang("en"); });

  // 4-bar priority gauge (matches the design's rank glyph).
  function gaugeEl(prio) {
    var lvl = { critical: 4, high: 3, normal: 2, low: 1 }[prio] || 1;
    var color = prio === "critical" ? "var(--accent)" : prio === "high" ? "var(--high)" : prio === "normal" ? "var(--normal)" : "var(--low)";
    var w = el("span", "bars");
    for (var i = 1; i <= 4; i++) { var b = el("span", "bar"); b.style.background = i <= lvl ? color : "var(--gaugeoff)"; w.appendChild(b); }
    return w;
  }

  // ---- start ----
  applyChrome();
  var answerToken = parseHashKey("a");
  var shareToken = parseHashKey("s");
  if (answerToken) {
    bootAnswer(answerToken);
  } else if (shareToken) {
    bootShare(shareToken);
  } else if (state.token && state.project) {
    hideGate();
    boot();
  } else {
    showGate("");
  }
})();
</script>
</body>
</html>
