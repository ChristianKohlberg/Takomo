  // ---- project settings sheet ----
  // Shows, and for an `admin` token edits, the per-project settings: the two
  // writing conventions the store hands to agents (`question_language`,
  // `style_guide`) and the enforced `answer_link_ttl_seconds` — how long a link
  // handed to an outside expert stays valid. Each has its own endpoint, so Save
  // sends only the fields that actually changed — a no-op field is never PUT,
  // and one failing endpoint can't silently discard another's edit.
  function openSettings() {
    state.settings = {
      loading: true, saving: false, err: "", saved: false,
      // Latched at open time, not read live: /whoami can never re-answer mid-sheet
      // and turn a read-only sheet the viewer has been reading into an editable one.
      readOnly: !!state.settingsReadOnly,
      // `ttl` is "" for "unset — use the built-in default", otherwise a string
      // of seconds. Kept as a string so it compares straight against the select's
      // value and against `orig` without a null-vs-0 special case.
      orig: { language: "", style: "", ttl: "", claimTtl: "", maxClaimTtl: "" },
      language: "", style: "", ttl: "", claimTtl: "", maxClaimTtl: ""
    };
    renderSettings();
    // Re-read from the store rather than trusting the cached project list: this
    // is a write surface, and a stale base would let one admin's Save quietly
    // revert another's.
    api("/projects").then(function (projects) {
      var p = null;
      (projects || []).forEach(function (row) { if (row.id === state.project) p = row; });
      if (!state.settings) return; // closed while loading
      if (!p) throw new Error("project '" + state.project + "' not visible to this token");
      var lang = p.question_language || "", style = p.style_guide || "";
      // null/absent = the project sets no default. Anything else is seconds.
      var ttl = p.answer_link_ttl_seconds == null ? "" : String(p.answer_link_ttl_seconds);
      // The lease policy, a separate pair of settings from the answer-link
      // lifetime above: how long a worker may hold a ticket, not how long a
      // credential handed outside the org stays valid.
      var claimTtl = p.claim_ttl_seconds == null ? "" : String(p.claim_ttl_seconds);
      var maxClaimTtl = p.max_claim_ttl_seconds == null ? "" : String(p.max_claim_ttl_seconds);
      state.settings.loading = false;
      state.settings.orig = { language: lang, style: style, ttl: ttl, claimTtl: claimTtl, maxClaimTtl: maxClaimTtl };
      state.settings.language = lang;
      state.settings.style = style;
      state.settings.ttl = ttl;
      state.settings.claimTtl = claimTtl;
      state.settings.maxClaimTtl = maxClaimTtl;
      state.settings.workflow = p.workflow || "";
      state.settings.name = p.name || "";
      renderSettings();
    }).catch(function (e) {
      if (!state.settings) return;
      state.settings.loading = false;
      state.settings.err = L().setLoadErr + (e.auth ? "403" : e.message);
      renderSettings();
    });
  }

  function closeSettings() {
    state.settings = null;
    $("modal-root").innerHTML = "";
    $("settings-btn").focus();
  }

  // Acknowledge a press on the aria-disabled Save. The reason is already on
  // screen next to the button, so re-stating it means drawing the eye back to
  // it rather than raising a toast this SPA does not otherwise have.
  function flashSettingsReason() {
    var hint = $("set-hint");
    if (!hint) return;
    hint.classList.remove("flash");
    void hint.offsetWidth; // restart the animation on a repeated press
    hint.classList.add("flash");
  }

  function saveSettings() {
    var s = state.settings;
    if (!s || s.saving) return;
    // Save is aria-disabled, not `disabled`, so it can still be pressed. This is
    // the same test syncFooter paints with, so the visual state and the actual
    // refusal cannot drift apart: acknowledge the press by re-stating the reason,
    // never attempt a PUT we already know the server will 403.
    if (s.readOnly) { flashSettingsReason(); return; }
    var style = s.style.trim(), language = s.language.trim();
    if (style.length > STYLE_MAX) return; // Save is disabled; belt and braces
    var calls = [];
    if (language !== s.orig.language.trim()) {
      calls.push(["/projects/" + encodeURIComponent(state.project) + "/language",
                  { language: language === "" ? null : language }]);
    }
    if (style !== s.orig.style.trim()) {
      calls.push(["/projects/" + encodeURIComponent(state.project) + "/style",
                  { style_guide: style === "" ? null : style }]);
    }
    if (s.ttl !== s.orig.ttl) {
      calls.push(["/projects/" + encodeURIComponent(state.project) + "/answer-link-ttl",
                  { ttl_seconds: s.ttl === "" ? null : Number(s.ttl) }]);
    }
    // The lease pair goes in ONE call even when only one half changed: the
    // endpoint validates them together, and sending half of an invalid pair would
    // get a 422 naming a number the admin never touched.
    if (s.claimTtl !== s.orig.claimTtl || s.maxClaimTtl !== s.orig.maxClaimTtl) {
      calls.push(["/projects/" + encodeURIComponent(state.project) + "/claim-ttl",
                  { ttl_seconds: s.claimTtl === "" ? null : Number(s.claimTtl),
                    max_ttl_seconds: s.maxClaimTtl === "" ? null : Number(s.maxClaimTtl) }]);
    }
    if (!calls.length) { closeSettings(); return; }
    s.saving = true; s.err = ""; s.saved = false;
    renderSettings();
    // Sequential, not parallel: SQLite is a single writer and two PUTs on the
    // same project row would just serialize anyway — this way a failure reports
    // which field it was on.
    var chain = Promise.resolve();
    calls.forEach(function (c) {
      chain = chain.then(function () {
        return api(c[0], {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(c[1])
        });
      });
    });
    chain.then(function (p) {
      if (!state.settings) return;
      state.settings.saving = false;
      state.settings.saved = true;
      // The response is the updated project, so the new baseline comes from the
      // store rather than from what we hoped we sent.
      state.settings.orig = {
        language: (p && p.question_language) || "",
        style: (p && p.style_guide) || "",
        ttl: (p && p.answer_link_ttl_seconds != null) ? String(p.answer_link_ttl_seconds) : "",
        claimTtl: (p && p.claim_ttl_seconds != null) ? String(p.claim_ttl_seconds) : "",
        maxClaimTtl: (p && p.max_claim_ttl_seconds != null) ? String(p.max_claim_ttl_seconds) : ""
      };
      state.settings.language = state.settings.orig.language;
      state.settings.style = state.settings.orig.style;
      state.settings.ttl = state.settings.orig.ttl;
      state.settings.claimTtl = state.settings.orig.claimTtl;
      state.settings.maxClaimTtl = state.settings.orig.maxClaimTtl;
      renderSettings();
    }).catch(function (e) {
      if (!state.settings) return;
      state.settings.saving = false;
      state.settings.err = e.auth ? "403 — this token cannot change project settings." : e.message;
      renderSettings();
    });
  }

  function renderSettings() {
    var root = $("modal-root");
    root.innerHTML = "";
    var s = state.settings;
    if (!s) return;

    var scrim = el("div", "modal-scrim");
    scrim.addEventListener("click", closeSettings);
    var sheet = el("div", "sheet");
    sheet.setAttribute("role", "dialog");
    sheet.setAttribute("aria-modal", "true");
    sheet.setAttribute("aria-label", L().setTitle);
    sheet.addEventListener("click", function (e) { e.stopPropagation(); });

    // header
    var head = el("div", "sh");
    var titles = el("div", "titles");
    titles.appendChild(el("h2", null, L().setTitle));
    var sub = el("div", "sub");
    var pid = el("span", "mono", state.project);
    sub.appendChild(pid);
    sub.appendChild(document.createTextNode(" · " + L().setSub));
    titles.appendChild(sub);
    head.appendChild(titles);
    var x = el("button", "close", "×");
    // There is nothing to cancel in a sheet you cannot change: it closes.
    x.setAttribute("aria-label", s.readOnly ? L().setClose : L().setCancel);
    x.addEventListener("click", closeSettings);
    head.appendChild(x);
    sheet.appendChild(head);

    // body
    var body = el("div", "sb");
    if (s.loading) {
      body.appendChild(el("div", "msg", L().setLoading));
    } else if (s.err && !s.orig) {
      body.appendChild(el("div", "msg err", s.err));
    } else {
      // question language
      var f1 = el("div", "fld");
      var l1 = el("label", null, L().setLangLabel); l1.setAttribute("for", "set-lang");
      f1.appendChild(l1);
      f1.appendChild(el("div", "help", L().setLangHelp));
      var i1 = el("input"); i1.type = "text"; i1.id = "set-lang";
      i1.value = s.language; i1.placeholder = L().setLangPh;
      if (s.readOnly) {
        // `readonly`, not `disabled`: the point of opening this sheet without
        // `admin` is to READ the value — it stays focusable, selectable and
        // copyable, and is announced as read-only rather than dropping out of
        // the tab order the way a disabled field does.
        i1.readOnly = true;
        i1.setAttribute("aria-readonly", "true");
      } else {
        i1.addEventListener("input", function () { s.language = i1.value; s.saved = false; syncFooter(); });
      }
      f1.appendChild(i1);
      body.appendChild(f1);

      // style guide
      var f2 = el("div", "fld");
      var l2 = el("label", null, L().setStyleLabel); l2.setAttribute("for", "set-style");
      f2.appendChild(l2);
      f2.appendChild(el("div", "help", L().setStyleHelp));
      var ta = el("textarea"); ta.id = "set-style";
      ta.value = s.style; ta.placeholder = L().setStylePh;
      ta.setAttribute("spellcheck", "true");
      if (s.readOnly) { ta.readOnly = true; ta.setAttribute("aria-readonly", "true"); }
      f2.appendChild(ta);
      body.appendChild(f2);

      // The counter is the only place the 2000-char cap is visible before Save,
      // so it doubles as the reason Save goes disabled. A read-only sheet has no
      // Save and no way to reach the cap, so the counter would be a limit shown
      // to someone who cannot exceed it — left out entirely.
      if (!s.readOnly) {
        var cnt = el("div", "cnt");
        var n = el("span", "n");
        cnt.appendChild(n);
        cnt.appendChild(el("span", null, L().setChars));
        f2.appendChild(cnt);
        var updateCount = function () {
          var len = ta.value.trim().length;
          n.textContent = len + " / " + STYLE_MAX;
          n.className = "n" + (len > STYLE_MAX ? " over" : len > STYLE_MAX * 0.9 ? " warn" : "");
        };
        ta.addEventListener("input", function () { s.style = ta.value; s.saved = false; updateCount(); syncFooter(); });
        updateCount();
      }

      // answer-link lifetime
      //
      // A fixed set of choices rather than a free-text duration: the value is
      // bounded (positive, at most 30 days) and a text field would need a parser,
      // an invalid-duration error state, and that error string in both locales —
      // three things a select cannot produce, because it can only emit a value
      // the server already accepts. The bounds become the list.
      var f3 = el("div", "fld");
      var l3 = el("label", null, L().setTtlLabel); l3.setAttribute("for", "set-ttl");
      f3.appendChild(l3);
      f3.appendChild(el("div", "help", L().setTtlHelp));
      var choices = [["", L().setTtlDefault], ["86400", L().setTtl24h], ["259200", L().setTtl3d],
                     ["604800", L().setTtl7d], ["1209600", L().setTtl14d], ["2592000", L().setTtl30d]];
      // A value set through the API need not be one of the six. Show it rather
      // than snapping the control to a neighbour — a sheet that silently rewrites
      // a setting on open is worse than one that shows an odd number.
      var known = choices.some(function (c) { return c[0] === s.ttl; });
      if (!known) choices.push([s.ttl, s.ttl + " " + L().setTtlSecs]);
      if (s.readOnly) {
        // A <select> has no `readonly`, and `disabled` would drop it out of the
        // tab order and explain nothing — the dead-control trap takomo-n0al
        // fixed. So a read-only sheet renders the chosen lifetime as the same
        // readonly text field the other two settings use: focusable, selectable,
        // copyable, announced read-only.
        var ro = el("input"); ro.type = "text"; ro.id = "set-ttl";
        choices.forEach(function (c) { if (c[0] === s.ttl) ro.value = c[1]; });
        ro.readOnly = true;
        ro.setAttribute("aria-readonly", "true");
        f3.appendChild(ro);
      } else {
        var sel = el("select"); sel.id = "set-ttl";
        choices.forEach(function (c) {
          var o = el("option", null, c[1]);
          o.value = c[0];
          if (c[0] === s.ttl) o.selected = true;
          sel.appendChild(o);
        });
        sel.addEventListener("change", function () { s.ttl = sel.value; s.saved = false; syncFooter(); });
        f3.appendChild(sel);
      }
      body.appendChild(f3);

      // Lease policy: how long a worker may hold a ticket.
      //
      // Two fields, one endpoint — the server validates them as a pair, because a
      // default above the ceiling would be silently clamped on every claim. The
      // sheet does NOT re-implement that rule: an invalid pair comes back as the
      // store's 422, which names both numbers, and lands in the footer like any
      // other save error. One place owns the rule.
      //
      // Selects, for the reason the answer-link field is one — except that this
      // ceiling is deliberately unbounded per project (takomo-2ztv), so the list
      // cannot be the bounds. It is a list of *common* values plus the same
      // escape hatch that field uses: an unlisted stored value is shown as itself
      // rather than snapped to a neighbour.
      [
        ["claimTtl", "set-claim-ttl", L().setClaimTtlLabel, L().setClaimTtlHelp, L().setClaimTtlDefault,
         [["300", L().setDur5m], ["900", L().setDur15m], ["1800", L().setDur30m],
          ["3600", L().setDur1h], ["7200", L().setDur2h], ["14400", L().setDur4h]]],
        ["maxClaimTtl", "set-max-claim-ttl", L().setMaxClaimTtlLabel, L().setMaxClaimTtlHelp, L().setMaxClaimTtlDefault,
         [["1800", L().setDur30m], ["3600", L().setDur1h], ["7200", L().setDur2h],
          ["14400", L().setDur4h], ["28800", L().setDur8h], ["86400", L().setDur24h]]]
      ].forEach(function (spec) {
        var key = spec[0], domId = spec[1], labelText = spec[2], helpText = spec[3];
        var defaultText = spec[4], durations = spec[5];
        var fld = el("div", "fld");
        var lbl = el("label", null, labelText); lbl.setAttribute("for", domId);
        fld.appendChild(lbl);
        fld.appendChild(el("div", "help", helpText));
        var opts = [["", defaultText]].concat(durations);
        var listed = opts.some(function (c) { return c[0] === s[key]; });
        if (!listed) opts.push([s[key], s[key] + " " + L().setTtlSecs]);
        if (s.readOnly) {
          var roIn = el("input"); roIn.type = "text"; roIn.id = domId;
          opts.forEach(function (c) { if (c[0] === s[key]) roIn.value = c[1]; });
          roIn.readOnly = true;
          roIn.setAttribute("aria-readonly", "true");
          fld.appendChild(roIn);
        } else {
          var pick = el("select"); pick.id = domId;
          opts.forEach(function (c) {
            var o = el("option", null, c[1]);
            o.value = c[0];
            if (c[0] === s[key]) o.selected = true;
            pick.appendChild(o);
          });
          pick.addEventListener("change", function () { s[key] = pick.value; s.saved = false; syncFooter(); });
          fld.appendChild(pick);
        }
        body.appendChild(fld);
      });
    }
    sheet.appendChild(body);

    // footer
    var foot = el("div", "sf");
    var status = el("div", "msg");
    status.id = "set-hint";
    foot.appendChild(status);
    foot.appendChild(el("span", "grow"));
    var cancel = el("button", "cancel", s.readOnly ? L().setClose : L().setCancel);
    cancel.addEventListener("click", closeSettings);
    var save = el("button", "primary", L().setSave);
    // The footer message is Save's accessible description in every state — it is
    // where the over-limit reason already lived, and where the read-only reason
    // goes now, so a screen reader gets the same sentence a sighted reader does.
    save.setAttribute("aria-describedby", "set-hint");
    save.addEventListener("click", saveSettings);
    foot.appendChild(cancel);
    foot.appendChild(save);
    sheet.appendChild(foot);

    function syncFooter() {
      if (s.readOnly) {
        // takomo-8iin's precedent, one surface over in /inbox: deliberately NOT
        // the native `disabled` attribute, which drops the control out of the tab
        // order and explains nothing — the same dead-control trap that produced
        // this ticket. `aria-disabled` keeps Save focusable and announced as
        // unavailable, and the reason beside it says which scope opens it.
        save.textContent = L().setSave;
        save.disabled = false;
        save.setAttribute("aria-disabled", "true");
        save.title = L().setReadOnly;
        status.className = "msg" + (s.err ? " err" : " ro");
        status.textContent = s.err || L().setReadOnly;
        showStatus();
        return;
      }
      var over = s.style.trim().length > STYLE_MAX;
      // Every editable field belongs in this list. Save is a real `disabled`
      // button when nothing is dirty, so a field missing here is not a cosmetic
      // bug: its edits cannot be saved at all, and the click reports nothing.
      var dirty = s.language.trim() !== s.orig.language.trim()
        || s.style.trim() !== s.orig.style.trim()
        || s.ttl !== s.orig.ttl
        || s.claimTtl !== s.orig.claimTtl
        || s.maxClaimTtl !== s.orig.maxClaimTtl;
      save.textContent = s.saving ? L().setSaving : L().setSave;
      save.disabled = s.loading || s.saving || over || !dirty;
      save.setAttribute("aria-disabled", save.disabled ? "true" : "false");
      status.className = "msg" + (s.err ? " err" : s.saved ? " ok" : "");
      status.textContent = s.err ? s.err
        : s.saved ? L().setSaved
        : over ? L().setOver
        : "";
      showStatus();
    }
    // On a phone the footer wraps and the message claims the whole first line, so
    // an empty one would spend a row's gap saying nothing. Zero-width either way
    // on desktop, where the spacer absorbs the difference.
    function showStatus() { status.style.display = status.textContent ? "" : "none"; }
    syncFooter();

    scrim.appendChild(sheet);
    root.appendChild(scrim);
    var first = $("set-lang");
    if (first) first.focus();
  }

  $("settings-btn").addEventListener("click", openSettings);

  // 4-bar priority gauge (matches the design's rank glyph).
  function gaugeEl(prio) {
    var lvl = { critical: 4, high: 3, normal: 2, low: 1 }[prio] || 1;
    var color = prio === "critical" ? "var(--accent)" : prio === "high" ? "var(--high)" : prio === "normal" ? "var(--normal)" : "var(--low)";
    var w = el("span", "bars");
    for (var i = 1; i <= 4; i++) { var b = el("span", "bar"); b.style.background = i <= lvl ? color : "var(--gaugeoff)"; w.appendChild(b); }
    return w;
  }

  // ---- start ----
  applyChrome();
  var answerToken = parseHashKey("a");
  var shareToken = parseHashKey("s");
  if (answerToken) {
    bootAnswer(answerToken);
  } else if (shareToken) {
    bootShare(shareToken);
  } else if (state.token && state.project) {
    hideGate();
    boot();
  } else {
    showGate("");
  }
})();
</script>
</body>
</html>
