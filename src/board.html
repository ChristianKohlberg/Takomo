<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>takomo board</title>
<style>
  /* ---- theme tokens (light default, dark via prefers-color-scheme) ---- */
  /* Aquarelle palette — shared with /inbox. --accent = deep blue (primary /
     critical emphasis); --high/--normal/--low = urgency scale; --crit = warm
     error/reject/bug. Each attribute is encoded once: priority is a single
     colored word, identifiers are monospace, the important card is a tinted
     field (no left stripe). */
  :root {
    --bg: #eef1f4; --panel: #ffffff; --col-bg: #f7fafc; --text: #14202a;
    --muted: #6e7c88; --cap: #5b6b78; --ink2: #3a4a56; --border: #e6ecf0; --border-soft: #eef2f5;
    --accent: #1f4e78; --accent2: #2f6ba0; --accent-ink: #173d5e;
    --shadow: 0 18px 50px -26px rgba(20,40,55,.28);
    --crit: #b4543f; --ok: #3f7a5f;
    --high: #2f6ba0; --normal: #5b8bb5; --low: #7d8a95; --gaugeoff: #cfd9e2;
    --chip-bg: #eaf2f9; --chip-text: #2f6ba0; --sel: #eef5fb; --sel-border: #cfe0ee; --hover: #f2f6fa;
    --overlay: rgba(20,40,55,.5);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e141b; --panel: #141d27; --col-bg: #101821; --text: #e6eef5;
      --muted: #8ba0b0; --cap: #9aabb8; --ink2: #c3d2de; --border: #26313d; --border-soft: #1e2833;
      --accent: #4c8dff; --accent2: #6ea8ff; --accent-ink: #7fb2ff;
      --shadow: 0 18px 50px -26px rgba(0,0,0,.6);
      --crit: #e0836f; --ok: #5fbf8f;
      --high: #6ea8ff; --normal: #7fa8d4; --low: #8494a1; --gaugeoff: #33414f;
      --chip-bg: #1a2836; --chip-text: #8fb6dc; --sel: #16263a; --sel-border: #2b4a63; --hover: #17212c;
      --overlay: rgba(1,4,9,.72);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }

  /* ---- shared header ---- */
  header {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    padding: 0 20px; min-height: 58px; background: var(--panel);
    border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 9px; color: var(--accent2); }
  .brand svg { display: block; }
  .brand span { font-size: 16px; font-weight: 750; letter-spacing: -.02em; color: var(--text); }
  .nav { display: flex; gap: 4px; }
  .nav a, .nav span.navpill {
    font-size: 13px; font-weight: 650; color: var(--muted); text-decoration: none;
    padding: 6px 12px; border-radius: 8px;
  }
  .nav a:hover { color: var(--accent); background: var(--hover); }
  .nav .active { color: var(--accent); background: var(--chip-bg); font-weight: 680; }
  header .grow { flex: 1 1 auto; }
  select, input, button {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
  }
  header select { max-width: 220px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  button.primary:hover { background: var(--accent-ink); }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.ghost:hover { color: var(--accent); background: var(--hover); }
  .status { font-size: 12px; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; }
  .share-banner { font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; }
  .share-banner:empty { display: none; }
  .share-exp:empty { display: none; }
  .archtoggle { font-size: 12.5px; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .iconbtn { position: relative; font-weight: 650; color: var(--accent2); }
  .iconbtn:hover { background: var(--hover); }
  .badge {
    display: inline-block; min-width: 17px; padding: 0 5px; border-radius: 9px;
    background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
    text-align: center; margin-left: 6px; line-height: 17px;
  }
  .badge.zero { display: none; }
  /* Every header action carries both a word and a glyph, and exactly one of
     them is ever visible: the word on a desktop, the glyph on a phone. The
     button's accessible name comes from an aria-label set in applyChrome, so
     hiding the word never costs a screen reader anything. */
  header .ico { display: none; font-size: 15px; line-height: 1; }
  /* The filter cluster. `display: contents` dissolves it — its children lay
     out in the header's flex row exactly as the loose controls did before,
     same order, same gap, same everything. The phone stylesheet turns it back
     into a real box (a panel behind one control); a desktop keeps it dissolved
     and merely hides the children while the disclosure is closed. */
  #filters { display: contents; }
  .filtbtn { display: none; }

  /* ---- the filter disclosure on a desktop (takomo-7u9t) ----
     The header wrapped to two rows at 1440/1280/1024 and three at 761, the
     same in both locales: one packed row plus a near-empty strip carrying
     Refresh and Sign out alone. It read as a wrap accident rather than a
     header anyone designed.

     a4ee980 already built the one control that fixes it, and scoped it below
     760px. This extends it upward. The phone needs a PANEL because a phone has
     no room to put the controls back where they were; a desktop has, so the
     open state here is simply the controls reappearing inline, in the same
     order and the same row they have always occupied. That is why this is two
     rules and not a second layout: scope the HIDING to the closed state
     instead of scoping the panel to the phone.

     Closed: 1 row, 58px at 1440 and 1280. Open: 2 rows, 83.6px — the height
     and the row count the header has today. Not the identical pixels: the
     disclosure button now sits in that row too and shifts what follows it.

     The project picker stays out of the disclosure deliberately. It is the
     only place the board says WHICH PROJECT you are looking at, which is
     context rather than a filter, and context should not need a click. The
     price is 179px, which is why 1024px keeps its second row: a chosen
     consequence, not a defect. Hiding the picker would buy that row back and
     is not a fix — it is the option that was weighed and turned down.

     The chevron is the one thing that is not shared with the phone rule. Every
     other header action hides its glyph on a desktop and shows its word, and
     this button would too — leaving a ghost button reading "Filters" between
     "Ask a human" and "Settings", indistinguishable from the controls that act
     rather than reveal. So the ▾ stays on at every width: it is what says this
     one opens. It is already in the DOM and already aria-hidden, so it costs
     no string and nothing to a screen reader, which is told the same thing by
     aria-expanded. */
  @media (min-width: 761px) {
    .filtbtn { display: inline-flex; align-items: center; gap: 6px; }
    .filtbtn .ico { display: inline-block; }
    body:not(.filters-open) #filters > *:not(#projsel) { display: none; }
  }

  .langtoggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .langtoggle span { font-size: 12px; font-weight: 680; padding: 5px 10px; cursor: pointer; color: var(--muted); }
  .langtoggle span.on { background: var(--accent); color: #fff; }
  .bars { display: inline-flex; gap: 2px; vertical-align: middle; }
  .bars .bar { width: 11px; height: 4px; border-radius: 2px; background: var(--gaugeoff); }

  /* ---- board ---- */
  #board {
    display: flex; gap: 16px; align-items: flex-start;
    padding: 18px 18px 40px; overflow-x: auto; min-height: calc(100vh - 58px);
  }
  .column { flex: 0 0 270px; max-width: 270px; display: flex; flex-direction: column; gap: 10px; }
  .column h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 750;
    margin: 0; padding: 0 2px 2px; color: var(--cap); display: flex; align-items: center; gap: 8px;
  }
  .column h2 .count { color: var(--low); font-size: 12px; font-weight: 600; }
  .column.done h2 { color: var(--muted); }
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .epicsel { max-width: 190px; }

  /* ---- typeahead (combobox) — the ticket filter, and later the tag values ----
     Sized to sit in the header next to the plain <select>s, and self-contained:
     the popup is absolutely positioned inside .ta, so the whole control can be
     moved or stacked (see the mobile-layout ticket) without touching this. */
  .ta { position: relative; display: inline-flex; align-items: center; max-width: 100%; }
  /* Visually hidden, still read: the control needs a name, and the header has
     no room for a visible one. */
  .ta-label {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
  }
  .ta input { width: 190px; max-width: 100%; padding-right: 28px; text-overflow: ellipsis; }
  .ta.narrow input { width: 150px; } /* tag handles are short; a ticket line is not */
  .ta.has-value input { font-weight: 620; border-color: var(--sel-border); background: var(--sel); }
  .ta-clear {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    border: 0; background: transparent; color: var(--muted); line-height: 1;
    font-size: 15px; padding: 3px 5px; border-radius: 6px;
  }
  .ta-clear:hover { color: var(--crit); background: var(--hover); }
  .ta-pop {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 20;
    min-width: 100%; width: max-content; max-width: min(420px, calc(100vw - 28px));
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .ta-list { list-style: none; margin: 0; padding: 4px; max-height: 46vh; overflow-y: auto; }
  .ta-list:empty { display: none; }
  .ta-list li {
    display: flex; align-items: baseline; gap: 7px; padding: 6px 9px; border-radius: 7px;
    cursor: pointer; font-size: 13px;
  }
  .ta-list li .tlead { font-family: var(--mono); font-size: 12px; color: var(--low); flex: 0 0 auto; }
  .ta-list li .ttext { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ta-list li[aria-selected="true"] { font-weight: 680; }
  .ta-list li[aria-selected="true"] .tlead { color: var(--accent2); }
  .ta-list li.on { background: var(--sel); color: var(--accent); }
  .ta-note { padding: 7px 11px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border-soft); }
  .ta-note:empty { display: none; }

  .grouptoggle { font-size: 12.5px; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .subhd { display: flex; align-items: baseline; gap: 7px; padding: 4px 2px 0; margin-top: 2px; }
  .subhd .slbl { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .subhd .scount { font-size: 11px; color: var(--low); font-weight: 600; flex: 0 0 auto; }
  .morebtn { border: 1px dashed var(--border); background: transparent; color: var(--accent2); border-radius: 9px; padding: 8px 10px; font: inherit; font-size: 12px; font-weight: 650; cursor: pointer; text-align: center; }
  .morebtn:hover { border-color: var(--sel-border); background: var(--hover); color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 10px; padding: 13px 14px; cursor: pointer; }
  .card:hover { border-color: var(--sel-border); }
  .card.tint { background: var(--sel); border-color: var(--sel-border); box-shadow: 0 10px 24px -14px rgba(31,78,120,.45); }
  .card.done { background: transparent; }
  .card.archived { opacity: .55; }
  .card .ctop { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
  .card .cid { font-family: var(--mono); font-size: 12px; color: var(--low); }
  .card.bug .cid { color: var(--crit); }
  .card.tint .cid { color: var(--muted); font-weight: 600; }
  .card .qflag { font-size: 12px; font-weight: 600; color: var(--accent2); white-space: nowrap; }
  .card .qflag.blocking { color: var(--accent); font-weight: 700; }
  /* In conversation: the ball is with the agent, so the card is a different
     shape in the column (dashed edge) without borrowing the attention tint
     that means "a human has to decide this". */
  .card .qflag.conv { color: var(--muted); font-weight: 650; }
  .card.conv { border-style: dashed; border-color: var(--sel-border); }
  .card .ctitle { font-size: 13.5px; font-weight: 650; line-height: 1.4; margin-bottom: 10px; word-break: break-word; color: var(--text); }
  .card.tint .ctitle { font-weight: 700; }
  .card.done .ctitle { font-weight: 550; color: var(--muted); margin-bottom: 0; }
  .card .cbot { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .card .holder { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .arch-tag { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .card .promo { display: flex; align-items: center; gap: 6px; margin-top: 9px; font-size: 12px; color: var(--ok); }
  .card .promo .pdot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: 0 0 auto; }
  .card .promo .ptarget { font-family: var(--mono); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .promo .page { color: var(--muted); flex: 0 0 auto; }
  /* Commit proof — quieter than the promotion badge: it says "verifiable",
     not "shipped", and must not compete with the deploy signal. */
  .card .proof { display: flex; align-items: center; gap: 5px; margin-top: 7px; font-size: 12px; color: var(--muted); min-width: 0; }
  .card .proof .pmark { flex: 0 0 auto; opacity: .75; }
  .card .proof .psha { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty-col { color: var(--muted); font-size: 12px; text-align: center; padding: 14px 4px; opacity: .6; }
  .promo-list { display: flex; flex-direction: column; gap: 8px; }
  .promo-row { display: flex; flex-direction: column; gap: 3px; border-left: 2px solid var(--ok); padding: 2px 0 4px 10px; }
  .promo-row .pr-head { display: flex; align-items: baseline; gap: 8px; }
  .promo-row .pr-target { font-family: var(--mono); font-weight: 700; color: var(--ok); }
  .promo-row .pr-when { font-size: 12px; color: var(--muted); }
  .promo-row .pr-meta { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .promo-row .pr-meta a { font-family: var(--mono); }

  /* priority/urgency as a single colored word */
  .uw { font-size: 12px; }
  .uw-critical { color: var(--accent); font-weight: 700; }
  .uw-high { color: var(--high); font-weight: 600; }
  .uw-normal { color: var(--normal); font-weight: 600; }
  .uw-low { color: var(--low); font-weight: 600; }

  /* ---- project settings modal ----
     A wide, scrollable sheet rather than a drawer: the style guide is a
     paragraph-sized field, and editing it beside the language setting reads as
     one "how this project writes" surface. Its scrim sits above the drawers so
     opening it from anywhere is unambiguous.

     Writing the settings is admin-only; READING them is not — GET /v1/projects
     is `read` scope and already returns all of them — so the sheet opens for any
     session token and goes read-only without `admin` (takomo-n0al). */
  .modal-scrim {
    position: fixed; inset: 0; background: var(--overlay); z-index: 70;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    animation: tkFade .15s ease;
  }
  @keyframes tkFade { from { opacity: 0 } to { opacity: 1 } }
  .sheet {
    width: min(760px, 100%); max-height: min(88vh, 900px); display: flex; flex-direction: column;
    background: var(--panel); border-radius: 16px; box-shadow: 0 40px 90px -30px rgba(0,0,0,.55);
    overflow: hidden;
  }
  .sheet > .sh { display: flex; align-items: flex-start; gap: 12px; padding: 22px 26px 16px; border-bottom: 1px solid var(--border-soft); }
  .sheet > .sh .titles { flex: 1 1 auto; min-width: 0; }
  .sheet > .sh h2 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
  .sheet > .sh .sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .sheet > .sh .sub .mono { font-family: var(--mono); color: var(--ink2); }
  .sheet > .sh .close { background: transparent; border: none; font-size: 22px; line-height: 1; color: var(--muted); padding: 0 4px; }
  .sheet > .sb { padding: 20px 26px; overflow-y: auto; flex: 1 1 auto; }
  .sheet > .sf { display: flex; align-items: center; gap: 12px; padding: 16px 26px; border-top: 1px solid var(--border-soft); background: var(--col-bg); }
  .sheet > .sf .grow { flex: 1 1 auto; }
  /* `flex: 0 0 auto` so the footer message can never squeeze a button below its
     own label. The footer is a row of [message][spacer][buttons], and until this
     ticket every message it carried was two or three words; the read-only reason
     is a whole sentence. */
  .sheet > .sf button { height: 40px; padding: 0 18px; border-radius: 9px; font-weight: 660; flex: 0 0 auto; }
  .sheet > .sf button[disabled] { opacity: .5; cursor: not-allowed; }
  /* A read-only sheet marks Save `aria-disabled`, not `disabled`, so it keeps
     its place in the tab order and can still be pressed — it has to LOOK
     unavailable without being inert. Same paint as [disabled]. */
  .sheet > .sf button[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
  .sheet > .sf .cancel { border: 1px solid var(--border); background: var(--panel); color: var(--muted); }
  .sheet .fld { margin-bottom: 22px; }
  .sheet .fld:last-child { margin-bottom: 4px; }
  .sheet .fld label { display: block; font-size: 13px; font-weight: 680; margin-bottom: 4px; }
  .sheet .fld .help { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin-bottom: 9px; }
  .sheet .fld input[type=text], .sheet .fld textarea, .sheet .fld select {
    width: 100%; background: var(--col-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; color: var(--text); font: inherit;
  }
  .sheet .fld textarea { min-height: 190px; resize: vertical; line-height: 1.6; }
  .sheet .fld input[type=text]:focus, .sheet .fld textarea:focus, .sheet .fld select:focus { outline: 2px solid var(--sel-border); outline-offset: -1px; }
  /* A read-only value is still meant to be read, selected and copied, so the
     field keeps full text contrast and stays focusable — `readonly`, never
     `disabled`. The dashed border is what says "not editable". */
  .sheet .fld input[readonly], .sheet .fld textarea[readonly] {
    border-style: dashed; background: transparent; cursor: default;
  }
  .sheet .cnt { display: flex; align-items: baseline; gap: 8px; margin-top: 7px; font-size: 12px; color: var(--muted); }
  .sheet .cnt .n { font-family: var(--mono); }
  .sheet .cnt .n.warn { color: var(--high); }
  .sheet .cnt .n.over { color: var(--crit); font-weight: 700; }
  .sheet .msg { font-size: 13px; line-height: 1.5; }
  .sheet .msg.err { color: var(--crit); }
  .sheet .msg.ok { color: var(--ok); font-weight: 660; }
  /* Same colour the inbox uses for "this token cannot answer": unavailable, not
     broken. It is the accessible description of Save, so it must be legible. */
  .sheet .msg.ro { color: var(--high); }
  /* Pressing an aria-disabled Save has to acknowledge the press somehow. The
     reason is already on screen an inch away, so re-stating it is enough —
     blink it rather than adding a toast this SPA does not otherwise have. */
  .sheet .msg.flash { animation: tkBlink .45s ease; }
  @keyframes tkBlink { 0%, 100% { opacity: 1 } 30%, 70% { opacity: .2 } }
  @media (prefers-reduced-motion: reduce) { .sheet .msg.flash { animation: none } }
  @media (max-width: 620px) {
    .modal-scrim { padding: 0; align-items: stretch; }
    .sheet { width: 100%; max-height: 100%; border-radius: 0; }
    /* 390px minus 52px of footer padding leaves ~338px, which a sentence and two
       buttons cannot share on one line. Wrap, and give the message the whole
       first line so the buttons keep their full width on the second. */
    .sheet > .sf { flex-wrap: wrap; }
    .sheet > .sf .msg { flex: 1 1 100%; }
    /* Finger targets, same 44px floor the header controls hold. Save is a real
       target here even when it is aria-disabled — pressing it is how you get
       the reason read back to you. */
    .sheet > .sf button { height: 44px; min-width: 44px; }
    .sheet > .sh .close { min-width: 44px; min-height: 44px; }
    /* The lifetime select is the sheet's only tap-to-open control, so it holds
       the same 44px floor as every other finger target on a phone. */
    .sheet .fld select { min-height: 44px; }
  }

  /* ---- detail panel ---- */
  #overlay { position: fixed; inset: 0; background: var(--overlay); display: none; z-index: 20; }
  #overlay.open { display: block; }
  #detail {
    position: fixed; top: 0; right: 0; height: 100%; width: min(480px, 100%);
    background: var(--panel); border-left: 1px solid var(--border); z-index: 21;
    transform: translateX(100%); transition: transform .18s ease; overflow-y: auto;
    box-shadow: -24px 0 60px -30px rgba(20,40,55,.5);
  }
  #detail.open { transform: translateX(0); }
  #detail .dhead { display: flex; align-items: flex-start; gap: 8px; padding: 20px 24px 16px; border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; background: var(--panel); }
  #detail .dhead h2 { font-size: 20px; margin: 0; flex: 1; word-break: break-word; letter-spacing: -.02em; line-height: 1.3; }
  #detail .close { background: transparent; border: none; font-size: 20px; line-height: 1; color: var(--muted); padding: 2px 6px; }
  #detail .dbody { padding: 16px 24px; }
  #detail section { margin-bottom: 20px; }
  #detail h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
  #detail .body-text { word-break: break-word; font-size: 13.5px; line-height: 1.65; color: var(--ink2); }
  #detail .kv { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: 12.5px; color: var(--muted); }
  #detail .kv .mono { font-family: var(--mono); color: var(--text); }

  a { color: var(--accent2); }
  .mono { font-family: var(--mono); }

  /* ---- ask-a-human drawer ---- */
  #inbox {

  #inbox .dhead h2 { font-size: 18px; margin: 0; flex: 1; font-weight: 720; }
  #inbox .dhead a.full { font-size: 12px; color: var(--accent2); text-decoration: none; }

  .q-item { border: 1px solid var(--border-soft); border-radius: 10px; padding: 13px 14px; margin-bottom: 12px; }
  .q-item.blocking { background: var(--sel); border-color: var(--sel-border); }

  .q-item .q-body { color: var(--ink2); word-break: break-word; margin: 6px 0 8px; font-size: 13px; line-height: 1.55; }
  .q-item .q-rec { font-size: 12.5px; color: var(--muted); background: var(--col-bg); border-radius: 8px; padding: 8px 11px; margin: 6px 0; }
  .q-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .q-actions button { max-width: 100%; overflow-wrap: anywhere; text-align: left; border-radius: 9px; }
  .q-actions input[type=text] { flex: 1 1 160px; min-width: 0; border-radius: 9px; }
  .q-note { width: 100%; margin-top: 8px; border-radius: 9px; }

  .q-readonly { font-size: 12.5px; color: var(--high); margin-bottom: 12px; }
  .q-err { color: var(--crit); font-size: 12px; margin-top: 6px; min-height: 14px; }

  /* ---- setup gate ---- */
  #gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 30; padding: 16px; }
  #gate .card2 { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 26px; width: min(420px, 100%); box-shadow: var(--shadow); }
  #gate .brand { justify-content: center; margin-bottom: 6px; }
  #gate h1 { font-size: 20px; margin: 6px 0 6px; text-align: center; font-weight: 750; }
  #gate p { color: var(--muted); margin: 0 0 16px; font-size: 13px; text-align: center; line-height: 1.6; }
  #gate label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }

  #gate .err { color: var(--crit); font-size: 13px; margin-top: 12px; min-height: 18px; }
  .hidden { display: none !important; }

  /* ---- phone layout ---------------------------------------------------
     The answered design (takomo-vqeh): the columns become sections down ONE
     vertical scroll — same workflow order, same priority sort inside each,
     empty states collapsed to their heading line. No sideways scrolling, no
     swiping, no state picker. The board is read-only, so a column is a way of
     laying information out, not a workspace; stacking loses nothing you could
     have acted on.

     Companion work the answer called for: the header collapses to icon
     buttons with every filter behind one control, because at 390px the
     wrapped header alone was ~200-260px of pinned chrome — a third of the
     screen — before you reached a card.

     Two rules this block keeps to. (1) CSS does the revealing: the script
     never measures the viewport, so a desktop reader runs exactly the code it
     ran before and sees exactly the pixels it saw before. (2) 760px is
     /inbox's breakpoint, reused deliberately so the two surfaces change shape
     at the same width rather than inventing a second idiom. */
  @media (max-width: 760px) {
    header { gap: 8px; row-gap: 6px; padding: 8px 12px; min-height: 0; }
    .brand span { display: none; }               /* the mark alone; the tab already says takomo */
    /* Every header control is a finger target here, not a cursor target: 44px
       on the short side. The nav pills and the language toggle come along for
       free — they share a row with a button that is already 44px tall, so the
       row does not grow for them. */
    .nav a, .nav span.navpill { padding: 7px 10px; min-height: 44px; display: inline-flex; align-items: center; }
    header .lbl { display: none; }
    header .ico { display: inline-block; }
    header button.ghost, header .iconbtn { min-width: 44px; min-height: 44px; padding: 7px 10px; }
    .langtoggle span { padding: 9px 10px; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
    /* The spacer becomes a zero-height full-width break, so the header is two
       deliberate rows — navigation on the first, actions on the second — and
       not whatever the wrap happens to produce for a given locale. */
    header .grow { flex: 0 0 100%; height: 0; }
    #inbox-btn { margin-left: auto; }
    .share-banner, .share-exp { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

    /* Filters behind one control. Closed by default, so the resting header is
       navigation plus actions and nothing else. */
    .filtbtn { display: inline-flex; align-items: center; gap: 6px; }
    #filters, header .archtoggle { display: none; }
    body.filters-open #filters {
      display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 100%; order: 10;
      padding: 10px; border: 1px solid var(--border-soft); border-radius: 10px;
      background: var(--col-bg);
    }
    body.filters-open header .archtoggle { display: inline-flex; flex: 1 1 100%; order: 11; padding: 0 2px; }
    /* One control per line: a 150-220px cap is what made these unreadable on a
       phone in the first place. */
    #filters > select, #filters > .ta, #filters > .grouptoggle { flex: 1 1 100%; max-width: none; }
    header #filters select { max-width: none; width: 100%; }
    #filters .ta input, #filters .ta.narrow input { width: 100%; }
    /* The typeahead popup hangs off a control that is now full width, so it
       tracks that width instead of its own fixed 190/420px. */
    .ta-pop { max-width: 100%; }
    .ta-list { max-height: 40vh; }

    /* The board itself: columns stacked into one scroll. */
    #board {
      flex-direction: column; align-items: stretch; gap: 16px;
      padding: 14px 12px 32px; overflow-x: hidden; min-height: 0;
    }
    /* `flex: 0 0 270px` is a WIDTH in a row and a HEIGHT in a column — it has
       to go, or every section would be 270px tall. */
    .column { flex: 0 0 auto; width: 100%; max-width: none; gap: 8px; }
    .column h2 { justify-content: space-between; padding: 0 2px 6px; border-bottom: 1px solid var(--border-soft); }
    .column.empty { gap: 0; }
    .column.empty h2 { opacity: .6; border-bottom-color: transparent; }
    .column.empty .cards { display: none; }      /* an empty state is one line, nothing more */
    /* A wide phone or a small tablet fits two cards abreast; 390px fits
       exactly one, which is today's column order read top to bottom. */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); align-items: start; }
    .cards > .subhd, .cards > .morebtn, .cards > .empty-col { grid-column: 1 / -1; }

    /* The two drawers. Both are full-bleed below 480/520px, and that part is
       right — 390px minus 2x24px of padding is already the narrowest the
       reading column should ever get, so narrowing the sheet to uncover a
       scrim would buy an exit by spending line length.

       What is wrong is the stacking: #overlay is the tap-to-close scrim at
       z-index 20 and the sheets sit at 21, so at full width the scrim is
       completely behind them and cannot be tapped. Escape closes them too, but
       a phone has no Escape key — which left one exit, a 20px glyph in 2px 6px
       of padding, about a 24px target.

       So keep the width and move the sheet down: it rises from the bottom and
       stops short of the top, putting the scrim back on screen as a full-width
       strip you can tap to dismiss. The dimmed header showing through it is
       the point — you can see what you are going back to. That restores the
       desktop's two independent ways out, and the close button below becomes
       the second one at a real touch size. */
    #detail, #inbox {
      top: 56px; bottom: 0; left: 0; right: 0; width: auto; height: auto;
      border-left: none; border-top: 1px solid var(--border);
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -18px 50px -30px rgba(20,40,55,.5);
      transform: translateY(100%);
    }
    #detail.open, #inbox.open { transform: translateY(0); }
    /* 44px of target, not 44px of chrome: the negative margins let the button
       grow out into the header's own padding, so the hit box is 44x44 while
       the header keeps the height (and the glyph the position) it had. */
    #detail .close, #inbox .close {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 44px; min-height: 44px; font-size: 26px;
      padding: 0; margin: -9px -10px -9px 0;
    }
  }

      state.me = { scopes: [], expertise: [], canAnswer: false };
      syncSettingsBtn();
    });
  }

  // takomo-n0al: this button used to be hidden outright without `admin`, which
  // is the one place in either SPA where a control disappeared on a scope rather
  // than explaining itself — and a viewer who knew the sheet existed concluded
  // it was broken. Only the two PUTs are admin-gated; GET /v1/projects is `read`
  // scope and already returns question_language and style_guide, and both values
  // are handed to every worker as style_hint/language_hint on the work loop. So
  // showing the sheet discloses nothing new and costs no permission: any session
  // token opens it, and without `admin` it opens read-only.
  //
  // Share sessions stay hidden, and that is not the same bug: a `tks_` token is
  // confined to /v1/shares/self* and genuinely cannot load the sheet at all, so
  // a button there would be an affordance we cannot honour.
  function syncSettingsBtn() {
    state.settingsReadOnly = !(state.me && state.me.scopes
      && state.me.scopes.indexOf("admin") !== -1);
    $("settings-btn").classList.toggle("hidden", !!state.shareMode);
  }

  function fullLoad() {
    // page through tickets for the project
    var all = {};
    function page(cursor) {
      // Always fetch archived too; render() decides whether to show them, so
      // the toggle never needs a refetch.
      var q = "/tickets?project=" + encodeURIComponent(state.project) + "&limit=200&include_archived=true";
      if (cursor) q += "&cursor=" + encodeURIComponent(cursor);
      return api(q).then(function (res) {
        (res.items || []).forEach(function (t) { all[t.id] = t; });
        if (res.next_cursor) return page(res.next_cursor);
      });
    }
    return page(null)
      .then(function () {
        state.tickets = all;
        // advance cursor to "now" so polling only reports future changes
        return api("/events?project=" + encodeURIComponent(state.project) + "&since=0&limit=1000&wait=0");
      })
      .then(function (ev) {
        if (ev && typeof ev.cursor === "number") state.cursor = ev.cursor;
        render();
      })
      .catch(handleErr);
  }

  // ---- polling for live updates ----
  function startPolling() {
    stopPolling();
    state.pollTimer = setInterval(poll, POLL_MS);
  }
  function stopPolling() {
    if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
  }
  function poll() {
    if (state.polling) return;
    state.polling = true;
    api("/events?project=" + encodeURIComponent(state.project) +
        "&since=" + state.cursor + "&limit=500&wait=0")
      .then(function (res) {
        var events = res.events || [];
        if (typeof res.cursor === "number") state.cursor = res.cursor;
        if (events.length === 0) return;
        // Collect touched ticket ids; refetch each affected ticket.
        var touched = {};
        events.forEach(function (e) { if (e.ticket) touched[e.ticket] = true; });
        var ids = Object.keys(touched);
        if (ids.length === 0) return;
        return Promise.all(ids.map(refreshTicket)).then(function () {
          render();
          refreshInboxCount();
          refreshPromotions();
          // Don't rebuild the inbox from under a human who is mid-answer: a
          // full re-render (innerHTML = "") would wipe typed text and focus.
          if (state.inboxOpen && !$("inbox").contains(document.activeElement)) renderInbox();
        });
      })
      .catch(function (e) {
        if (e.auth) handleErr(e);
      })
      .then(function () { state.polling = false; });
  }

  function refreshTicket(id) {
    return api("/tickets/" + encodeURIComponent(id))
      .then(function (t) {
        if (t && t.project === state.project) state.tickets[id] = t;
      })
      .catch(function (e) {
        // 404 => ticket gone/out of scope; drop it from the board.
        if (e.status === 404) delete state.tickets[id];
      });
  }

  // ---- epic grouping / filtering helpers ----
  // Walk a ticket's parent chain (guarded against cycles / missing parents) and
  // return the id of its top-most epic ancestor — or "" if it has none. An epic
  // ticket heads its own group.
  function epicOf(t) {
    var cur = t, depth = 0, guard = {}, lastEpic = "";
    while (cur && depth < 30 && !guard[cur.id]) {
      guard[cur.id] = 1;
      if (cur.type === "epic") lastEpic = cur.id;
      if (!cur.parent) break;
      cur = state.tickets[cur.parent]; depth++;
    }
    return lastEpic;
  }
  // True when `ancestorId` is `t` itself or any ancestor of `t` — i.e. `t` lies in
  // that ticket's subtree. Used by both the epic filter and the ticket filter, so
  // "filter by TK-7" keeps TK-7's subtasks visible instead of orphaning them.
  function inSubtree(t, ancestorId) {
    var cur = t, depth = 0, guard = {};
    while (cur && depth < 30 && !guard[cur.id]) {
      guard[cur.id] = 1;
      if (cur.id === ancestorId) return true;
      if (!cur.parent) break;
      cur = state.tickets[cur.parent]; depth++;
    }
    return false;
  }
  function epicLabel(epicId) {
    if (!epicId) return L().noEpic;
    var e = state.tickets[epicId];
    return e && e.title ? (epicId + " · " + e.title) : epicId;
  }
  // Keep the header's epic dropdown and group toggle in sync with the loaded
  // tickets — populate options, prune a stale selection, hide when no epics.
  function populateEpics() {
    var sel = $("epicsel"), wrap = $("group-wrap"); if (!sel) return;
    var epics = Object.keys(state.tickets).map(function (k) { return state.tickets[k]; })
      .filter(function (t) { return t.type === "epic" && (!t.archived_at || state.showArchived); })
      .sort(function (a, b) { return String(a.id).localeCompare(String(b.id)); });
    sel.innerHTML = "";
    var all = el("option"); all.value = ""; all.textContent = L().allEpics; sel.appendChild(all);
    epics.forEach(function (e) { var o = el("option"); o.value = e.id; o.textContent = e.id + " — " + (e.title || ""); sel.appendChild(o); });
    if (state.epicFilter && !epics.some(function (e) { return e.id === state.epicFilter; })) { state.epicFilter = ""; localStorage.setItem(LS_EPIC, ""); }
    sel.value = state.epicFilter;
    var none = epics.length === 0;
    sel.classList.toggle("hidden", none);
    if (wrap) wrap.classList.toggle("hidden", none);
    var chk = $("groupepic"); if (chk) chk.checked = state.groupByEpic;
  }

  // ---- typeahead: a dependency-free single-select combobox ----
  //
  // Replaces a <select> whose option list has outgrown scanning. Same contract
  // as the <select> it stands in for — a value, "" meaning "no filter", and one
  // onChange — so the callers keep their existing state handling.
  //
  // Three things it is careful about:
  //  * Keyboard. A <select> is fully operable by keyboard for free; a typeahead
  //    that is only clickable would be a regression. This follows the ARIA
  //    combobox pattern (aria-expanded/-controls/-activedescendant on the input,
  //    role=listbox on the popup) so open/type/arrow/Enter/Escape all work, and

  //  * Locale. Every visible string comes from a callback that is re-run on each
  //    setItems(), and setItems() runs inside render(), which setLang() calls —
  //    so switching DE/EN repaints this control's own text immediately. That is
  //    the bug class in takomo-fcog (a <select> keeping its old-locale label

  // strings — far below anything a keystroke would notice — so the list is
  // recomputed on every keystroke rather than indexed. What is bounded is the

  // "keep typing" note. That keeps the cost flat as a project grows without
  // dragging in virtual scrolling.
  var TA_MAX_ROWS = 60;

  function makeTypeahead(cfg) {

    var open = false;
    var query = "";   // typed since opening; "" = show everything
    var view = [];    // items currently listed
    var hasAll = false; // is view[0] the synthetic "all" row?
    var active = -1;  // index into view

    // "fo1j filter" and "filter fo1j" both find the same ticket. Rows whose lead
    // (the id) starts with the first token float to the top: typing an id should
    // land on that ticket, not on something that merely mentions it.
    function compute() {
      var toks = query.toLowerCase().split(/\s+/).filter(function (s) { return s; });

        return;
      }
      hasAll = false;
      var head = [], rest = [];
      items.forEach(function (it) {
        for (var i = 0; i < toks.length; i++) if (it.hay.indexOf(toks[i]) === -1) return;

      });

    }

        li.setAttribute("aria-selected", it.value === value ? "true" : "false");
        if (it.lead) li.appendChild(el("span", "tlead", it.lead));

      else if (view.length > TA_MAX_ROWS) note.textContent = L().taMore.replace("{n}", String(view.length - TA_MAX_ROWS));
      else note.textContent = n === 1 ? L().taCount1 : L().taCount.replace("{n}", String(n));

    }

    input.addEventListener("focus", function () {
      if (!open && !noAutoOpen) openList();
      input.select(); // typing replaces the shown selection instead of editing it
    });
    input.addEventListener("click", function () { if (!open) openList(); });
    input.addEventListener("input", function () {
      query = input.value;

      // the input text and focus are all left alone, so a background poll that
      // adds a ticket just extends the list under the cursor.
      setItems: function (next) {

        if (open) {
          compute();
          if (active >= Math.min(view.length, TA_MAX_ROWS)) active = view.length ? 0 : -1;

        syncText();

      setValue: function (v) { value = v || ""; syncText(); },
      show: function (visible) {

      }

  }

  function setTicketFilter(id) {
    state.ticketFilter = id || "";
    localStorage.setItem(LS_TICKET, state.ticketFilter);
  }
  function ticketLabel(t) { return t.title ? (t.id + " — " + t.title) : t.id; }

  var tickTA = makeTypeahead({
    id: "tickfilter",
    label: function () { return L().taTicket; },
    allLabel: function () { return L().allTickets; },
    onChange: function (v) {
      setTicketFilter(v);
      state.expanded = {};
      render();
      // The drawer's queue and its badge follow the filter.
      refreshInboxCount();
      if (state.inboxOpen) renderInbox();
    }
  });

  // Keep the header's ticket filter in sync with the loaded tickets. The list is
  // scoped by the active epic filter so the two compose: pick an epic, then narrow
  // to one of its tickets.
  function populateTickets() {
    if (!tickTA) return;
    var tickets = Object.keys(state.tickets).map(function (k) { return state.tickets[k]; })
      .filter(function (t) { return !t.archived_at || state.showArchived; })
      .filter(function (t) { return !state.epicFilter || inSubtree(t, state.epicFilter); })
      .sort(function (a, b) { return String(a.id).localeCompare(String(b.id)); });

    // board with no visible cause — drop it instead.
    if (state.ticketFilter && !tickets.some(function (t) { return t.id === state.ticketFilter; })) setTicketFilter("");
    tickTA.setItems(tickets.map(function (t) {
      return {
        value: t.id,
        display: ticketLabel(t),
        lead: t.id,
        text: t.title || "",
        hay: (t.id + " " + (t.title || "")).toLowerCase()
      };
    }));
    tickTA.setValue(state.ticketFilter);
    // Nothing to filter (no tickets, or an epic with none): hide it rather than
    // offer an empty search box, which is what the <select> did too.
    tickTA.show(tickets.length > 0);
  }

  // Distinct tag references currently in use across the (visible) tickets. The
  // filter offers only tags actually present, so it works in share mode too
  // (no registry call) and never lists a kind with nothing to show.
  function ticketTagRefs() {
    var seen = {};
    Object.keys(state.tickets).forEach(function (id) {
      var t = state.tickets[id];
      if (t.archived_at && !state.showArchived) return;
      (t.tags || []).forEach(function (r) { seen[r] = true; });
    });
    return Object.keys(seen);
  }
  function refKind(ref) { var i = ref.indexOf(":"); return i === -1 ? ref : ref.slice(0, i); }
  function refHandle(ref) { var i = ref.indexOf(":"); return i === -1 ? ref : ref.slice(i + 1); }
  function refLabelText(ref) {
    var lbl = state.tagLabels[ref], h = refHandle(ref);
    return lbl && lbl !== h ? (lbl + " (" + h + ")") : h;
  }

  // The second half of the tag filter reuses the ticket typeahead unchanged. The
  // two lists differ only in what a row is made of — id/title there, handle/label
  // here — which is the one thing the factory already takes as data, so sharing
  // it costs nothing. The *kind* picker stays a <select>: a project has a handful
  // of kinds, they fit without truncating, and "all of this kind" is a filter in
  // its own right, so there is nothing there to search.
  var tagvalTA = makeTypeahead({
    id: "tagvalfilter",
    label: function () { return L().taTagValue; },
    allLabel: function () { return L().allValues; },
    onChange: function (v) {
      state.tagRef = v;
      localStorage.setItem(LS_TAGREF, state.tagRef);
      state.expanded = {};
      render();
    }
  });

  // Keep the tag kind dropdown and the value typeahead in sync with the tags in
  // play; prune stale selections; hide when there are none.
  function populateTagFilter() {
    var ksel = $("tagkindsel"); if (!ksel || !tagvalTA) return;
    var refs = ticketTagRefs();
    var kinds = [];
    refs.forEach(function (r) { var k = refKind(r); if (kinds.indexOf(k) === -1) kinds.push(k); });
    kinds.sort();

      state.tagKind = ""; state.tagRef = "";
      localStorage.setItem(LS_TAGKIND, ""); localStorage.setItem(LS_TAGREF, "");
    }
    ksel.innerHTML = "";
    var kAll = el("option"); kAll.value = ""; kAll.textContent = L().allTags; ksel.appendChild(kAll);
    kinds.forEach(function (k) { var o = el("option"); o.value = k; o.textContent = k; ksel.appendChild(o); });
    ksel.value = state.tagKind;

    var vals = refs.filter(function (r) { return refKind(r) === state.tagKind; })
      .sort(function (a, b) { return refHandle(a).localeCompare(refHandle(b)); });

      state.tagRef = ""; localStorage.setItem(LS_TAGREF, "");
    }

    // label from the registry. The handle leads the row in mono, the way a ticket
    // id does, so the identifier column stays scannable.
    tagvalTA.setItems(vals.map(function (r) {
      var h = refHandle(r), lbl = state.tagLabels[r] || "";
      return {
        value: r,
        display: refLabelText(r),
        lead: h,
        text: lbl && lbl !== h ? lbl : "",
        hay: (h + " " + lbl).toLowerCase()
      };
    }));
    tagvalTA.setValue(state.tagRef);

    ksel.classList.toggle("hidden", kinds.length === 0);
    tagvalTA.show(kinds.length > 0 && !!state.tagKind);
  }

  // A ticket passes the tag filter when: no kind chosen (all), OR a specific
  // kind:handle is chosen and it carries that ref, OR a kind (no value) is
  // chosen and it carries any tag of that kind.
  function matchesTagFilter(t) {
    if (!state.tagKind) return true;

    var pref = state.tagKind + ":";
    return tags.some(function (r) { return r.indexOf(pref) === 0; });
  }

  // ---- rendering ----
  function render() {
    var board = $("board");
    board.innerHTML = "";
    if (!state.workflow) return;
    populateEpics();
    populateTickets();
    populateTagFilter();
    var states = state.workflow.states || [];
    var byState = {};
    var catOf = {};
    states.forEach(function (s) { byState[s.id] = []; catOf[s.id] = s.category || ""; });
    Object.keys(state.tickets).forEach(function (id) {
      var t = state.tickets[id];
      if (t.archived_at && !state.showArchived) return; // archived hidden by default
      if (state.epicFilter && !inSubtree(t, state.epicFilter)) return; // epic filter
      if (state.ticketFilter && !inSubtree(t, state.ticketFilter)) return; // ticket filter (incl. subtasks)
      if (!matchesTagFilter(t)) return; // tag filter (kind / kind:handle)

      byState[t.state].push(t);

    var prank = { critical: 0, high: 1, normal: 2, low: 3 };
    function bySort(a, b) {

      var pb = prank[b.priority] == null ? 9 : prank[b.priority];
      if (pa !== pb) return pa - pb;
      return (b.updated_at || "").localeCompare(a.updated_at || "");
    }
    // columns in workflow order, then any leftover unknown states
    var colOrder = states.map(function (s) { return s.id; });
    Object.keys(byState).forEach(function (k) { if (colOrder.indexOf(k) === -1) colOrder.push(k); });

    // Render a capped list of cards into `container`, with a "+N more" / "show
    // less" toggle keyed by `key` so each column/group collapses independently.
    function renderCapped(container, items, isDone, key) {
      var expanded = !!state.expanded[key];
      var shown = expanded ? items : items.slice(0, COLLAPSE_LIMIT);
      shown.forEach(function (t) { container.appendChild(cardEl(t, isDone)); });
      if (items.length > COLLAPSE_LIMIT) {
        var btn = el("button", "morebtn", expanded ? L().showLess : L().showMore.replace("{n}", items.length - COLLAPSE_LIMIT));
        btn.addEventListener("click", function () { state.expanded[key] = !expanded; render(); });
        container.appendChild(btn);
      }
    }

    colOrder.forEach(function (sid) {
      var items = (byState[sid] || []).slice().sort(bySort);
      var isDone = catOf[sid] === "done";
      // `empty` is a fact about the data, not about the viewport — the phone
      // stylesheet is what decides to collapse such a section to its heading
      // line, and the desktop stylesheet ignores the class entirely.
      var col = el("div", "column" + (isDone ? " done" : "") + (items.length === 0 ? " empty" : ""));
      var h = el("h2");
      h.appendChild(el("span", null, sid));
      h.appendChild(el("span", "count", String(items.length)));
      col.appendChild(h);
      var cards = el("div", "cards");
      if (items.length === 0) {
        cards.appendChild(el("div", "empty-col", "—"));
      } else if (state.groupByEpic) {
        // Bucket the column's cards by epic, epics first (id order), "no epic" last.
        var groups = {}, order = [];
        items.forEach(function (t) { var e = epicOf(t); if (!groups[e]) { groups[e] = []; order.push(e); } groups[e].push(t); });
        order.sort(function (a, b) { if (!a) return 1; if (!b) return -1; return String(a).localeCompare(String(b)); });
        order.forEach(function (eid) {
          var sub = el("div", "subhd");
          sub.appendChild(el("span", "slbl", epicLabel(eid)));
          sub.appendChild(el("span", "scount", String(groups[eid].length)));
          cards.appendChild(sub);
          renderCapped(cards, groups[eid], isDone, "col:" + sid + ":epic:" + (eid || "_"));
        });
      } else {
        renderCapped(cards, items, isDone, "col:" + sid);
      }
      col.appendChild(cards);
      board.appendChild(col);
    });
  }

  function cardEl(t, isDone) {
    var prio = t.priority || "low";
    var qi = state.openQByTicket[t.id];
    // Every open question on this ticket is waiting on the *agent*: the thread
    // is live, but nothing here is anyone's decision to make.
    var convOnly = !!(qi && qi.conv && !qi.blocking && !qi.advisory);
    var tint = !isDone && (prio === "critical" || (qi && qi.blocking));
    var cls = "card"
      + (t.type === "bug" ? " bug" : "")
      + (tint ? " tint" : "")
      + (convOnly && !isDone ? " conv" : "")
      + (isDone ? " done" : "")
      + (t.archived_at ? " archived" : "");
    var c = el("div", cls);
    c.setAttribute("data-id", t.id);

    var top = el("div", "ctop");
    top.appendChild(el("span", "cid", t.id + (t.type ? " · " + t.type : "")));
    if (qi && qi.count) {
      // A pending decision outranks a live thread: if anything on this ticket
      // is a human's turn, that is what the card has to say. "in conversation"
      // is reserved for the case where it is nobody's turn but the agent's.
      var flagTxt = qi.blocking ? L().blocking
        : qi.advisory ? L().advisory
        : convOnly ? "⤺ " + L().inConversation
        : (qi.count > 1 ? L().questionsN.replace("{n}", qi.count) : L().question1);
      top.appendChild(el("span", "qflag" + (qi.blocking ? " blocking" : (convOnly ? " conv" : "")), flagTxt));
    } else if (t.archived_at) {
      top.appendChild(el("span", "arch-tag", "archived"));
    }
    c.appendChild(top);

    c.appendChild(el("div", "ctitle", t.title || "(untitled)"));

    if (!isDone) {
      var bot = el("div", "cbot");
      var holder = t.claim && t.claim.holder;
      bot.appendChild(el("span", "holder", holder ? holder : L().unclaimed));
      bot.appendChild(gaugeEl(prio));
      c.appendChild(bot);
    }
    // Commit proof badge (e.g. "⌗ 5caea2a") — the ticket carries a checkable
    // commit, so its state is more than someone's word.
    var commit = t.links && typeof t.links === "object" ? t.links.commit : null;
    if (typeof commit === "string" && commit.trim()) {
      var cb = el("div", "proof");
      cb.title = L().proofCommit + ": " + commit;
      cb.appendChild(el("span", "pmark", "⌗"));
      cb.appendChild(el("span", "psha", shortCommit(commit)));
      c.appendChild(cb);
    }
    // Latest promotion badge (e.g. "● production · 2h").
    var pr = state.promoByTicket[t.id];
    if (pr) {
      var pb = el("div", "promo");
      pb.appendChild(el("span", "pdot"));
      pb.appendChild(el("span", "ptarget", pr.target));
      pb.appendChild(el("span", "page", "· " + fmtAge(pr.created_at)));
      c.appendChild(pb);
    }
    c.setAttribute("aria-label", (t.id || "") + ": " + (t.title || ""));
    activate(c, function () { openDetail(t.id); });
    return c;
  }

  // ---- detail panel ----
  function openDetail(id) {
    state.openTicketId = id;
    $("overlay").classList.add("open");
    $("detail").classList.add("open");
    $("detail").setAttribute("aria-hidden", "false");
    $("d-title").textContent = id;
    $("d-body").textContent = ""; $("d-body").appendChild(el("p", "status", L().loading));
    var fetchDetail = state.shareMode
      ? shareApi("/self/tickets/" + encodeURIComponent(id))
      : api("/tickets/" + encodeURIComponent(id) + "?include=comments,deps,promotions");
    fetchDetail
      .then(renderDetail)
      .catch(function (e) {
        if (e && e.expired) { showExpired(); return; }
        $("d-body").innerHTML = "";
        $("d-body").appendChild(el("p", "status", "Failed: " + e.message));
      });
  }
  function closeDetail() {
    state.openTicketId = null;
    $("overlay").classList.remove("open");
    $("detail").classList.remove("open");
    $("detail").setAttribute("aria-hidden", "true");
  }
  $("d-close").addEventListener("click", closeDetail);
  $("overlay").addEventListener("click", function () { closeDetail(); closeInbox(); });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    // The settings sheet is the topmost layer, so Escape dismisses it alone —
    // otherwise closing it would also collapse the drawers behind it.
    if (state.settings) { closeSettings(); return; }
    closeDetail(); closeInbox();
  });

  // ---- ask-a-human inbox ----
  function questionsQuery() {
    var q = "/questions?project=" + encodeURIComponent(state.project) + "&status=open";
    if (state.mineOnly && state.me && state.me.expertise.length) q += "&mine=true";
    return q;
  }

  // The ticket filter narrows the drawer's queue the same way it narrows the
  // board: a question counts when its ticket is in the filtered subtree. Falls
  // back to an id match for a question whose ticket isn't loaded.
  function questionInFilter(q) {
    if (!state.ticketFilter) return true;
    var t = state.tickets[q.ticket];
    return t ? inSubtree(t, state.ticketFilter) : q.ticket === state.ticketFilter;
  }

  function refreshInboxCount() {
    if (state.shareMode) return;
    api(questionsQuery()).then(function (res) {
      var items = res.items || [];
      var shown = items.filter(questionInFilter);
      var b = $("inbox-count");
      b.textContent = String(shown.length);
      b.classList.toggle("zero", shown.length === 0);
      // Build the per-ticket open-question map from the UNfiltered set so every
      // visible card keeps its indicator, and the detail drawer can offer
      // "Answer in Inbox".
      var map = {};
      items.forEach(function (q) {
        var m = map[q.ticket] || (map[q.ticket] = { count: 0, blocking: false, advisory: false, conv: 0 });
        m.count++;
        // Whose turn it is, not just the mode. A question a human bounced back
        // for more research (`awaiting == "agent"`) is still open and still
        // parks the ticket, but the ball is with the agent — counting it as
        // blocking would make the card shout for a decision nobody can take
        // yet. Same partition the inbox's "in conversation" folder uses.
        if (q.awaiting === "agent") { m.conv++; return; }
        if (q.mode && q.mode !== "blocking") m.advisory = true; else m.blocking = true;
      });
      state.openQByTicket = map;
      render(); // paint per-card question indicators
    }).catch(function () { /* count is best-effort */ });
  }

  function openInbox() {
    state.inboxOpen = true;
    $("overlay").classList.add("open");
    $("inbox").classList.add("open");
    $("inbox").setAttribute("aria-hidden", "false");
    renderInbox();
  }
  function closeInbox() {
    if (!state.inboxOpen) return;
    state.inboxOpen = false;
    if (!state.openTicketId) $("overlay").classList.remove("open");
    $("inbox").classList.remove("open");
    $("inbox").setAttribute("aria-hidden", "true");
  }

  function renderInbox() {
    var body = $("inbox-body");
    api(questionsQuery()).then(function (res) {
      var items = (res.items || []).filter(questionInFilter);
      body.innerHTML = "";
      if (state.me && !state.me.canAnswer) {
        body.appendChild(el("div", "q-readonly", L().cantAnswer));
      }
      if (items.length === 0) {
        body.appendChild(el("div", "q-empty", state.ticketFilter ? L().noneForTicket : L().allClear));
        return;
      }
      items.forEach(function (q) { body.appendChild(qItemEl(q)); });
    }).catch(function (e) {
      body.innerHTML = "";
      body.appendChild(el("div", "q-empty", L().couldNotLoadQ + (e && e.message ? e.message : "error")));
    });
  }

  function qItemEl(q) {
    var blocking = !(q.mode && q.mode !== "blocking");
    // The needs-a-decision highlight is for questions it is a human's turn on;
    // one in conversation gets its own quieter treatment instead.
    var conv = q.awaiting === "agent";
    var item = el("div", "q-item" + (blocking && !conv ? " blocking" : "") + (conv ? " conv" : ""));
    var urg = q.urgency || "normal";
    var head = el("div", "q-head");
    head.appendChild(el("span", "uw uw-" + urg, cap(urg)));
    head.appendChild(el("span", "uw", blocking ? L().blocking : L().advisory));
    item.appendChild(head);
    item.appendChild(el("div", "q-title", q.title || "(untitled question)"));
    // one monospace identity line: agent · kind · ticket
    item.appendChild(el("div", "q-meta", [q.asked_by || "—", q.kind, q.ticket].join(" · ")));
    if (conv) {
      var aw = el("div", "q-rec");
      aw.appendChild(el("span", "convtag", "⤺ " + L().inConversation));
      aw.appendChild(document.createTextNode(" · " + L().awaiting + (q.asked_by || "agent") + L().awaitingSub));
      item.appendChild(aw);
    }
    if (q.body) item.appendChild(mdNode(q.body, "q-body"));
    if (q.recommended != null && q.recommended !== "") {
      item.appendChild(el("div", "q-rec", (q.asked_by || "agent") + " " + L().recommends + " " + (typeof q.recommended === "string" ? q.recommended : JSON.stringify(q.recommended))));
    }

    var err = el("div", "q-err");
    var note = el("input", "q-note"); note.type = "text"; note.placeholder = L().notePlaceholder;

    if (state.me && state.me.canAnswer) {
      var actions = el("div", "q-actions");
      var send = function (value) { submitAnswer(q.id, value, note.value.trim(), err); };
      if (q.kind === "confirm" || q.kind === "approve") {
        var yes = el("button", "primary", q.kind === "approve" ? L().approve : L().yes);
        var no = el("button", null, q.kind === "approve" ? L().reject : L().no);
        yes.addEventListener("click", function () { send("yes"); });
        no.addEventListener("click", function () { send("no"); });
        actions.appendChild(yes); actions.appendChild(no);
      } else if (q.kind === "choose") {
        (q.options || []).forEach(function (opt) {
          var btn = el("button", null, opt);
          btn.addEventListener("click", function () { send(opt); });
          actions.appendChild(btn);
        });
      } else { // clarify
        var input = el("input"); input.type = "text"; input.placeholder = L().answerPlaceholder;
        var go = el("button", "primary", L().send);
        var submit = function () { var v = input.value.trim(); if (v) send(v); };
        go.addEventListener("click", submit);
        input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
        actions.appendChild(input); actions.appendChild(go);
      }
      item.appendChild(actions);
      item.appendChild(note);
    }
    item.appendChild(err);
    return item;
  }

  function submitAnswer(id, value, noteText, errEl) {
    errEl.textContent = "";
    var payload = noteText ? { value: value, note: noteText } : value;
    api("/questions/" + encodeURIComponent(id) + "/answer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ answer: payload })
    }).then(function () {
      renderInbox();
      refreshInboxCount();
      fullLoad(); // the ticket resumed — refresh the board
    }).catch(function (e) {
      errEl.textContent = "Failed: " + (e && e.message ? e.message : "error") + (e && e.status === 403 ? " (needs a token with the 'human' scope)" : "");
    });
  }

  $("inbox-btn").addEventListener("click", openInbox);
  $("inbox-close").addEventListener("click", closeInbox);
  $("mine-toggle").addEventListener("change", function () {
    state.mineOnly = $("mine-toggle").checked;
    refreshInboxCount();
    if (state.inboxOpen) renderInbox();
  });

  function renderDetail(t) {
    $("d-title").textContent = t.title || t.id;
    var b = $("d-body"); b.innerHTML = "";

    // "Blocked — answer in inbox" callout when this ticket has open questions.
    var qi = state.openQByTicket[t.id];
    if (qi && qi.count) {
      // "Blocked … answering resumes this ticket" is a lie when the human has
      // already bounced every open question back — there is nothing to answer
      // until the agent reports back, and the reader's job here is to read.
      var convOnly = !!(qi.conv && !qi.blocking && !qi.advisory);
      var sco = el("section");
      var callout = el("div", "callout" + (convOnly ? " conv" : ""));
      callout.appendChild(el("div", "ct", convOnly ? L().inConvN.replace("{n}", qi.conv) : L().blockedN.replace("{n}", qi.count)));
      callout.appendChild(el("div", "cs", convOnly ? L().inConvSub : (qi.blocking ? L().answeringResumes : L().decisionRouted)));
      var a = el("a", "answer-btn", convOnly ? L().readThread : L().answerInInbox); a.href = "/inbox";
      callout.appendChild(a);
      sco.appendChild(callout);
      b.appendChild(sco);
    }

    // meta row — priority as a colored word, identifiers monospace
    var s1 = el("section");
    var kv = el("div", "kv");
    kv.appendChild(el("span", "mono", t.id));
    kv.appendChild(el("span", "uw uw-" + (t.priority || "low"), cap(t.priority || "—")));
    kv.appendChild(el("span", null, L().state + ": " + t.state));
    if (t.type) kv.appendChild(el("span", null, t.type));
    if (t.claim && t.claim.holder) { var ch = el("span"); ch.appendChild(document.createTextNode(L().claimedBy + " ")); ch.appendChild(el("span", "mono", t.claim.holder)); kv.appendChild(ch); }
    s1.appendChild(kv);
    b.appendChild(s1);

    (t.labels || []).length && (function () {
      var s = el("section"); s.appendChild(el("h3", null, L().labels));
      var kv2 = el("div", "kv");
      t.labels.forEach(function (l) { kv2.appendChild(el("span", null, l)); });
      s.appendChild(kv2); b.appendChild(s);
    })();

    (t.tags || []).length && (function () {

    // body

    // deps
    var deps = t.deps || {};
    var blockedBy = deps.blocked_by || [];
    var blocks = deps.blocks || [];
    if (blockedBy.length || blocks.length) {
      var sd = el("section");
      sd.appendChild(el("h3", null, L().dependencies));
      if (blockedBy.length) {
        blockedBy.forEach(function (d) {
          var row = el("div", "dep-item");
          row.appendChild(document.createTextNode(L().blockedByRel));
          row.appendChild(el("span", "mono", (d.id || d)));

          if (d.state) row.appendChild(document.createTextNode(" [" + d.state + "]"));
          sd.appendChild(row);
        });
      }
      if (blocks.length) {
        blocks.forEach(function (d) {

          var row = el("div", "dep-item");
          row.appendChild(document.createTextNode(L().blocksRel));
          row.appendChild(el("span", "mono", idv));

      b.appendChild(sd);

    // links
    var links = t.links;

      sl.appendChild(el("h3", null, L().links));
      Object.keys(links).forEach(function (k) {

        row.appendChild(el("strong", null, k + ": "));
        // The commit is the proof, so it must stay readable: show the stub,

        var isCommit = k === "commit" && typeof v === "string" && v.trim();
        if (typeof v === "string" && /^https?:\/\//.test(v)) {
          var a = el("a"); a.href = v; a.textContent = isCommit ? shortCommit(v) : v;
          if (isCommit) a.title = v;

        }

    }

    // promotions (history, newest first)
    var promos = t.promotions || [];
    if (promos.length) {
      var sp = el("section");
      sp.appendChild(el("h3", null, L().promotions));
      var plist = el("div", "promo-list");
      promos.forEach(function (p) {

          } else if (p.url) {

          if (p.note) { if (meta.childNodes.length) meta.appendChild(document.createTextNode(" · ")); mdInline(meta, p.note); }
          row.appendChild(meta);
        }
        plist.appendChild(row);
      });
      sp.appendChild(plist);
      b.appendChild(sp);
    }

    // comments
    var comments = t.comments || [];
    var sc = el("section");
    sc.appendChild(el("h3", null, L().comments + " (" + comments.length + ")"));
    if (comments.length === 0) {
      sc.appendChild(el("div", "status", L().noComments));
    } else {
      comments.forEach(function (c) {
        var cc = el("div", "comment");
        cc.appendChild(el("div", "who", esc(c.author) + " · " + esc(c.created_at)));
        cc.appendChild(mdNode(c.body, "txt"));
        sc.appendChild(cc);
      });
    }
    b.appendChild(sc);
  }

  // ---- errors ----
  function handleErr(e) {
    if (e && e.auth) { showGate("Token was rejected (" + (e.status || "") + "). Enter a valid read token."); return; }
    var board = $("board");
    board.innerHTML = "";
    var m = el("div", "empty-col", "Could not load: " + (e && e.message ? e.message : "unknown error"));
    m.style.margin = "40px auto"; m.style.maxWidth = "400px";
    board.appendChild(m);
  }

  // ---- share mode ----------------------------------------------------------
  // A shared link carries its token in the URL FRAGMENT (#s=<token>), which the
  // browser never sends to the server (kept out of logs/referrers). In share
  // mode the board skips the token gate and project picker entirely and talks
  // only to the read-only, scope-bounded /v1/shares/self* endpoints. The token
  // is read at startup by parseHashKey("s"), the generalisation of this
  // section's original parseShareToken().

  // Like api(), but for the share endpoints: carries the share token and maps an
  // expired/revoked share (410) to a friendly terminal error.
  function shareApi(path, opts) {
    opts = opts || {};
    var headers = opts.headers || {};
    headers["Authorization"] = "Bearer " + state.share.token;
    return fetch(API + "/shares" + path, { headers: headers, method: opts.method || "GET" })
      .then(function (r) {
        if (r.status === 410) { var g = new Error("expired"); g.expired = true; throw g; }
        if (r.status === 401 || r.status === 403) { var e = new Error("auth"); e.expired = true; throw e; }
        if (!r.ok) {
          return r.text().then(function (t) {
            var msg = t;
            try { var j = JSON.parse(t); msg = j.message || (j.error && j.error.message) || t; } catch (_) {}
            var e2 = new Error(msg || ("HTTP " + r.status)); e2.status = r.status; throw e2;
          });
        }
        return r.json();
      });
  }

  function fmtExpiry(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString();
  }

  function showExpired() {
    stopPolling();
    $("gate").classList.add("hidden");
    $("topbar").classList.add("hidden");
    closeDetail();
    var board = $("board");
    board.innerHTML = "";
    var wrap = el("div", "card2");
    wrap.style.margin = "60px auto"; wrap.style.maxWidth = "440px"; wrap.style.textAlign = "center";
    wrap.appendChild(el("h1", null, "This shared link has expired"));
    wrap.appendChild(el("p", null, "The link is no longer valid — it has expired or been revoked. Ask whoever shared it for a fresh link."));
    board.appendChild(wrap);
  }

  function bootShare(token) {
    state.shareMode = true;
    state.share = { token: token, meta: null };
    $("gate").classList.add("hidden");
    // Reveal a trimmed header: no project picker, no sign-out, no nav; just a
    // title, the expiry notice, and a manual refresh.
    var bar = $("topbar");
    bar.classList.remove("hidden");
    $("nav").classList.add("hidden");
    $("projsel").classList.add("hidden");
    $("signout").classList.add("hidden");
    $("inbox-btn").classList.add("hidden"); // questions are not part of a read-only share
    shareLoad().catch(handleShareErr);
  }

  function shareLoad() {
    return shareApi("/self")
      .then(function (meta) {
        state.share.meta = meta;

  // ---- answer-link mode ---------------------------------------------------
  // An answer link carries a per-question grant token in the URL FRAGMENT
  // (#a=<token>) — never sent to the server automatically. It talks only to the
  // write-once /v1/answer/self endpoints and lets an outside expert answer ONE
  // question without any standing token.
  function parseHashKey(key) {
    var h = window.location.hash || "";
    if (h.charAt(0) === "#") h = h.slice(1);
    var out = "";
    h.split("&").forEach(function (part) {
      var i = part.indexOf("=");
      if (i > 0 && part.slice(0, i) === key) out = decodeURIComponent(part.slice(i + 1));
    });
    return out;
  }

  function answerApi(path, opts) {
    opts = opts || {};
    var headers = opts.headers || {};
    headers["Authorization"] = "Bearer " + state.answerToken;
    var init = { headers: headers, method: opts.method || "GET" };
    if (opts.body != null) init.body = opts.body;
    return fetch(API + "/answer" + path, init).then(function (r) {
      if (r.status === 410) { var g = new Error("expired"); g.expired = true; throw g; }
      if (!r.ok) {
        return r.text().then(function (t) {
          var msg = t;
          try { var j = JSON.parse(t); msg = j.message || (j.error && j.error.message) || t; } catch (_) {}
          var e = new Error(msg || ("HTTP " + r.status)); e.status = r.status; throw e;
        });
      }
      return r.json();
    });
  }

  function bootAnswer(token) {
    state.answerToken = token;
    $("gate").classList.add("hidden");
    $("topbar").classList.add("hidden");
    answerApi("/self").then(renderAnswerPage).catch(function (e) {
      if (e && e.expired) { answerCard("This link is no longer valid", "It has expired, been used, or been revoked. Ask whoever sent it for a fresh link."); return; }
      answerCard("Could not load the question", (e && e.message) ? e.message : "unknown error");
    });
  }
