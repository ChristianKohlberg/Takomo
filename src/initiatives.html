<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>takomo · initiatives</title>
<style>
  /* ---- Aquarelle tokens (shared with the board and the inbox) ---- */
  :root {
    --bg: #eef1f4; --panel: #ffffff; --col-bg: #f7fafc; --text: #14202a;
    --muted: #6e7c88; --muted2: #93a2ac; --ink2: #3a4a56; --border: #e6ecf0; --border-soft: #eef2f5;
    --accent: #1f4e78; --accent2: #2f6ba0; --accent-ink: #173d5e;
    --shadow: 0 18px 50px -26px rgba(20,40,55,.28);
    --crit: #b4543f; --ok: #3f7a5f; --warn: #c99a3a;
    --high: #2f6ba0; --normal: #5b8bb5; --low: #7d8a95; --gaugeoff: #cfd9e2;
    --chip-bg: #eaf2f9; --chip-text: #2f6ba0; --sel: #eef5fb; --sel-border: #cfe0ee; --hover: #f2f6fa;
    --dark: #14202a; --dark-ink: #eaf0f4;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e141b; --panel: #141d27; --col-bg: #101821; --text: #e6eef5;
      --muted: #8ba0b0; --muted2: #6f8291; --ink2: #c3d2de; --border: #26313d; --border-soft: #1e2833;
      --accent: #4c8dff; --accent2: #6ea8ff; --accent-ink: #7fb2ff;
      --shadow: 0 18px 50px -26px rgba(0,0,0,.6);
      --crit: #e0836f; --ok: #5fbf8f; --warn: #d8b25e;
      --high: #6ea8ff; --normal: #7fa8d4; --low: #8494a1; --gaugeoff: #33414f;
      --chip-bg: #1a2836; --chip-text: #8fb6dc; --sel: #16263a; --sel-border: #2b4a63; --hover: #17212c;
      --dark: #05090e; --dark-ink: #e6eef5;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; height: 100vh;
  }
  .tk-scroll::-webkit-scrollbar { width: 9px; height: 9px; }
  .tk-scroll::-webkit-scrollbar-thumb { background: var(--gaugeoff); border-radius: 6px; }
  .tk-scroll::-webkit-scrollbar-track { background: transparent; }
  @keyframes tkFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes tkSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .hidden { display: none !important; }

  /* ---- header ---- */
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px; flex: 0 0 auto;
    min-height: 58px; padding: 9px 20px; background: var(--panel); border-bottom: 1px solid var(--border-soft);
  }
  .brand { display: flex; align-items: center; gap: 9px; color: var(--accent2); }
  .brand span { font-size: 16px; font-weight: 750; letter-spacing: -.02em; color: var(--text); }
  .nav { display: flex; gap: 4px; margin-left: 4px; }
  .nav a, .nav .navpill { font-size: 13px; font-weight: 650; color: var(--muted); text-decoration: none; padding: 6px 13px; border-radius: 8px; cursor: pointer; }
  .nav a:hover { color: var(--accent); background: var(--hover); }
  .nav .active { color: var(--accent); background: var(--chip-bg); font-weight: 680; }
  .projpick { position: relative; display: inline-flex; align-items: center; }
  .projpick select {
    appearance: none; -webkit-appearance: none;
    font: inherit; font-weight: 650; font-size: 13px; color: var(--ink2);
    background: var(--col-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 30px 7px 12px; max-width: 220px; cursor: pointer; text-overflow: ellipsis;
  }
  .projpick select:hover { border-color: var(--sel-border); color: var(--accent); }
  .projpick::after { content: "▾"; position: absolute; right: 11px; color: var(--muted); font-size: 11px; pointer-events: none; }
  .grow { flex: 1 1 auto; }
  .langtoggle { display: inline-flex; gap: 2px; font-size: 11.5px; font-weight: 700; color: var(--muted2); }
  .langtoggle span { padding: 4px 7px; border-radius: 6px; cursor: pointer; }
  .langtoggle span.on { background: var(--chip-bg); color: var(--chip-text); }
  .iconbtn {
    font: inherit; font-size: 15px; line-height: 1; color: var(--muted);
    background: var(--col-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; cursor: pointer;
  }
  .iconbtn:hover { color: var(--accent); border-color: var(--sel-border); }
  .primary {
    font: inherit; font-size: 13px; font-weight: 680; color: #fff;
    background: var(--accent); border: 1px solid var(--accent); border-radius: 8px;
    padding: 7px 14px; cursor: pointer;
  }
  .primary:hover { background: var(--accent2); border-color: var(--accent2); }
  .primary[disabled] { opacity: .55; cursor: default; }
  .ghost {
    font: inherit; font-size: 13px; font-weight: 650; color: var(--ink2);
    background: var(--col-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 13px; cursor: pointer;
  }
  .ghost:hover { color: var(--accent); border-color: var(--sel-border); }

  /* ---- layout: filter bar, list, detail ---- */
  main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 380px 1fr; grid-template-rows: auto 1fr; }
  .fbar {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 9px 18px; background: var(--panel); border-bottom: 1px solid var(--border-soft);
  }
  .chip {
    font-size: 12.5px; font-weight: 650; color: var(--muted); background: var(--col-bg);
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; cursor: pointer;
  }
  .chip:hover { color: var(--accent); border-color: var(--sel-border); }
  .chip.on { background: var(--chip-bg); border-color: var(--sel-border); color: var(--chip-text); }
  .search {
    font: inherit; font-size: 13px; color: var(--ink2); background: var(--col-bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 11px; width: 220px;
  }
  .search:focus { outline: none; border-color: var(--sel-border); }

  .listpane { border-right: 1px solid var(--border-soft); background: var(--panel); overflow-y: auto; min-height: 0; }
  .readpane { overflow-y: auto; min-height: 0; padding: 0; }

  .irow {
    padding: 13px 18px; border-bottom: 1px solid var(--border-soft); cursor: pointer;
    display: flex; flex-direction: column; gap: 5px;
  }
  .irow:hover { background: var(--hover); }
  .irow.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent2); }
  .irow .it { font-weight: 680; font-size: 13.8px; letter-spacing: -.01em; display: flex; gap: 8px; align-items: baseline; }
  .irow .it .txt { flex: 1 1 auto; min-width: 0; }
  .irow .isum { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .irow .imeta { display: flex; gap: 9px; flex-wrap: wrap; color: var(--muted2); font-size: 11.5px; font-family: var(--mono); }
  .st { font-size: 10.5px; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 5px; flex: 0 0 auto; }
  .st.open { background: var(--chip-bg); color: var(--chip-text); }
  .st.parked { background: rgba(201,154,58,.16); color: var(--warn); }
  .st.distilled { background: rgba(63,122,95,.16); color: var(--ok); }

  /* ---- detail ---- */
  .dwrap { padding: 20px 26px 40px; max-width: 860px; animation: tkFade .18s ease; }
  .dhead { display: flex; align-items: flex-start; gap: 12px; }
  .dtitle { font-size: 22px; font-weight: 740; letter-spacing: -.02em; margin: 0; flex: 1 1 auto; }
  .dtitle[contenteditable="true"] { outline: none; border-bottom: 1px dashed var(--sel-border); }
  .dsum { color: var(--ink2); font-size: 14px; margin: 9px 0 0; }
  .dsum[contenteditable="true"] { outline: none; border-bottom: 1px dashed var(--sel-border); min-height: 20px; }
  .did { font-family: var(--mono); font-size: 11.5px; color: var(--muted2); }
  .statsel {
    appearance: none; -webkit-appearance: none; font: inherit; font-size: 11.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em; color: var(--chip-text); background: var(--chip-bg);
    border: 1px solid var(--sel-border); border-radius: 6px; padding: 4px 9px; cursor: pointer;
  }
  .rollup {
    display: flex; gap: 0; flex-wrap: wrap; margin: 18px 0 6px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  }
  .rollup .cell { flex: 1 1 110px; padding: 11px 14px; border-right: 1px solid var(--border-soft); }
  .rollup .cell:last-child { border-right: 0; }
  .rollup .k { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted2); }
  .rollup .v { font-size: 17px; font-weight: 720; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .tagchip { font-size: 11.5px; font-family: var(--mono); background: var(--chip-bg); color: var(--chip-text); border-radius: 5px; padding: 2px 7px; }
  .labchip { font-size: 11.5px; background: var(--col-bg); border: 1px solid var(--border); color: var(--ink2); border-radius: 5px; padding: 2px 7px; }

  .sechdr { font-size: 11.5px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; color: var(--muted2); margin: 26px 0 10px; }
  .entry {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; animation: tkSlide .2s ease;
  }
  .ehdr { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 7px; }
  .kindchip { font-size: 10.5px; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; background: var(--chip-bg); color: var(--chip-text); border-radius: 5px; padding: 2px 7px; }
  .etitle { font-weight: 680; font-size: 14px; }
  .prov { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted2); font-size: 11.5px; font-family: var(--mono); margin-left: auto; }
  .ebody { font-size: 13.6px; color: var(--text); }
  .ebody p:first-child { margin-top: 0; }
  .ebody p:last-child { margin-bottom: 0; }
  .ebody pre { background: var(--col-bg); border: 1px solid var(--border-soft); border-radius: 7px; padding: 9px 11px; overflow-x: auto; font-family: var(--mono); font-size: 12.2px; }
  .ebody code { font-family: var(--mono); font-size: 12.4px; }
  .ebody table { border-collapse: collapse; font-size: 12.8px; }
  .ebody th, .ebody td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  .ebody a { color: var(--accent2); }
  .att {
    display: inline-flex; align-items: center; gap: 7px; margin-top: 10px;
    font: inherit; font-size: 12.5px; font-weight: 650; color: var(--accent);
    background: var(--col-bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 11px; cursor: pointer;
  }
  .att:hover { border-color: var(--sel-border); background: var(--sel); }
  .att .sz { color: var(--muted2); font-weight: 600; font-family: var(--mono); font-size: 11.5px; }

  /* ---- composer + create form ---- */
  .composer { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 15px 16px; }
  .frow { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 9px; }
  .fld { display: flex; flex-direction: column; gap: 4px; flex: 1 1 170px; min-width: 0; }
  .fld label { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted2); }
  .fld input, .fld select, .fld textarea {
    font: inherit; font-size: 13px; color: var(--text); background: var(--col-bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; width: 100%;
  }
  .fld textarea { min-height: 96px; resize: vertical; font-family: inherit; }
  .fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--sel-border); }
  .fld .hint { font-size: 11px; color: var(--muted2); text-transform: none; letter-spacing: 0; font-weight: 500; }
  .cactions { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .filepick { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .filename { font-family: var(--mono); font-size: 11.5px; color: var(--ink2); }

  .modal { position: fixed; inset: 0; background: rgba(12,22,32,.45); display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px; z-index: 60; }
  .sheet { background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); width: 100%; max-width: 560px; padding: 22px 24px; animation: tkSlide .18s ease; }
  .sheet h2 { margin: 0 0 4px; font-size: 18px; font-weight: 740; letter-spacing: -.02em; }
  .sheet .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }

  .empty { padding: 60px 26px; color: var(--muted); text-align: center; animation: tkFade .2s ease; }
  .empty .big { font-size: 15px; font-weight: 680; color: var(--ink2); margin-bottom: 6px; }

  /* ---- gate ---- */
  #gate { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 80; }
  .card2 { background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); padding: 30px 32px; width: 100%; max-width: 400px; }
  .card2 h1 { font-size: 19px; font-weight: 740; margin: 12px 0 4px; letter-spacing: -.02em; }
  .card2 p { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .card2 label { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted2); margin-bottom: 5px; }
  .card2 input { font: inherit; font-family: var(--mono); font-size: 13px; color: var(--text); background: var(--col-bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; width: 100%; }
  .card2 button { margin-top: 14px; width: 100%; font: inherit; font-size: 13.5px; font-weight: 680; color: #fff; background: var(--accent); border: 0; border-radius: 8px; padding: 10px; cursor: pointer; }
  .gerr { color: var(--crit); font-size: 12.5px; margin-top: 10px; min-height: 16px; }

  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 90; }
  .toast { display: flex; align-items: flex-start; gap: 10px; background: var(--dark); color: var(--dark-ink); border-radius: 10px; padding: 11px 13px; max-width: 400px; font-size: 12.8px; box-shadow: 0 18px 40px -18px rgba(0,0,0,.5); animation: tkSlide .2s ease; }
  .toast.success { background: var(--ok); }
  .toast .tmsg { flex: 1 1 auto; }
  .toast .tclose { background: transparent; border: 0; color: inherit; font-size: 15px; line-height: 1; cursor: pointer; opacity: .7; }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
    .listpane { max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--border-soft); }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="card2">
    <div class="brand" id="gate-brand"></div>
    <h1 id="gate-title">takomo · initiatives</h1>
    <p id="gate-sub"></p>
    <label id="gate-label" for="g-token"></label>
    <input id="g-token" type="password" placeholder="tk_live_••••••••" autocomplete="off">
    <button id="g-go"></button>
    <div class="gerr" id="g-err"></div>
  </div>
</div>

<header class="hidden" id="topbar">
  <div class="brand" id="brand"></div>
  <nav class="nav"><a href="/board" id="nav-board">Board</a><a href="/inbox" id="nav-inbox">Inbox</a><span class="navpill active" id="nav-init">Initiatives</span></nav>
  <div class="projpick"><select id="projsel" title="project"></select></div>
  <span class="grow"></span>
  <button class="primary" id="newbtn"></button>
  <div class="langtoggle"><span id="lang-de">DE</span><span id="lang-en">EN</span></div>
  <button class="iconbtn" id="refresh" title="Refresh">↻</button>
  <button class="iconbtn" id="signout" title="Sign out">⎋</button>
</header>

<main class="hidden" id="app">
  <div class="fbar" id="fbar"></div>
  <section class="listpane tk-scroll" id="list"></section>
  <section class="readpane tk-scroll" id="read"></section>
</main>

<div id="modal-root"></div>
<div id="toasts"></div>

  // ---- api ----
  function api(path, opts) {
    opts = opts || {};

  // ---- gate ----

  function hideGate() { $("gate").classList.add("hidden"); $("topbar").classList.remove("hidden"); $("app").classList.remove("hidden"); }
  function applyGateStrings() {
    $("gate-sub").textContent = t().gateTokenSub; $("gate-label").textContent = t().gateLabel; $("g-go").textContent = t().gateOpen;
  }
  $("g-go").addEventListener("click", function () {
    var tk = $("g-token").value.trim();
    if (!tk) { $("g-err").textContent = t().tokenNeeded; return; }
    state.token = tk; localStorage.setItem(LS_TOKEN, tk); $("g-err").textContent = ""; hideGate(); boot();
  });
  $("g-token").addEventListener("keydown", function (e) { if (e.key === "Enter") $("g-go").click(); });
  $("signout").addEventListener("click", function () {

  $("refresh").addEventListener("click", function () { fetchAll().catch(handleErr); });
  $("newbtn").addEventListener("click", openCreate);
  $("projsel").addEventListener("change", function () {
    state.project = $("projsel").value;

  $("lang-de").addEventListener("click", function () { setLang("de"); });
  $("lang-en").addEventListener("click", function () { setLang("en"); });
  function setLang(l) { state.lang = l; localStorage.setItem(LS_LANG, l); applyChrome(); applyGateStrings(); render(); }

  // ---- boot + fetch ----
  function boot() {
    Promise.all([loadProjects(), loadMe()]).then(fetchAll).catch(handleErr);
  }
  function loadProjects() {
    return api("/projects").then(function (projects) {
      var sel = clear($("projsel"));
      var all = el("option"); all.value = ""; all.textContent = t().allProjects; sel.appendChild(all);
      (projects || []).forEach(function (p) {
        var o = el("option"); o.value = p.id; o.textContent = p.id; sel.appendChild(o);
      });
      sel.value = state.project;
      state.project = sel.value;
      localStorage.setItem(LS_PROJECT, state.project);
    }).catch(function () {});
  }
  function loadMe() {
    return api("/whoami").then(function (w) {
      state.me = { scopes: (w && w.scopes) || [], actor: (w && w.actor) || "" };
      // The composer's `source` defaults to who you are: the common case is that
      // the person reading is the person the input came from.
      if (!state.draft.source) state.draft.source = state.me.actor;
    }).catch(function () { state.me = { scopes: [], actor: "" }; });
  }

  function listQuery() {
    var qs = ["limit=100"];
    if (state.project) qs.push("project=" + encodeURIComponent(state.project));
    if (state.status) qs.push("status=" + encodeURIComponent(state.status));
    if (state.q.trim()) qs.push("q=" + encodeURIComponent(state.q.trim()));
    return "/initiatives?" + qs.join("&");
  }
  function fetchAll() {
    return api(listQuery()).then(function (page) {
      state.items = (page && page.items) || [];
      // Keep the selection only while it is still in view.
      if (state.selectedId && !state.items.some(function (i) { return i.id === state.selectedId; })) {
        state.selectedId = null; state.entries = []; state.entryCursor = null;
      }
      render();
      return state.selectedId ? fetchEntries(state.selectedId, true) : null;
    });
  }
  function fetchEntries(id, replace) {
    var qs = "?limit=" + ENTRY_PAGE + (!replace && state.entryCursor ? "&cursor=" + encodeURIComponent(state.entryCursor) : "");
    return api("/initiatives/" + encodeURIComponent(id) + "/entries" + qs).then(function (page) {
      var items = (page && page.items) || [];
      state.entries = replace ? items : state.entries.concat(items);

      // initiative's counts are refreshed from the same response.

      }

    });
  }
  function select(id) {
    state.selectedId = id; state.entries = []; state.entryCursor = null;

    fetchEntries(id, true).catch(handleErr);
  }
  function selected() {
    for (var i = 0; i < state.items.length; i++) if (state.items[i].id === state.selectedId) return state.items[i];
    return null;
  }

  // ---- hash routing (#i=ini-…) ----
  var suppressHash = false;
  function setHash(id) {

  }
  function applyHash() {

  }

  // ---- writes ----
  function guardWrite() {
    if (canWrite()) return true;
    toast(t().writeNeeded, "err");
    return false;
  }
  function createInitiative(fields) {
    return api("/initiatives", { method: "POST", body: JSON.stringify(fields) }).then(function (ini) {
      state.creating = false;
      toast(t().created, "success");
      return fetchAll().then(function () { select(ini.id); });
    });
  }
  function patchInitiative(id, body, note) {
    return api("/initiatives/" + encodeURIComponent(id), { method: "PATCH", body: JSON.stringify(body) })
      .then(function (updated) {
        state.items.forEach(function (i, idx) { if (i.id === id) state.items[idx] = updated; });
        toast(note, "success");
        render();
      });
  }
  function appendEntry(id) {
    var d = state.draft;
    if (!d.source.trim()) { toast(t().needSource, "err"); return; }
    if (!d.text.trim() && !state.file) { toast(t().needBody, "err"); return; }
    var body = { kind: (d.kind || "note").trim(), source: d.source.trim() };
    if (d.text.trim()) body.text = d.text;
    if (d.title.trim()) body.title = d.title.trim();

  function downloadAttachment(entry) {
    fetch(API + "/initiatives/" + encodeURIComponent(entry.initiative) + "/entries/" + encodeURIComponent(entry.id) + "/content",
      { headers: { "Authorization": "Bearer " + state.token } })
      .then(function (r) {

  // ---- render ----
  function render() { renderFilterBar(); renderList(); renderDetail(); renderModal(); }

  function renderFilterBar() {
    var bar = clear($("fbar"));

    // so a count derived from it would read 0 on every chip except the active one
    // — a number that looks authoritative and is wrong. A truthful count needs its
    // own unfiltered request, which this page does not need to make.

      var c = el("button", "chip" + (state.status === value ? " on" : ""), label);
      c.addEventListener("click", function () { state.status = value; fetchAll().catch(handleErr); });
      return c;
    };
    bar.appendChild(mk("", t().all));
    STATUSES.forEach(function (s) { bar.appendChild(mk(s, statusLabel(s))); });

    search.type = "search"; search.placeholder = t().searchPh; search.value = state.q;
    search.id = "initiative-search";
    search.setAttribute("aria-label", t().searchPh);

  function renderList() {
    var pane = clear($("list"));
    if (!state.items.length) {
      var e = el("div", "empty");
      e.appendChild(el("div", "big", t().emptyList));
      e.appendChild(el("div", null, t().emptyListHint));
      pane.appendChild(e);
      return;
    }
    state.items.forEach(function (i) {
      var row = el("div", "irow" + (i.id === state.selectedId ? " sel" : ""));
      var head = el("div", "it");

      head.appendChild(el("span", "st " + i.status, statusLabel(i.status)));

      meta.appendChild(el("span", null, (r.entries || 0) + " · " + t().rEntries.toLowerCase()));

  function renderDetail() {
    var pane = clear($("read"));
    var ini = selected();
    if (!ini) {
      var e = el("div", "empty");
      e.appendChild(el("div", "big", t().noneSelected));
      e.appendChild(el("div", null, t().noneSelectedHint));
      pane.appendChild(e);
      return;
    }
    var wrap = el("div", "dwrap");

    var head = el("div", "dhead");
    var h1 = el("h1", "dtitle", ini.title);
    if (canWrite()) {
      // Edited in place rather than behind a form: retitling is the smallest
      // possible change and a modal for it would be heavier than the edit.
      h1.setAttribute("contenteditable", "true");
      h1.addEventListener("blur", function () {
        var v = h1.textContent.trim();
        if (!v) { h1.textContent = ini.title; return; }
        if (v === ini.title) return;
        patchInitiative(ini.id, { title: v }, t().savedTitle).catch(function (err) { h1.textContent = ini.title; handleErr(err); });
      });
    }

    var sel = el("select", "statsel");

    });

    wrap.appendChild(head);
    wrap.appendChild(el("div", "did", ini.id + " · " + ini.project));

    var sum = el("p", "dsum", ini.summary || "");
    if (canWrite()) {
      sum.setAttribute("contenteditable", "true");
      sum.addEventListener("blur", function () {
        var v = sum.textContent.trim();
        if (v === (ini.summary || "")) return;
        patchInitiative(ini.id, { summary: v }, t().savedSummary).catch(function (err) { sum.textContent = ini.summary || ""; handleErr(err); });
      });

    wrap.appendChild(sum);

    var r = ini.rollup || {};
    var roll = el("div", "rollup");
    [[t().rEntries, String(r.entries || 0)],

      (ini.tags || []).forEach(function (tg) { chips.appendChild(el("span", "tagchip", tg)); });
      wrap.appendChild(chips);

    if (canWrite()) {

      wrap.appendChild(composer(ini));
    }

    wrap.appendChild(el("div", "sechdr", t().entriesHdr));
    if (!state.entries.length) {
      var ee = el("div", "empty");
      ee.appendChild(el("div", "big", t().emptyEntries));
      ee.appendChild(el("div", null, t().emptyEntriesHint));

    } else {

        more.addEventListener("click", function () { fetchEntries(ini.id, false).catch(handleErr); });
        wrap.appendChild(more);
      }
    }
    pane.appendChild(wrap);
  }

  function entryCard(en) {
    var card = el("div", "entry");
    var hdr = el("div", "ehdr");
    hdr.appendChild(el("span", "kindchip", en.kind));
    if (en.title) hdr.appendChild(el("span", "etitle", en.title));
    var prov = el("div", "prov");
    prov.appendChild(el("span", null, en.source));
    if (en.origin_at) prov.appendChild(el("span", null, t().wrote + " " + fmtAge(en.origin_at)));
    prov.appendChild(el("span", null, fmtAge(en.created_at) + " · " + t().by + " " + en.author));
    hdr.appendChild(prov);
    card.appendChild(hdr);
    if (en.text) {
      // mdNode comes from src/spa-common.js, inlined below at the marker: the same
      // renderer /board and /inbox use, so an agent's markdown reads the same here.
      var body = el("div", "ebody");
      body.appendChild(mdNode(en.text));
      card.appendChild(body);
    }
    if (en.source_uri) {
      var link = el("a", null, en.source_uri);

      btn.appendChild(el("span", "sz", fmtBytes(en.content_bytes)));
      btn.addEventListener("click", function () { downloadAttachment(en); });
      card.appendChild(btn);
    }
    return card;
  }

  function field(labelText, hintText, control) {
    var f = el("div", "fld");
    var lab = el("label", null, labelText);
    var id = "f-" + Math.random().toString(36).slice(2, 9);
    control.id = id; lab.setAttribute("for", id);
    f.appendChild(lab);
    f.appendChild(control);
    if (hintText) f.appendChild(el("div", "hint", hintText));
    return f;
  }
  function textInput(value, placeholder, onInput) {
    var i = el("input"); i.type = "text"; i.value = value || ""; if (placeholder) i.placeholder = placeholder;
    i.addEventListener("input", function () { onInput(i.value); });
    return i;
  }

  function composer(ini) {
    var box = el("div", "composer");
    var d = state.draft;

    var row1 = el("div", "frow");
    var kind = el("input"); kind.type = "text"; kind.value = d.kind; kind.setAttribute("list", "kindlist");
    kind.addEventListener("input", function () { d.kind = kind.value; });
    var dl = el("datalist"); dl.id = "kindlist";
    KINDS.forEach(function (k) { var o = el("option"); o.value = k; dl.appendChild(o); });
    var kindFld = field(t().eKind, t().eKindHint, kind);
    kindFld.appendChild(dl);   // sibling of the input, not a child of it
    row1.appendChild(kindFld);
    row1.appendChild(field(t().eSource, t().eSourceHint, textInput(d.source, "agent:w1", function (v) { d.source = v; })));
    box.appendChild(row1);

    var row2 = el("div", "frow");
    row2.appendChild(field(t().eTitle, null, textInput(d.title, t().eTitlePh, function (v) { d.title = v; })));
    row2.appendChild(field(t().eSourceUri, null, textInput(d.uri, t().eSourceUriPh, function (v) { d.uri = v; })));
    box.appendChild(row2);

    var ta = el("textarea"); ta.value = d.text; ta.placeholder = t().eTextPh;
    ta.addEventListener("input", function () { d.text = ta.value; });
    var row3 = el("div", "frow");
    row3.appendChild(field(t().eText, null, ta));
    box.appendChild(row3);

    var row4 = el("div", "frow");
    var when = el("input"); when.type = "datetime-local"; when.value = d.origin;
    when.addEventListener("input", function () { d.origin = when.value; });
    row4.appendChild(field(t().eOrigin, t().eOriginHint, when));
    box.appendChild(row4);

    var actions = el("div", "cactions");
    var pick = el("div", "filepick");
    var fileIn = el("input"); fileIn.type = "file";
    fileIn.id = "initiative-attach";
    fileIn.setAttribute("aria-label", t().aAttach);
    fileIn.addEventListener("change", function () {
      var f = fileIn.files && fileIn.files[0];
      if (!f) { state.file = null; render(); return; }
      var reader = new FileReader();
      reader.onload = function () {
        // readAsDataURL gives "data:<mime>;base64,<payload>" — the payload after
        // the comma is exactly what the API's content_base64 wants.
        var res = String(reader.result || "");
        var comma = res.indexOf(",");
        state.file = { name: f.name, mime: f.type || "", b64: comma >= 0 ? res.slice(comma + 1) : "", size: f.size };
        render();
      };
      reader.onerror = function () { toast("Could not read the file", "err"); };
      reader.readAsDataURL(f);
    });
    if (state.file) {
      pick.appendChild(el("span", "filename", state.file.name + " · " + fmtBytes(state.file.size)));
      var rm = el("button", "ghost", t().attachClear);
      rm.addEventListener("click", function () { state.file = null; render(); });
      pick.appendChild(rm);
    } else {
      pick.appendChild(el("span", null, t().attach));
      pick.appendChild(fileIn);
    }
    actions.appendChild(pick);
    actions.appendChild(el("span", "grow"));
    var send = el("button", "primary", state.busy ? t().appending : t().append);
    send.disabled = state.busy;
    send.addEventListener("click", function () { if (guardWrite()) appendEntry(ini.id); });
    actions.appendChild(send);
    box.appendChild(actions);
    return box;
  }

  // ---- create sheet ----
  function openCreate() {
    if (!guardWrite()) return;
    if (!state.project) { toast(t().needProject, "err"); return; }
    state.creating = true; renderModal();
  }
  function renderModal() {
    var root = clear($("modal-root"));
    if (!state.creating) return;
    var draft = { title: "", summary: "", labels: "", tags: "" };
    var overlay = el("div", "modal");
    var sheet = el("div", "sheet");
    sheet.appendChild(el("h2", null, t().newInitiative));
    sheet.appendChild(el("div", "sub", t().newSub));

    var titleIn = textInput("", t().fTitlePh, function (v) { draft.title = v; });
    var r1 = el("div", "frow"); r1.appendChild(field(t().fTitle, null, titleIn)); sheet.appendChild(r1);
    var sumIn = el("textarea"); sumIn.placeholder = t().fSummaryPh;
    sumIn.addEventListener("input", function () { draft.summary = sumIn.value; });
    var r2 = el("div", "frow"); r2.appendChild(field(t().fSummary, null, sumIn)); sheet.appendChild(r2);
    var r3 = el("div", "frow");
    r3.appendChild(field(t().fLabels, null, textInput("", t().fLabelsPh, function (v) { draft.labels = v; })));
    r3.appendChild(field(t().fTags, t().fTagsPh, textInput("", t().fTagsPh, function (v) { draft.tags = v; })));
    sheet.appendChild(r3);

    var actions = el("div", "cactions");
    var cancel = el("button", "ghost", t().cancel);
    cancel.addEventListener("click", function () { state.creating = false; renderModal(); });
    actions.appendChild(cancel);
    actions.appendChild(el("span", "grow"));
    var go = el("button", "primary", t().create);
    go.addEventListener("click", function () {
      if (!draft.title.trim()) { toast(t().needTitle, "err"); return; }
      var body = { project: state.project, title: draft.title.trim() };
      if (draft.summary.trim()) body.summary = draft.summary.trim();
      if (splitList(draft.labels).length) body.labels = splitList(draft.labels);
      if (splitList(draft.tags).length) body.tags = splitList(draft.tags);
      createInitiative(body).catch(handleErr);
    });
    actions.appendChild(go);
    sheet.appendChild(actions);

    overlay.appendChild(sheet);
    overlay.addEventListener("click", function (e) { if (e.target === overlay) { state.creating = false; renderModal(); } });
    root.appendChild(overlay);
    titleIn.focus();
  }

  // ---- chrome ----
  function applyChrome() {
    $("brand").innerHTML = LOGO + '<span>takomo</span>';
    $("gate-brand").innerHTML = LOGO;
    $("nav-board").textContent = t().board;
    $("nav-inbox").textContent = t().inbox;
    $("nav-init").textContent = t().initiatives;
    $("newbtn").textContent = "+ " + t().newInitiative;
    $("lang-de").className = state.lang === "de" ? "on" : "";
    $("lang-en").className = state.lang === "en" ? "on" : "";
  }

  applyChrome(); applyGateStrings();
  if (state.token) { hideGate(); boot(); applyHash(); } else { showGate(""); }

  // <<SPA_COMMON>> — src/spa-common.js is inlined here when the response is built (src/api/mod.rs). Last line on purpose: appending keeps every line number above it.
})();
</script>
</body>
</html>
