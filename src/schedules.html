<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>takomo · schedules</title>
<style>
  /* ---- Aquarelle tokens (shared with the board, the inbox and initiatives) ----
     One addition: --nf / --nfbg, the "not fulfilled" outcome. The palette had no
     word for it, so it is set at the same muted saturation as --crit and --ok to
     read as a member of the family rather than an import. */
  :root {
    --bg: #eef1f4; --panel: #ffffff; --col-bg: #f7fafc; --text: #14202a;
    --muted: #6e7c88; --muted2: #93a2ac; --ink2: #3a4a56; --border: #e6ecf0; --border-soft: #eef2f5;
    --accent: #1f4e78; --accent2: #2f6ba0; --accent-ink: #173d5e;
    --shadow: 0 18px 50px -26px rgba(20,40,55,.28);
    --crit: #b4543f; --ok: #3f7a5f; --warn: #c99a3a;
    --okbg: #e9f2ed; --okbd: #cfe3d8;
    --nf: #b4543f; --nfbg: #f7ebe7; --nfbd: #ecd7d0;
    --high: #2f6ba0; --normal: #5b8bb5; --low: #7d8a95; --gaugeoff: #cfd9e2;
    --chip-bg: #eaf2f9; --chip-text: #2f6ba0; --sel: #eef5fb; --sel-border: #cfe0ee; --hover: #f2f6fa;
    --overlay: rgba(20,40,55,.5);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e141b; --panel: #141d27; --col-bg: #101821; --text: #e6eef5;
      --muted: #8ba0b0; --muted2: #6f8291; --ink2: #c3d2de; --border: #26313d; --border-soft: #1e2833;
      --accent: #4c8dff; --accent2: #6ea8ff; --accent-ink: #7fb2ff;
      --shadow: 0 18px 50px -26px rgba(0,0,0,.6);
      --crit: #e0836f; --ok: #5fbf8f; --warn: #d8b25e;
      --okbg: #16302a; --okbd: #24483c;
      --nf: #e0836f; --nfbg: #351f1b; --nfbd: #4d2e27;
      --high: #6ea8ff; --normal: #7fa8d4; --low: #8494a1; --gaugeoff: #33414f;
      --chip-bg: #1a2836; --chip-text: #8fb6dc; --sel: #16263a; --sel-border: #2b4a63; --hover: #17212c;
      --overlay: rgba(1,4,9,.72);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; height: 100vh;
  }
  .tk-scroll::-webkit-scrollbar { width: 9px; height: 9px; }
  .tk-scroll::-webkit-scrollbar-thumb { background: var(--gaugeoff); border-radius: 6px; }
  .tk-scroll::-webkit-scrollbar-track { background: transparent; }
  @keyframes tkFade { from { opacity: 0; } to { opacity: 1; } }
  .hidden { display: none !important; }
  .grow { flex: 1 1 auto; }

  /* ---- header ---- */
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px; flex: 0 0 auto;
    min-height: 58px; padding: 9px 20px; background: var(--panel); border-bottom: 1px solid var(--border-soft);
  }
  .brand { display: flex; align-items: center; gap: 9px; color: var(--accent2); }
  .brand span { font-size: 16px; font-weight: 750; letter-spacing: -.02em; color: var(--text); }
  .nav { display: flex; gap: 4px; margin-left: 4px; }
  .nav a, .nav .navpill { font-size: 13px; font-weight: 650; color: var(--muted); text-decoration: none; padding: 6px 13px; border-radius: 8px; cursor: pointer; }
  .nav a:hover { color: var(--accent); background: var(--hover); }
  .nav .active { color: var(--accent); background: var(--chip-bg); font-weight: 680; }
  /* The one thing schedules put on another page: a count of proposals waiting on
     a human, exactly as /inbox badges open questions. */
  .badge {
    display: inline-block; min-width: 17px; padding: 0 5px; border-radius: 9px;
    background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
    text-align: center; margin-left: 6px; line-height: 17px;
  }
  .badge.zero { display: none; }
  select, input, textarea, button {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; font-weight: 650; }
  button.primary:hover { background: var(--accent-ink); }
  button.danger { color: var(--crit); }
  button.danger:hover { background: var(--nfbg); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .iconbtn { color: var(--accent2); font-weight: 650; }
  .iconbtn:hover { background: var(--hover); }
  .langtoggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .langtoggle span { font-size: 12px; font-weight: 680; padding: 5px 10px; cursor: pointer; color: var(--muted); }
  .langtoggle span.on { background: var(--accent); color: #fff; }

  /* ---- gate ---- */
  #gate { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 50; padding: 20px; }
  .card2 { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 26px; width: 100%; max-width: 430px; }
  .card2 h1 { font-size: 19px; margin: 12px 0 6px; letter-spacing: -.02em; }
  .card2 p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .card2 label { display: block; font-size: 12px; font-weight: 680; color: var(--cap, var(--muted)); margin-bottom: 5px; }
  .card2 input { width: 100%; margin-bottom: 12px; }
  .card2 button { width: 100%; background: var(--accent); color: #fff; border-color: transparent; font-weight: 650; }
  .gerr { color: var(--crit); font-size: 12.5px; margin-top: 10px; min-height: 16px; }

  /* ---- the page: one scrolling column of rows ---- */
  main { flex: 1 1 auto; overflow-y: auto; padding: 18px 20px 60px; }
  .wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .banner {
    background: var(--nfbg); border: 1px solid var(--nfbd); border-radius: 10px;
    padding: 10px 14px; display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--nf); font-weight: 620;
  }
  .grouphead {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 750;
    color: var(--muted); display: flex; align-items: center; gap: 8px; padding: 6px 2px 0;
  }
  .grouphead .ct { color: var(--low); font-weight: 600; }
  .empty { color: var(--muted); font-size: 13.5px; padding: 30px 4px; text-align: center; }

  /* one schedule */
  .scard { background: var(--panel); border: 1px solid var(--border); border-radius: 11px; padding: 13px 15px 12px; animation: tkFade .18s ease-out; }
  .scard.pend { background: var(--sel); border-color: var(--sel-border); }
  .scard.off .nm, .scard.off .sub { color: var(--low); }
  .stop { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .scard .nm { font-size: 14px; font-weight: 680; }
  .scard .sub { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .scard .why { font-size: 13px; color: var(--ink2); margin: 9px 0 0; }
  .sfoot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .sfoot b { font-weight: 700; }
  .tal-done { color: var(--ok); } .tal-nf { color: var(--nf); }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 680; padding: 2px 8px; border-radius: 7px; background: var(--chip-bg); color: var(--chip-text); }
  .chip.flat { background: transparent; color: var(--low); border: 1px solid var(--border); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .acts button { font-size: 12px; padding: 5px 11px; }

  /* the ticket a proposal would create */
  .tprev { margin-top: 10px; border: 1px dashed var(--border); border-radius: 9px; padding: 10px 12px; background: var(--panel); }
  .tprev-title { font-size: 13px; font-weight: 640; margin-bottom: 4px; }
  .tprev .md, .tprev-body { font-size: 12.5px; color: var(--muted); }
  .tprev .md p { margin: 4px 0; }
  .tprev .md pre { background: var(--col-bg); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; overflow-x: auto; font-family: var(--mono); font-size: 11.5px; }
  .tprev .md code { font-family: var(--mono); font-size: 11.5px; }
  .tprev .md ul, .tprev .md ol { margin: 4px 0; padding-left: 18px; }

  /* the lineage strip: one cell per occurrence, most recent last */
  /* Flex rather than an 8-column grid, and right-justified: a schedule with
     fewer than eight occurrences must still put its NEWEST cell flush right,
     because "now" is where the eye ends up. In a grid the short row left a hole
     on the right and the most recent occurrence drifted off the edge. The
     max-width keeps a 5-cell row the same cell size as an 8-cell one. */
  .lin { display: flex; justify-content: flex-end; gap: 6px; margin-top: 11px; }
  .lc {
    flex: 1 1 0; min-width: 0; max-width: calc((100% - 42px) / 8);
    border: 1px solid var(--border); border-radius: 7px; padding: 7px 8px; min-height: 62px;
    background: var(--panel); font-size: 11.5px; line-height: 1.3; text-align: left;
    cursor: pointer; overflow: hidden;
  }
  .lc:hover { border-color: var(--accent2); }
  .lc .ls { display: block; font-family: var(--mono); font-size: 10px; color: var(--low); margin-bottom: 3px; }
  .lc .lo { display: block; font-weight: 660; }
  .lc .lw { display: block; font-family: var(--mono); font-size: 9.5px; color: var(--low); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lc.done { background: var(--okbg); border-color: var(--okbd); }
  .lc.done .lo { color: var(--ok); }
  .lc.not_fulfilled { background: var(--nfbg); border-color: var(--nfbd); }
  .lc.not_fulfilled .lo { color: var(--nf); }
  .lc.open { background: var(--sel); border-color: var(--sel-border); }
  .lc.open .lo { color: var(--accent-ink); }
  .linaxis { display: flex; justify-content: flex-end; font-family: var(--mono); font-size: 10px; color: var(--low); margin-top: 3px; }

  /* ---- modal ---- */
  .backdrop { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 20px; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); width: 100%; max-width: 560px; max-height: 86vh; overflow-y: auto; }
  .mhead { padding: 15px 18px 0; }
  .mhead h2 { font-size: 17px; margin: 0 0 5px; letter-spacing: -.02em; }
  .mhead p { margin: 0; color: var(--muted); font-size: 13px; }
  .mbody { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .fld { display: flex; flex-direction: column; gap: 5px; }
  .fld label { font-size: 12px; font-weight: 680; color: var(--muted); }
  .fld input, .fld select, .fld textarea { width: 100%; }
  .fld textarea { min-height: 66px; resize: vertical; font-family: inherit; }
  .frow { display: flex; gap: 10px; flex-wrap: wrap; }
  .frow > .fld { flex: 1 1 130px; }
  .days { display: flex; gap: 4px; flex-wrap: wrap; }
  .days span { font-size: 12px; font-weight: 650; padding: 5px 9px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; color: var(--muted); }
  .days span.on { background: var(--accent); border-color: transparent; color: #fff; }
  .preview { font-family: var(--mono); font-size: 11.5px; color: var(--muted); background: var(--col-bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; }
  .mfoot { padding: 0 18px 16px; display: flex; gap: 8px; justify-content: flex-end; }
  .merr { color: var(--crit); font-size: 12.5px; min-height: 16px; }

  /* ---- toasts ---- */
  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
  .toast { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent2); border-radius: 9px; box-shadow: var(--shadow); padding: 10px 12px; display: flex; gap: 10px; align-items: center; font-size: 13px; max-width: 380px; }
  .toast.bad { border-left-color: var(--crit); }
  .toast .tmsg { flex: 1 1 auto; }
  .toast .tclose { background: transparent; border: 0; color: inherit; font-size: 15px; line-height: 1; cursor: pointer; opacity: .7; }

  @media (max-width: 760px) {
    .lc { max-width: calc((100% - 18px) / 4); }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="card2">
    <div class="brand" id="gate-brand"></div>
    <h1 id="gate-title">takomo · schedules</h1>
    <p id="gate-sub"></p>
    <label id="gate-label" for="g-token"></label>
    <input id="g-token" type="password" placeholder="tk_live_••••••••" autocomplete="off">
    <button id="g-go"></button>
    <div class="gerr" id="g-err"></div>
  </div>
</div>

<header class="hidden" id="topbar">
  <div class="brand" id="brand"></div>
  <nav class="nav"><a href="/board" id="nav-board">Board</a><a href="/inbox" id="nav-inbox">Inbox</a><a href="/initiatives" id="nav-init">Initiatives</a><span class="navpill active" id="nav-sched">Schedules<span class="badge zero" id="pendbadge">0</span></span></nav>
  <div><select id="projsel" title="project"></select></div>
  <span class="grow"></span>
  <button class="primary" id="newbtn"></button>
  <div class="langtoggle"><span id="lang-de">DE</span><span id="lang-en">EN</span></div>
  <button class="iconbtn" id="refresh" title="Refresh">↻</button>
  <button class="iconbtn" id="signout" title="Sign out">⎋</button>
</header>

<main class="hidden tk-scroll" id="app"><div class="wrap" id="wrap"></div></main>

<div id="modal-root"></div>
<div id="toasts"></div>

<script>
"use strict";
(function () {
  var API = "/v1";
  var LS_TOKEN = "takomo.schedules.token";
  var LS_LANG = "takomo.lang";
  var LS_PROJECT = "takomo.schedules.project";
  var DAYS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
  var UNITS = ["day", "week", "month"];
  // How many occurrences the strip shows. Eight is two months of a weekly
  // cadence and a fortnight of a daily one — enough to see a pattern, and it
  // fits the width without shrinking the text below 11px.
  var STRIP = 8;

  var LOGO = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11a6 6 0 0 1 12 0"/><circle cx="9.7" cy="9.6" r="0.9" fill="currentColor" stroke="none"/><circle cx="14.3" cy="9.6" r="0.9" fill="currentColor" stroke="none"/><path d="M7 11.2c0 2.8-1.4 3.8-1.4 5.8"/><path d="M10 11.6c0 2.9-.5 4.3 0 6.2"/><path d="M14 11.6c0 2.9.5 4.3 0 6.2"/><path d="M17 11.2c0 2.8 1.4 3.8 1.4 5.8"/></svg>';

  // ---- i18n ----
  // The de and en tables are kept line-for-line parallel: same keys, same order.
  // `spa_string_tables_agree_on_every_key` in tests/api.rs enforces it, because a
  // key present in only one table renders as `undefined` for those readers.
  var STR = {
    de: {
      schedules:"Zeitpläne",
      board:"Board",
      inbox:"Inbox",
      initiatives:"Initiativen",
      gateTokenSub:"Token mit 'read'. Zum Aktivieren, Pausieren oder Anlegen braucht es zusätzlich 'human'.",
      gateLabel:"API-Token",
      gateOpen:"Öffnen",
      allProjects:"Alle Projekte",
      newSchedule:"Neuer Zeitplan",
      newSub:"Ein Zeitplan legt in einem Rhythmus ein ganz normales Ticket an. Das Ticket verweist zurück — und auf nichts sonst.",
      groupPending:"Wartet auf dich",
      groupActive:"Aktiv",
      groupStopped:"Gestoppt",
      emptyAll:"Noch keine Zeitpläne. Ein Zeitplan legt in einem Rhythmus ein Ticket an — wöchentlicher Review, Schlüsselrotation, tägliche Backup-Prüfung.",
      bannerPending:"Ein Agent hat einen Zeitplan vorgeschlagen. Bis du ihn aktivierst, passiert nichts.",
      statusPending:"wartet",
      statusActive:"aktiv",

      fAt:"Uhrzeit",

      fBody:"Ticket-Text",
      fLabels:"Labels",

      previewLabel:"Die nächsten Termine",

      fBody:"Ticket body",

      needHuman:"Your token needs the 'human' scope for that.",

  var initialLang = (localStorage.getItem(LS_LANG) || ((navigator.language || "en").toLowerCase().indexOf("de") === 0 ? "de" : "en"));
  var state = {
    token: localStorage.getItem(LS_TOKEN) || "",
    lang: STR[initialLang] ? initialLang : "en",
    project: localStorage.getItem(LS_PROJECT) || "",
    me: { scopes: [], actor: "" },
    schedules: [],
    busy: {}
  };

  function t() { return STR[state.lang]; }
  function isHuman() { return state.me.scopes.indexOf("human") !== -1; }
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function pad(n) { return n < 10 ? "0" + n : String(n); }

  /// Render an instant the way the rest of takomo does: local, short, and never
  /// pretending to a precision the sweeper does not have.
  function fmtWhen(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(state.lang === "de" ? "de-DE" : "en-GB", { day: "numeric", month: "short" }) +
      ", " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  /// The slot label on a strip cell. Deliberately short — the cell is ~110px —
  /// and derived from the cadence so a weekly row reads as a week and a daily row
  /// as a date.
  function slotLabel(iso, unit) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    if (unit === "week") return isoWeekLabel(d);
    if (unit === "month") return d.toLocaleDateString(state.lang === "de" ? "de-DE" : "en-GB", { month: "short", year: "2-digit" });
    return d.toLocaleDateString(state.lang === "de" ? "de-DE" : "en-GB", { day: "numeric", month: "short" });
  }

  /// ISO-8601 week label, e.g. 2026-W32. Computed rather than taken from the API
  /// because the API sends the instant; the label is a local presentation of it.
  function isoWeekLabel(d) {
    var x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = x.getUTCDay() || 7;
    x.setUTCDate(x.getUTCDate() + 4 - day);
    var yearStart = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
    var week = Math.ceil(((x - yearStart) / 86400000 + 1) / 7);
    return x.getUTCFullYear() + "-W" + pad(week);
  }

  /// The cadence as one human line, in the reader's language.
  function cadenceText(c) {
    if (!c) return "—";
    var out = [];
    if (c.interval && c.interval > 1) {
      out.push(t().everyN + " " + c.interval + " " + (c.every === "day" ? (state.lang === "de" ? "Tage" : "days") : c.every === "week" ? (state.lang === "de" ? "Wochen" : "weeks") : (state.lang === "de" ? "Monate" : "months")));
    } else {
      out.push(c.every === "day" ? t().unitDay : c.every === "week" ? t().unitWeek : t().unitMonth);
    }
    if (c.on && c.on.length) out.push(c.on.join(" "));
    if (c.day) out.push(t().onDay + " " + c.day);
    out.push(c.at || "");
    if (c.tz && c.tz !== "UTC") out.push(c.tz);
    else out.push("UTC");
    return out.join(" · ");
  }

  function outcomeLabel(o) {
    return o === "done" ? t().outDone : o === "not_fulfilled" ? t().outNf : t().outOpen;
  }

  function splitList(s) {
    return String(s || "").split(",").map(function (x) { return x.trim(); }).filter(function (x) { return x.length > 0; });
  }

  function api(path, opts) {
    var init = opts || {};
    init.headers = init.headers || {};
    init.headers["Authorization"] = "Bearer " + state.token;
    if (init.body) init.headers["Content-Type"] = "application/json";
    return fetch(API + path, init).then(function (r) {
      if (r.status === 204) return null;
      return r.text().then(function (tx) {
        var body = null;
        try { body = tx ? JSON.parse(tx) : null; } catch (e) { body = null; }
        if (!r.ok) {
          var err = new Error((body && body.message) || r.statusText || ("HTTP " + r.status));
          err.status = r.status;
          err.code = body && body.code;
          throw err;
        }
        return body;
      });
    });
  }

  function handleErr(e) {
    if (e && e.status === 401) { signOut(); return; }
    toast((e && e.message) || String(e), "bad");
  }

  function toast(msg, kind) {
    var box = el("div", "toast" + (kind === "bad" ? " bad" : ""));
    box.appendChild(el("div", "tmsg", msg));
    var x = el("button", "tclose", "×");
    x.addEventListener("click", function () { if (box.parentNode) box.parentNode.removeChild(box); });
    box.appendChild(x);
    $("toasts").appendChild(box);
    setTimeout(function () { if (box.parentNode) box.parentNode.removeChild(box); }, 6000);
  }

  function showGate(msg) {
    $("gate").classList.remove("hidden");
    $("topbar").classList.add("hidden");
    $("app").classList.add("hidden");
    $("g-err").textContent = msg || "";
  }
  function hideGate() {
    $("gate").classList.add("hidden");
    $("topbar").classList.remove("hidden");
    $("app").classList.remove("hidden");
  }
  function applyGateStrings() {
    $("gate-sub").textContent = t().gateTokenSub;
    $("gate-label").textContent = t().gateLabel;
    $("g-go").textContent = t().gateOpen;
  }
  function signOut() {
    state.token = "";
    localStorage.removeItem(LS_TOKEN);
    showGate("");
  }

  $("g-go").addEventListener("click", function () {
    var v = $("g-token").value.trim();
    if (!v) return;
    state.token = v;
    localStorage.setItem(LS_TOKEN, v);
    hideGate();
    boot();
  });
  $("g-token").addEventListener("keydown", function (e) { if (e.key === "Enter") $("g-go").click(); });
  $("signout").addEventListener("click", signOut);
  $("refresh").addEventListener("click", function () { fetchAll().catch(handleErr); });
  $("newbtn").addEventListener("click", openCreate);
  $("projsel").addEventListener("change", function () {
    state.project = $("projsel").value;
    localStorage.setItem(LS_PROJECT, state.project);
    fetchAll().catch(handleErr);
  });
  $("lang-de").addEventListener("click", function () { setLang("de"); });
  $("lang-en").addEventListener("click", function () { setLang("en"); });
  function setLang(l) { state.lang = l; localStorage.setItem(LS_LANG, l); applyChrome(); applyGateStrings(); render(); }

  function boot() {
    loadMe().then(loadProjects).then(fetchAll).catch(handleErr);
  }

  function loadMe() {
    return api("/whoami").then(function (w) {
      state.me = { scopes: (w && w.scopes) || [], actor: (w && w.actor) || "" };
      if (state.me.scopes.indexOf("read") === -1) { showGate(t().gateNoRead); throw new Error("no read scope"); }
      applyChrome();
    });
  }

  function loadProjects() {
    return api("/projects").then(function (projects) {
      var sel = clear($("projsel"));
      sel.appendChild(el("option", null, t().allProjects)).value = "";
      (projects || []).forEach(function (p) {
        var o = el("option", null, p.name || p.id);
        o.value = p.id;
        sel.appendChild(o);
      });
      if (state.project) sel.value = state.project;
    }).catch(function () {});
  }

  function fetchAll() {
    var q = state.project ? "?project=" + encodeURIComponent(state.project) : "";
    return api("/schedules" + q).then(function (body) {
      var rows = (body && body.schedules) || [];
      // The detail view is what carries the occurrence history, so fetch it per
      // row. Bounded by the per-project cap (50), and the list is the page — a
      // second round trip per row is cheaper than a bespoke list shape.
      return Promise.all(rows.map(function (s) {
        return api("/schedules/" + encodeURIComponent(s.id) + "?occurrences=" + STRIP)
          .then(function (full) { return full || s; })
          .catch(function () { return s; });
      }));
    }).then(function (full) {
      state.schedules = full;
      render();
    });
  }

  // ---- render ----------------------------------------------------------------

  function render() {
    var wrap = clear($("wrap"));
    var pending = state.schedules.filter(function (s) { return s.status === "pending"; });
    var active = state.schedules.filter(function (s) { return s.status === "active"; });
    var stopped = state.schedules.filter(function (s) { return ["paused", "rejected", "retired"].indexOf(s.status) !== -1; });

    var badge = $("pendbadge");
    badge.textContent = String(pending.length);
    badge.className = pending.length ? "badge" : "badge zero";

    if (!state.schedules.length) {
      wrap.appendChild(el("div", "empty", t().emptyAll));
      return;
    }
    if (pending.length) wrap.appendChild(bannerNode());
    group(wrap, t().groupPending, pending);
    group(wrap, t().groupActive, active);
    group(wrap, t().groupStopped, stopped);
  }

  function bannerNode() {
    var b = el("div", "banner");
    b.appendChild(el("span", null, "●"));
    b.appendChild(el("span", null, t().bannerPending));
    return b;
  }

  function group(wrap, title, rows) {
    if (!rows.length) return;
    var head = el("div", "grouphead");
    head.appendChild(el("span", null, title));
    head.appendChild(el("span", "ct", String(rows.length)));
    wrap.appendChild(head);
    rows.forEach(function (s) { wrap.appendChild(scheduleNode(s)); });
  }

  function statusLabel(s) {
    return s === "pending" ? t().statusPending
      : s === "active" ? t().statusActive
      : s === "paused" ? t().statusPaused
      : s === "rejected" ? t().statusRejected
      : t().statusRetired;
  }

  function scheduleNode(s) {
    var terminal = s.status === "rejected" || s.status === "retired";
    var card = el("div", "scard" + (s.status === "pending" ? " pend" : "") + (s.status === "paused" || terminal ? " off" : ""));

    var top = el("div", "stop");
    var idbox = el("div");
    idbox.appendChild(el("div", "nm", s.name));
    idbox.appendChild(el("div", "sub", cadenceText(s.cadence)));
    top.appendChild(idbox);
    top.appendChild(el("span", "grow"));
    top.appendChild(el("span", s.status === "active" ? "chip" : "chip flat", statusLabel(s.status)));
    top.appendChild(actionsNode(s));
    card.appendChild(top);

    if (s.rationale) card.appendChild(el("p", "why", "“" + s.rationale + "”"));
    if (s.cadence_error) card.appendChild(el("p", "why", s.cadence_error));

    // On a proposal, show the ticket it would create — title, and the body
    // rendered the way the board would render it. Approving a cadence without
    // seeing its ticket is approving a name.
    if (s.status === "pending" && s.template) {
      var prev = el("div", "tprev");
      prev.appendChild(el("div", "tprev-title", s.template.title || ""));
      if (s.template.body) prev.appendChild(mdNode(s.template.body, "tprev-body"));
      card.appendChild(prev);
    }

    var occ = (s.occurrences || []).slice(0, STRIP);
    if (occ.length) {
      // Newest-first from the API; the strip reads left-to-right in time, so
      // reverse it — "now" belongs on the right, where the eye ends up.
      var strip = el("div", "lin");
      occ.slice().reverse().forEach(function (o) { strip.appendChild(occNode(o, s)); });
      card.appendChild(strip);
      var axis = el("div", "linaxis");
      axis.appendChild(el("span", null, t().nowArrow));
      card.appendChild(axis);
    }

    card.appendChild(footNode(s, occ));
    return card;
  }

  function occNode(o, s) {
    var cell = el("button", "lc " + (o.outcome || "open"));
    cell.type = "button";
    cell.title = o.title + " · " + o.ticket;
    cell.appendChild(el("span", "ls", slotLabel(o.slot, s.cadence && s.cadence.every)));
    cell.appendChild(el("span", "lo", outcomeLabel(o.outcome)));
    cell.appendChild(el("span", "lw", o.claimed_by || o.ticket));
    cell.addEventListener("click", function () { window.location.href = "/board#t=" + encodeURIComponent(o.ticket); });
    return cell;
  }

  function footNode(s, occ) {
    var foot = el("div", "sfoot");
    if (occ.length) {
      var done = occ.filter(function (o) { return o.outcome === "done"; }).length;
      var nf = occ.filter(function (o) { return o.outcome === "not_fulfilled"; }).length;
      var tal = el("span", null, t().lastN + " " + occ.length + " — ");
      var d = el("b", "tal-done", done + " " + t().outDone);
      tal.appendChild(d);
      if (nf) {
        tal.appendChild(el("span", null, " · "));
        tal.appendChild(el("b", "tal-nf", nf + " " + t().outNf));
      }
      foot.appendChild(tal);
    } else {
      foot.appendChild(el("span", null, t().neverFired));
    }
    foot.appendChild(el("span", "grow"));
    if (s.proposed_by) foot.appendChild(el("span", null, t().proposedBy + " " + s.proposed_by));
    if (s.next_slot) foot.appendChild(el("span", null, t().nextAt + " " + fmtWhen(s.next_slot)));
    else if (s.status === "paused") foot.appendChild(el("span", null, t().noneScheduled));
    return foot;
  }

  function actionsNode(s) {
    var box = el("div", "acts");
    function act(labelKey, path, opts) {
      var b = el("button", opts && opts.cls, t()[labelKey]);
      b.disabled = !!state.busy[s.id];
      b.addEventListener("click", function () {
        if (!isHuman()) { toast(t().needHuman, "bad"); return; }
        if (opts && opts.confirmKey && !window.confirm(t()[opts.confirmKey])) return;
        run(s, path, opts && opts.method);
      });
      box.appendChild(b);
    }
    if (s.status === "pending") {
      act("actReject", "/reject", { cls: "danger", confirmKey: "confirmReject" });
      act("actActivate", "/activate", { cls: "primary" });
    } else if (s.status === "active") {
      act("actRun", "/run", {});
      act("actPause", "/pause", {});
    } else if (s.status === "paused") {
      act("actResume", "/resume", { cls: "primary" });
    }
    act("actDelete", "", { cls: "danger", method: "DELETE", confirmKey: "confirmDelete" });
    return box;
  }

  function run(s, suffix, method) {
    state.busy[s.id] = true;
    render();
    api("/schedules/" + encodeURIComponent(s.id) + suffix, { method: method || "POST", body: method === "DELETE" ? undefined : "{}" })
      .then(function (body) {
        if (method === "DELETE") toast(t().deleted);
        else if (suffix === "/run") toast(body && body.created ? t().ranNew + " " + body.ticket : t().ranNothing);
        else toast(t().saved);
      })
      .catch(handleErr)
      .then(function () {
        delete state.busy[s.id];
        return fetchAll().catch(handleErr);
      });
  }

  // ---- create ----------------------------------------------------------------

  function openCreate() {
    if (!isHuman() && !canWrite()) { toast(t().needHuman, "bad"); return; }
    var form = { every: "week", interval: 1, on: ["mon"], day: 1, at: "09:00", tz: guessTz() };
    var root = clear($("modal-root"));
    var back = el("div", "backdrop");
    var modal = el("div", "modal");

    var head = el("div", "mhead");
    head.appendChild(el("h2", null, t().newSchedule));
    head.appendChild(el("p", null, t().newSub));
    modal.appendChild(head);

    var body = el("div", "mbody");
    var name = field(body, t().fName, "input", t().fNamePh);
    var projRow = el("div", "frow");
    body.appendChild(projRow);

    var unitSel = document.createElement("select");
    UNITS.forEach(function (u) {
      var o = el("option", null, u === "day" ? t().unitDay : u === "week" ? t().unitWeek : t().unitMonth);
      o.value = u;
      unitSel.appendChild(o);
    });
    unitSel.value = form.every;
    wrapField(projRow, t().fEvery, unitSel);

    var interval = document.createElement("input");
    interval.type = "number"; interval.min = "1"; interval.max = "52"; interval.value = "1";
    wrapField(projRow, t().fInterval, interval);

    var at = document.createElement("input");
    at.type = "time"; at.value = form.at; at.step = "60";
    wrapField(projRow, t().fAt, at);

    var daysFld = el("div", "fld");
    daysFld.appendChild(el("label", null, t().fDays));
    var daysBox = el("div", "days");
    DAYS.forEach(function (d) {
      var chip = el("span", form.on.indexOf(d) !== -1 ? "on" : null, d);
      chip.addEventListener("click", function () {
        var i = form.on.indexOf(d);
        if (i === -1) form.on.push(d); else form.on.splice(i, 1);
        chip.className = form.on.indexOf(d) !== -1 ? "on" : "";
      });
      daysBox.appendChild(chip);
    });
    daysFld.appendChild(daysBox);
    body.appendChild(daysFld);

    var domFld = el("div", "fld");
    domFld.appendChild(el("label", null, t().fDayOfMonth));
    var dom = document.createElement("input");
    dom.type = "number"; dom.min = "1"; dom.max = "31"; dom.value = "1";
    domFld.appendChild(dom);
    body.appendChild(domFld);

    var tz = field(body, t().fTz, "input", "Europe/Berlin");
    tz.value = form.tz;

    var title = field(body, t().fTitle, "input", t().fTitlePh);
    body.appendChild(el("div", "preview", t().fTitleHint));
    var bodyIn = field(body, t().fBody, "textarea", "");
    var labels = field(body, t().fLabels, "input", t().fLabelsPh);
    var rationale = field(body, t().fRationale, "textarea", t().fRationalePh);
    var err = el("div", "merr");
    body.appendChild(err);
    modal.appendChild(body);

    function syncUnit() {
      daysFld.style.display = unitSel.value === "week" ? "" : "none";
      domFld.style.display = unitSel.value === "month" ? "" : "none";
    }
    unitSel.addEventListener("change", syncUnit);
    syncUnit();

    var foot = el("div", "mfoot");
    var cancel = el("button", null, t().cancel);
    cancel.addEventListener("click", function () { clear(root); });
    var submit = el("button", "primary", t().create);
    submit.addEventListener("click", function () {
      var cadence = { every: unitSel.value, at: at.value, tz: tz.value.trim() || "UTC" };
      var iv = parseInt(interval.value, 10);
      if (iv > 1) cadence.interval = iv;
      if (unitSel.value === "week") {
        if (!form.on.length) { err.textContent = t().pickDay; return; }
        cadence.on = form.on.slice();
      }
      if (unitSel.value === "month") cadence.day = parseInt(dom.value, 10);
      var payload = {
        project: state.project || ($("projsel").options.length > 1 ? $("projsel").options[1].value : ""),
        name: name.value.trim(),
        cadence: cadence,
        template: { title: title.value.trim() }
      };
      if (bodyIn.value.trim()) payload.template.body = bodyIn.value.trim();
      var ls = splitList(labels.value);
      if (ls.length) payload.template.labels = ls;
      if (rationale.value.trim()) payload.rationale = rationale.value.trim();
      submit.disabled = true;
      err.textContent = "";
      api("/schedules", { method: "POST", body: JSON.stringify(payload) })
        .then(function (created) {
          clear(root);
          toast(created && created.status === "pending" ? t().pendingCreated : t().created);
          return fetchAll();
        })
        .catch(function (e) {
          submit.disabled = false;
          err.textContent = (e && e.message) || String(e);
        });
    });
    foot.appendChild(cancel);
    foot.appendChild(submit);
    modal.appendChild(foot);

    back.appendChild(modal);
    back.addEventListener("click", function (e) { if (e.target === back) clear(root); });
    root.appendChild(back);
    name.focus();
  }

  function canWrite() { return state.me.scopes.indexOf("write") !== -1; }

  function guessTz() {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; }
    catch (e) { return "UTC"; }
  }

  function wrapField(row, label, input) {
    var f = el("div", "fld");
    f.appendChild(el("label", null, label));
    f.appendChild(input);
    row.appendChild(f);
    return input;
  }

  function field(parent, label, tag, placeholder) {
    var f = el("div", "fld");
    f.appendChild(el("label", null, label));
    var input = document.createElement(tag);
    if (placeholder) input.placeholder = placeholder;
    f.appendChild(input);
    parent.appendChild(f);
    return input;
  }

  function applyChrome() {
    $("brand").innerHTML = LOGO + '<span>takomo</span>';
    $("gate-brand").innerHTML = LOGO;
    $("nav-board").textContent = t().board;
    $("nav-inbox").textContent = t().inbox;
    $("nav-init").textContent = t().initiatives;
    // The pill carries a badge child, so only its first text node is replaced —
    // setting textContent would delete the badge element with it.
    $("nav-sched").firstChild.textContent = t().schedules;
    $("newbtn").textContent = "+ " + t().newSchedule;
    $("lang-de").className = state.lang === "de" ? "on" : "";
    $("lang-en").className = state.lang === "en" ? "on" : "";
  }

  applyChrome(); applyGateStrings();
  if (state.token) { hideGate(); boot(); } else { showGate(""); }

  // <<SPA_COMMON>> — src/spa-common.js is inlined here when the response is built (src/api/mod.rs). Last line on purpose: appending keeps every line number above it.
})();
</script>
</body>
</html>
