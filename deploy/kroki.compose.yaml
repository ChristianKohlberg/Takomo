# Private rendering service for a Takomo process on this host.
# docker compose -f deploy/kroki.compose.yaml up -d
# See docs/diagrams.md before connecting a remote Takomo process.
services:
  kroki:
    image: yuzutech/kroki:0.32.1@sha256:6980bfb218b48b74ea14b888d9c7e8c032d1cb6325f3292277abdf62483abd9d
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8000"
    environment:
      KROKI_SAFE_MODE: SECURE
      KROKI_PLANTUML_SECURITY_PROFILE: SANDBOX
      # Kroki's SECURE mode does not sandbox D2. Do not let D2 fetch icons/images.
      # Takomo also rejects D2 imports before sending source to this service.
      D2_BUNDLE: "false"
      KROKI_MERMAID_HOST: mermaid
      KROKI_COMMAND_TIMEOUT: 8s
      KROKI_CONVERT_TIMEOUT: 8s
      KROKI_DELEGATE_TIMEOUT_MS: "9000"
      KROKI_DELEGATE_MAX_POOL_SIZE: "4"
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    depends_on:
      - mermaid
    networks:
      - gateway
      - renderers
  mermaid:
    image: yuzutech/kroki-mermaid:0.32.1@sha256:ad6721646aabfb8b5f5005db2daa6e37189c25e18aab19a8ef8590b6171cd192
    restart: unless-stopped
    environment:
      KROKI_MERMAID_MAX_CONCURRENCY: "4"
      KROKI_MERMAID_CONVERT_TIMEOUT: "8000"
      KROKI_MERMAID_PROTOCOL_TIMEOUT: "8000"
      KROKI_MERMAID_MAX_TEXT_SIZE: "50000"
    mem_limit: 1g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    networks:
      - renderers
networks:
  gateway: {}
  renderers:
    internal: true
