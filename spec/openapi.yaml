  # -- schedules: recurrence rules that materialize ordinary tickets --
  validation.schedule.cadence: "the recurrence rule is unusable. The message names every problem at once, and a cron-shaped string is answered with its declarative equivalent rather than parsed."
  validation.schedule.template: "the ticket template a schedule stamps out is unusable. parent and blocked_by are refused on purpose — an occurrence that inherited a dependency would stop being independent of its siblings."
  validation.schedule.name: "a schedule needs a non-blank name of at most 300 characters."
  validation.schedule.window: "ends_at must be after starts_at."
  validation.schedule.instant: "a timestamp field was neither RFC 3339 nor unix milliseconds."
  validation.schedule.status: "the status filter is not one of pending, active, paused, rejected, retired."
  validation.schedule.approval: "the schedule-approval setting takes a boolean `required`."
  validation.schedule.too_many: "the project is at its cap of pending/active/paused schedules. Delete or reject one first."
  validation.expired: "the `expired` ticket filter takes true or false."
  notfound.schedule: "no schedule with that id exists. `GET /v1/schedules?project=<p>` lists them."
  conflict.schedule.status: "the schedule cannot move to that status from the one it is in. The message names the legal moves; rejected and retired are terminal."
  # -- bearer tokens (tk_): authentication, scopes, project allowlist, budget --
  auth.missing: "no Authorization header. Every /v1 and /mcp call needs `Bearer tk_...`; only /healthz is open."
  auth.invalid: "the bearer token is not recognised, was revoked, or has expired. Mint a fresh one with `takomo token create`."
  auth.scope: "the token authenticates but does not carry the scope this operation requires. The message names the missing scope and the ones the token holds."
  auth.project: "the token is restricted to a project allowlist that does not cover the project addressed."
  rate.limited: "the token's sliding-window write budget is spent. Reads are not charged and keep working; `Retry-After` says how long to wait."

  # -- share tokens (tks_): read-only, /v1/shares/self only -------------------
  share.missing: "no share token. A shared link carries it in the URL fragment (#s=...), which browsers never send — the page reads it and sends it as the bearer."
  share.invalid: "the share token is not recognised. The link is mistyped, or the share was revoked."
  share.expired: "the share existed but its window has closed. Ask the owner for a fresh link."
  share.rate_limited: "one link has made more requests in the last minute than viewing a board takes, so it is being throttled. The budget is per link and shared by everyone holding it."
  share.kind: "`kind` on share creation must be `project` (a whole project) or `epic` (a ticket plus its descendant subtree)."
  share.ttl: "`ttl_seconds` on share creation must be a positive integer no larger than the 30-day maximum."
  share.kind_unrecognized: "the share's stored scope kind is neither `project` nor `subtree`, so it cannot be served. The share is refused rather than widened to a scope it may not cover."
  share.not_owner: "only the share's creator, or an admin, may revoke it."

  # -- answer grants (tka_): one question, one answer, then spent -------------
  answer.missing: "no answer-link token. An answer link carries it in the URL fragment (#a=...)."
  answer.invalid: "the answer-link token is not recognised. The link is mistyped, or the grant was revoked."
  answer.expired: "the answer link existed but its window has closed. Ask for a fresh one."
  answer.project: "the grant's stored project does not match the question it references. The link is refused rather than served under the wrong scope."
  answer_link.spent: "the grant is single-use and has already been spent. Nothing was recorded for this attempt; the answer already on the question stands."
  answer_link.ttl: "`ttl_seconds` on answer-link creation must be a positive integer no larger than the 30-day maximum — the link is a credential handed outside the org."
  answer_link.not_owner: "only the link's creator, or an admin, may revoke it."

  # -- claims and leases ------------------------------------------------------
  # Family: lease_and_fence — see `src/error_codes.rs` and `x-error-code-families`.
  # Eight codes, one concept: who may mutate a claimed ticket, and whether the
  # caller's fence still matches the lease. All ride 409 unless a scope check
  # runs first on a transition (403 `transition.scope` wins over fence.required).
  claim.held: "the ticket is already claimed by someone else, until the time the message states. Only the lease holder may mutate it: comment instead, pick different work, or wait for the lease to expire."
  claim.none: "the ticket holds no claim and no lapsed one, so there is nothing to release or force-release."
  claim.state: "the ticket's state is not claimable in this project's workflow. The message lists the claimable states and the route back to one."
  claim.blocked: "the ticket has open blockers, so it never enters the ready queue. Finish or cancel the blockers first."
  claim.epic_held: "the ticket sits under an epic someone else has claimed, which reserves the whole subtree for that holder. Check the claim's age and movement with GET /v1/tickets/{epic}/claim; if it looks abandoned, an admin can force-release the epic."
  claim.children_held: "the epic cannot be claimed while other workers hold live claims inside its subtree — the reservation never displaces a lease already granted. Wait, coordinate, or (admin) force-release the listed claims."
  fence.required: "the ticket is claimed by you and this call mutates it, so it must echo the lease's fencing token. Send the `fence` from the claim or heartbeat response. Distinct from fence.stale: your lease is still live — you omitted the token."
  fence.stale: "the fence presented was superseded by a later claim, or the lease is simply gone. Stop writing — work in flight may duplicate another worker's. Re-claim if the work is still yours. Distinct from fence.invalid: this value was issued once and is now stale."
  fence.invalid: "the fence presented is higher than any this ticket has reached, so it was never issued. A client bug: the value was fabricated, hand-incremented, or belongs to another ticket. Distinct from fence.stale: the store never issued this number."
  heartbeat.no_lease: "no active lease of yours on this ticket, so there is nothing to renew. Claim it first, then heartbeat before the `expires_at` you were given."
  release.no_lease: "no active lease of yours on this ticket to release. Pass an explicit fence to release one anyway."

  # -- optimistic concurrency, on whole-body replacement only -----------------
  conflict.if_match_required: "replacing `body` needs `If-Match: \"<version>\"`, the value of the ticket's ETag. Field sets and `metadata_merge` never need it."
  conflict.idempotency_key: "this `Idempotency-Key` was already used with a different request body. Use a fresh key for a different write, or retry with the same body."
  conflict.version: "the `If-Match` version is not the current one, so the body changed since you read it. Re-read the ticket, re-apply your edit to the fresh body, retry."

  # -- workflow transitions ---------------------------------------------------
  transition.illegal: "no transition from the ticket's state to the one requested exists in this project's workflow. `allowed_transitions` on the error lists the legal moves."
  transition.unknown_state: "the target state requested does not exist in this project's workflow at all."
  transition.claim_required: "the transition carries `requires: [claim]` and you hold no lease. `details.claimable_states` says where a lease may be taken; `details.reentry_states` is the route back when the current state is not one of them."
  transition.scope: "the transition carries a `requires: [scope:<s>]` authorisation gate — human approval, typically — and the token lacks that scope. Not a workflow mistake."
  transition.guard: "a `requires: [guard:<id>]` on the transition is unsatisfied. `details.guard` names it and `details.offending_tickets` the children or blockers in the way."
  transition.requirements: "the transition's requirements are unmet and no more specific code applies."
  transition.no_target: "an MCP convenience tool (`takomo_start`, `takomo_done`, …) found no legal transition into the state category it aims for. Pass an explicit `to`."
  patch.state_not_patchable: "`state` is workflow-controlled and cannot be set by PATCH. Use POST /tickets/{id}/transition, which validates the move and reports the legal ones."

  # -- ask-a-human ------------------------------------------------------------
  question.not_open: "the question is not open, so there is nothing to answer — or nothing to answer again."
  question.not_answered: "only an answered question can be reopened."
  question.not_awaiting_reply: "the question is not waiting on an agent reply; it is the human's turn. Reply only after a human asks for more."
  question.no_park: "a blocking question has to park its ticket, and the ticket's state has no self-service transition into a blocked one. Move it to a blocked state first, ask from an in-progress state, or use `mode=advisory`."
  question.no_resume: "no transition out of the parked state can resume the ticket automatically: every exit is gated by a claim, a guard, or a scope this token lacks, or leads only to a terminal or blocked state. The answer is still recorded."
  question.resume_claim: "the resume edge requires an active claim, which nobody holds while a question is open. Choose a `resume_to` that is not claim-gated, or claim the ticket and transition it normally."
  question.resume_guard: "the resume edge is guarded. Satisfy the guard and transition explicitly; the recorded answer stays on the ticket."
  question.answer_scope: "resuming into the chosen state needs a scope the answerer's token lacks. Have someone holding it answer, or pass a `resume_to` this token can reach."
  question.approve_expertise: "approving is gated, and this caller holds neither key. Two things can approve an `approve`: a matching `expert:<tag>` scope, or being the person the question is addressed to (a token bound to them with `user`). The same pair governs reopening one, and minting an answer link for one — where being the assignee means minting your OWN link, since whoever holds the link can spend it. `admin` is not a substitute for either; you can only delegate authority you hold."
  validation.assignee: "`assignee` must be a user handle (or `usr-` id) to address the question to, or null to return it to the open queue. A missing field is refused rather than guessed at."
  question.reopen_archived: "the ticket is archived, so the answer is settled. Re-ask instead of reopening."
  question.reopen_claimed: "a worker holds the ticket and is relying on the answer, so it cannot be reversed. Reopen only while the ticket is free."
  question.reopen_moved: "the ticket has moved on since the answer resumed it, so the answer is already in use. Re-ask if you need a new decision."
  question.reopen_no_park: "this project's workflow has no blocked state to re-park the ticket into. Move it by hand and re-ask."

  # -- projects, workflows, tokens, tags --------------------------------------
  project.id: "the project id is invalid. It becomes the ticket-id prefix, so it must match ^[a-z][a-z0-9-]{1,15}$."
  project.exists: "a project with that id already exists."
  project.active_claims: "the project has tickets under a live lease, and archiving or deleting it would yank work out from under a worker. Wait for the leases, or re-issue with `?force=true`."
  project.archived: "the project is archived, so it accepts no writes at all — this is a gate a human lifts, not a transient failure. Do NOT retry: read what you need (reads are unaffected) and move on, or ask an admin to POST /projects/{project}/unarchive."
  project.claim_ttl: "a claim-TTL setting is not a positive number of seconds, or the default exceeds the maximum — which would clamp every claim, so no claim would get the default set. Send null to fall back to the built-in bounds."
  project.answer_link_ttl: "`answer_link_ttl_seconds` must be a positive number of seconds no larger than the 30-day maximum, the same bound an explicit `ttl_seconds` carries."
  project.style_guide_too_long: "the project style guide is over its character limit. It rides along on every work-loop response, so it holds the few conventions that change how an agent writes; anything longer belongs in a ticket or repo docs."
  workflow.parse: "the workflow document does not match the expected shape. `name`, `initial`, `states` (id and category each) and `transitions` (from and to each) are required; see spec/workflow-format.md."
  workflow.invalid: "the workflow parsed but is not a usable state machine — an unreachable state, a transition to a state that does not exist, no terminal state. The message lists every problem found."
  workflow.missing: "`workflow` is required: the state machine document to save. See spec/workflow-format.md."
  workflow.name: "`name` must be 1-100 characters. It is how the workflow is chosen from the library, so it has to be typed by a human."
  workflow.name_taken: "a workflow with that name already exists in the library. Pick another name, or edit the existing entry."
  workflow.name_reserved: "the name belongs to a workflow this server ships. Those rows are reseeded on every start, so an entry using the name would be silently overwritten — pick another."
  workflow.builtin: "the workflow ships with the server and is reseeded on every start, so editing or deleting it through the API would be undone at the next restart. Copy it under a new name and change the copy."
  layout.missing: "`layout` is required: an object mapping each state id to an x/y position."
  notfound.workflow: "no library entry with that id. List them with GET /v1/workflows; a project's own workflow lives at GET /v1/projects/{project}/workflow instead."
  token.actor: "`actor` must be non-empty and at most 200 characters. It is who the token acts as, and it lands in the event log."
  token.scopes: "`scopes` is required and must be a non-empty array of strings, e.g. [\"read\", \"write\"]."
  token.projects: "`projects` must be an array of project ids, or the string \"*\" for all of them — never an empty array."
  token.rate_limit: "`rate_limit`, in writes per minute, must be a positive integer."
  token.expires_seconds: "`expires_seconds` must be a positive integer number of seconds."
  tag.exists: "that `kind:handle` is already registered in the project. PATCH the tag to change its label or meta."
  answer.relay_self: "the relaying actor is the one that ASKED this question, so it cannot also relay the answer. Relaying records a decision a human made; relaying your own question would let an agent request approval and grant it to itself. Have the human answer it, or relay from an actor that did not ask it."
  answer.relay_approve: "an 'approve' question is never relayable. It is gated precisely so the answer is evidence that the authority was exercised, and a relayed name is a claim about who decided rather than proof of it — which is also why a relaying credential's own `user` binding does not unlock the assignee route. Answer it from a token holding the expert scope or bound to the named person, or mint that person a single-use answer link."
  answer.relay_redundant: "this token holds the 'human' scope, so it should answer as itself rather than relay — drop 'on_behalf_of'. Relaying exists for a caller that cannot answer, and a human relaying would make 'answered_by' a claim instead of a fact."
  answer.relay_actor: "'on_behalf_of' must name the human who made the decision — it is what 'answered_by' records and what a later reader will hold someone to. Empty or whitespace would file the decision under nobody."
  tag.too_many: "too many tag references in one request, or the patch would leave the ticket over the cap. `details` carries `count` and `max`. Send fewer, or use `tags` to replace the whole set with one under the limit. The cap exists because attaching tags is per-reference work inside the single-writer transaction every claim and transition waits on."

  # -- initiatives: the collection an idea accumulates ------------------------
  initiative.attachment_too_large: "the decoded attachment is over the 5 MiB per-entry cap; `details` carries `bytes` and `max_bytes`. The bytes are written with the process-wide write mutex held, so this cap is how long one upload may make every claim and transition wait — a latency bound, not a storage one. Host anything larger elsewhere and reference it with `source_uri`."
  initiative.too_large: "this entry would take the initiative over its 1 GiB total; `details` carries the current size, the size it would reach, and the cap. Unlike the per-attachment cap this one costs no request any latency — it bounds accumulation, because the store is one SQLite file someone has to back up. Reference large documents instead of storing them, or distil the initiative and open a fresh one."
  initiative.too_many_entries: "the initiative already holds the maximum number of entries. One this full has outgrown being a single idea: distil it into tickets, mark it `distilled`, and start a new one for what remains an idea."
  initiative.no_attachment: "the entry exists but is text-only, so there are no bytes to download. Its text is already in the entry list; only entries with `has_content: true` have an attachment."

  # -- missing entities. `notfound.<kind>` names the kind the handler looked ---
  # -- for, so this family grows with the addressable kinds. -------------------
  notfound.ticket: "no ticket with that id."
  notfound.project: "no project with that id. GET /projects lists them."
  notfound.epic: "the `epic` filter names no epic of that project — it may be a typo, a ticket in another project, or a ticket that is not of type `epic`. `GET /projects/{project}/roadmap` with no filter lists the epics."
  notfound.question: "no question with that id."
  notfound.token: "no token with that id."
  notfound.tag: "no tag with that `kind:handle` in the project."
  notfound.user: "nobody in the directory with that handle or `usr-` id. `GET /v1/users` lists the people; a user is never created implicitly, because a directory that grows from a typo makes the typo assignable."
  notfound.membership: "that person is not a member of that project, so there is no membership to remove."
  notfound.share: "no share with that id."
  notfound.answer-link: "no answer-link grant with that id."
  notfound.initiative: "no initiative with that id. GET /v1/initiatives lists them; the id shape is `ini-…`."
  notfound.mindmap: "no mindmap with that id. GET /v1/mindmaps lists them; the id shape is `mm-…`."
  notfound.mindmap_node: "no node with that id on that mindmap. The pair is the address — a node id from another map is not reachable here."
  notfound.initiative_entry: "no entry with that id on that initiative. The pair is the address — an entry id from a different initiative is not reachable here."

  # -- rejected input. `validation.<field-or-concept>`: 400 when the request ---
  # -- is malformed, 422 when it is well-formed but unacceptable. --------------
  validation.json: "the request body is not valid JSON, or was sent without `Content-Type: application/json`."
  validation.body_json: "the request body parsed, but is not a JSON object."
  validation.unknown_field: "the body carries field names this endpoint does not accept. The message lists the unknown ones and the accepted set — a typo is refused, never silently dropped."
  validation.field_required: "a required field is absent. The message names it."
  validation.field_type: "a field is present with the wrong JSON type. The message names the field and the type expected."
  validation.query: "a query parameter is missing, or is not the type expected."
  validation.cursor: "the pagination cursor is not one this endpoint issued. Pass the exact `next_cursor` from the previous page."
  validation.if_match: "the `If-Match` header is not a ticket version as returned in the ETag, e.g. `If-Match: \"7\"`."
  validation.idempotency_key: "the `Idempotency-Key` header is over its 128-character limit."
  validation.empty_patch: "the patch contains no changes. Send at least one settable field."
  validation.no_changes: "the request asks for no change at all — an empty tag add and remove, or a tag patch with neither `label` nor `meta_merge`."
  validation.title: "the title is empty, or over its length limit."
  validation.body: "the body is over its byte limit."
  validation.comment: "the comment body is empty, or over its byte limit."
  validation.type: "the ticket type is not one of the known values."
  validation.priority: "the priority is not one of the known values."
  validation.label: "a label is empty, or over its length limit."
  validation.state: "tickets are created in the workflow's initial state, and another was requested. Create the ticket, then transition it."
  validation.project: "the project named does not exist."
  validation.project_required: "this endpoint needs an explicit `project` query parameter."
  validation.parent: "the parent ticket does not exist, or belongs to a different project — parent and child must share one."
  validation.tickets: "POST /v1/tickets/move needs a non-empty 'tickets' array. An epic id there moves its whole subtree unless descendants is false."
  validation.descendants: "the 'descendants' field of a move must be a boolean: true (the default) moves each named ticket's subtree, false moves only the named tickets and orphans their children."
  validation.move_too_large: "the move covers more tickets than one call may touch (500), because it holds the write lock every claim queues behind. Split it — name the child epics one at a time — or move the root alone with descendants:false and re-file its children."
  validation.parent_cycle: "setting that parent would make the ticket tree cyclic."
  validation.blocked_by: "a `blocked_by` entry names a ticket that does not exist."
  validation.dep_cycle: "adding that dependency would create a cycle — the would-be blocker already depends on this ticket, directly or transitively."
  validation.links: "`links` must be a JSON object of string values, with null to delete a key."
  validation.links_size: "the serialized `links` object exceeds its byte cap. Trim values or delete unused keys (set them to null)."
  validation.metadata: "`metadata` must be a JSON object with namespaced keys, e.g. `myagent.run_id`."
  validation.metadata_merge: "`metadata_merge` must be a JSON object (RFC 7386 merge-patch; null deletes a key)."
  validation.metadata_size: "serialized `metadata` is over its cap. Trim keys by setting them to null via `metadata_merge`, or move bulk content into the body or a comment."
  validation.include: "an `include=` value is not one this endpoint offers. The message lists the valid ones."
  validation.include_archived: "`include_archived` must be true or false."
  validation.archived: "the `archived` filter must be one of `only`, `all`, `active`."
  validation.transitive: "`transitive` must be true or false."
  validation.direction: "the dependency `direction` must be one of `blocked_by`, `blocks`, `both`."
  validation.target: "a promotion needs a non-empty `target` — the stage the work reached, e.g. staging, production."
  validation.promotion: "a promotion field is over its byte limit."
  validation.ttl: "`ttl_seconds` on a claim is outside this project's bounds. An admin can change them with PUT /projects/{id}/claim-ttl."
  validation.kind: "the question kind is not one of the four, or the operation asked for something that kind does not carry — only a `choose` question has options."
  validation.mode: "the question mode must be `blocking`, which parks and resumes the ticket, or `advisory`, which is routed and recorded with no state change."
  validation.urgency: "the urgency is not one of the known values."
  validation.on_timeout: "`on_timeout` is not one of `recommended`, `escalate`, `cancel` — or is `cancel` on an advisory question, which gates nothing."
  validation.options: "`options` must be an array of strings, or of {value, desc} objects each carrying a string `value`. Always 422 — one status for this code across the ask and revise paths."
  validation.option_notes: "option descriptions must pair 1:1 with the options, and each stay within its length limit."
  validation.multi: "`multi` is only meaningful on a `choose` question."
  validation.recommended: "the recommendation is not among the options."
  validation.recommended_multi: "a `recommended_multi` entry is not among the options."
  validation.recommended_note: "`recommended_note` must be a string, or null to clear it, within its length limit."
  validation.confidence: "`confidence` must be an integer 1-4 — 1 tentative, 2 moderate, 3 strong, 4 very strong."
  validation.expertise: "too many expertise tags, or one outside its length bounds."
  validation.summary: "`summary` is over its length limit."
  validation.answer: "the answer does not fit the question's kind: a boolean for confirm and approve, an option string (an array when `multi`) for choose, text for clarify."
  validation.answer_required: "`answer` is required. A note goes inside it: {\"answer\": {\"value\": …, \"note\": \"…\"}}."
  validation.resume_to: "the `resume_to` requested is not a legal next state from where the ticket is parked. The message lists the legal targets."
  validation.message: "a follow-up message is empty, or over its byte limit."
  validation.reason: "the reason is over its byte limit."
  validation.tag_kind: "a tag kind must match ^[a-z][a-z0-9-]*$ within its length bound, e.g. person, component, team."
  validation.tag_handle: "a tag handle must match ^[a-z0-9][a-z0-9._-]*$ within its length bound. The display name goes in `label`."
  validation.tag_ref: "a tag reference must be `kind:handle`, e.g. `person:ada`. It names an entity in the project's tag registry."
  validation.tag_label: "a tag label is over its length limit."
  validation.tag_meta: "tag `meta`, or `meta_merge`, must be a JSON object."
  validation.tag_meta_size: "serialized tag `meta` is over its cap."

  # -- the people directory: who work can be addressed to ----------------------
  validation.user_handle: "a user handle must match ^[a-z0-9][a-z0-9._-]*$ within its length bound — deliberately the same rule as a tag handle, so `person:<handle>` stays a legal reference to that person. The real name goes in `name`."
  validation.user_name: "a display name is over its length limit."
  validation.user_email: "the email is over its length limit, or has no `@`. The check is shallow on purpose: takomo never sends mail, so the address is a note for a human reader. Send null to clear it."
  validation.user_meta: "user `meta`, or `meta_merge`, must be a JSON object."
  validation.user_meta_size: "serialized user `meta` is over its cap."
  user.exists: "someone already holds that handle. PATCH the person instead of adding a second row for them."
  user.disabled: "that person is disabled, so new work cannot be addressed to them and no credential can be bound to them. Their past answers and decisions are untouched. Re-enable them, or pick someone else."
  user.not_member: "that person is not a member of the project, so work there cannot be addressed to them. Membership says who may be handed work; it is separate from what their token may read or write."

  # -- initiatives and their entries ------------------------------------------
  # -- mindmaps: brainstorming, before any of it is an idea --------------------
  validation.mindmap_title: "a mindmap needs a title within its length bound — it is the root everything else hangs off."
  validation.mindmap_summary: "the summary is over its length limit. The long form belongs in an initiative, which is what a branch promotes into."
  validation.mindmap_status: "the status is not one of open | parked | distilled. A label an owner sets, not a workflow state, so nothing gates the order."
  validation.mindmap_metadata: "`metadata_merge` must be a JSON object (keys set to null are removed)."
  validation.mindmap_node_text: "the node is empty, or longer than the cap. A node is a sentence or two — that brevity is the method, not a limitation, so the refusal names the way out: shorten it, split it in two, or promote the branch to an initiative where the long form belongs."
  validation.mindmap_nodes: "the batch is empty, over the per-call cap, or an entry is not a {text, parent?, position?} object."
  validation.mindmap_parent: "`parent` must be a node id, or null to hang the node off the root. Absent leaves it where it is."
  validation.mindmap_at: "`at` needs both `x` and `y`, or null to hand the node back to the layout. Half a coordinate places nothing, so it is refused rather than guessed at."
  validation.mindmap_target: "the promotion target is not `epic` or `initiative`. The message names both and what each is for."
  mindmap.full: "the map is at its node cap. A brainstorm that big has stopped being one — promote its branches, or start a second map."
  mindmap.too_deep: "that would nest past the depth cap, where nobody can read the shape anyway. Promote the branch instead."
  mindmap.cycle: "that would hang a node off itself or off one of its own children, cutting the branch off the map. The drag that makes this easy to try is exactly why it is refused."
  mindmap.already_promoted: "that branch already became an epic or an initiative. Promoting again would make a second one from the same thought, indistinguishable from the first."
  notfound.mindmap_relationship: "no relationship with that id on that map. Relationships come back on GET /v1/mindmaps/{id} as `relationships`; one whose endpoints no longer exist is dropped on read rather than repaired, so a stale id from an older canvas is expected to miss."
  notfound.mindmap_attachment: "no attachment with that id on that node. The node and the attachment are the address together — an attachment id from another node is not reachable here. GET /v1/mindmaps/{id} lists each node's `attachments`."
  validation.mindmap_notes: "the node's `notes` are over the 8,000-character cap. Notes are the long form of one thought, not a document: at that length the branch wants to be an initiative, so promote it instead of stretching the node."
  validation.mindmap_node_kind: "`kind` is not one of thought | question | decision | screen | component. An enum rather than free text, so a map of a system can say what a box IS without a project inventing five spellings of the same word."
  validation.mindmap_node_origin: "`origin` is not `human` or `agent`. It records who put the node there so a trust lens over an agent-grown branch stays buildable; it is stored, never guessed."
  validation.mindmap_edge_label: "the label on the edge to this node's parent is over its length bound. It names one hierarchy edge in passing — the explanation belongs in the node's notes."
  validation.mindmap_rel_label: "the relationship's label is over its length bound. It is drawn along an edge on a canvas, so it has to stay a couple of words."
  validation.mindmap_relationship: "the relationship's two ends are the same node. An edge from a node to itself says nothing, and drawing one would only make the canvas harder to read — link two different nodes, or say it in the node's own text."
  validation.mindmap_icons: "`icons` must be an array of strings — short tokens, at most eight. Anything longer than a token belongs in the node's title or notes, which is what a reader actually reads."
  validation.mindmap_attachment: "the attachment is unusable: its `kind` is not one of pdf | code | table | diagram | audio | link, its `name` is empty, or `name`, `gist` or `ref` is over its cap. An attachment is a POINTER, never the bytes — the name is what somebody reads before deciding to follow it."
  mindmap.relationships_full: "the map is at its cap of 1,000 relationships. Past that the canvas is a graph nobody can read — split the map, or delete the cross-links that have stopped earning their place."
  mindmap.project_has_one: "that project already has a mindmap. A project holds ONE brainstorm, the way it holds one board — the refusal names the existing map, because the caller almost always wanted that one. Grow it, promote the branch that turned out to be its own subject, or delete the map first; deleting one is ordinary. The data model still allows several per project, so lifting this is a decision rather than a migration."
  mindmap.attachments_full: "the node is at its cap of 20 attachments. A node carrying more than that has become a folder; split it into two nodes, or promote the branch."
  validation.check_node: "the `node` on a check names no section of this project's plan. A check says which part of the plan it verifies, so the id has to be one of them \u2014 read the plan and use a section's node id, or leave `node` out for a check about no part in particular."
  conflict.collab_busy: "the project's archive state changed while this document was being opened, so the answer to \"may this be written\" could not be settled. Nothing is wrong with the document: open it again. Rare by construction \u2014 it takes three archive or unarchive commits during one open."
  conflict.collab_compaction_size: "compaction would not free anything, or would write a single row over the cap for one object. The document's content is simply that large \u2014 there is nothing to retry, and the flusher stops attempting it until an append succeeds or a minute passes. Never returned to an HTTP caller; compaction runs on the flusher, and this is a named contract rather than a silent skip."
  conflict.collab_compaction: "compaction was built from a log that has since grown, so replacing it would drop whatever was appended meanwhile. Nothing to do: the next flush compacts from a replica that has seen the new row. Never returned to an HTTP caller \u2014 compaction runs on the flusher, and this code exists so the refusal is a named contract rather than a silent skip."
  conflict.mindmap_archived: "the map is archived and cannot be written to. Not reachable today — a mindmap has no archive state, because throwing one away is ordinary and there is nothing between 'here' and 'gone' to freeze — but the code is published so adding that gate later stays a schema change and not a new error vocabulary."
  mindmap.too_many_peers: "that map already has the maximum number of live editors on its sync socket. Wait for somebody to close the map, then reconnect."
  mindmap.session_missing: "the map's sync socket was opened without a ticket. Mint one with POST /v1/mindmaps/{id}/session and pass it as `?ticket=`. A browser WebSocket cannot set an Authorization header, which is why the credential rides the query string — and why it is a short-lived, single-map ticket rather than your real token."
  mindmap.session_invalid: "that sync ticket is not recognized. It may be mistyped, or minted against a different server."
  mindmap.session_expired: "that sync ticket has expired or been revoked. Mint a new one; tickets are deliberately short-lived so a leaked one is worth little."
  mindmap.session_wrong_mindmap: "that sync ticket was minted for a different map. A ticket reaches exactly one object, which is the point of scoping it — and a ticket minted for a document does not open a map either."

  validation.initiative_title: "an initiative needs a title, and it may not be cleared by an update — it is the quick name the idea goes by."
  validation.initiative_status: "the status is not one of open | parked | distilled. It is a lifecycle label an owner sets, not a workflow state, so nothing gates the order."
  validation.initiative_field_length: "a field on an initiative or one of its entries is over its character cap. `details` names the `field`, its length, and the cap — one code for every length overrun on this surface, because the caller's decision is the same: send less."
  validation.initiative_labels: "a label is empty or whitespace-only, or there are more than 50 of them."
  validation.initiative_metadata: "`metadata`, or `metadata_merge`, must be a JSON object."
  validation.initiative_metadata_size: "serialized initiative `metadata` is over its cap."
  conflict.initiative_has_checks: "a verification check is filed under the initiative being deleted, and a check may not name one that does not exist. `details.checks` lists them; re-file or detach them, or repeat the delete with ?force=true to have the column cleared."
  validation.entry_kind: "the entry `kind` is not a slug matching ^[a-z][a-z0-9-]*$. The vocabulary is open — note, research, feedback, transcript, document — but the shape is fixed."
  validation.entry_source: "`source` is required on an entry: it records where the input came from, so a later reader can weigh it. Without it the collection is text nobody can attribute."
  validation.entry_empty: "the entry carries neither text nor an attachment, which would record provenance for nothing. Send `text`, `content_base64`, or both."
  validation.entry_text: "the entry text is over its byte limit. Split it across entries, or attach it as a document."
  validation.entry_content_base64: "`content_base64` is not valid base64 (standard alphabet, padded). Refused rather than decoded partially — a truncated document must never be stored as if it were whole."
  validation.entry_attachment_unlabeled: "an attachment arrived with neither `filename` nor `mime`, so nothing downstream could tell a reader what the bytes are. Send at least one."
  validation.entry_mime: "the attachment's media type is not a bare `type/subtype`. It is served back as the attachment's `Content-Type`, so it is restricted to what a header may hold — no parameters, no whitespace."
  validation.origin_at: "`origin_at` is not an RFC 3339 timestamp. It states when the content was written, as opposed to when it landed here; a wrong provenance date is worse than a missing one, so it is refused rather than dropped."

  # -- environments: where a check can be run ----------------------------------
  notfound.environment: "no environment with that id, or none with that slug in this project. List them with GET /v1/projects/{project}/environments, or register it first."
  conflict.environment_slug: "that slug is already taken in this project. A slug is immutable because checks and tool calls address environments by it — update the existing environment, or pick another slug."
  validation.environment_slug: "`slug` must be 2-32 characters: a leading lowercase letter, then lowercase letters, digits or dashes. It is the handle a person types and an agent passes."
  validation.environment_name: "`name` must be non-empty and within its length bound. Omit it entirely to reuse the slug."
  validation.environment_kind: "`kind` must be `local`, `ephemeral`, `shared`, `staging`, `production` or `other`. An enum rather than free text, so a project cannot grow prod/production/Prod and lose the ability to answer whether something is verified in production."
  validation.environment_data_state: "`data_state` must be `seeded`, `empty`, `production_like` or `unknown` — what is in the environment, which is what decides whether a case's preconditions can be met at all."
  validation.environment_base_url: "`base_url` must be an absolute http:// or https:// URL within its length bound, or null when the environment has no HTTP surface. A bare host is refused because it produces a request to nowhere rather than an error."
  validation.environment_prose: "`bring_up`, `teardown` or `notes` is over its length limit. Keep it to the commands and caveats a runner needs, and link out for the rest."
  validation.environment_credentials_hint: "`credentials_hint` is over its length bound, or looks like a credential rather than a pointer to one. Takomo never stores credentials and every token with `read` can see this field — send where the credential lives, e.g. `env:STAGING_TOKEN`."
  validation.environment_metadata_size: "serialized environment `metadata` is over its cap. The bulk belongs in `notes`."
  validation.environment_count: "the project already holds the maximum number of live environments. Archive one nobody runs against any more."

  # -- collaborative documents -------------------------------------------------
  notfound.document: "no document with that id. List them with GET /v1/projects/{project}/documents."
  validation.document_title: "`title` must be 1-200 characters. It names the document; the prose belongs in the document itself, which is edited over the WebSocket session rather than through any JSON route."
  validation.document_path: "`path` is not a drawable folder. Use `/`-separated segments with no leading or trailing slash, no empty segment and no `.` or `..` — those shapes render as a folder nobody can name or navigate out of. Send \"\" for the top level."
  validation.document_status: "`status` must be `draft`, `review`, `settled` or `archived`. It is a label, not a state machine: nothing enforces an order between them."
  validation.document_initiative: "the `initiative` given belongs to another project. A document may record the initiative it was distilled from, and that reference is validated where it is made so the migration question — which initiatives have moved across — stays answerable."
  validation.document_metadata: "serialized document `metadata` is over its cap. Long prose belongs in the document."
  validation.document_count: "the project already holds the maximum number of live documents. Archive one with DELETE /v1/documents/{id}."

  # -- the shared CRDT log: a document and a mindmap are both collaborative objects
  # Both are stored the same way — one Yjs document each, one update log, one
  # sync ticket — so these codes are named for the log rather than for either
  # kind. They replace `validation.doc_update_empty`,
  # `validation.doc_update_too_large` and `validation.document_too_large`, which
  # said "document" about a path a mindmap now takes too.
  validation.doc_update_empty: "a document flush carried no bytes. An empty flush records nothing, and a compaction of nothing would empty the document — so it is refused rather than written. Skip the flush instead."
  validation.doc_update_too_large: "one document flush is over its byte cap. A flush is meant to be a few seconds of typing; every write in this process is serialized behind the same mutex, so an oversized one stalls every claim, transition and heartbeat. Flush more often."
  validation.document_too_large: "this document's update log is at its byte cap. Every reader replays the whole log to open it, so the cap is what bounds that allocation. Split the document into linked ones."
  validation.mindmap_update_empty: "a mindmap flush carried no bytes. The mindmap counterpart of `validation.doc_update_empty`; the two are separate codes because a client written against one surface should never have to parse the other's vocabulary."
  validation.mindmap_update_too_large: "one mindmap flush is over its byte cap. See `validation.doc_update_too_large` for why a flush is bounded at all."
  validation.mindmap_too_large: "this mindmap's update log is at its byte cap. Every peer replays the whole log to open the map, so the cap is what bounds that allocation. Promote its branches and start a second map."
  validation.trace_kind: "that is not a kind of act the plan's history records, or not one a caller may record itself. The rest — authored, renamed, moved, pruned, accepted — are written by the paths that perform them, so nobody can claim to have done something they did not; a caller may record only `edited` (prose changes over the sync socket, which the server never sees as a request) and `reviewed` (somebody saying they agree)."
  validation.mindmap_position: "`position` is out of range for that ring. It is an INDEX among a node's siblings now (0 is first, and the ring's length appends), not the gapped 1000/2000 ordering it used to be — a stale gapped value is refused rather than silently appending the node in the wrong place."
  notfound.object: "that id names no collaborative object. A room id carries its own kind — `doc-…` is a document, `mm-…` is a mindmap — and a prefix that is neither reaches nothing, so it reads as absent rather than as a malformed id."

  # -- document proposals: what an agent may offer -----------------------------
  validation.document_ops: "`ops` is not a usable list of operations, or none of them could be applied. An agent addresses BLOCKS BY ID — `[{\"op\":\"replace\",\"id\":\"blk_…\",\"markdown\":\"…\"}]` — and never sends a whole document, because a document would overwrite whatever somebody typed while the model was thinking. Re-read with takomo_document_read: the block ids move as people edit."
  validation.document_proposals: "the document already holds the maximum number of undecided proposals. Somebody has to accept or reject the ones already offered — a pile nobody decides on is the state this cap exists to make visible."
  conflict.document_archived: "the document is archived and cannot be written to. Restore it first if the work still belongs to it."

  # -- the prompt bar: the one route that calls a model -------------------------
  speech.not_configured: "dictation is off on this server, so no token can be minted. Set TAKOMO_ASSEMBLYAI_API_KEY and restart. /v1/whoami reports features.voice, so a page can leave the button out rather than offering one that cannot work."
  speech.upstream: "the speech provider could not be reached, or refused the key. Its own message is passed through, because it is the only thing that distinguishes a bad key from a rate limit."
  document.agent_not_configured: "this server has no document agent configured, so the prompt bar cannot run. Set TAKOMO_TENSORX_API_KEY (optionally TAKOMO_TENSORX_BASE_URL and TAKOMO_DOC_MODEL) and restart. Everything else on /documents works without it — an agent connected over MCP proposes through the same path."
  document.agent_failed: "the model provider could not be reached, refused the request, or answered with something that was not a usable plan. Nothing was written to the document. The provider's own message is passed through, because it is the only thing that distinguishes a bad key from an unknown model from a rate limit."
  validation.document_unchanged: "every proposed change was the text the document already has. A model asked for something the document already satisfies should say so, not offer a replacement that changes nothing — a no-op a reviewer accepts costs them a decision and gives them nothing."
  validation.document_instruction: "the prompt-bar instruction is empty or over its length bound. A prompt bar is for a sentence saying what should change."

  # -- the document sync socket ------------------------------------------------
  document.session_missing: "the sync socket was opened without a ticket. Mint one with POST /v1/documents/{id}/session and pass it as `?ticket=`. A browser WebSocket cannot set an Authorization header, which is why the credential rides the query string — and why it is a short-lived, single-document ticket rather than your real token."
  document.session_invalid: "that sync ticket is not recognized. It may be mistyped, or minted against a different server."
  document.session_expired: "that sync ticket has expired or been revoked. Mint a new one; tickets are deliberately short-lived so a leaked one is worth little."
  document.session_wrong_document: "that sync ticket was minted for a different document. A ticket reaches exactly one, which is the point of scoping it — otherwise it would be an ordinary token with a short life."
  document.too_many_peers: "that document already has the maximum number of live editors. Wait for somebody to close it, then reconnect."

  # -- the app's own assets ----------------------------------------------------
  notfound.asset: "no embedded asset with that name. The binary bakes `web/dist/assets/` into a compile-time table and serves `/assets/{file}` as an exact lookup in it; a stale index.html from an older build is the usual cause."

  # -- checklist: releases, checks, cases, verdicts ----------------------------
  notfound.release: "no release with that id in this project. A verdict may only cite a release the project actually has."
  notfound.check: "no checklist check with that id."
  notfound.case: "no checklist case with that id."
  conflict.release_exists: "that `ref` is already recorded for the project. A release is an immutable marker, not a mutable record — push the next ref rather than re-pushing this one."
  conflict.case_retired: "the case was retired by a later regeneration, so it is history rather than work. File the current case set and record verdicts against a live case."
  forbidden.human_scope: "recording a verdict with `actor_kind: human` needs the `human` scope. An agent may record what it observed as `agent`; only a person's token may assert that a person approved a case."
  validation.release_ref: "`ref` is required and within its length bound — the tag or FULL commit sha the release stands for. Short shas are ambiguous."
  validation.release_note: "the release note is over its length limit."
  validation.release_paths: "more touched paths than one push may carry. A diff that large is a repository-wide sweep: push without `touched_paths` and retest every check instead of enumerating it."
  validation.check_title: "a check needs a non-empty `title`, within its length bound, naming the one action it verifies."
  validation.check_body: "the check body is over its length limit. It is free-form prose an agent or a human follows."
  validation.check_precondition: "the check precondition is over its length limit."
  validation.check_layer: "`layer` must be `ui`, `api` or `other`. A check covers ONE layer: a rule enforced only in the interface passes at the API layer, so the two verdicts are not interchangeable."
  validation.check_severity: "`severity` must be `blocking`, `advisory` or `low`. Only `blocking` blocks a release gate."
  validation.check_environments: "more environments than one check may declare. A check verified in twenty places is usually several checks — declare the ones where the verdict actually differs."
  validation.verdict_environment: "the verdict names an environment this check is not verified in, or names one at all on a check that declares none. A verdict is evidence about the check, so it has to be taken somewhere the check claims."
  conflict.environment_ambiguous: "the check must be verified in more than one environment, so a verdict has to say which one it is about. A bare verdict there does not state what was observed, and defaulting silently would file (say) a staging run as production. The worklist names the environment for every item on it."
  validation.check_initiative: "the `initiative` given does not exist, or belongs to another project. Unlike a ticket's `initiative:` tag — which the roadmap deliberately lets dangle — this is a column chosen from a list, so a wrong id is refused where it is made."
  validation.check_epic: "the `epic` given is not a ticket of type `epic`, or belongs to another project. Checks group under epics so the vocabulary matches tickets."
  validation.check_globs: "a check glob is empty, over its length bound, or there are more than one check may claim. A check covers one action, which a handful of path patterns describes."
  validation.check_numbers: "an expiry or cost field on a check is negative. Send a non-negative number, or null to inherit."
  validation.check_metadata_size: "serialized check `metadata` is over its cap. The bulk belongs in the check body."
  validation.verification: "`verification` must be `agent`, `human` or `agent_then_human`. `agent_then_human` needs BOTH verdicts, which is why they are stored as separate facts."
  validation.policy_numbers: "an expiry field on a checklist policy is negative. Send a non-negative number, or null to clear the override."
  validation.cases: "`cases` is required and must be an array of objects, each with a `key`."
  validation.case_key: "every case needs a `key`, unique within its check and within its length bound. Derive it from the parameter assignment so regenerating the model matches existing cases instead of orphaning their history."
  validation.case_label: "a case label is over its length limit."
  validation.case_count: "more cases in one call than the cap allows. A pairwise model for a large form lands near 76 — thousands means most of the parameters are inert fields that do not belong in the model."
  validation.verdict: "`verdict` must be `pass`, `fail`, `blocked` or `unreachable`. `unreachable` is not a failure: it says the declared layer gives no way to reach this configuration, and it is counted apart from both covered and uncovered."
  validation.verdict_note: "a `fail` verdict needs a `note` saying what went wrong, and a note stays within its length limit. A bare fail is a claim the next reader cannot act on."
  validation.actor_kind: "`actor_kind` must be `agent` or `human`."

  # -- the catch-all ----------------------------------------------------------
  internal: "an invariant failed server-side — a database error, a poisoned lock. The message is deliberately generic so SQL text and schema names never reach a client; the detail is in the server log. Nothing a caller can act on beyond retrying."

# The `/oauth/*` and `.well-known` endpoints speak a DIFFERENT error vocabulary:
# RFC 6749's, in an `error` field, because that is the only one an OAuth client
# reads (see the OauthError schema). Listed separately rather than merged into
# `x-error-codes` above precisely so the two are not mistaken for one namespace —
# `invalid_request` here is not a takomo error code and never appears on /v1.
x-oauth-errors:
  invalid_request: "a required parameter is missing or malformed — no grant_type, no client_id, a code without its code_verifier, a code_challenge_method other than S256. The description names which."
  invalid_grant: "the authorization code or refresh token was refused. RFC 6749 puts every reason under this one value: unknown, expired, already redeemed, issued to another client, a redirect_uri that does not match, a failed PKCE check, a connection whose credentials were revoked at the server, or a consenting takomo token that has been revoked (an expired one does not end a connection — see spec/auth.md). The description distinguishes them, and the last two are deliberately worded apart from a replay: a revoked connection is an administrative act, not a credential that may have been stolen. A *replay* additionally revokes everything that credential produced, because a replay cannot be told apart from a stolen credential racing the real client."
  invalid_client_metadata: "a registration named something this server does not implement — a token_endpoint_auth_method other than `none`, a grant or response type it does not support. Unrecognized metadata members are ignored rather than refused, so only what the description names is at issue."
  invalid_redirect_uri: "a registration's redirect_uris are absent, too many, or one is not an absolute https URI without a fragment (plain http is accepted only for loopback)."
  unsupported_response_type: "the authorization endpoint was asked for something other than `code`. Reported by redirect once the redirect target itself has been verified."
  unsupported_grant_type: "the token endpoint was asked for a grant this server does not implement. `client_credentials` in particular is not offered: every credential here represents a human's consent. For a non-interactive agent, mint a token with `takomo token create`."
  access_denied: "the human at the consent screen declined. A normal outcome of the flow, not a failure."
  temporarily_unavailable: "either this instance runs no OAuth authorization server, or the global registration budget for this minute is spent. In the first case `TAKOMO_PUBLIC_URL` is unset OR is set to a value unusable as an issuer; an instance in that second state serves normally with OAuth off (takomo-z919), so this response cannot tell the two apart and does not pretend to — its startup line names which. The remedy states the accepted shape."
