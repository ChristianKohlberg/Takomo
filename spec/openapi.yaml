openapi: 3.1.0
info:
  title: Takomo
  version: "1.0.0-draft1"
  description: |
    Central task store for agent fleets. One authority, bearer-token auth,
    hierarchical tickets, enforced per-project workflows, atomic claim/lease,
    append-only event log.

    Design rules this contract encodes:
    - Most writes are commutative (comments, field sets, metadata merge); CAS
      (`If-Match` on `version`) is only needed for whole-body replacement.
    - Every rejection teaches: error bodies state what is allowed and how to
      proceed (`allowed_transitions`, `remedy`).
    - Claiming is one atomic operation (`POST /ready/claim`), never read-then-claim.
    - The event log (`global_seq`) is the only push/poll surface; all delivery
      mechanisms (SSE, hooks, channels) layer on the `since` cursor.
    - `/v1` is frozen: additive evolution only; experiments live in `metadata`.

servers:
  - url: /v1

security:
  - bearer: []

tags:
  - { name: tickets }
  - { name: workflow }
  - { name: claims }
  - { name: events }
  - { name: questions }
  - { name: admin }
  - { name: identity }
  - { name: shares }
  - { name: tags }
  - { name: users }
  - { name: checklist }
  - { name: documents }
  - { name: environments }
  - { name: oauth }
  - { name: initiatives }
  - { name: mindmaps }
  - { name: schedules }

paths:
  /whoami:
    get:
      tags: [identity]
      summary: Who am I — the calling token's actor, scopes, projects, and person
      description: |
        Any valid token may call this; it removes the need for a client-side
        TAKOMO_ACTOR env var by letting the caller ask the store for its own
        identity (used by `takomo whoami` and by `ls --mine`-style filters).

        `user` is the person in the directory this credential belongs to, or null
        for a machine token. That is a different thing from `actor`: `actor` is a
        free-form string the credential carries, while `user` is somebody the
        server can vouch for — it is what `?mine=true` on the inbox reads, and the
        second of the two authorities that can answer an `approve`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhoAmI" }

  /tokens:
    get:
      tags: [identity]
      summary: List token metadata (admin scope)
      description: |
        Returns metadata only — never the plaintext token or its at-rest hash.

        A token the OAuth flow issued additionally carries `oauth_client`, naming the
        connection it belongs to. That is the field to identify a row by before
        revoking it: an expiry does not distinguish one (a hand-minted token can have
        one too), two connectors approved by the same human are otherwise identical,
        and revocation is not reversible.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Token" } }
        "403":
          description: Token lacks the admin scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [identity]
      summary: Mint a token over HTTP (admin scope)
      description: |
        Reuses the same store logic as the `takomo token create` CLI: the
        plaintext is returned exactly ONCE in the response and only its SHA-256
        is stored. This is a deliberate posture shift from auth.md's original
        "minting requires shell access" stance — see auth.md for the rationale.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenCreate" }
      responses:
        "201":
          description: Minted; plaintext shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenCreated" }
        "403":
          description: Token lacks the admin scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Invalid body (missing scopes, bad projects, etc.)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tokens/{id}:
    delete:
      tags: [identity]
      summary: Revoke a token by its public id (admin scope)
      description: |
        For an ordinary token this marks the row revoked and nothing else.

        For a token the OAuth flow issued it also **ends that connection**: the
        refresh family it belongs to is revoked in the same transaction, so the
        client cannot answer the resulting 401 by rotating back into a fresh
        credential. Other connections — including others approved by the same human —
        are untouched. See `spec/auth.md` for the two revocation levers.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: 'token id, e.g. "tok_a8f2k1x9"' }
      responses:
        "204": { description: Revoked }
        "403":
          description: Token lacks the admin scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects:
    get:
      tags: [admin]
      summary: List projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Project" } }
    post:
      tags: [admin]
      summary: Create a project (admin scope)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /projects/{project}:
    delete:
      tags: [admin]
      summary: Delete a project and everything under it (admin scope)
      description: |
        Cascade-deletes the project together with ALL of its tickets, comments,
        dependency edges, events, questions (including their follow-up threads
        and any minted answer links), promotions, and tag registry entries, in a
        single transaction. Dependency edges that point INTO this project from
        another project's tickets are cleared too. A store-level
        `project_deleted` audit event (with a null `project`, so per-project
        event queries stay empty) records the deletion; its `deleted` payload
        carries the per-table row counts removed.

        Refused with `409 project.active_claims` when any ticket still holds an
        active (unexpired) claim — deleting under a live lease would yank work
        out from under a running worker. Pass `?force=true` to delete anyway,
        abandoning those leases.

        Tokens scoped to this project are deliberately left as-is: once the
        project is gone they simply stop resolving against it. Revoke them
        separately with `DELETE /v1/tokens/{id}` if desired.
      parameters:
        - { $ref: "#/components/parameters/project" }
        - name: force
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: delete even when tickets hold active claims (abandons those leases)
      responses:
        "204": { description: Deleted }
        "403":
          description: Token lacks the admin scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A ticket holds an active claim and force was not set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /projects/{project}/workflow:
    get:
      tags: [workflow]
      summary: Get the project's workflow definition
      parameters: [ { $ref: "#/components/parameters/project" } ]
      responses:
        "200":
          description: The active workflow (see workflow-format.md)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
    put:
      tags: [workflow]
      summary: Replace the project's workflow (admin scope; must remain valid for existing tickets)
      parameters: [ { $ref: "#/components/parameters/project" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Workflow" }
      responses:
        "200": { description: Replaced }
        "422":
          description: Invalid workflow (unreachable states, tickets stranded)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /projects/{project}/workflow/validate:
    post:
      tags: [workflow]
      summary: Would this workflow be accepted? (admin scope; writes nothing)
      description: |
        Runs exactly the validation `PUT /projects/{project}/workflow` runs —
        including the stranded-ticket rule, which depends on where this project's
        tickets currently sit — and returns the result instead of applying it.

        Exists for editors: a draft has to be checked while it is being written,
        and the rules are subtle enough (terminal reachability, the
        claimable-with-done-category trap, stranding) that a client
        reimplementing them would drift. Asking the server the same question the
        PUT answers keeps "valid here" and "accepted there" from disagreeing.

        A distinct route rather than a `dry_run` flag on the PUT: a query
        parameter that silently turns a write into a read is the kind of thing a
        proxy strips and a caller forgets, and getting it wrong writes the
        database.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Workflow" }
      responses:
        "200":
          description: "The verdict. `valid: false` is a normal 200 — an invalid draft is an answer, not a failure."
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  problems:
                    type: array
                    items: { type: string }
                    description: empty when valid; each entry names one defect
        "422":
          description: The body is not a workflow document at all (`workflow.parse`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /projects/{project}/workflow-layout:
    get:
      tags: [workflow]
      summary: Node positions for the workflow editor (read scope)
      parameters: [ { $ref: "#/components/parameters/project" } ]
      responses:
        "200":
          description: "`layout` is null when nothing is stored; the client lays the graph out itself."
          content:
            application/json:
              schema:
                type: object
                properties:
                  layout: { type: [object, "null"], additionalProperties: true }
    put:
      tags: [workflow]
      summary: Store node positions (admin scope)
      description: |
        Where the editor's nodes sit, stored BESIDE the workflow rather than
        inside it: `Workflow` is `deny_unknown_fields`, so a `positions` key in
        the document would be rejected on the way back in.

        Separate from the workflow PUT for a second reason — moving a node
        changes nothing about how the project behaves, so this emits no
        `workflow_changed` event and wakes no long-poller. A board that refetched
        every time someone dragged a box would be reacting to nothing.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [layout]
              properties:
                layout:
                  type: object
                  additionalProperties: true
                  description: state id to an x/y position
      responses:
        "200": { description: Stored }

  /workflows:
    get:
      tags: [workflow]
      summary: The workflow library — named state machines reusable across projects (read scope)
      description: |
        A workflow has always been a COLUMN on a project, so two projects wanting
        the same lifecycle each carried their own copy, and improving one
        improved neither the other nor the next project created. This is the
        shared shelf they can be taken from.

        It stores documents and never applies one: applying stays
        `PUT /projects/{project}/workflow`, the single place the
        never-strand-a-ticket check runs. Deleting a library entry therefore does
        not affect a project already using it — applying copies the document onto
        the project.

        Built-ins (`factory-default`, `simple`) are seeded from the binary on
        every start and marked `builtin: true`. They cannot be edited, renamed or
        deleted here, and a user entry may not take one of their names, because
        the next restart would overwrite it.

        Read scope, not admin: a non-admin can already read the workflow of any
        project it can see, and choosing which one to ask an admin for is not
        privileged.
      responses:
        "200":
          description: Every entry, built-ins first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkflowEntry" }
    post:
      tags: [workflow]
      summary: Save a named workflow (admin scope)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, workflow]
              properties:
                name: { type: string, description: "1-100 chars, unique, and not a built-in's name" }
                description: { type: [string, "null"] }
                workflow: { $ref: "#/components/schemas/Workflow" }
                layout: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowEntry" }
        "409":
          description: A workflow with that name exists (`workflow.name_taken`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Invalid document (`workflow.invalid`, with `details.problems`) or a reserved name (`workflow.name_reserved`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /workflows/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [workflow]
      summary: One library entry (read scope)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowEntry" }
        "404": { description: No such entry }
    patch:
      tags: [workflow]
      summary: Rename, re-describe, or replace a library entry (admin scope)
      description: |
        An absent key leaves that field alone; `description: null` clears it.
        Built-ins refuse with `workflow.builtin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: [string, "null"] }
                workflow: { $ref: "#/components/schemas/Workflow" }
                layout: { type: [object, "null"], additionalProperties: true }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowEntry" }
        "422":
          description: Invalid document, a reserved name, or a built-in (`workflow.builtin`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [workflow]
      summary: Delete a library entry (admin scope)
      description: |
        Does not touch a project already using the document. Built-ins refuse
        with `workflow.builtin`.
      responses:
        "204": { description: Deleted }
        "404": { description: No such entry }
        "422":
          description: A built-in cannot be deleted (`workflow.builtin`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /projects/{project}/roadmap:
    get:
      tags: [workflow]
      summary: Epic and initiative progress rollup (read scope)
      description: |
        Two readings of the same work. An epic CLOSES and an initiative never
        does, so a feature that ships as v1, then v1.1, then v2 is one
        initiative with one epic per version filed under it: `epics` gives
        per-version progress, `initiatives` gives progress over the life of the
        lane.

        For each `epic` in the project, returns the epic plus a rollup over its
        FULL descendant subtree (walked recursively via `parent`): ticket counts
        by state and by category, the subtree `total`, a `done` count (states in
        the `done` category), and a whole-number completion `percent`. The epic
        itself is the container and is not counted in its own rollup. Counts
        include archived descendants so historical completion is not understated.

        Each epic also carries `flags`: short codes for an epic whose own state
        contradicts its subtree (empty when consistent).

        Alongside `epics`, `unparented` is a rollup of the same shape (minus the
        ticket identity fields) over every non-epic ticket in the project whose
        `parent` chain never reaches an epic — a NULL parent, a chain of
        non-epic ancestors, or a parent id pointing at a row that no longer
        exists. Without it, work outside every epic would be invisible while the
        per-epic percentages read as complete.

        `initiatives` and `uninitiated` are the same pair on the initiative
        side. A ticket joins an initiative by carrying the `initiative:<id>`
        tag — the reference `/initiatives` already writes when it files a
        passage as work — and the set is grown DOWNWARD through `parent` from
        there, so tagging the version epic counts everything beneath it. Epics
        are containers and are excluded from the counts.

        Two properties differ from `epics` and matter to a client:

        - **Initiative rollups may overlap and MUST NOT be summed.** A ticket
          carrying two initiative tags, or tagged for one lane beneath an
          ancestor tagged for another, is counted by both. Flat epics partition
          the project; lanes do not.
        - **A tag naming an initiative that does not exist owns nothing**, so
          its ticket lands in `uninitiated` rather than disappearing from every
          bucket — the rule `unparented` applies to a dangling `parent`.

        `epic` narrows the report to a single epic. `unparented` is then OMITTED
        rather than returned empty — it is a project-wide statement about work no
        epic owns, and repeating it under a single-epic view would read as "this
        epic has no unparented work", which is not a thing an epic can have.
        `initiatives` and `uninitiated` are omitted for the same reason, and one
        more: a lane SPANS versions, so reporting lanes beside a single version
        would invite reading the lane's numbers as that version's. The response
        echoes the filter back as `epic`.
      parameters:
        - { $ref: "#/components/parameters/project" }
        - name: epic
          in: query
          required: false
          schema: { type: string }
          description: |
            Narrow the report to one epic's DESCENDANT SUBTREE. A value that is not an epic of
            this project is a 404, not an empty report: a typo, the wrong project and naming a
            task are indistinguishable in an empty list and all three are worth reporting.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  generated_at: { type: string, format: date-time }
                  epics:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        state: { type: string }
                        state_category: { type: string }
                        priority: { type: string }
                        total: { type: integer, description: descendants in the subtree }
                        done: { type: integer, description: descendants in a done-category state }
                        percent: { type: integer, description: done/total as a whole percent (0 when empty) }
                        ready:
                          type: integer
                          description: |
                            Descendants the ready QUEUE would hand out right now: a claimable
                            state, not archived, unclaimed or lease-expired, and not blocked.
                            Computed from the same CTE as `GET /ready`, so the two cannot drift.
                        backlog:
                          type: integer
                          description: |
                            Descendants in a claimable state that are NOT ready — blocked by a
                            dependency, or already claimed. `ready + backlog` is the whole
                            claimable set, so the pair partitions it. Keyed on the workflow's
                            `claimable` flag, not the `todo` category: a state can be claimable
                            and categorised `in_progress`, and a `todo` state can be
                            non-claimable.
                        awaiting_answer:
                          type: integer
                          description: |
                            Descendants carrying at least one OPEN question, in any mode. An
                            OVERLAY on the counts above, not a bucket — such a ticket is still
                            counted in its own state and may or may not be `ready`. It exists
                            because a queue entry with an unanswered decision on it looks
                            claimable and is not worth picking up.
                        by_state: { type: object, additionalProperties: { type: integer } }
                        by_category: { type: object, additionalProperties: { type: integer } }
                        initiatives:
                          type: array
                          description: |
                            Ids of the initiatives this epic is filed under — the inverse of a
                            lane's `epics`, so "what is this version part of" needs no
                            client-side inversion of the whole project. Empty for an epic under
                            no lane; more than one is legitimate.
                          items: { type: string }
                        claim:
                          type: [object, "null"]
                          description: |
                            The epic's ACTIVE claim, or `null` — an expired lease is not a hold,
                            so "is it held" is one check rather than three.

                            An epic claimed without `ttl_seconds` is held until released, so
                            there is no expiry to judge it by and movement is what there is
                            instead. `idle_seconds` is anchored at the claim when nothing has
                            moved since, so a fresh hold reads as barely idle rather than as
                            idle since whenever the subtree last changed.

                            This is the CHEAP half of `GET /v1/tickets/{id}/claim`, derived from
                            row timestamps. That route walks the event log to break movement into
                            created/closed/in_progress/blocked, which is worth a request for one
                            epic and would be one walk per epic here. Use this to scan a list;
                            use the route for the precise answer on one.
                          properties:
                            holder: { type: string }
                            held_since: { type: [string, "null"], format: date-time }
                            held_for_seconds: { type: [integer, "null"] }
                            indefinite:
                              type: boolean
                              description: An active claim with no expiry — an epic claim without a TTL.
                            expires_at: { type: [string, "null"], format: date-time }
                            last_activity_at:
                              type: [string, "null"]
                              format: date-time
                              description: Newest write anywhere in the subtree; null when the subtree is empty.
                            idle_seconds:
                              type: [integer, "null"]
                              description: Seconds since the last movement, anchored at the claim when nothing has moved.
                        flags:
                          type: array
                          description: |
                            Epic/child state contradictions, empty when the epic is consistent.
                            `done_with_open_children`: the epic's own state category is `done`
                            but `done < total`. `open_with_all_children_done`: the epic is not
                            done, `total > 0`, and every descendant is done. `empty_epic`:
                            `total == 0` — a flag, not an error, so a client can render an epic
                            filed ahead of its work differently from a 0%-complete epic that
                            does have children.
                          items:
                            type: string
                            enum: [done_with_open_children, open_with_all_children_done, empty_epic]
                  initiatives:
                    type: array
                    description: |
                      One entry per initiative in the project, in creation order. Counts cover
                      every non-epic ticket tagged `initiative:<id>` plus everything beneath
                      those tickets via `parent`. These rollups MAY OVERLAP each other and must
                      not be summed — see the endpoint description. Omitted under an `epic`
                      filter, like `unparented`.
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        status:
                          type: string
                          description: |
                            The initiative's own label (`open`, `parked`, `distilled`, …). A
                            label, not a state machine — an initiative is nurtured, not
                            completed, which is why it can outlive any number of epics.
                        total: { type: integer, description: non-epic tickets in the lane }
                        done: { type: integer, description: those in a done-category state }
                        percent: { type: integer, description: done/total as a whole percent (0 when empty) }
                        ready: { type: integer, description: what the ready queue would hand out }
                        backlog: { type: integer, description: claimable but blocked or already claimed }
                        awaiting_answer: { type: integer, description: "holding an open question (an overlay, not a bucket)" }
                        by_state: { type: object, additionalProperties: { type: integer } }
                        by_category: { type: object, additionalProperties: { type: integer } }
                        epics:
                          type: array
                          description: |
                            Ids of the epic tickets tagged into this initiative directly, in
                            creation order — the versions filed under the lane. Join them to
                            the `epics` array in this same response for per-version progress.
                            Directly tagged only: an epic that merely inherits the lane from an
                            ancestor was not filed as one of its versions.
                          items: { type: string }
                        flags:
                          type: array
                          description: |
                            Initiative/work contradictions, empty when consistent.
                            `empty_initiative`: `total == 0` — a flag, not an error, since a
                            lane opened before any work is filed is legitimate.
                            `parked_with_ready_work`: status is `parked` but `ready > 0`, so
                            the lane was set aside while the queue still hands its tickets out.
                            There is deliberately no `done`-style code: `distilled` means the
                            substance became tickets, so open work under it is expected.
                          items:
                            type: string
                            enum: [empty_initiative, parked_with_ready_work]
                  uninitiated:
                    type: object
                    description: |
                      Rollup over the project's non-epic tickets that no initiative owns —
                      never tagged, not beneath anything tagged, or carrying a tag that names
                      an initiative which does not exist. Same shape as an initiative's rollup
                      without the identity fields; it is a bucket, not an initiative. Omitted
                      under an `epic` filter.
                    properties:
                      total: { type: integer }
                      done: { type: integer }
                      percent: { type: integer, description: done/total as a whole percent (0 when empty) }
                      ready: { type: integer, description: what the ready queue would hand out }
                      backlog: { type: integer, description: claimable but blocked or already claimed }
                      awaiting_answer: { type: integer, description: "holding an open question (an overlay, not a bucket)" }
                      by_state: { type: object, additionalProperties: { type: integer } }
                      by_category: { type: object, additionalProperties: { type: integer } }
                  unparented:
                    type: object
                    description: |
                      Rollup over the project's non-epic tickets that no epic owns. Same shape
                      as an epic's rollup, without `id`/`title`/`state`/`priority` — it is a
                      bucket, not a ticket.
                    properties:
                      total: { type: integer }
                      done: { type: integer }
                      percent: { type: integer, description: done/total as a whole percent (0 when empty) }
                      ready: { type: integer, description: what the ready queue would hand out }
                      backlog: { type: integer, description: claimable but blocked or already claimed }
                      awaiting_answer: { type: integer, description: "holding an open question (an overlay, not a bucket)" }
                      by_state: { type: object, additionalProperties: { type: integer } }
                      by_category: { type: object, additionalProperties: { type: integer } }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{project}/impact:
    get:
      tags: [workflow]
      summary: Open blockers ranked by the work each one releases (read scope)
      description: |
        Answers "if I close exactly one thing, what buys the most?".

        For every non-terminal ticket that blocks something in this project,
        `unblocks` is how many of the project's tickets would leave the blocked
        set if that ONE ticket closed, split into `direct` (they hold the
        `blocked_by` edge themselves) and `downstream` (they inherit it from an
        ancestor, the same propagation the ready queue applies).

        The count is a COUNTERFACTUAL, not a reachability walk, and two
        consequences follow. A ticket held by two blockers counts towards
        neither alone, because closing either one leaves it blocked. And a chain
        does not cascade: if `B` blocks `X` and `X` blocks `Y`, closing `B`
        releases `X` but not `Y` — `X` is claimable now but still not terminal,
        so it goes on blocking `Y`. The numbers are therefore smaller than a
        graph walk would give, and they are what a reader can act on.

        Blockers that would release nothing are omitted rather than listed as a
        zero. A blocker may live in another project (dependencies cross project
        boundaries) while the work it holds is in this one; it is still reported,
        because the point is to name the ticket worth closing.

        `epic` narrows the WORK counted to that epic's subtree — `blocked_total`
        and every `unblocks` are then subtree-relative. It deliberately does NOT
        narrow the blockers considered: a ticket outside the epic, or outside the
        project, that holds the epic up is exactly what this view exists to name.
        The response echoes the filter back as `epic`.
      parameters:
        - { $ref: "#/components/parameters/project" }
        - name: epic
          in: query
          required: false
          schema: { type: string }
          description: |
            Narrow the report to one epic's DESCENDANT SUBTREE. A value that is not an epic of
            this project is a 404, not an empty report: a typo, the wrong project and naming a
            task are indistinguishable in an empty list and all three are worth reporting.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  generated_at: { type: string, format: date-time }
                  blocked_total:
                    type: integer
                    description: |
                      Tickets in this project blocked right now, so a reader can see what share
                      the top blocker accounts for.
                  blockers:
                    type: array
                    description: Most impactful first; ties break on id so the order is stable between calls.
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        project: { type: string, description: may differ from the queried project }
                        title: { type: string }
                        state: { type: string }
                        priority: { type: string }
                        type: { type: string }
                        unblocks: { type: integer, description: tickets released if this one closed }
                        direct: { type: integer, description: released tickets holding the edge themselves }
                        downstream: { type: integer, description: released tickets inheriting it from an ancestor }
                        unblocks_ids:
                          type: array
                          description: The released ticket ids, sorted — so a caller can act without a second request.
                          items: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{project}/language:
    put:
      tags: [workflow]
      summary: Set the project's ask-a-human question language (admin scope)
      description: |
        The human-facing language agents should phrase ask-a-human questions
        (and options) in for this project. Surfaced back to agents as a
        `language_hint` on the work loop of both surfaces — `POST /tickets`,
        `GET /tickets/{id}`, `POST /tickets/{id}/claim`, `POST /ready/claim`, and
        the MCP tools over the same ground — plus `question_language` on
        `takomo_workflow`, and shown as a nudge on the inbox. Soft — never
        enforced. Send `{"language": null}` to clear it.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language: { type: [string, "null"], description: 'e.g. "German"; null clears it' }
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400":
          description: |
            Malformed body — `validation.field_required` when `language` is absent,
            `validation.field_type` when it is not a string or null,
            `validation.unknown_field` when extra keys are present.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Token lacks the admin scope, or the project is outside the token's allowlist (`auth.project`).
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{project}/tags:
    get:
      tags: [tags]
      summary: List the project's tag registry (read scope)
      description: |
        The project's tag registry — named entities of some `kind` (person,
        component, team, …) that tickets reference by `kind:handle`. Ordered by
        (kind, handle). Reference metadata only: tags never affect ticket state,
        claims, or question routing.

        A `person:` entry additionally carries `person` when its handle names
        somebody in the people directory (`/v1/users`), which is the authority on
        who they are — `q` searches that name too. Addressing work to a person is
        the directory's job, not a tag's.
      parameters:
        - { $ref: "#/components/parameters/project" }
        - { name: kind, in: query, schema: { type: string }, description: 'restrict to one kind, e.g. person' }
        - { name: q, in: query, schema: { type: string }, description: 'case-insensitive substring match on handle or label' }
      responses:
        "200":
          description: The registry entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        "403": { description: Token lacks the read scope or the project }
    post:
      tags: [tags]
      summary: Register a tag (write scope)
      description: |
        Register a named entity. Conflicts (409 `tag.exists`) if the
        (kind, handle) pair already exists in the project. Tagging a ticket with
        an unknown handle also creates a stub here, so explicit registration is
        only needed to set a display label or `meta` up front.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagCreate" }
      responses:
        "201":
          description: The created tag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "403": { description: Token lacks the write scope or the project }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "A tag with this (kind, handle) already exists" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /projects/{project}/tags/{kind}/{handle}:
    parameters:
      - { $ref: "#/components/parameters/project" }
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: handle, in: path, required: true, schema: { type: string } }
    get:
      tags: [tags]
      summary: Get one tag (read scope)
      responses:
        "200":
          description: The tag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [tags]
      summary: Update a tag's label and/or meta (write scope)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagPatch" }
      responses:
        "200":
          description: The updated tag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [tags]
      summary: Delete a tag (write scope)
      description: |
        Removes the registry entry. Ticket references (`kind:handle` strings)
        are deliberately left intact — the reference is the source of truth, the
        registry row an enrichment — so the response reports how many tickets
        still point at it.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  still_referenced: { type: integer, description: 'tickets still carrying this kind:handle reference' }
        "404": { $ref: "#/components/responses/NotFound" }

  /users:
    get:
      tags: [users]
      summary: The people directory (read scope)
      description: |
        Who work can be addressed to. Global to the server rather than nested under
        a project — a person is not per-project — with `project` filtering to the
        members of one, which is who may be handed work there.

        A bounded envelope: `items` plus `total` counted with the same predicate,
        the `limit` applied, and a prose `note` when the page left someone out.
        Ordering is by handle and therefore stable, so `offset` is a safe
        continuation.

        Readable by any valid token, because a name has to be renderable by whoever
        is looking at a question. Every write here needs `admin`.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 'case-insensitive substring match on handle, name or email' }
        - { name: project, in: query, schema: { type: string }, description: 'only members of this project' }
        - { name: include_disabled, in: query, schema: { type: boolean }, description: 'include people who can no longer be assigned work' }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: One page of the directory.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
                  total: { type: integer, description: 'how many matched, ignoring the page size' }
                  limit: { type: integer }
                  note: { type: string, description: 'present only when the page left someone out' }
        "403": { description: Token lacks the read scope or the named project }
    post:
      tags: [users]
      summary: Add a person to the directory (admin scope)
      description: |
        Admin, not `write`, because this is the directory assignment draws from and
        assignment is the one route by which a name confers authority (a named
        assignee may answer an `approve`).

        There is no lazy creation anywhere: unlike a tag, an unknown handle is a 404
        rather than a new row, because a directory that grows from a typo makes the
        typo assignable and it looks real.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: The person, with any memberships created alongside them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { description: Token lacks the admin scope }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "That handle is already taken (`user.exists`)" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/{handle}:
    parameters:
      - { name: handle, in: path, required: true, schema: { type: string }, description: 'the handle, or the usr- id — both resolve' }
    get:
      tags: [users]
      summary: One person, with their memberships (read scope)
      responses:
        "200":
          description: The person.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [users]
      summary: Update a person's name, email or meta (admin scope)
      description: |
        The handle is deliberately not patchable: it is what every
        `person:<handle>` reference and every stored assignment resolves through,
        so renaming it would orphan them silently. A person whose name changes gets
        a new `name`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPatch" }
      responses:
        "200":
          description: The updated person.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { description: Token lacks the admin scope }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/{handle}/disable:
    parameters:
      - { name: handle, in: path, required: true, schema: { type: string } }
    post:
      tags: [users]
      summary: Stop new work being addressed to this person (admin scope)
      description: |
        A gate, in the same idiom as archiving a project — and deliberately neither
        a delete nor a revocation.

        What stops: being assignable, and with it the assignee route to answering an
        `approve`. What does not: every record naming them stays readable (deleting
        the row would make an answered question's `answered_by` unreadable after the
        fact), and their tokens keep working, because what a credential may do is its
        scopes. Revoke the token to end access.

        Reversible with `/enable`, because disabling changes nothing else about them.
      responses:
        "200":
          description: The person, now disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { description: Token lacks the admin scope }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{handle}/enable:
    parameters:
      - { name: handle, in: path, required: true, schema: { type: string } }
    post:
      tags: [users]
      summary: Put a disabled person back in the directory (admin scope)
      responses:
        "200":
          description: The person, active again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { description: Token lacks the admin scope }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{handle}/projects:
    parameters:
      - { name: handle, in: path, required: true, schema: { type: string } }
    post:
      tags: [users]
      summary: Make a person a member of a project (admin scope)
      description: |
        Membership says who may be *handed work* in a project. It is not access
        control — a token's own `projects` allowlist still decides what that
        credential may read or write — but because a named assignee may answer an
        `approve`, it is a second fence in front of that authority.

        Idempotent: re-adding a member is the state the caller asked for, not a 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project]
              properties:
                project: { type: string }
      responses:
        "201":
          description: The membership.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserMembership" }
        "403": { description: Token lacks the admin scope or the named project }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The project is archived, so its memberships are frozen too" }

  /users/{handle}/projects/{project}:
    parameters:
      - { name: handle, in: path, required: true, schema: { type: string } }
      - { $ref: "#/components/parameters/project" }
    delete:
      tags: [users]
      summary: End a project membership (admin scope)
      description: |
        Questions already addressed to this person stay addressed to them: silently
        retracting an open decision would leave it with nobody looking at it. They
        simply cannot be handed anything new here.
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "403": { description: Token lacks the admin scope or the named project }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{project}/style:
    put:
      tags: [workflow]
      summary: Set the project's style guide for agent-written text (admin scope)
      description: |
        The project's house style for the text agents write — ticket titles and
        bodies, comments, and human-facing questions. Surfaced back to agents as
        a `style_hint` on the work loop of both surfaces — `POST /tickets`,
        `GET /tickets/{id}`, `POST /tickets/{id}/claim`, `POST /ready/claim`, and
        the MCP tools (`takomo_next`/`claim`/`start`/`show`/`new`) over the same
        ground — as `style_guide` on `takomo_workflow`, and echoed on the
        `POST /v1/questions` response note. Soft — never enforced, exactly like
        the language setting.

        Capped at 2000 characters **after trimming** leading and trailing
        whitespace: the server trims, then counts Unicode scalar values, so a
        padded string that is over the limit only after spaces may pass here and
        fail client-side validation that checks the raw body against `maxLength`.
        Over the cap is a `422 project.style_guide_too_long`. A blank string is
        treated as a clear, and `{"style_guide": null}` clears it explicitly.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [style_guide]
              properties:
                style_guide:
                  type: [string, "null"]
                  description: 'e.g. "Two sentences max. Plain language, no marketing voice."; null clears it. At most 2000 characters after trim (see description).'
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400":
          description: |
            Malformed body — `validation.field_required` when `style_guide` is absent,
            `validation.field_type` when it is not a string or null,
            `validation.unknown_field` when extra keys are present.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Token lacks the admin scope, or the project is outside the token's allowlist (`auth.project`).
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: The style guide exceeds 2000 characters after trim (`project.style_guide_too_long`) }

  /projects/{project}/archive:
    post:
      tags: [workflow]
      summary: Archive a project — freeze every write under it (admin scope)
      description: |
        Archiving is a gate, not a deletion and not a status label. While it is
        on, every mutation under the project is refused with a 409
        `project.archived` — creating or patching a ticket, claiming, moving
        through the workflow, commenting, asking or answering a question, tags,
        schedules, checklist writes, and the project's own settings — and the
        project's tickets are dropped from the ready queue, so `GET /ready` and
        `POST /ready/claim` stop offering work an agent would then be refused
        permission to do. Its active schedules stop materializing occurrences and
        its question deadlines stop firing, both resuming untouched afterwards.

        Everything else is unchanged. Reads answer exactly as before: the board,
        the ticket history, the events, the export. Nothing is moved, rewritten or
        removed, which is precisely what makes `POST
        /projects/{project}/unarchive` a complete undo — and what makes archiving
        the thing to reach for instead of `DELETE /projects/{project}`, which
        cascades away every ticket, comment, question and event irreversibly.

        Takes no body. Refuses with a 409 `project.active_claims` while any ticket
        holds an unexpired lease: freezing a project under a running worker would
        leave that worker no call it could make, not even a release. `?force=true`
        archives anyway and releases those leases, bumping each ticket's fence so
        the displaced worker gets the `fence.stale` 409 it already knows how to
        read.

        Idempotent: archiving an archived project keeps the original
        `archived_at` and emits no second event.
      parameters:
        - { $ref: "#/components/parameters/project" }
        - name: force
          in: query
          required: false
          schema: { type: boolean }
          description: 'Release any active leases and archive anyway (default false)'
      responses:
        "200":
          description: The archived project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { description: Token lacks the admin scope }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: 'A ticket holds an active claim (`project.active_claims`); retry with ?force=true' }

  /projects/{project}/unarchive:
    post:
      tags: [workflow]
      summary: Put an archived project back to work (admin scope)
      description: |
        The undo for `POST /projects/{project}/archive`. Writes are accepted
        again, the project's tickets return to the ready queue, and its schedules
        and question deadlines resume — all exactly as they stood, because
        archiving never changed them. Takes no body. Idempotent on a live project.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      responses:
        "200":
          description: The project, now live.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { description: Token lacks the admin scope }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{project}/claim-ttl:
    put:
      tags: [workflow]
      summary: Set the project's lease policy — default and maximum claim lifetime (admin scope)
      description: |
        How long a worker may hold a ticket in this project. Two settings, one
        endpoint:

        - `ttl_seconds` — the lease a claim gets when it names no `ttl_seconds` of
          its own. Built-in fallback 900 seconds.
        - `max_ttl_seconds` — the ceiling an explicit `ttl_seconds` on
          `POST /tickets/{id}/claim`, `POST /ready/claim` or
          `POST /tickets/{id}/heartbeat` is checked against. Built-in fallback
          3600 seconds. Deliberately **unbounded above**: a deployment may set
          whatever its fleet needs.

        Not to be confused with `/projects/{project}/answer-link-ttl`. That bounds
        the lifetime of a credential handed to someone outside the org; this
        bounds how long work may be held.

        Both are sent together because they are validated as a pair — a default
        above the ceiling would be silently clamped on every claim, so no claim
        would ever get the configured default. That combination is a
        `422 project.claim_ttl` naming both numbers. Either field may be omitted
        to leave it as it is, or sent as `null` to clear it and fall back to the
        built-in; sending neither is a `400`, so a typo'd field name cannot
        silently reset the policy.

        Raising the maximum trades recovery latency for fewer heartbeats. The
        sweeper frees only *expired* leases, so this value is how long a crashed
        worker parks its ticket before it returns to the ready queue on its own —
        `POST /tickets/{id}/release` cannot shorten that, since it requires the
        holder's identity and a matching fence. To reclaim it sooner, an admin
        forces it: `POST /tickets/{id}/force-release`.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                ttl_seconds:
                  type: [integer, "null"]
                  minimum: 1
                  description: 'default lease a claim gets, in seconds; null clears the setting (falls back to 900)'
                max_ttl_seconds:
                  type: [integer, "null"]
                  minimum: 1
                  description: 'ceiling an explicit ttl_seconds may request, in seconds; null clears the setting (falls back to 3600). No upper bound.'
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400":
          description: Neither field was sent, or one was neither an integer nor null.
        "422":
          description: |
            `project.claim_ttl` — a non-positive value, or a default above the
            ceiling that would apply. `details` carries both numbers and the
            effective maximum.
        "404": { description: Unknown project. }

  /projects/{project}/answer-link-ttl:
    put:
      tags: [workflow]
      summary: Set the project's default answer-link lifetime (admin scope)
      description: |
        How long an answer link minted for one of this project's questions
        (`POST /questions/{id}/answer-link`) stays valid, in seconds.

        Unlike the language and style settings this one is **enforced**, not
        advisory: an answer link is a bearer credential handed to someone outside
        the org, so its lifetime is not a preference a worker token gets to
        change — hence `admin`, and hence a hard maximum.

        Precedence when minting, most specific first: an explicit `ttl_seconds`
        on the mint call, then this project setting, then the built-in default of
        604800 seconds (7 days). Send `{"ttl_seconds": null}` to clear the
        project default and fall back to that built-in.

        Bounds are exactly those of an explicit `ttl_seconds`: a positive integer
        no larger than 2592000 (30 days, the same cap share links carry). Outside
        them is a `422 project.answer_link_ttl`.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ttl_seconds]
              properties:
                ttl_seconds:
                  type: [integer, "null"]
                  minimum: 1
                  maximum: 2592000
                  description: 'seconds an answer link stays valid; null clears the project default (falls back to 7 days)'
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { description: Token lacks the admin scope }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: The lifetime is not a positive integer of at most 2592000 seconds }

  /tickets:
    post:
      tags: [tickets]
      summary: Create a ticket
      description: |
        `Idempotency-Key` is required for agent clients: retries with the same
        key return the original ticket (200) instead of creating a twin (201).
        Reusing a key with a different request body is refused (409). The key is
        matched on a fingerprint of the full create payload, not the key alone.
        The response includes `similar` — existing open tickets with matching
        title keywords — so a client can notice a semantic duplicate.
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketCreated" }
        "200":
          description: Idempotent replay of a prior create
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketCreated" }
        "409":
          description: Idempotency-Key reused with a different request body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation failure (unknown project, bad parent, cycle)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [tickets]
      summary: List/search tickets
      parameters:
        - { name: project, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string }, description: state id or category }
        - { name: type, in: query, schema: { type: string } }
        - { name: label, in: query, schema: { type: string }, description: 'repeatable, AND semantics' }
        - { name: tag, in: query, schema: { type: string }, description: 'exact `kind:handle` tag reference; repeatable, AND semantics' }
        - { name: tag_kind, in: query, schema: { type: string }, description: 'match any tag of this kind (e.g. person); repeatable, AND semantics' }
        - { name: parent, in: query, schema: { type: string }, description: direct children of this id }
        - { name: epic, in: query, schema: { type: string }, description: "every descendant at any depth (the whole subtree); the ticket itself is excluded, unlike `parent` which matches one level" }
        - { name: q, in: query, schema: { type: string }, description: full-text over title+body }
        - { name: claimed_by, in: query, schema: { type: string } }
        - { name: fields, in: query, schema: { type: string }, description: comma list for sparse responses }
        - { name: include_archived, in: query, schema: { type: boolean, default: false }, description: include archived tickets alongside active ones }
        - { name: archived, in: query, schema: { type: string, enum: [only, all, active] }, description: "only = archived only; all = both; active = default (non-archived)" }
        - name: expired
          in: query
          schema: { type: boolean }
          description: |
            Scheduled occurrences only. `true` = the deadline has passed (what a
            maintenance agent queries to find what to tidy — nothing on the server
            closes an expired ticket); `false` = still live. A hand-made ticket has
            no deadline and counts as unexpired. Terminal state is not considered:
            this asks whether the clock ran out, so filter on state as well if you
            only want the unfinished ones.
        - { name: schedule, in: query, schema: { type: string }, description: 'only occurrences of this schedule' }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Ticket" } }
                  next_cursor: { type: [string, "null"] }

  /tickets/{id}:
    get:
      tags: [tickets]
      summary: Get a ticket
      description: |
        Also carries the project's `style_hint` / `language_hint` (see
        ConventionHints) when it sets them: reading a ticket is the start of
        working on it, and the conventions have to arrive before the agent
        writes. The list endpoint deliberately does not — hints are per project,
        not per ticket, and would be a per-row cost for a repeated value.
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: include, in: query, schema: { type: string }, description: "comma list: comments,children,deps,events,promotions" }
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string }, description: 'current version, e.g. "7"' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Ticket"
                  - $ref: "#/components/schemas/ConventionHints"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [tickets]
      summary: Update fields (commutative; CAS only for body)
      description: |
        Field-level sets (`title`, `priority`, `labels`) and `metadata_merge`
        (RFC 7386 merge-patch semantics, namespaced keys) are commutative and
        never require `If-Match`. `links` MERGES per key: each key in the patch
        is set (string value) or deleted (null value) while untouched keys
        survive, so concurrent writers attaching different link keys never
        clobber each other. Replacing `body` requires `If-Match: "<version>"`;
        on mismatch the 409 carries the current version and body hash. State is
        NOT patchable — use /transition.
        While a ticket is claimed, non-holders may only patch `metadata_merge`
        under their own namespace and add comments; other fields 409.
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: If-Match, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "409": { $ref: "#/components/responses/Conflict" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tickets/{id}/transition:
    post:
      tags: [workflow]
      summary: Move a ticket to another state (the only way state changes)
      description: |
        Validated against the project workflow: transition must exist from the
        current state, all `requires` must hold (active claim held by caller,
        token scope, guards like no-open-children). Illegal transitions return
        409 with `allowed_transitions` and a `remedy` — errors are written for
        LLM readers.

        Checks run in the order legality → scope → claim/fence, and the headline
        `code`/`message` names the first real blocker in that order: an illegal
        target is `transition.illegal`, a missing scope is `transition.scope`
        (403), and only then are claim ownership and fence echoing checked. So a
        lease holder attempting a human gate they lack the scope for sees the
        403, not a fencing error.

        Human approval is authoritative over a lease: a transition whose
        `requires` includes `scope:human`, performed by a caller holding the
        `human` scope, succeeds even while another actor holds the claim, and
        auto-releases that claim as a side effect (emitting a `released` event
        alongside `transitioned`). This override is scoped to human-required
        transitions; ordinary `claim`-required transitions keep the holder lock.

        A `claim`-required transition attempted without a lease is
        `transition.claim_required` (409), and its `remedy` depends on where the
        ticket sits, because a lease can only be taken in a state the workflow
        marks `claimable`. From a claimable state the remedy is the claim itself
        plus the transition to retry with the new fence. From a non-claimable one
        — the usual shape of a lease that expired while the work ran — claiming
        would be refused with `claim.state`, so the remedy instead names the
        re-entry edges out of the current state that land in a claimable state,
        and warns that taking one returns the ticket to the ready queue. Either
        way `details` carries `claimable_states`, and the non-claimable case also
        carries `reentry_states`.
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, description: target state id }
                reason: { type: string, maxLength: 2000 }
                fence: { type: integer, description: required while ticket is claimed }
      responses:
        "200":
          description: Transitioned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "409":
          description: Illegal transition, missing claim, stale fence, or guard failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransitionError" }
        "403":
          description: Transition requires a scope this token lacks (e.g. human)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransitionError" }

  /tickets/{id}/comments:
    post:
      tags: [tickets]
      summary: Append a comment (always allowed, commutative)
      description: |
        `Idempotency-Key` is supported so a retry after an ambiguous failure
        returns the original comment (200) instead of appending a twin (201).
        Reusing a key with a different body is refused (409).
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 65536 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "200":
          description: Idempotent replay of a prior comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "409":
          description: Idempotency-Key reused with a different body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tickets/{id}/deps:
    get:
      tags: [tickets]
      summary: The dependency graph around a ticket (reverse + transitive, cycle-safe)
      description: |
        Returns the dependency graph reachable from the ticket. `direction`
        selects which edges to follow: `blocked_by` (default) walks to the
        tickets that block this one; `blocks` walks the inverse (the tickets
        this one blocks); `both` walks both. With `transitive=true` the walk
        chases the whole chain to its ends; otherwise only the ticket's direct
        neighbours are returned. The traversal is cycle-safe (a visited set
        bounds it even when A blocks B blocks A). Edges are canonical
        `{ticket, blocked_by}` pairs (ticket is blocked by blocked_by)
        regardless of traversal direction, so `both` never duplicates an edge.

        **The walk is bounded at 500 nodes.** The cycle guard stops the traversal
        repeating, not the traversal being large, and one edge into a densely
        linked epic pulls in its whole component at a query per node. On reaching
        the ceiling the response is a correct partial graph with `truncated: true`
        and a `note`. Treat a truncated graph as evidence about the nodes present
        and about nothing else — in particular, an absent blocker is not proof of
        no blocker. Narrow with `direction`, or drop `transitive`.
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: direction, in: query, schema: { type: string, enum: [blocked_by, blocks, both], default: blocked_by } }
        - { name: transitive, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  root: { type: string }
                  direction: { type: string, enum: [blocked_by, blocks, both] }
                  transitive: { type: boolean }
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        state: { type: string }
                        state_category: { type: string }
                        type: { type: string }
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        ticket: { type: string, description: the blocked ticket }
                        blocked_by: { type: string, description: the ticket that blocks it }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [tickets]
      summary: Add a blocked_by edge (cycle-checked)
      description: |
        Dependency edges drive readiness and the no_open_blockers guard, so
        they follow the claimed-ticket write rules: while the ticket is
        claimed, only the holder may change deps and must echo the lease
        `fence` (per the Lease schema's fence-on-every-mutating-call rule).
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked_by]
              properties:
                blocked_by: { type: string, description: ticket id that blocks this one }
                fence: { type: integer, description: required while ticket is claimed }
      responses:
        "201": { description: Added }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Would create a cycle, or unknown id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [tickets]
      summary: Remove a blocked_by edge
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: blocked_by, in: query, required: true, schema: { type: string } }
        - { name: fence, in: query, required: false, schema: { type: integer }, description: required while ticket is claimed }
      responses:
        "204": { description: Removed }
        "409": { $ref: "#/components/responses/Conflict" }

  /tickets/move:
    post:
      tags: [tickets]
      summary: Move tickets to another project, in bulk (write scope)
      description: |
        Re-files tickets under another project. Subtrees come along by default,
        so naming an epic moves the epic and everything beneath it.

        **Ids do not change.** A ticket id is minted as `<project>-<suffix>` and
        nothing — server, clients, or SPA — ever parses the project back out of
        it, so the id keeps resolving in commit messages and links it was quoted
        in. After a move the prefix reads as where the ticket was originally
        filed; `project` is where it lives.

        What the move reconciles, because it IS keyed on the project:

        - **State.** A state the target workflow also defines is kept; anything
          else lands on that workflow's `initial`. Never silent: each entry in
          `moved` carries `from_state`, `to_state` and `state_reset`, and the
          `ticket_moved` event carries the same.
        - **Parent.** A parent and a child must share a project, so a moved
          ticket whose parent stays behind is unparented (`parent_cleared`), and
          a child left behind by a moving parent is orphaned and listed in
          `orphaned` — which is what `descendants: false` is for.
        - **Tags** are registered in the target project's tag registry, exactly
          as a patch naming an unregistered tag does.
        - **Questions, promotions, answer grants and subtree shares** carry a
          denormalized project and follow the ticket. Past events are not
          rewritten: the log records the project each event happened in.
        - **Checklist checks** cover a project's surface, so they do not move. A
          check pointing at a departing epic has its `epic` cleared and is listed
          in `checks_detached`; an epic-level checklist policy override is dropped.

        Dependency edges are left alone — `deps` never required both ends to
        share a project.

        Refused as a whole (409 `claim.held`) if any ticket in the set is
        claimed: a lease is held against a workflow the move would change, and a
        partial move would split a subtree across two projects. Bounded at 500
        tickets per call (422 `validation.move_too_large`) rather than
        truncated, since a half-moved epic is worse than a refusal you can split.

        The token must reach both sides — every named ticket's current project
        and the target.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketMove" }
      responses:
        "200":
          description: What moved, and what the move had to reconcile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketMoveResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /tickets/{id}/archive:
    post:
      tags: [tickets]
      summary: Archive a ticket (hide from default views; write scope)
      description: |
        Sets `archived_at` so the ticket drops out of the default list, ready
        queue, board, and metrics. The ready queue and metrics always exclude
        archived tickets; `GET /v1/tickets` re-includes them with
        `include_archived=true` or `archived=only`. Any state may be archived —
        terminal done/cancelled is the typical case. Idempotent.
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tickets/{id}/unarchive:
    post:
      tags: [tickets]
      summary: Unarchive a ticket (return to default views; write scope)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses:
        "200":
          description: Unarchived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tickets/{id}/promote:
    post:
      tags: [tickets]
      summary: Record that the ticket's work reached a target/stage (write scope)
      description: |
        Append a promotion: the ticket's work reached a named `target` —
        free-form ("staging", "production", "published", "delivered", …), so
        this is not tied to software deployment. History is kept; the latest per
        ticket drives the board badge. Independent of workflow state.
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string, description: 'Stage reached, e.g. "staging", "production"' }
                url: { type: string, description: 'Optional link (deploy, published page, …)' }
                ref: { type: string, description: 'Optional reference (version, commit, build id)' }
                note: { type: string }
      responses:
        "201":
          description: The recorded promotion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promotion" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tickets/{id}/promotions:
    get:
      tags: [tickets]
      summary: Promotion history for a ticket (newest first; read scope)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses:
        "200":
          description: Promotions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Promotion" } }

  /promotions:
    get:
      tags: [tickets]
      summary: Latest promotion per ticket across a project (read scope)
      description: One row per ticket (the most recent) — the board's badge source.
      parameters:
        - { name: project, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Latest promotions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Promotion" } }

  /tickets/{id}/claim:
    post:
      tags: [claims]
      summary: Claim this specific ticket (atomic)
      description: |
        Succeeds only if the ticket is in a claimable state, unclaimed (or the
        caller already holds it — idempotent renewal), and unblocked. Returns
        the lease with the fencing token all subsequent mutating calls must echo,
        plus the project's `style_hint` / `language_hint` (see ConventionHints)
        when it sets them.

        **Resuming a lapsed lease.** One narrow exception to "a claimable state":
        the caller may claim a ticket in a state the workflow does **not** mark
        claimable when it is the holder whose own lease expired there and nobody
        has claimed since. Without it, an agent whose work outlived its lease
        could not finish the ticket at all — `done` requires a claim, and the
        claim was refused because the in-progress state is not claimable, so the
        two errors pointed at each other and the only escape was to walk the
        ticket backwards into the ready queue, where another worker could take it.
        The response carries `resumed: true`.

        Nothing about fencing is relaxed. The resume bumps `fence_seq` like any
        claim, so every echo of the old lease's fence now 409s; a **different**
        actor is refused `claim.state` exactly as before (the message names whose
        lapsed lease it is); a state that is terminal or `blocked`-category is
        never resumable; and an admin `force-release` clears the right to resume
        along with the claim. What makes it safe is that a new claim by anyone
        else — the only thing that creates a competing writer — ends it.

        **Claiming an epic reserves its whole subtree.** While any claim on an
        epic is active, no other actor can claim a ticket anywhere under it
        (409 `claim.epic_held`) and the ready queue stops offering the subtree —
        the holder keeps working children by id with ordinary leased claims. An
        epic claimed **without** `ttl_seconds` gets no expiry at all: the lease
        comes back with `expires_at: null` and is held until released (or
        force-released; there is no TTL to wait out — judge it by
        `GET /tickets/{id}/claim` instead). An explicit `ttl_seconds` bounds an
        epic claim like any other. The reservation never displaces live work: a
        fresh epic claim is refused (`claim.children_held`) while anyone else
        holds an active claim inside the subtree, and the ready queue likewise
        never hands out such an epic.
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds:
                  type: integer
                  default: 900
                  maximum: 3600
                  description: >-
                    Lease length. On an epic, omitting it means NO expiry (held
                    until released) rather than the default.
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Lease"
                  - $ref: "#/components/schemas/ConventionHints"
        "409":
          description: |
            Already claimed by another holder (`claim.held`), blocked
            (`claim.blocked`), the state is not claimable and this caller is not
            the holder whose lease lapsed there (`claim.state` — `details`
            carries `claimable_states` and `lapsed_holder`), under an epic
            someone else has claimed (`claim.epic_held` — `details` names the
            epic, holder, and `held_since`), or an epic whose subtree carries
            someone else's live claims (`claim.children_held` — `details.held`
            lists them).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [claims]
      summary: Inspect the claim on a ticket, with movement since it was granted
      description: |
        Who holds the ticket, since when, and whether the claim expires — plus,
        while it is held, what has **moved in its subtree since the grant**:
        tickets created, tickets closed (event-based, so a later reopen does not
        un-count it), tickets currently in progress, currently blocked (a
        blocked-category state or an open dependency), still open, and the time
        of the last movement.

        This read is what makes an indefinite epic claim safe to offer: with no
        TTL to wait out, "held five hours, ten created, five closed, movement
        two minutes ago" reads as an agent mid-flight, while the same five hours
        with `idle_seconds` close to `held_for_seconds` reads as an abandoned
        lock — an admin `force-release` away. Works on any ticket; on one with
        no descendants the movement counts are simply zero. `movement` is null
        when the ticket is unclaimed (no anchor to count from), or when the
        claim predates the server recording grant times.
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses:
        "200":
          description: The claim and its movement report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimStatus" }

  /tickets/{id}/heartbeat:
    post:
      tags: [claims]
      summary: Renew the lease (harness/orchestrator responsibility, not the model's)
      description: |
        On a claim with no expiry (an epic claimed without a TTL) the beat is a
        no-op that returns the lease as it stands, `expires_at: null` included —
        it never writes a TTL, so a routine beat cannot quietly convert "held
        until released" into a 15-minute lease.
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fence]
              properties:
                fence: { type: integer }
                ttl_seconds: { type: integer, default: 900, maximum: 3600 }
      responses:
        "200":
          description: Renewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lease" }
        "409":
          description: |
            Fence mismatch. `fence.stale` (presented < current) means the lease
            expired and was superseded by a later claim — stop writing.
            `fence.invalid` (presented > current, a value never issued) is a
            client bug — re-read the fence from your claim response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tickets/{id}/release:
    post:
      tags: [claims]
      summary: Voluntarily release the claim
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fence]
              properties:
                fence: { type: integer }
                reason: { type: string }
      responses:
        "204": { description: Released }
        "409": { $ref: "#/components/responses/Conflict" }

  /tickets/{id}/force-release:
    post:
      tags: [claims]
      summary: Drop a ticket's claim regardless of who holds it (admin scope)
      description: |
        The recovery path for a ticket held by a worker that is gone.
        `POST /tickets/{id}/release` answers only to the holder — it wants that
        actor's identity and a matching `fence` — and the sweeper frees a lease
        exactly when it expires, not a moment sooner. Since
        `max_ttl_seconds` (`PUT /projects/{project}/claim-ttl`) has no upper
        bound, "when it expires" can be arbitrarily far away, so without this
        route a crashed worker parks its ticket with direct database access as
        the only way out.

        A **separate route rather than a `force` flag** on `/release`: a flag is
        one typo away from an ordinary worker turning its own release into a
        force. This path needs the `admin` scope, and no `fence` is accepted —
        the caller is displacing a holder whose fence it has no way to know.

        **The fence is bumped.** That is the point: the displaced worker may
        still be alive and mid-write, and after the force its `fence` is stale,
        so its next mutating call gets a `409 fence.stale` instead of winning a
        ticket someone else now holds. The response returns both the fence the
        old holder is carrying (`previous_fence`) and the new one (`fence`).

        An already-lapsed lease is force-released too rather than refused: the
        holder is still recorded on the row, and natural expiry does *not* bump
        the fence, so a zombie echoing that fence would still be accepted.
        `lease_expired: true` in the response says that is what happened.

        That holds once the sweeper has cleared the claim row as well, where all
        that remains is the lapsed holder's right to **resume** the lease in place
        (see `POST /tickets/{id}/claim`). Forcing it is how an operator takes an
        in-flight ticket away for good; a ticket with neither an active claim nor a
        lapsed one is the only `claim.none`.

        Emits `lease_revoked` — its own event kind, not `released` with a flag,
        because `kind` is the only server-side event filter
        (`GET /events?kind=lease_revoked`) and a `released` event whose actor is
        not the holder would read as the holder letting go voluntarily. The
        event carries the ousted `holder`, both fences, `lease_expired`, and the
        `reason`, attributed to the admin actor that forced it.

        Also reachable as `takomo ticket force-release <id>` against the
        database file — the command you need when the reason the ticket is stuck
        is that the server itself is wedged, or when the admin token is what got
        lost.
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: 'why the claim was taken; recorded on the lease_revoked event and echoed back'
      responses:
        "200":
          description: Released; the claim is gone and the fence has advanced.
          content:
            application/json:
              schema:
                type: object
                required: [ticket, project, previous_holder, previous_fence, fence, lease_expired]
                properties:
                  ticket: { type: string }
                  project: { type: string }
                  previous_holder: { type: string, description: 'the actor that was displaced' }
                  previous_fence: { type: integer, description: 'the fence that actor is still carrying; now stale' }
                  fence: { type: integer, description: 'the bumped fence — one greater than previous_fence' }
                  lease_expired: { type: boolean, description: 'true when the lease had already lapsed; the claim row was still there and the holder is now fenced off regardless' }
                  reason: { type: [string, "null"] }
        "403":
          description: '`auth.scope` — the token does not carry `admin`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { description: Unknown ticket. }
        "409":
          description: |
            `claim.none` — the ticket holds no claim, so there was nothing to
            displace. Not idempotent bookkeeping: a second force-release on the
            same ticket lands here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ready:
    get:
      tags: [claims]
      summary: Peek the ready queue (no side effects)
      parameters:
        - { name: project, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: label, in: query, schema: { type: string } }
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 200 }
          description: Page size. Out-of-range values are clamped rather than refused.
      responses:
        "200":
          description: |
            Ready = claimable state, unclaimed, unblocked (directly or via
            ancestors), ordered by priority then age.

            **This is an envelope, not a bare array** — it was an array before
            takomo 0.4. An array had nowhere to report what it left out, so a
            caller that asked for 20 and received 20 could not tell a queue of 20
            from the head of a queue of 137. `total` is the whole queue for this
            filter, counted with the same predicate that selected the page.

            There is no cursor, deliberately. The ready queue is live — other
            workers claim from it while you read — so a positional page 2 would
            promise a stable sequence that does not exist. Raise `limit` or
            narrow the filter instead.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Ticket" } }
                  total:
                    type: integer
                    description: Ready tickets matching the filter, ignoring limit.
                  limit: { type: integer, description: 'The page size actually applied.' }
                  note:
                    type: string
                    description: Present only when total exceeds the page — says so in words, and what to do about it.

  /ready/claim:
    post:
      tags: [claims]
      summary: Atomically claim the next ready ticket (the worker primitive)
      description: |
        Long-poll: with `wait`, the request blocks until a matching ticket
        becomes ready or the wait elapses (204). Exactly one caller receives a
        given ticket. This is the intended worker loop: claim → work →
        transition → repeat; the blocking call is the sleep. The claimed ticket
        comes back with its `lease` and, when the project sets them, its
        `style_hint` / `language_hint` (see ConventionHints).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project: { type: string }
                type: { type: string }
                labels: { type: array, items: { type: string } }
                wait_seconds: { type: integer, default: 0, maximum: 120 }
                ttl_seconds: { type: integer, default: 900 }
      responses:
        "200":
          description: A ticket was claimed for you
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Ticket"
                  - $ref: "#/components/schemas/ConventionHints"
                  - type: object
                    properties:
                      lease: { $ref: "#/components/schemas/Lease" }
        "204": { description: No matching ready work within the wait window }

  /events:
    get:
      tags: [events]
      summary: Read the event log from a cursor (the only source of truth for "what changed")
      parameters:
        - { name: since, in: query, required: true, schema: { type: integer }, description: last seen global_seq; 0 for from-start }
        - { name: project, in: query, schema: { type: string } }
        - { name: ticket, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string }, description: comma list of event kinds }
        - { name: wait, in: query, schema: { type: integer, default: 0, maximum: 120 }, description: long-poll seconds }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        "200":
          description: Events after `since`, oldest first; empty array on wait timeout
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/Event" } }
                  cursor: { type: integer, description: pass as next `since` }

  /events/stream:
    get:
      tags: [events]
      summary: SSE stream of events (doorbell; cursor remains the source of truth)
      description: |
        `text/event-stream`. Each event's `id:` is its global_seq, so
        `Last-Event-ID` resumes seamlessly. Consumers must treat the stream as
        lossy and reconcile via GET /events on reconnect.
      parameters:
        - { name: since, in: query, schema: { type: integer } }
        - { name: project, in: query, schema: { type: string } }
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema: { type: string }

  /export:
    get:
      tags: [admin]
      summary: Export tickets (with comments and deps) as JSONL — read scope
      description: |
        Streams one JSON object per line (`application/x-ndjson`): each line is
        a full ticket (its `blocked_by` array carries the dependency edges) plus
        a `comments` array. `metadata` and `links` ride along verbatim, so the
        export is a faithful snapshot. Round-trips through the `takomo import
        --from takomo` CLI verb. Honors token project scoping; `project`
        narrows to one project.
      parameters:
        - { name: project, in: query, schema: { type: string }, description: narrow to one project (else all readable projects) }
      responses:
        "200":
          description: JSONL stream, one ticket object per line
          content:
            application/x-ndjson:
              schema: { type: string }

  /export/sqlite:
    get:
      tags: [admin]
      summary: Download the whole database as one SQLite file — admin scope, unrestricted token
      description: |
        An operator backup, and a different kind of thing from GET /export. That
        one is a logical, per-project export of tickets; this is the entire store
        as a byte-exact SQLite database — every project, plus tokens, OAuth
        clients, shares, answer grants and the event log.

        There is no per-project variant and there will not be one: most of those
        tables do not hang off a project at all. Use `GET /export?project=<id>`
        for the project-shaped export.

        Taken with `VACUUM INTO`, not a file copy, so the result is consistent
        and includes commits still sitting in the WAL. The body is a single
        self-contained file (`journal_mode=delete`, no `-wal` sidecar) that
        `sqlite3` opens directly.

        Requires the `admin` scope AND a token with no project allowlist. A
        token limited to one project is refused `auth.project`, because the file
        contains every other project's rows along with token hashes and OAuth
        client secrets, and so cannot be narrowed to match the allowlist.
      responses:
        "200":
          description: The database file; Content-Disposition names it takomo-<timestamp>.sqlite
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment filename for the download
          content:
            application/vnd.sqlite3:
              schema: { type: string, format: binary }
        "403":
          description: Missing the admin scope (auth.scope), or the token carries a project allowlist (auth.project)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /metrics:
    get:
      tags: [admin]
      summary: Store metrics — read scope, scoped to readable projects
      description: |
        Observability over the store: ticket counts by state and by category
        per project, open (unexpired) claim counts, and the total event count.
        A token scoped to a subset of projects only sees those projects.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at: { type: string, format: date-time }
                  totals:
                    type: object
                    properties:
                      projects: { type: integer }
                      tickets: { type: integer }
                      open_claims: { type: integer }
                      events: { type: integer }
                  projects:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        total: { type: integer }
                        open_claims: { type: integer }
                        by_state: { type: object, additionalProperties: { type: integer } }
                        by_category: { type: object, additionalProperties: { type: integer } }

  /shares:
    post:
      tags: [shares]
      summary: Mint a shareable, read-only, expiring web link — write scope
      description: |
        Creates a scoped, read-only, auto-expiring view of the board and mints a
        distinct **share token** for it. The share token grants ONLY the
        `/v1/shares/self*` read endpoints; it can neither read arbitrary
        projects nor write anything. Two scopes:

        - `kind: project` — every ticket in the referenced project.
        - `kind: epic` — the referenced ticket plus its FULL recursive
          descendant subtree (walked via `parent`). Any ticket can be a subtree
          root; `epic` is just the common case. The stored/echoed `kind` for
          this scope is `subtree`.

        The plaintext `token` is returned ONCE (only its SHA-256 is stored). The
        returned `path` (`/board#s=<token>`) carries the token in the URL
        FRAGMENT so it stays out of server logs and Referer headers. Anyone with
        the link can view the scoped board (read-only) until it expires.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareCreate" }
      responses:
        "201":
          description: Created — `token` and `path` are shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareCreated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Invalid kind or ttl
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [shares]
      summary: List share metadata — read scope (admin sees all; else own shares)
      description: |
        Lists share metadata. An `admin`-scoped token sees every share; any
        other reader sees only the shares it created. Never returns the token or
        its hash.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Share" }

  /shares/{id}:
    delete:
      tags: [shares]
      summary: Revoke a share — write scope (creator or admin)
      description: |
        Revokes a share immediately; its token then returns `410 Gone` on every
        `self*` endpoint. Allowed for the share's creator or any admin.
        Idempotent — revoking an already-revoked share still returns 204.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: 'share id, e.g. "share_a8f2k1x9q7z3"' }
      responses:
        "204": { description: Revoked }
        "403":
          description: Not the creator and not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /shares/self:
    get:
      tags: [shares]
      summary: The share's own scope + workflow — share token
      security:
        - shareBearer: []
      description: |
        Authenticated by the SHARE token (not a normal `tk_` token). Returns the
        share's scope and the project workflow, enough for the board to render
        the columns. An expired or revoked share returns `410 Gone`.

        Every request on the `/shares/self*` routes is charged to this share's
        per-link sliding window of 120 requests/minute, shared by every viewer
        holding the link. Unlike the `tk_` budget, **reads are charged** — a share is
        a read-only bearer capability meant to be pasted around, so reads are the
        whole of what it can do. See spec/auth.md.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareSelf" }
        "401":
          description: Missing or unrecognized share token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: The shared link has expired or been revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: |
            `share.rate_limited` — this link exceeded 120 requests/minute. Carries
            `Retry-After`; the link itself still works.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: |
            `share.kind_unrecognized` — the share's stored scope kind is neither
            `project` nor `subtree`, so it cannot be resolved to a scope. The
            share is refused rather than widened; nothing is readable through it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /shares/self/tickets:
    get:
      tags: [shares]
      summary: The tickets in the share's scope (read-only) — share token
      security:
        - shareBearer: []
      description: |
        Authenticated by the SHARE token. Returns **one page** of the tickets in
        scope (project: all in the project; epic/subtree: the root plus recursive
        descendants), oldest first, read-only. Archived tickets are excluded unless
        `include_archived=true`.

        **Paged, and bounded whatever the caller asks for.** This used to return the
        entire scope with no `LIMIT`, which behind a credential designed to be
        pasted around meant an arbitrarily large scan anyone holding the link could
        trigger repeatedly. `limit` defaults to 200 and is clamped to 200; `cursor`
        takes the previous page's `next_cursor`.

        **It never truncates silently.** `next_cursor` is non-null exactly when more
        tickets remain, and a page that leaves rows behind also carries a `warning`
        naming the call that fetches the rest. Keep paging while `next_cursor` is
        set, carrying `include_archived` along.

        Requests on this path are charged to the share's own per-link budget — see
        the `429` below and spec/auth.md.
      parameters:
        - { name: include_archived, in: query, schema: { type: boolean, default: false }, description: include archived tickets }
        - { name: limit, in: query, schema: { type: integer, default: 200, minimum: 1, maximum: 200 }, description: 'page size; values above the maximum are clamped, not refused' }
        - { name: cursor, in: query, schema: { type: string }, description: the previous page's next_cursor }
      responses:
        "200":
          description: One page of the share's scope.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Ticket" } }
                  next_cursor:
                    type: [string, "null"]
                    description: pass as `cursor` for the next page; null when this is the last one
                  warning:
                    type: string
                    description: >-
                      Present only when tickets remain beyond this page, spelling out
                      the next call. A partial view of a shared board must never look
                      complete.
        "410":
          description: The shared link has expired or been revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: |
            `share.rate_limited` — this link has exceeded its budget of 120
            requests/minute (see spec/auth.md). Carries `Retry-After`. The budget is
            per link and shared by every viewer holding it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: |
            `share.kind_unrecognized` — the share's stored scope kind is neither
            `project` nor `subtree`. No tickets are returned: an unresolvable
            scope fails closed, never back to the whole project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /shares/self/tickets/{id}:
    get:
      tags: [shares]
      summary: One in-scope ticket with comments + deps — share token
      security:
        - shareBearer: []
      description: |
        Authenticated by the SHARE token. Returns one ticket (with `comments`
        and `deps`) for the board's detail panel. A ticket outside the share's
        scope returns `404` — the share cannot reach it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: The shared link has expired or been revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: |
            `share.rate_limited` — this link exceeded 120 requests/minute, counted
            across all `/shares/self*` routes together. Carries `Retry-After`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: |
            `share.kind_unrecognized` — the share's stored scope kind is neither
            `project` nor `subtree`, so membership in its scope cannot be decided.
            The ticket is withheld rather than assumed in scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /mcp:
    servers:
      - url: /
    post:
      tags: [identity]
      summary: Hosted MCP endpoint (Model Context Protocol, streamable HTTP transport)
      description: |
        A Model Context Protocol server hosted in-process, so an agent can attach
        with `claude mcp add --transport http https://<host>/mcp` instead of
        running the Node stdio wrapper in `clients/mcp`. This is NOT part of the
        frozen `/v1` REST surface — it lives at the root path and speaks
        JSON-RPC 2.0 over the MCP Streamable HTTP transport (spec 2025-06-18).

        Mode: stateless, `application/json` responses. Every POST is a
        self-contained JSON-RPC message (`initialize`, `tools/list`,
        `tools/call`, ...); no session id is issued and none is required, which
        lets the endpoint scale horizontally with no session affinity.

        Auth: the SAME bearer-token path as the REST API. Send
        `Authorization: Bearer tk_...` on every request; missing, invalid, and
        SHARE (`tks_`) tokens are rejected with 401 before any MCP frame is
        processed. Each tool re-checks scope and project access exactly like the
        equivalent REST endpoint, and calls the internal store directly (no HTTP
        round-trip back to this process).

        Rate limiting: the per-token write budget is charged **per tool call**,
        not per HTTP request — every MCP frame is a POST, so the method cannot
        tell a read from a write. The read-only tools (`takomo_show`,
        `takomo_list`, `takomo_ready`, `takomo_deps`, `takomo_questions`,
        `takomo_projects`, `takomo_workflow`, `takomo_roadmap`,
        `takomo_schedules`, `takomo_whoami`) cost nothing, and neither do `initialize`,
        `tools/list`, or an unknown tool name; every other tool debits one
        write. Exhausting the budget comes back as a tool-level error (HTTP
        200, `result.isError`) whose payload carries `code: rate.limited`,
        `status: 429`, and the same message and remedy the REST surface sends.

        Tools (mirroring the Node MCP work loop): `takomo_new`,
        `takomo_list`, `takomo_ready`, `takomo_show`, `takomo_claim`,
        `takomo_next`, `takomo_start`, `takomo_transition`,
        `takomo_done`, `takomo_block`, `takomo_cancel`,
        `takomo_comment`, `takomo_link`, `takomo_dep`, `takomo_deps`,
        `takomo_heartbeat`, `takomo_release`, `takomo_archive`, `takomo_move`,
        `takomo_projects`, `takomo_workflow`, `takomo_roadmap`, `takomo_ask`,
        `takomo_answer`, `takomo_questions`, `takomo_withdraw`,
        `takomo_answer_link`, `takomo_whoami`, `takomo_schedules`,
        `takomo_schedule_new`. Claimed
        tickets track a fencing token that later transitions echo automatically;
        convenience verbs (start/done/block/cancel) resolve target states from
        the project workflow by category.

        Schedules: `takomo_schedule_new` is the one write tool whose result may do
        nothing. An agent proposing a cadence needs only `write`, but unless the
        project turned `schedule_approval` off the schedule lands `pending` with
        no next slot — the sweep's index is partial, so it cannot see the row at
        all. **Activating needs `human`**, which is what keeps a `write`
        credential from starting something that outlives it. The tool's `note`
        says so in words; an agent that ignores it will poll a schedule a human
        may never activate.

        Links: `takomo_link` writes only the key it names and lets the store
        merge it, exactly like `PATCH /v1/tickets/{id}` with
        `links: {"<key>": "<value>"}` — a concurrent writer's other keys survive,
        and `value: null` (or omitted) deletes the key, deleting one that is not
        set being a no-op. It does not read-modify-write the whole `links`
        object, which would resurrect a key deleted between its read and its
        write.

        Leases: `takomo_claim`, `takomo_next` and `takomo_start` take
        `ttl_seconds` (1-3600, default 900) and `takomo_heartbeat` renews a lease
        the caller holds — the MCP equivalents of the `ttl_seconds` body field on
        `POST /v1/tickets/{id}/claim`, `POST /v1/ready/claim`, and
        `POST /v1/tickets/{id}/heartbeat`. `takomo_next` long-polls with the same
        `wait_seconds` contract as `POST /v1/ready/claim` (0..=120). Both
        transports resolve the fence the same way (holding the active claim means
        the ticket's current `fence_seq`), so an MCP caller does not have to track
        the token to renew its own lease; an explicit `fence` still overrides. A
        lapsed lease cannot be revived on either transport.

        `takomo_new` accepts an optional `idempotency_key` (same semantics as the
        Node wrapper and the REST `Idempotency-Key` header), plus `metadata` and
        `blocked_by` on create. `takomo_ask` accepts `recommended` as any JSON
        value, matching `POST /v1/questions`.
      requestBody:
        required: true
        description: A single JSON-RPC 2.0 request or notification (an MCP message).
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, const: "2.0" }
                id:
                  description: Present for requests, omitted for notifications.
                  oneOf:
                    - { type: string }
                    - { type: integer }
                method:
                  type: string
                  examples: [initialize, tools/list, tools/call]
                params: { type: object }
      responses:
        "200":
          description: |
            A JSON-RPC 2.0 response. For `tools/call`, `result.content[0].text`
            carries the tool's JSON payload; tool-level failures set
            `result.isError` and relay the store's `message` / `remedy` /
            `allowed_transitions` so the agent can self-correct.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc: { type: string, const: "2.0" }
                  id:
                    oneOf:
                      - { type: string }
                      - { type: integer }
                  result: { type: object }
                  error: { type: object }
        "202":
          description: Accepted — returned for a JSON-RPC notification (no id).
        "401":
          description: |
            Missing, invalid, or share (`tks_`) token.

            When the server is configured with a public base URL
            (`TAKOMO_PUBLIC_URL`), this response also carries
            `WWW-Authenticate: Bearer resource_metadata="<base>/.well-known/oauth-protected-resource"`.
            That header is how a hosted client discovers the OAuth authorization
            server; see the `/oauth/*` paths below.
          headers:
            WWW-Authenticate:
              description: |
                RFC 9728 challenge pointing at this resource's protected-resource
                metadata. Present only when OAuth is configured.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------------------
  # OAuth 2.1 authorization server. Root paths, NOT part of the frozen /v1
  # surface, and the one family of endpoints in this contract whose error bodies
  # are RFC 6749's rather than takomo's Error schema — an OAuth client parses
  # `error` and nothing else. See `x-oauth-errors` at the root of this document.
  #
  # All six are unauthenticated by design: they are what a client uses in order to
  # obtain a credential. Consent is authenticated in-band, by the human pasting a
  # takomo token into the consent form.

  /.well-known/oauth-protected-resource:
    servers:
      - url: /
    get:
      tags: [oauth]
      summary: Protected-resource metadata (RFC 9728)
      description: |
        Names the protected resource (`<base>/mcp`) and the authorization server
        that guards it. Also served at
        `/.well-known/oauth-protected-resource/mcp`, the suffixed form a client
        probes when the resource lives at a path.

        `resource` must equal the URL the user types into their client, byte for
        byte — Claude compares the two — which is why the server refuses to guess
        it and takes `TAKOMO_PUBLIC_URL` instead.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource: { type: string, examples: ["https://takomo.example.com/mcp"] }
                  authorization_servers: { type: array, items: { type: string } }
                  scopes_supported: { type: array, items: { type: string } }
                  bearer_methods_supported: { type: array, items: { type: string } }
                  resource_name: { type: string }
        "404":
          description: |
            No OAuth authorization server is configured on this instance —
            `TAKOMO_PUBLIC_URL` is unset or unusable as an issuer; see
            `temporarily_unavailable` under `x-oauth-errors`. The body names the
            variable to set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OauthError" }

  /.well-known/oauth-authorization-server:
    servers:
      - url: /
    get:
      tags: [oauth]
      summary: Authorization-server metadata (RFC 8414)
      description: |
        Advertises `code_challenge_methods_supported: ["S256"]`, which the MCP
        authorization spec requires so a client can verify PKCE support before
        starting a flow, and `token_endpoint_auth_methods_supported: ["none"]`,
        because every client here is a public client.

        `client_id_metadata_document_supported` is deliberately absent: CIMD is not
        implemented, and advertising it would stop a capable client from falling
        back to dynamic registration.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer: { type: string }
                  authorization_endpoint: { type: string }
                  token_endpoint: { type: string }
                  registration_endpoint: { type: string }
                  scopes_supported: { type: array, items: { type: string } }
                  response_types_supported: { type: array, items: { type: string } }
                  response_modes_supported: { type: array, items: { type: string } }
                  grant_types_supported: { type: array, items: { type: string } }
                  token_endpoint_auth_methods_supported: { type: array, items: { type: string } }
                  code_challenge_methods_supported: { type: array, items: { type: string } }
        "404":
          description: OAuth is not configured on this instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OauthError" }

  /oauth/register:
    servers:
      - url: /
    post:
      tags: [oauth]
      summary: Dynamic client registration (RFC 7591)
      description: |
        Registers a public client. Unauthenticated, as the RFC requires, and
        therefore rate-limited by a single global sliding window rather than per
        caller — there is no caller identity to key one by.

        Unrecognized metadata members are IGNORED rather than rejected (RFC 7591
        §2). This is the one mutating endpoint in this contract that does not
        return `validation.unknown_field`: real clients send `client_uri`,
        `logo_uri`, `software_id` and more, and refusing those would refuse every
        one of them.

        No `client_secret` is ever issued. PKCE is the client authentication at the
        token endpoint.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uris]
              properties:
                redirect_uris:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string }
                  description: |
                    Absolute https URIs with no fragment. Plain http is accepted
                    only for loopback hosts (RFC 8252 native clients). Matched
                    literally at the authorization endpoint — a differing scheme
                    host port path or trailing slash is a different URI — which is
                    what prevents an open redirect.
                client_name:
                  type: string
                  description: |
                    shown on the consent screen and in the operator's token listing;
                    truncated to 200 characters. Control characters and bidirectional
                    overrides are refused (`invalid_client_metadata`) rather than
                    stripped: registration is unauthenticated and this value is
                    rendered, so a name that can forge a line of a terminal listing is
                    not accepted at all.
                token_endpoint_auth_method:
                  type: string
                  const: none
                  description: optional; any other value is refused rather than silently downgraded
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id: { type: string, examples: ["oc_a8f2k1x9q7z3n4m6"] }
                  client_id_issued_at: { type: integer, description: seconds since the epoch }
                  client_name: { type: string }
                  redirect_uris: { type: array, items: { type: string } }
                  grant_types: { type: array, items: { type: string } }
                  response_types: { type: array, items: { type: string } }
                  token_endpoint_auth_method: { type: string, const: none }
        "400":
          description: "`invalid_redirect_uri` or `invalid_client_metadata`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OauthError" }
        "404":
          description: OAuth is not configured on this instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OauthError" }
        "429":
          description: |
            The global registration budget for this minute is spent. Carries
            `Retry-After`. That budget paces registration; what bounds the table is
            the sweep — past 24h, a registration with no authorization code and no
            refresh token left referencing it is deleted (see spec/auth.md).
          headers:
            Retry-After:
              description: seconds to wait before retrying
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OauthError" }

  /oauth/authorize:
    servers:
      - url: /
    get:
      tags: [oauth]
      summary: Consent screen (authorization endpoint, authorization code + PKCE)
      description: |
        Returns an HTML consent page, not JSON: the response is for a human in a
        browser. It states which client is asking, offers the requested scopes as
        checkboxes the human can narrow, and takes a takomo token as the credential
        that authorizes the grant.

        **Validation order is load-bearing.** `client_id` and `redirect_uri` are
        checked first, against the client's registration; until both are known
        good, errors are rendered as a page and nothing is redirected anywhere.
        Only afterwards are protocol errors reported the RFC 6749 §4.1.2.1 way, by
        redirecting `error` and `error_description` (with `state`) to the verified
        target.

        The `admin` scope is never offered and never granted, whatever the token
        pasted into the form carries. `offline_access` is not offered either, for the
        opposite reason: it grants nothing, a refresh token is issued regardless, and
        a checkbox whose only effect would be a connection that dies within the hour
        is a trap rather than a choice — so the page states it in a sentence and
        emits no checkbox for it.
      security: []
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, const: code } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - name: redirect_uri
          in: query
          required: false
          schema: { type: string }
          description: |
            Must match one the client registered. May be omitted only when the
            client registered exactly one.
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, const: S256 } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - name: scope
          in: query
          required: false
          schema: { type: string }
          description: |
            Space-separated. Grantable values are `read`, `write`, `human`, plus
            `offline_access`. Unknown values are dropped rather than refused; the
            token response echoes what was actually granted. Omitted — or present but
            empty, which is the same statement — means offer everything grantable.
        - { name: resource, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The consent page (`text/html`).
          content:
            text/html:
              schema: { type: string }
          headers:
            Content-Security-Policy:
              schema: { type: string }
              description: |
                `form-action` names `'self'` **and the origin of the verified
                `redirect_uri`**. Both are required: the form posts back here, and
                the response to that post is a 302 onward to the client's callback.
                A browser applies `form-action` to every hop of the navigation a
                form starts rather than to its immediate target alone, so a policy
                naming only `'self'` blocks the redirect that completes the flow —
                the human sees a click that does nothing and the client reports
                only that it could not connect. The origin alone appears, never the
                path, because CSP matches a path prefix and the callback path is
                not ours to constrain. On the `400` page below, which redirects
                nowhere, `form-action` stays `'self'` and the rejected target is
                not named.
        "302":
          description: |
            A protocol error, redirected to the verified `redirect_uri` as `error`
            / `error_description` / `state`.
          headers:
            Location:
              schema: { type: string }
        "400":
          description: |
            An HTML page. Reached when `client_id` is unknown or `redirect_uri` is
            not registered — the two cases where there is no verified target to
            redirect to, so nothing is sent onward.
          content:
            text/html:
              schema: { type: string }
        "404":
          description: OAuth is not configured on this instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OauthError" }
    post:
      tags: [oauth]
      summary: Submit consent
      description: |
        The consent form's own target, `application/x-www-form-urlencoded`. Carries
        the authorization request back as hidden fields, plus `token` (the takomo
        credential approving it), the `grant_scope` values left checked, and
        `action` = `approve` or `deny`.

        On approval the issued authorization code is bound to a snapshot of that
        token's authority: same actor, the checked scopes intersected with the ones
        it holds, its project allowlist, its write budget. Consent narrows; it never
        widens.

        A credential the server will not accept re-renders the form with an
        explanation (200) rather than redirecting a failure the human could not act
        on. That re-render preserves the `grant_scope` values submitted, so a scope
        the human unchecked stays unchecked; only the first `GET` pre-checks
        everything requested.

        Hidden fields the original request did not carry are absent rather than
        empty, and an empty `scope` / `state` / `resource` is read as absent — a
        present-but-empty parameter here is the form round trip inventing one, not the
        client asking for nothing. Consequently `state` comes back on the redirect
        only when the client sent one (RFC 6749 §4.1.2), and otherwise byte-for-byte
        as received: it is opaque, so unlike the parameters this server interprets it
        is never trimmed.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, code_challenge, action]
              properties:
                client_id: { type: string }
                redirect_uri: { type: string }
                code_challenge: { type: string }
                code_challenge_method: { type: string, const: S256 }
                response_type: { type: string, const: code }
                state: { type: string }
                scope: { type: string }
                resource: { type: string }
                token:
                  type: string
                  description: a takomo bearer token the human holds
                grant_scope:
                  type: array
                  items: { type: string }
                  description: |
                    repeated; the scopes left checked on the form. `offline_access` is
                    never among them — it is not rendered as a checkbox — and is
                    echoed on the granted scope whenever the client requested it.
                action: { type: string, enum: [approve, deny] }
      responses:
        "302":
          description: |
            Approved (`code` and `state` on the registered `redirect_uri`) or denied
            (`error=access_denied`).
          headers:
            Location:
              schema: { type: string }
        "200":
          description: |
            The consent page again, carrying an explanation — the pasted token was
            absent, unrecognized, revoked, expired, or carries none of the checked
            scopes.
          content:
            text/html:
              schema: { type: string }
          headers:
            Content-Security-Policy:
              schema: { type: string }
              description: |
                As on the `GET`: `form-action` names `'self'` and the verified
                callback origin, so a retry from this re-rendered form can complete.
        "400":
          description: An HTML page — unknown client or unregistered redirect URI.
          content:
            text/html:
              schema: { type: string }
        "404":
          description: OAuth is not configured on this instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OauthError" }

  /oauth/token:
    servers:
      - url: /
    post:
      tags: [oauth]
      summary: Token endpoint — authorization_code and refresh_token grants
      description: |
        Takes `application/x-www-form-urlencoded` (RFC 6749 §4.1.3). Worth stating
        because it is a common failure: a JSON-only body parser answers 415 here and
        the client reports an unexplained connection failure.

        **What an access token is:** an ordinary `tk_` takomo token with an expiry
        (one hour). It appears in `GET /v1/tokens`, is revocable with
        `DELETE /v1/tokens/{id}`, and carries the consenting token's own write
        budget — there is no second credential type and no second auth path.

        **Two revocation levers.** `DELETE /v1/tokens/{id}` on the **derived** token
        ends that one connection: it 401s at once and its refresh family is revoked
        with it, so the client cannot answer the 401 by rotating back, and no other
        connection is touched. Reach for that one when a single client misbehaves.
        `DELETE` on the **consenting** token ends every connection approved with it —
        both grants re-check it and answer `invalid_grant` once it is revoked or
        deleted — along with the human's own access.

        A consenting token that merely **expires** does not, deliberately: a
        revocation is a decision that has to cascade, an expiry is bookkeeping, and
        killing a working connector over a stale `--expires` flag would buy nothing
        revocation does not already give. The cost, stated plainly: a short-lived
        consent token does not bound the connection it approved — ending one is a
        revocation, on either row.

        **Refresh tokens rotate on every use**, as OAuth 2.1 requires for public
        clients. The superseded *access* token is left to expire on its own, since
        clients refresh proactively while requests may still be in flight on it.
        Presenting an already-rotated refresh token is treated as reuse: the whole
        family descended from that consent is revoked, access tokens included.

        `client_credentials` is not offered. Every credential here represents a
        specific human's consent; for a non-interactive agent, mint a token directly
        with `takomo token create`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token] }
                client_id: { type: string }
                code:
                  type: string
                  description: authorization_code grant
                code_verifier:
                  type: string
                  description: authorization_code grant; PKCE (RFC 7636)
                redirect_uri:
                  type: string
                  description: authorization_code grant; must match the value sent to /oauth/authorize
                refresh_token:
                  type: string
                  description: refresh_token grant
      responses:
        "200":
          description: "Credentials issued. `Cache-Control: no-store`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string, examples: ["tk_R7xK2mQ4vBnL8sTfWzYp1c"] }
                  token_type: { type: string, const: Bearer }
                  expires_in: { type: integer, examples: [3600] }
                  refresh_token: { type: string, examples: ["tkr_9Fj2qHs..."] }
                  scope:
                    type: string
                    description: |
                      What was actually granted. May be narrower than requested —
                      the human can uncheck scopes on the consent screen — which RFC
                      6749 §5.1 requires to be echoed.
        "400":
          description: |
            `invalid_request`, `unsupported_grant_type`, or `invalid_grant`. The last
            covers every refused grant — unknown, expired, replayed, wrong client,
            wrong redirect URI, failed PKCE, this connection revoked, consenting token
            revoked — with the reason in `error_description`. A revoked connection is
            worded apart from a replay on purpose: one is an operator ending it, the
            other may be a stolen credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OauthError" }
        "404":
          description: OAuth is not configured on this instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OauthError" }

  /questions:
    get:
      tags: [questions]
      summary: List questions on the ask-a-human board (the inbox read-model)
      description: |
        Open questions by default, ordered by urgency then age. Filter by
        `project`, `ticket`, or `status` (comma-separated).

        Two ways to ask "who is this waiting on". `assignee=<handle>` reads one
        person's queue — including somebody else's, which is the point of a shared
        board — and `assignee=none` is the triage read: what nobody has been asked
        yet. `expertise` (repeatable) filters by explicit routing tags.

        `mine=true` is everything waiting on *you*, in both senses this board has:
        addressed to the person your token belongs to, OR covered by your
        `expert:<tag>` scopes. They are ORed deliberately — requiring both would
        hide a question aimed straight at you because it happened to carry no tag.
        A token with neither a person nor an expert scope gets an empty list and a
        note saying so.

        The result is paginated: `limit` (clamped 1..500, default 500) bounds a
        page and `cursor` (an opaque row offset) fetches the next one. When more
        rows remain the response carries a non-null `next_cursor` to pass back as
        `cursor`.

        `total` is the whole match, counted with the same predicate that selected
        the page, and `next_cursor` is derived from it. Before 0.4 the cursor was
        inferred instead — "this page is full, so there is probably more" — which
        offered a cursor to an empty page whenever the queue happened to be an
        exact multiple of the page size.
      parameters:
        - { name: project, in: query, schema: { type: string } }
        - { name: ticket, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string }, description: "Comma-separated: open (default), answered, withdrawn, expired" }
        - { name: mine, in: query, schema: { type: boolean }, description: "Only questions waiting on you: addressed to your person, or covered by your expert:<tag> scopes" }
        - { name: assignee, in: query, schema: { type: string }, description: "One person's queue by handle, or 'none' for the questions nobody has been asked yet" }
        - { name: expertise, in: query, schema: { type: string }, description: Repeatable tag filter (match any) }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 }, description: Max questions per page }
        - { name: cursor, in: query, schema: { type: integer, minimum: 0 }, description: Row offset from a previous next_cursor }
      responses:
        "200":
          description: The matching questions (one bounded page).
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Question" }
                  total:
                    type: integer
                    description: Questions matching the filter, ignoring limit and cursor.
                  limit: { type: integer, description: 'The page size actually applied.' }
                  note: { type: string, description: 'Present only when questions remain beyond this page.' }
                  next_cursor:
                    type: [integer, "null"]
                    description: Pass as `cursor` to fetch the next page; null when the last page was returned.
    post:
      tags: [questions]
      summary: Ask a human — raise a question and park the ticket (block-and-resume)
      description: |
        Requires the `write` scope. Parks the ticket in a blocked state and
        releases the caller's lease, then records the question. End the run and
        resume the ticket once a human answers. Echo the lease `fence` while you
        hold it. A ticket may hold several open questions; it resumes only when
        all are answered (a barrier). Retrying with the same ticket, asker, mode,
        kind, and title while that earlier question is still **open** returns the
        existing question (HTTP 201 with the same body shape) rather than creating
        a second row — safe for the CLI to replay after a transient failure. Once
        the earlier question is answered, withdrawn, or expired, the same tuple
        creates a new question.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, kind, title]
              properties:
                ticket: { type: string }
                mode:
                  type: string
                  enum: [blocking, advisory]
                  default: blocking
                  description: blocking parks+resumes the ticket (needs a parkable state); advisory records a routed decision with no state change (e.g. an epic-level question)
                kind: { type: string, enum: [confirm, choose, clarify, approve] }
                title: { type: string }
                body: { type: string }
                options:
                  type: array
                  description: 'For kind=choose (>= 2). Each item is a string, or an object {value, desc} to give the option a one-line trade-off description shown in the inbox.'
                  items:
                    oneOf:
                      - { type: string }
                      - type: object
                        required: [value]
                        properties:
                          value: { type: string }
                          desc: { type: string }
                option_notes:
                  type: array
                  items: { type: string }
                  description: 'Alternative to {value,desc}: per-option descriptions parallel to `options` (same length).'
                multi: { type: boolean, description: 'For kind=choose, allow selecting several options (multi-select)' }
                recommended_multi: { type: array, items: { type: string }, description: 'For a multi choose, the recommended set of options; every entry must be one of `options`' }
                recommended: { description: "The agent's suggested answer. For a question with `options` it must be one of them exactly (a string) or null — `on_timeout=recommended` stores it as the answer, so a recommendation that is not an option could never be one. For a kind that carries no options (confirm/approve/clarify) it is free-form JSON." }
                recommended_note: { type: string, description: A short rationale for the recommendation ("why") }
                confidence: { type: integer, minimum: 1, maximum: 4, description: How strong the recommendation is (1 tentative … 4 very strong) }
                summary: { type: string, description: One-line summary for the inbox list preview }
                expertise:
                  type: array
                  items: { type: string }
                  description: Routing tags, e.g. ["domain:billing"]
                assignee:
                  type: string
                  description: |
                    Address this question to one person, by handle (`GET /v1/users`).
                    They must be a member of the ticket's project. Omit it and the
                    question goes to the open queue, where anyone with the expertise
                    can take it — and `POST /v1/questions/{id}/assign` can address it
                    later, which is the usual case, since the agent asking rarely
                    knows who owns the decision.
                urgency: { type: string, enum: [critical, high, normal, low] }
                expires_in_seconds: { type: integer, description: Auto-expire deadline }
                on_timeout: { type: string, enum: [recommended, escalate, cancel] }
                fence: { type: integer }
      responses:
        "201":
          description: |
            The question plus the parked ticket. Both a fresh ask and an
            idempotent replay of an identical still-open ask (same ticket, asker,
            mode, kind, title) return **201** with the same response shape — the
            replay carries the existing question's id, not a new row. There is no
            200 arm for replay; compare question ids across retries to detect
            dedup. Safe for the CLI to replay after a transient failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: { $ref: "#/components/schemas/Question" }
                  ticket: { $ref: "#/components/schemas/Ticket" }
                  note: { type: string }
                  hints:
                    type: array
                    items: { type: string }
                    description: Non-blocking suggestions for optional fields that would make the inbox render richer.
        "400":
          description: Malformed body (unknown field, missing/mistyped ticket/kind/title).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            Invalid value: bad kind/urgency/on_timeout, choose with < 2 options,
            an `approve` question naming neither an expertise tag nor an assignee
            (it must name something that gates it), `on_timeout=recommended`
            with a window under the required minimum, or a `recommended` /
            `recommended_multi` that is not among `options`
            (`validation.recommended`, `validation.recommended_multi`) — the same
            rule POST /v1/questions/{id}/options enforces on a revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The ticket has no self-service edge into a blocked state, so it can't be parked (question.no_park).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /questions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Question id, e.g. "q-9f3ka2xz"
    get:
      tags: [questions]
      summary: Fetch one question
      responses:
        "200":
          description: The question.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "404": { $ref: "#/components/responses/NotFound" }

  /questions/{id}/assign:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [questions]
      summary: Address an open question to a person, or return it to the queue (human scope)
      description: |
        A separate operation from asking, because the agent that raised the question
        usually cannot know who should decide it — it knows a billing question when
        it writes one, not which colleague owns billing this month. Triage is a human
        act that happens afterwards.

        **Assignment is routing, not a lock.** Any `human` token may still answer the
        three ordinary kinds, so a decision is never stranded because the assignee is
        away; what assignment changes is who the inbox sorts it to, and what `mine`
        means. The single exception is an `approve`, where being the named person is
        one of the two authorities that can answer it.

        Only while the question is open: reassigning a settled one would rewrite who
        a recorded decision was waiting on. The handover is mirrored onto the ticket
        thread and recorded as a `question_assigned` event.

        Send `{"assignee": null}` to return it to the open queue. An absent field is
        refused rather than guessed at.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee]
              properties:
                assignee:
                  type: [string, "null"]
                  description: 'the person''s handle (or usr- id), or null for the open queue'
      responses:
        "200":
          description: The question, with its assignee resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: { $ref: "#/components/schemas/Question" }
        "403": { description: Token lacks the human scope or the question's project }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The question is no longer open (`question.not_open`), the person is
            disabled (`user.disabled`), or they are not a member of this project
            (`user.not_member`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /questions/{id}/answer:
    post:
      tags: [questions]
      summary: Answer a question (the human authorization gate) and resume the ticket
      description: |
        Requires the `human` scope. Records the reply and resumes the ticket.

        **Relaying.** A caller that cannot answer may instead *record a decision a
        human already made elsewhere*, by sending `on_behalf_of` with that
        person's name. That path needs the `answer:relay` scope rather than
        `human`, stores the named human as `answered_by`, and records the caller
        as `relayed_by` on the `question_answered` event — so a relayed decision
        stays distinguishable from a first-hand one. It exists because the
        `human` gate is about *authority*, while the thing it also blocked was
        *transcription*: an agent that has been told the decision could not write
        it down, leaving the question open and the ticket parked over bookkeeping.

        Three rules keep that safe, and they are enforced in the store rather than
        the handler so no caller can route around them: an actor may not relay a
        question it **asked itself** (`answer.relay_self`) — otherwise an agent
        could request approval and grant it to itself; an **`approve` question is
        never relayable** (`answer.relay_approve`), because being answered from a
        token holding `expert:<tag>` is the *evidence* that a named expert
        exercised their authority and a relayed name is only a claim about it;
        and a token that already holds `human` is told to answer as itself
        (`answer.relay_redundant`) rather than make `answered_by` a claim.

        A relayed answer **does resume the ticket**, carrying the named human's
        authority for the `scope:human` resume edge — the same reasoning the
        timeout path already applies when the system enacts a recommendation.
        Recording the decision without acting on it would be incoherent (naming
        the decider already accepts the attribution, so withholding the resume
        buys no safety against a forged name) and actively harmful: a parked
        ticket is out of the ready queue, so an answered-but-unresumed question
        leaves every inbox while no fleet picks the work up. The resume reason and
        the `question_answered` event both name the relayer.
        `answer` may be a scalar (`true`, an option string, or clarification
        text) or `{ "value": ..., "note": ... }` (a top-level `note` sibling is
        rejected). An `approve` question additionally requires the answerer to
        hold a matching `expert:<tag>` scope.

        The resume goes through the workflow's human-gated (`scope:human`)
        transition out of the parked state. Where the parked state has no
        human-gated exit at all — the `simple` workflow has none anywhere, by
        design — it goes instead through any exit the answerer can take
        (scope satisfied, no claim, no guard) that leads somewhere non-terminal
        and unblocked, preferring a claimable `todo` so the ticket re-enters the
        ready queue. A human gate that exists but is not takeable is never
        routed around.

        The resume is performed by the same transition machinery as
        `POST /v1/tickets/{id}/transition`, with the answerer as the actor and
        their scopes as the authority — so it can also be refused for the
        ordinary transition reasons, and those codes appear in the `resume`
        block. In particular, a lease someone took on the ticket while it was
        parked (possible only where a workflow marks a blocked state
        `claimable`) is superseded only by a `scope:human` resume edge; where the
        workflow declares no human authority there, the answer is recorded but
        the ticket stays parked with `resume.code: claim.held` rather than being
        moved out from under the holder.

        An explicit `resume_to` is strict (a bad target errors). With no
        `resume_to`, the answer is recorded even if the ticket cannot be
        auto-resumed: `resolved_to` is then null and the `resume` block of the
        response carries a `code`, a `message` and a `remedy` saying why the
        ticket is still parked and what to call next. That case also posts a
        second comment on the ticket.

        The answer is mirrored onto the ticket as a comment so the resuming
        agent sees the decision in its normal work loop. The comment names the
        question by **id**, not by restating its title (`Human answered
        q-9f3ka2xz: yes / approved — <note>`); the id resolves to the full
        question via `GET /v1/questions/{id}`. The other question endpoints that
        mirror onto the ticket — `reopen`, `followup`, `reply`, `options` — use
        the same shape. Comment prose is not a contract: do not parse it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { description: "Scalar or { value, note }" }
                resume_to: { type: string, description: Override the resume state }
                on_behalf_of:
                  type: string
                  description: >-
                    The human who actually made this decision. Present = this is a
                    relay, which requires the `answer:relay` scope instead of
                    `human`; absent = the caller is answering as itself. Must be
                    non-empty.
      responses:
        "200":
          description: The answered question and resumed ticket.
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: { $ref: "#/components/schemas/Question" }
                  ticket: { $ref: "#/components/schemas/Ticket" }
                  resume: { $ref: "#/components/schemas/AnswerResume" }
        "400":
          description: Missing `answer`, or an unknown top-level field.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Token lacks the `human` scope (or the `expert:<tag>` an approve needs).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Answer invalid for the kind (non-bool confirm/approve, unknown choose option, empty clarify).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }

  /questions/{id}/answer-link:
    post:
      tags: [questions]
      summary: Mint a per-question answer link for an outside expert
      description: |
        Requires the `human` scope (and, for an `approve` question, the matching
        `expert:<tag>` — you can only delegate authority you hold). Returns a
        scoped, expiring, single-use `tka_` token (shown once) plus the
        `#a=<token>` board path. The holder can read and answer ONLY this
        question, via `/v1/answer/self`, and nothing else.

        Lifetime precedence, most specific first: an explicit `ttl_seconds` here,
        then the question's project `answer_link_ttl_seconds` (see
        `PUT /projects/{project}/answer-link-ttl`), then the built-in default of
        604800 seconds (7 days). The response echoes the lifetime applied as
        `ttl_seconds` and where it came from as `ttl_source`.

        The MCP tool `takomo_answer_link` runs the same implementation, so every
        rule above — the delegation gate included — holds identically there.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds:
                  type: integer
                  minimum: 1
                  maximum: 2592000
                  description: 'Link lifetime in seconds. Omit to use the project default and then the built-in 7 days; max 30 days.'
                actor: { type: string, description: 'Who the answer is attributed to (default human:link:<qid>)' }
      responses:
        "201":
          description: The grant metadata plus the one-time token and board path.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/AnswerGrant" }
                  - type: object
                    properties:
                      token: { type: string, description: 'tka_… — shown once' }
                      path: { type: string, description: '/board#a=<token>' }
                      url: { type: string, description: 'Full URL when TAKOMO_PUBLIC_URL is set' }
                      ttl_seconds: { type: integer, description: 'The lifetime actually applied, in seconds' }
                      ttl_source:
                        type: string
                        enum: [explicit, project, default]
                        description: 'Where that lifetime came from: this request, the project setting, or the built-in default'
                      warning: { type: string, description: 'The token is shown once and anyone holding the link can answer this question' }
        "403":
          description: Token lacks `human` (or the `expert:<tag>` an approve link needs).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The question is not open.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /answer-links/{id}:
    delete:
      tags: [questions]
      summary: Revoke an answer link (creator or admin, `human` scope)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: 'answer-grant id, e.g. "ag_…"' }
      responses:
        "204": { description: Revoked (idempotent) }
        "403": { description: Not the creator and not an admin }
        "404": { $ref: "#/components/responses/NotFound" }

  /answer/self:
    get:
      tags: [questions]
      summary: The one question an answer link can answer (answer-grant auth)
      description: |
        Authenticated by a `tka_` answer-link token (in the `#a=` fragment), NOT
        a normal token. Returns the question plus minimal ticket context.
      security:
        - answerBearer: []
      responses:
        "200":
          description: The question and its ticket context.
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: { $ref: "#/components/schemas/Question" }
                  ticket: { type: [object, "null"] }
                  expires_at: { type: string, format: date-time }
        "410": { description: 'The link is expired, used, or revoked.' }
    post:
      tags: [questions]
      summary: Answer the one question the link grants (answer-grant auth, single-use)
      description: |
        Authenticated by the `tka_` answer-link token. The grant IS the human
        authorization: it answers as its recorded actor with exactly the scope
        needed for this question.

        Single-use is atomic: the link is marked used in the SAME transaction
        that records the answer. Of any number of simultaneous submissions on one
        link exactly one is applied; every other gets `410` and changes nothing.
        A rejected answer (bad option, missing expert scope) rolls the spend back
        with it, so a link is never burned by an attempt that did not land.
      security:
        - answerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { description: "Scalar or { value, note }" }
                resume_to: { type: string }
      responses:
        "200":
          description: The answered question and (for a blocking question) the resumed ticket.
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: { $ref: "#/components/schemas/Question" }
                  ticket: { $ref: "#/components/schemas/Ticket" }
                  resume: { $ref: "#/components/schemas/AnswerResume" }
        "410":
          description: >-
            The link is expired, used, or revoked (`answer.expired`); or it was
            spent by a simultaneous submission while this one was in flight
            (`answer_link.spent`, raised inside the answering transaction — this
            request recorded nothing).

  /questions/{id}/withdraw:
    post:
      tags: [questions]
      summary: Withdraw an open question (the agent no longer needs the answer)
      description: Requires the `write` scope. The ticket stays parked.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: The withdrawn question.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "409": { $ref: "#/components/responses/Conflict" }

  /questions/{id}/reopen:
    post:
      tags: [questions]
      summary: Reopen an answered question — a conditional undo beyond the 30s window
      description: |
        Requires the `human` scope (and, for an `approve` question, the matching
        domain expert). Takes back the decision: the question returns to `open`
        and, for a blocking question that resumed a ticket, the ticket is
        re-parked in a blocked state. Refused with a teaching `409` when the
        ticket already relies on the answer — it has been claimed
        (`question.reopen_claimed`), moved past the state it resumed into
        (`question.reopen_moved`), or archived (`question.reopen_archived`). In
        that case re-ask instead of reopening. Advisory questions (no state
        change) just reopen.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The reopened question and the (re-parked) ticket.
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: { $ref: "#/components/schemas/Question" }
                  ticket: { $ref: "#/components/schemas/Ticket" }
        "409": { $ref: "#/components/responses/Conflict" }

  /questions/{id}/followup:
    post:
      tags: [questions]
      summary: Ask the agent for more research before answering
      description: |
        Requires the `human` scope. Bounces an open question back to the asking
        agent with a message, records it on the follow-up thread, and flips
        `awaiting` to `agent`. The question stays open and a blocking question's
        ticket stays parked — you still own the eventual answer.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 32768, description: What the agent should look into }
      responses:
        "200":
          description: The question, now awaiting the agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "409": { $ref: "#/components/responses/Conflict" }

  /questions/{id}/reply:
    post:
      tags: [questions]
      summary: Agent replies to a follow-up with the requested research
      description: |
        Requires the `write` scope. The asking agent posts the context the human
        asked for; records it on the thread and flips `awaiting` back to `human`
        so the inbox shows the question ready to answer again.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 32768, description: The research/context the human asked for }
      responses:
        "200":
          description: The question, now awaiting the human.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "409": { $ref: "#/components/responses/Conflict" }

  /questions/{id}/options:
    post:
      tags: [questions]
      summary: Revise a still-open choose question's options
      description: |
        Requires the `write` scope. Replaces the option set of an open `choose`
        question, so an agent that learns something while answering a follow-up
        can fix the choices instead of withdrawing the question and losing the
        whole thread.

        `options` is required and **replaces** the set (it does not merge).
        `recommended`, `recommended_multi` and `recommended_note` are only touched
        when present in the body — send `recommended: null` to clear it. A
        recommendation left pointing at an option that no longer exists is a 422,
        not a silent drop: the caller decides what it should now be.

        Whose turn it is (`awaiting`) is deliberately unchanged — revising is
        orthogonal to the thread. A human still holding the old option list is
        protected by the answer path, which validates the chosen option against
        the current set. Revising an answered, withdrawn or expired question is a
        409: it would rewrite what was decided.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [options]
              properties:
                options:
                  type: array
                  minItems: 2
                  description: "The full replacement set: strings, or {value, desc} objects."
                  items:
                    oneOf:
                      - type: string
                      - type: object
                        required: [value]
                        properties:
                          value: { type: string }
                          desc: { type: string }
                option_notes:
                  type: array
                  items: { type: string }
                  description: One-line trade-off per option, parallel to options (1:1 or omitted).
                recommended:
                  description: New recommendation; must be one of the revised options. null clears it. Omit to keep.
                recommended_multi:
                  type: array
                  items: { type: string }
                  description: For a multi choose — the new recommended subset. Empty list clears it. Omit to keep.
                recommended_note: { type: [string, "null"], description: Rationale for the recommendation. null clears it. Omit to keep. }
                reason: { type: string, maxLength: 32768, description: Why the options changed — recorded on the ticket for a human who read the old set. }
      responses:
        "200":
          description: The question with its revised options.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "409": { $ref: "#/components/responses/Conflict" }

  /mindmaps:
    get:
      tags: [mindmaps]
      summary: List mindmaps (read scope)
      description: |
        Brainstorms in a project, newest-touched first. A bounded envelope: `items`
        plus `total` counted with the same predicate, the `limit` applied, and a
        prose `note` when the page left something out. Each row carries its node
        count, which is what tells a reader whether a map is worth opening.
      parameters:
        - { name: project, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [open, parked, distilled] } }
        - { name: q, in: query, schema: { type: string }, description: 'substring over title and summary' }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: One page of maps.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Mindmap" } }
                  total: { type: integer }
                  limit: { type: integer }
                  note: { type: string }
    post:
      tags: [mindmaps]
      summary: Start a mindmap (write scope)
      description: |
        `{"project":"tp","title":"Payments rebuild"}`. The title is the root —
        a map starts from one thing and everything hangs off it — so there is no
        separate root node to create.

        A project holds ONE mindmap. The question "which map?" is not one anybody
        wanted to answer, and a rail of half-started maps is how a surface stops
        being used; a branch that turns out to be its own subject promotes into an
        initiative or an epic instead. The data model is unchanged — `mindmaps` is
        still keyed by project and every read still pages — so this is a cap that
        can be lifted, not a shape that has to be migrated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, title]
              properties:
                project: { type: string }
                title: { type: string, description: 'the root: what this is about' }
                summary: { type: string }
                metadata: { type: object }
      responses:
        "201":
          description: The map, with no nodes yet and a note saying how to grow it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mindmap: { $ref: "#/components/schemas/Mindmap" }
                  nodes: { type: array, items: { $ref: "#/components/schemas/MindmapNode" } }
                  note: { type: string }
        "403": { description: Token lacks the write scope or the project }
        "409": { description: "The project already has a mindmap (`mindmap.project_has_one` — a project holds one brainstorm, and the refusal names the map it has), or the project is archived, so brainstorming under it is frozen too (`project.archived`)" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /mindmaps/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: 'e.g. mm-9f3ka2xz' }
    get:
      tags: [mindmaps]
      summary: One mindmap and every node on it (read scope)
      description: |
        One request, because a canvas cannot draw half a tree — and it is
        affordable precisely because a map is capped at 500 nodes. Nodes come in
        tree order, parents before their children, so a caller can build the tree
        in one pass; `position` is each node's rank among its own siblings.

        There is no cursor here and none is needed: the cap is well below any page
        size, so `total` is always the whole map.

        Read from the **live replica**, not from the update log, so what comes back
        includes the edits somebody is making right now. Two repairs happen here
        rather than being stored, because a CRDT admits states no synchronous
        validator could have refused: a node whose ancestry loops is re-parented to
        the root (the member with the lowest id moves, so every peer computes the
        same tree), and a node whose parent no longer exists is re-parented to the
        root rather than dropped — losing a subtree because somebody deleted its
        parent concurrently is worse than showing it. A relationship whose end no
        longer resolves is dropped.
      responses:
        "200":
          description: The map, its nodes, and its cross-links.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mindmap: { $ref: "#/components/schemas/Mindmap" }
                  nodes: { type: array, items: { $ref: "#/components/schemas/MindmapNode" } }
                  standing:
                    type: object
                    description: |
                      Where each section stands, keyed by node id: when it last
                      changed, when it was last confirmed, and whether the
                      confirmation is still good. A READING and not a stored
                      flag — a section confirmed BEFORE its last edit is not
                      confirmed any more, which no boolean can express.
                    additionalProperties:
                      type: object
                      properties:
                        changed_at: { type: [string, "null"], format: date-time }
                        reviewed_at: { type: [string, "null"], format: date-time }
                        confirmed: { type: boolean }
                  relationships:
                    type: array
                    items: { $ref: "#/components/schemas/MindmapRelationship" }
                    description: 'Edges outside the hierarchy. Dangling ones are already filtered out.'
                  total: { type: integer, description: 'the node count — relationships do not count against the node cap' }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [mindmaps]
      summary: Retitle, re-summarise, or relabel a mindmap (write scope)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                summary: { type: string }
                status: { type: string, enum: [open, parked, distilled] }
                metadata_merge: { type: object, description: 'RFC 7386 merge; a null value deletes a key' }
      responses:
        "200":
          description: The updated map.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mindmap: { $ref: "#/components/schemas/Mindmap" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [mindmaps]
      summary: Throw a mindmap away (write scope)
      description: |
        An ordinary thing to do, and the clearest statement of what a mindmap is:
        an initiative is nurtured, a map is scratch. Its nodes go with it.

        What its branches **became** does not: an epic or an initiative that
        graduated is work in its own right and left the map when it graduated. The
        reply says how many nodes went, so deleting the wrong map is obvious
        immediately.
      responses:
        "200":
          description: Gone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  removed_nodes: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }

  /mindmaps/{id}/outline:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: node, in: query, schema: { type: string }, description: 'narrow to one branch' }
    get:
      tags: [mindmaps]
      summary: The tree as indented text (read scope)
      description: |
        Its own route because this is the shape a *model* reads and writes
        cheapest, and the one a person pastes into a document. It is also what
        seeds an initiative when a branch graduates.
      responses:
        "200":
          description: The outline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mindmap: { type: string }
                  outline: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /mindmaps/{id}/nodes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [mindmaps]
      summary: Add thoughts, one or many (write scope)
      description: |
        Takes a **batch** — `{"nodes":[{"text":"API"},{"text":"integrations"}]}` —
        because that is what an agent brainstorming with somebody sends, and the
        batch lands whole or not at all. A bare `{"text":"…"}` is accepted too,
        since that is what one keystroke sends and wrapping it in an array is
        friction on the fastest path in the feature.

        `parent` omitted hangs the node off the root. `position` omitted appends to
        the end of its ring, which is what typing does; a value is what splitting
        one thought into two needs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [nodes]
                  properties:
                    nodes:
                      type: array
                      maxItems: 50
                      items: { $ref: "#/components/schemas/MindmapNodeAdd" }
                - $ref: "#/components/schemas/MindmapNodeAdd"
      responses:
        "201":
          description: The nodes created, in the order they were asked for.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes: { type: array, items: { $ref: "#/components/schemas/MindmapNode" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The map is at its node cap (`mindmap.full`), or the parent is already at
            the depth cap (`mindmap.too_deep`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /mindmaps/{id}/nodes/{node}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: node, in: path, required: true, schema: { type: string } }
    patch:
      tags: [mindmaps]
      summary: Retype, move or place one node (write scope)
      description: |
        `parent: null` lifts a node to the first ring, `at: null` hands it back to
        the layout, and an absent field leaves either alone — absent and null mean
        different things here.

        A move onto the node's own descendant is refused (`mindmap.cycle`): it
        would cut that branch off the map, and it is exactly what a drag makes easy
        to try.

        Only a **reparent** reaches the event log. Text and placement change
        constantly while somebody is thinking, and an event per keystroke-batch
        would bury every other event in the project under one person's typing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 280, description: 'the field''s real name' }
                text: { type: string, maxLength: 280, description: 'accepted alias for `title`' }
                notes: { type: string, maxLength: 8000, description: 'the long form; does not render in the outline' }
                parent: { type: [string, "null"] }
                position: { type: integer, minimum: 0, description: 'the index among the node''s siblings to move it to, 0 first. An index, NOT the gapped 1000/2000 ordering this field used to carry — a value past the end of the ring is refused with `validation.mindmap_position` rather than silently appending.' }
                kind: { type: string, enum: [thought, question, decision, screen, component] }
                edge_label: { type: string, maxLength: 80, description: 'labels the edge to this node''s parent' }
                color: { type: string }
                shape: { type: string }
                icons: { type: array, maxItems: 8, items: { type: string } }
                reviewed: { type: boolean, description: 'mark an agent-written node as looked at' }
                at:
                  description: 'hand placement, or null to let the layout place it'
                  oneOf:
                    - { type: "null" }
                    - type: object
                      required: [x, y]
                      properties:
                        x: { type: number }
                        y: { type: number }
      responses:
        "200":
          description: The updated node.
          content:
            application/json:
              schema:
                type: object
                properties:
                  node: { $ref: "#/components/schemas/MindmapNode" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`mindmap.cycle` or `mindmap.too_deep`" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [mindmaps]
      summary: Prune a node and everything under it (write scope)
      responses:
        "200":
          description: Pruned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  removed: { type: integer, description: 'the node plus its subtree' }
        "404": { $ref: "#/components/responses/NotFound" }

  /mindmaps/{id}/nodes/{node}/promote:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: node, in: path, required: true, schema: { type: string } }
    post:
      tags: [mindmaps]
      summary: Graduate a branch into an epic or an initiative (write scope)
      description: |
        `epic` creates an epic ticket titled from the node with its **direct
        children** as tickets under it — the fastest path from "we talked about it"
        to work in the queue. A deeper subtree would arrive as a flat pile whose
        shape nobody could recover, and the map keeps that shape for whoever wants
        it.

        `initiative` creates an initiative titled from the node with the subtree as
        its first **entry** — an entry carries provenance, and where an idea came
        from is what a collection is supposed to remember.

        **The node stays either way**, and keeps a link to what it became. Promotion
        is not a move: the map is the record of how the thinking got there, and a
        branch that vanished the moment it mattered would make the map worthless as
        the thing you read afterwards.

        Promoting twice is refused — it would make a second epic from one thought,
        indistinguishable from the first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string, enum: [epic, initiative] }
      responses:
        "201":
          description: The node, now carrying what it became, and what was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  node: { $ref: "#/components/schemas/MindmapNode" }
                  created:
                    type: object
                    properties:
                      kind: { type: string, enum: [epic, initiative] }
                      id: { type: string }
                      children:
                        type: array
                        items: { type: string }
                        description: 'ticket ids, on an epic promotion only'
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Already promoted (`mindmap.already_promoted`)" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /mindmaps/{id}/run:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [mindmaps]
      summary: Ask a model for a change to one section (write scope)
      description: |
        The ONE route in this codebase that calls a language model, pointed at a
        section of the plan. A deliberate exception to "Takomo stores, the agent
        computes", made because a prompt bar that only filed a request nobody
        would answer is not a feature.

        What the exception does NOT change: the model is schema-constrained to
        operations against block ids, its answer goes through the same
        validation a fleet agent's does, and it lands as a **proposal a person
        accepts**. Nothing here writes live text.

        The section is re-read inside the write and the operations validated
        against THAT, because it may have moved while the model was thinking —
        which is the failure this whole surface exists to remove.

        Off unless the model key is configured; `/v1/whoami` reports
        `features.doc_agent` so a page can explain the absence rather than
        offering a bar that fails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node, instruction]
              properties:
                node: { type: string, description: 'the section to change' }
                instruction: { type: string, description: 'what you want changed, in a sentence' }
                scope: { type: [array, "null"], items: { type: string }, description: 'restrict to these block ids' }
                model: { type: string }
      responses:
        "200":
          description: Offered, not applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal: { type: string }
                  mindmap: { type: string }
                  node: { type: string }
                  status: { type: string }
                  operations: { type: integer }
                  skipped: { type: array, items: { type: string } }
                  summary: { type: string }
                  note: { type: string }
        "403":
          description: Token lacks the scope this route needs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { description: "No model is configured (`doc_agent.not_configured`); `/v1/whoami` reports this as `features.doc_agent: false`" }

  /speech/token:
    post:
      tags: [mindmaps]
      summary: A short-lived token for dictation (write scope)
      description: |
        Dictation on `/mindmaps`: you talk, and each finished sentence lands as a
        thought. This is the whole server side of it.

        The audio never reaches this server — the browser streams it straight to
        the speech provider, which keeps a recording out of the request log and
        off this disk. What the browser must not hold is the account key (a key
        in a page is a key on every machine that loads it), so this exchanges it
        for a token that is good for ten minutes and nothing else.

        `write`, not `read`: dictation exists to change a map, and it costs the
        operator money per minute. Off unless `TAKOMO_ASSEMBLYAI_API_KEY` is set;
        `/v1/whoami` reports `features.voice`, so a page leaves the button out
        rather than offering one that fails.
      responses:
        "200":
          description: A token to open the provider's socket with.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_in: { type: integer, description: 'seconds' }
        "403":
          description: Token lacks the scope this route needs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { description: "The speech provider could not be reached or refused the key (`speech.upstream`)" }
        "503": { description: "Dictation is not configured (`speech.not_configured`); `/v1/whoami` reports this as `features.voice: false`" }

  /mindmaps/{id}/prose:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [mindmaps]
      summary: The plan as an agent reads it (read scope)
      description: |
        Annotated with block ids, which is what makes a reply addressable: an
        agent answers with OPERATIONS against block ids, never with a document.
        One section with `node`, or the whole plan — headings from the tree,
        each section's blocks beneath its own.
      parameters:
        - { name: node, in: query, schema: { type: string }, description: 'one section' }
      responses:
        "200":
          description: The plan, or one section of it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mindmap: { type: string }
                  node: { type: [string, "null"] }
                  markdown: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /mindmaps/{id}/proposals:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [mindmaps]
      summary: What has been proposed, and what became of it (read scope)
      parameters:
        - { name: node, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, accepted, rejected] } }
      responses:
        "200":
          description: Proposals against this plan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
                  total: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [mindmaps]
      summary: Propose a change to one section (write scope)
      description: |
        **An agent proposes; a person accepts.** Nothing here goes live: the
        operations are validated against the section as it stands and stored as
        a proposal for somebody to decide on.

        Operations address BLOCK IDS — `replace`, `insert_after`, `delete` — and
        never carry a document, which is what keeps a person's concurrent typing.
        An op naming a block that is gone, or outside `scope`, is dropped and
        reported in `skipped` rather than silently applied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node, operations]
              properties:
                node: { type: string, description: 'the section' }
                operations: { type: array, items: { type: object } }
                instruction: { type: string, description: 'what you were asked to do, in one line' }
                summary: { type: string, description: 'what you changed and WHY — the reason, not a restatement of the edit' }
                scope: { type: array, items: { type: string }, description: 'restrict to these block ids; enforced server-side' }
      responses:
        "201":
          description: Offered, not applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal: { type: string }
                  mindmap: { type: string }
                  node: { type: string }
                  status: { type: string }
                  operations: { type: integer }
                  skipped: { type: array, items: { type: string } }
                  note: { type: string }
        "403":
          description: Token lacks the scope this route needs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /mindmaps/{id}/trace:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [mindmaps]
      summary: What happened to the plan, and who did it (read scope)
      description: |
        The plan's history, newest first — or one section's, with `node`.

        **This is not the CRDT update log.** That is the mechanism which rebuilds
        the text: written on every flush, merged, and rewritten wholesale by
        compaction. Asking it "who changed 2.1, and has anybody agreed with it
        since?" is asking a storage format a question about people. This answers
        that one.

        Sparse by construction: an act somebody would name — a thought written,
        renamed, moved, pruned, reviewed, a proposal accepted — never a
        keystroke. Every entry carries the free-form actor string AND the person
        behind the credential (`users.id`) where it was bound to one, because a
        scope is not an identity and an actor string does not survive somebody
        leaving.
      parameters:
        - { name: node, in: query, schema: { type: string }, description: 'one section' }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 500 } }
      responses:
        "200":
          description: A bounded envelope of acts, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        node: { type: [string, "null"], description: 'the section, or null for the plan as a whole' }
                        kind: { type: string, enum: [authored, renamed, edited, moved, pruned, reviewed, proposed, accepted, rejected] }
                        actor: { type: string, description: 'the free-form actor string the credential carried' }
                        user: { type: [string, "null"], description: 'WHICH PERSON, when the credential was bound to one' }
                        note: { type: [string, "null"] }
                        text:
                          type: [string, "null"]
                          description: |
                            What the section SAID at that moment, as plain text —
                            which is what makes a diff possible. The CRDT log
                            cannot answer it: compaction rewrites it into one
                            blob, so "what did 2.1 say last Tuesday" has no
                            answer there by design. Null for an act that did not
                            change the prose, and read from the replica rather
                            than taken from the caller, because a history
                            somebody can write is not a history.
                        at: { type: string, format: date-time }
                  total: { type: integer }
                  limit: { type: integer }
                  note: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [mindmaps]
      summary: Record an act the server cannot see (write scope)
      description: |
        Only the four acts the server cannot OBSERVE. It performs a move, a
        rename, a prune and a proposal, so it records those itself and a caller
        cannot claim to have done them. It cannot see prose edited over the sync
        socket, a review (somebody saying they agree), or a proposal accepted or
        rejected — which the browser does by applying ops to the replica. Those
        four are reported, and reporting is all anybody could do.

        Post one when an edit SETTLES, not while somebody types: a history with
        an entry per keystroke buries every entry worth reading.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [edited, reviewed, accepted, rejected] }
                node: { type: string, description: 'the section; omit for the plan as a whole' }
                note: { type: string }
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "403":
          description: Token lacks the scope this route needs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /mindmaps/{id}/session:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [mindmaps]
      summary: Mint a ticket for the map's sync socket (read scope)
      description: |
        The same `tkd_` ticket `POST /v1/documents/{id}/session` mints, for a map.
        A mindmap is stored as one Yjs document, exactly as a document is, so two
        people and an agent grow one branch at a time on ONE replica rather than
        on copies that have to be reconciled afterwards.

        The reason the credential exists is unchanged and narrow: a browser
        `WebSocket` cannot set an `Authorization` header, and putting the caller's
        real `tk_` token in a query string would scatter it through every access
        log on the path. This ticket reaches **one map**, expires, is revocable,
        and carries no more than the token that asked for it — `can_write` is
        copied from the caller's scopes, so a `read`-only reader joins as a
        read-only peer whose edits are never applied.

        It is not a sixth credential kind. `tkd_` was widened from "document
        session" to "collab session"; a new prefix would imply a new auth path,
        and there is not one.

        The kind is checked against the id rather than assumed from the route, so
        a `doc-…` id presented here is a `notfound.mindmap` rather than a ticket
        for something the caller did not ask for.
      responses:
        "200":
          description: The ticket and where to use it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, description: 'The object the ticket reaches — the field to read. `mindmap` below is the same value, under the kind-specific key.' }
                  kind: { type: string, enum: [document, mindmap], description: 'Always `mindmap` here.' }
                  mindmap: { type: string }
                  session: { type: string, description: 'ds-xxxxxxxx, the revocable handle.' }
                  token: { type: string, description: '`tkd_…`. Shown once; stored hashed.' }
                  can_write: { type: boolean, description: 'Copied from the minting token scopes.' }
                  display: { type: string, description: 'The name collaborators see next to a caret — the person''s handle when the credential is bound to one, else the token''s actor. Never the token or its id.' }
                  expires_at: { type: string, format: date-time }
                  url: { type: string, description: 'The socket BASE, without the room — y-websocket appends the room and params itself.' }
                  room: { type: string, description: 'The room to append: the mindmap id.' }
                  note: { type: string }
        "403": { description: Token lacks the project }
        "404": { description: 'No mindmap with that id (`notfound.mindmap`), including a document id presented here.' }

  /mindmaps/{id}/relationships:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [mindmaps]
      summary: Link two nodes without making one the parent of the other (write scope)
      description: |
        The hierarchy answers "what is this part of". A **relationship** answers
        everything else — a question hanging off the thing it questions, a screen
        that navigates to another, a plain "see also". One mechanism instead of
        three special cases, which is why it is a separate collection rather than
        more fields on a node.

        A relationship does not affect the tree, does not participate in cycle
        detection, and does not count against the node cap. It has its own cap of
        1,000 per map.

        Both ends must exist, and they must differ: an edge from a node to itself
        says nothing. A relationship whose end no longer resolves is **dropped on
        read** rather than repaired — a dangling edge is not a node and there is
        nothing to keep — so deleting a node takes its cross-links with it.

        **No event is emitted.** One created in the browser would emit nothing
        while one created here emitted something, and an event that fires half the
        time is worse than no event at all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, description: 'a node id on this map' }
                to: { type: string, description: 'a different node id on this map' }
                label: { type: string, maxLength: 80, description: 'drawn along the edge, so a couple of words' }
      responses:
        "201":
          description: The relationship.
          content:
            application/json:
              schema:
                type: object
                properties:
                  relationship: { $ref: "#/components/schemas/MindmapRelationship" }
        "404": { description: 'No such map, or one of the two ends is not a node on it (`notfound.mindmap`, `notfound.mindmap_node`).' }
        "409": { description: "The map is at its relationship cap (`mindmap.relationships_full`)" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /mindmaps/{id}/relationships/{relationship}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: relationship, in: path, required: true, schema: { type: string }, description: 'e.g. mr-9f3ka2xz' }
    delete:
      tags: [mindmaps]
      summary: Remove a cross-link (write scope)
      description: |
        Only the edge goes. Both nodes stay where they are — a relationship is a
        remark about two thoughts, not a container for either of them.
      responses:
        "200":
          description: Gone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "404": { description: 'No such map, or no relationship with that id on it (`notfound.mindmap`, `notfound.mindmap_relationship`).' }

  /mindmaps/{id}/nodes/{node}/attachments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: node, in: path, required: true, schema: { type: string } }
    post:
      tags: [mindmaps]
      summary: Point a node at something that lives elsewhere (write scope)
      description: |
        A **pointer, never the bytes**. Initiative entries are the only place in
        this store that hold binary blobs, and they carry byte caps because an
        unbounded upload holds the write mutex every claim waits on. Here the
        argument is stronger still: bytes in a CRDT log are replayed by every peer
        that joins, so a map with a PDF inside it would get slower to open for
        everybody, forever.

        So `ref` is where the thing is — a URL or a path — and `gist` is one line
        of what it says, which is what a reader weighs before deciding to follow
        it. At most 20 per node: a node carrying more than that has become a
        folder.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MindmapAttachmentAdd" }
      responses:
        "201":
          description: The attachment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment: { $ref: "#/components/schemas/MindmapAttachment" }
        "404": { description: 'No such map, or no such node on it (`notfound.mindmap`, `notfound.mindmap_node`).' }
        "409": { description: "The node is at its attachment cap (`mindmap.attachments_full`)" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /mindmaps/{id}/nodes/{node}/attachments/{attachment}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: node, in: path, required: true, schema: { type: string } }
      - { name: attachment, in: path, required: true, schema: { type: string }, description: 'e.g. ma-9f3ka2xz' }
    delete:
      tags: [mindmaps]
      summary: Drop a pointer off a node (write scope)
      description: |
        The node and whatever the pointer named are both untouched — nothing was
        ever stored here but the address.

        The node and the attachment are the address together: an attachment id
        from another node is not reachable here.
      responses:
        "200":
          description: Gone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "404": { description: 'No such map, node, or attachment on that node (`notfound.mindmap`, `notfound.mindmap_node`, `notfound.mindmap_attachment`).' }

  /initiatives:
    get:
      tags: [initiatives]
      summary: List initiatives
      description: |
        Requires the `read` scope; bounded by the token's project allowlist.

        An initiative is a home for an idea that is not yet work — a product idea,
        a direction, what came out of a good conversation. It has no workflow, is
        never claimed, and is nurtured by appending research inputs over time.

        Initiatives are usually created and fed **over MCP** — the thing that
        produces one is an agent in a conversation (`takomo_initiative_new`,
        `takomo_initiative_append`, `takomo_initiative_update`). The write routes
        here exist because the `/initiatives` page needs them: an initiative is fed
        by people as well as agents, and a browser cannot call an MCP tool.
      parameters:
        - { name: project, in: query, required: false, schema: { type: string } }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, parked, distilled] }
        - { name: q, in: query, required: false, schema: { type: string }, description: 'tokenized search over title and summary; every whitespace-separated term must match' }
        - { name: label, in: query, required: false, schema: { type: string } }
        - { name: tag, in: query, required: false, schema: { type: string }, description: 'exact `kind:handle` tag reference' }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: A page of initiatives, newest first, each with its derived rollup.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Initiative" }
                  next_cursor: { type: [string, "null"] }

    post:
      tags: [initiatives]
      summary: Open an initiative
      description: |
        Requires the `write` scope for the named project.

        MCP came first here (`takomo_initiative_new`), because an agent in a
        conversation is what usually produces an initiative. This route exists
        because the `/initiatives` page needs it: a person reading a collection
        wants to start one, and a browser cannot call an MCP tool. Both go through
        the same store method and the same validators.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, title]
              properties:
                project: { type: string }
                title: { type: string, maxLength: 300, description: 'the quick name the idea goes by' }
                summary: { type: string, description: 'a very short description; the long form belongs in an entry, where it carries provenance' }
                status: { type: string, enum: [open, parked, distilled], default: open }
                labels: { type: array, items: { type: string }, maxItems: 50 }
                tags:
                  type: array
                  items: { type: string }
                  description: '`kind:handle` references; unknown handles are registered in the project tag registry on the fly'
                metadata: { type: object }
      responses:
        "201":
          description: The new initiative.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Initiative" }

  /initiatives/{id}:
    get:
      tags: [initiatives]
      summary: Fetch one initiative with its rollup
      description: Requires the `read` scope. The project check runs against the initiative's own project, so naming an id never grants access to it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The initiative.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Initiative" }

    patch:
      tags: [initiatives]
      summary: Edit an initiative's description
      description: |
        Requires the `write` scope. Sets any of title, summary, status, labels or
        tags, and/or merges into `metadata` (RFC 7386: a null value removes a key).

        Entries are deliberately NOT reachable from here. They are append-only —
        the accumulated record IS the initiative — so the only editable part is how
        it is described and filed. A patch with no fields is a `400`
        (`validation.no_changes`) rather than a version bump that changed nothing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 300 }
                summary: { type: string }
                status: { type: string, enum: [open, parked, distilled] }
                labels: { type: array, items: { type: string }, maxItems: 50, description: 'whole-set replace' }
                tags: { type: array, items: { type: string }, description: 'whole-set replace' }
                metadata_merge: { type: object }
      responses:
        "200":
          description: The updated initiative.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Initiative" }

    delete:
      tags: [initiatives]
      summary: Delete an initiative and its entries
      description: |
        Requires the `write` scope — the same as every other content delete in a
        project (mindmaps, environments, checks); `admin` is reserved for deleting
        the project itself.

        Removes the initiative, every entry appended to it, and their attachment
        bytes. `status: parked` already covers "set aside and still readable", so
        this is for the case parking does not fix: a duplicate, a mistake, an
        experiment nobody wants kept.

        Three kinds of reference point at an initiative, and each is treated the
        way the surface that created it already decided:

        - **Entries go with it.** They belong to it and nothing else can reach
          them once it is gone.
        - **A check's `initiative` may not dangle**, because it is validated on
          write. A check filed under this initiative refuses the delete with
          `409 conflict.initiative_has_checks`, listing the ids in
          `details.checks`. Re-file or detach them, or pass `?force=true` to have
          the column cleared for you — `null` is a value it already has a meaning
          for.
        - **A ticket's `initiative:<id>` tag is left exactly as it is.** The
          roadmap deliberately keeps such a ticket visible under `uninitiated`
          rather than dropping it, so those tickets are neither blocked on nor
          edited. The response counts them, because the lane is about to vanish
          from the roadmap and the caller should know how much work moves with it.

        A mindmap node promoted into this initiative keeps its promotion link:
        deleting the work leaves the record of where it came from.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: force
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Detach the verification checks filed under it instead of refusing.
      responses:
        "200":
          description: What was removed, and what was left standing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string }
                  project: { type: string }
                  entries: { type: integer, description: 'Entries removed with it.' }
                  bytes: { type: integer, description: 'Their total stored bytes, text and attachments together.' }
                  detached_checks: { type: integer, description: 'Checks whose initiative column was cleared; only non-zero with force=true.' }
                  tagged_tickets: { type: integer, description: 'Tickets whose initiative: tag now names nothing. Untouched; they move into the roadmap uninitiated bucket.' }
        "409":
          description: 'A verification check still names it (`conflict.initiative_has_checks`); re-file it or retry with ?force=true'

  /initiatives/{id}/entries:
    get:
      tags: [initiatives]
      summary: List an initiative's entries — the collection of research inputs
      description: |
        Requires the `read` scope. Newest first, cursor-paged. Entry text is
        included; attachment **bytes are not** — `has_content` says whether there
        are any, and `/initiatives/{id}/entries/{entry}/content` serves them. The
        collection's `rollup` rides along so a UI needs one request, not two.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: A page of entries plus the whole collection's rollup.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InitiativeEntry" }
                  next_cursor: { type: [string, "null"] }
                  rollup: { $ref: "#/components/schemas/InitiativeRollup" }

    post:
      tags: [initiatives]
      summary: Append one contribution to an initiative
      description: |
        Requires the `write` scope. A note, a research finding, a colleague's
        feedback, a transcript, an attached document — text, an attachment, or
        both. Append-only: entries are never edited or deleted.

        `source` is required, exactly as on the MCP tool. An entry whose origin
        nobody recorded is text nobody can weigh later.

        An attachment arrives as `content_base64` because JSON cannot carry bytes,
        and is decoded before the caps are applied — so the 5 MiB limit bounds the
        real document, not its 4/3-larger encoding. It needs a `filename` and/or a
        `mime`; without either, nothing downstream can say what the bytes are.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, source]
              properties:
                kind:
                  type: string
                  description: 'free-form slug matching ^[a-z][a-z0-9-]*$ — conventionally note, research, feedback, transcript, document, decision'
                source:
                  type: string
                  description: 'REQUIRED — where this input came from: an agent id, a person, a conversation'
                title: { type: string, maxLength: 300 }
                text: { type: string, description: 'markdown; give this, an attachment, or both' }
                source_uri: { type: string, description: 'where the input lives — the conversation, the doc, the PR' }
                origin_at:
                  type: string
                  format: date-time
                  description: 'RFC 3339. When the content was WRITTEN, as opposed to when it landed here (recorded automatically). Refused rather than dropped if unparseable.'
                content_base64:
                  type: string
                  description: 'the attachment, base64 (standard alphabet, padded). Capped at 5 MiB decoded.'
                mime: { type: string, description: 'bare `type/subtype`; required unless filename is given' }
                filename: { type: string, description: 'required unless mime is given' }
                meta: { type: object }
      responses:
        "201":
          description: |
            The new entry, plus the initiative with its recomputed rollup — so a
            caller that just appended can update the counts it is showing without a
            second request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry: { $ref: "#/components/schemas/InitiativeEntry" }
                  initiative: { $ref: "#/components/schemas/Initiative" }
        "409": { $ref: "#/components/responses/Conflict" }

  /initiatives/{id}/entries/{entry}/content:
    get:
      tags: [initiatives]
      summary: Download one entry's attachment
      description: |
        Requires the `read` scope. The only endpoint in this API that returns
        something other than JSON, and the reason attachment bytes are never
        selected by any other query: a document is fetched by itself, once, by the
        reader that wants it.

        Served under the entry's own stored media type — validated as a bare
        `type/subtype` when it was appended — with
        `Content-Disposition: attachment` and `X-Content-Type-Options: nosniff`,
        because these bytes were uploaded by an API caller and must never render as
        active content in the origin that serves `/board`.

        A text-only entry answers `404 initiative.no_attachment`, not an empty
        body that would read like a corrupt download.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: entry, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The attachment bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /board:
    servers: [{ url: / }]
    get:
      tags: [admin]
      summary: Board — one route, three audiences (the app shell)
      description: |
        Self-contained page served at `/board`. Unauthenticated HTML; every data
        fetch carries a credential the page is given, and which credential
        decides what the page *is*:

        - `#a=tka_…` — a single-use answer link. Shows ONE question to an outside
          expert and lets them answer it once, through `/v1/answer/self`.
        - `#s=tks_…` — a read-only share of a project or subtree, through
          `/v1/shares/self*`.
        - neither — the board itself, on a `tk_` token held in `localStorage`.

        The fragment wins over a stored token: someone following an answer link
        while signed in must land on the question they were sent. Fragments never
        reach the server, which is what lets those tokens ride in a URL at all.

        Served from `web/`. This route and the three below return the SAME
        document: the app is client-side routed, and the router picks the surface
        from the path. Each is still a real server route, so a typed URL, a
        bookmark and an `#a=` link all work without a history fallback.
      security: []
      responses:
        "200": { description: HTML page }

  /inbox:
    servers: [{ url: / }]
    get:
      tags: [questions]
      summary: Ask-a-human inbox (static email-style SPA; folder rail + list + answer pane)
      description: |
        Self-contained page served at `/inbox`. Unauthenticated HTML; every data
        fetch carries the viewer's bearer token, and answering requires the
        `human` scope. Talks to `/v1/questions*` and `/v1/events`.
      security: []
      responses:
        "200": { description: HTML page }

  /mindmaps-page:
    servers: [{ url: / }]
    get:
      operationId: mindmapsPage
      tags: [mindmaps]
      summary: Mindmaps page (the app shell; served at `/mindmaps`)
      description: |
        Self-contained page served at **`/mindmaps`** — documented under a distinct
        key because the `/v1` collection route already claims `/mindmaps` in this
        document, and OpenAPI paths are unique per document regardless of
        `servers`.

        A pan/zoom canvas: drag a node onto another to reparent it, into space to
        pin it, and grow the map from the keyboard — Enter for the next thought,
        Tab to go a level deeper. A node with no hand placement is laid out
        automatically, which is what keeps a map growing at typing speed tidy;
        "tidy up" hands every pinned node back to the layout.

        On a phone the same tree renders as an indented list. That is not a
        degraded canvas but a better shape for the screen: a pinch-zoom surface at
        375 px is a worse way to read a tree than a list is.

        Unauthenticated HTML; every data fetch carries the viewer's bearer token.
        Reading needs `read`; growing, moving or promoting additionally needs
        `write`.
      security: []
      responses:
        "200": { description: HTML page }

  /schedules-page:
    servers: [{ url: / }]
    get:
      operationId: schedulesPage
      tags: [schedules]
      summary: Schedules page (the app shell; served at `/schedules`)
      description: |
        Self-contained page served at **`/schedules`** — documented under a
        distinct key because the `/v1` collection route already claims
        `/schedules` in this document, and OpenAPI paths are unique per document
        regardless of `servers`.

        Unauthenticated HTML; every data fetch carries the viewer's bearer token.
        Reading needs `read`; activating, pausing, rejecting, running or creating
        additionally needs `human`.

        Rows, not columns, and that is the design decision rather than a layout
        accident: the board sorts by state into columns, but a schedule's content
        is a HISTORY, so forcing cadences into columns would throw away the axis
        that carries the meaning.

        Served from `web/` — the same shell as `/board`, `/inbox` and
        `/initiatives`, with the surface chosen by the router.
      security: []
      responses:
        "200": { description: HTML page }

  /inbox-page:
    servers: [{ url: / }]
    get:
      operationId: inboxPage
      tags: [questions]
      summary: Ask-a-human inbox (the app shell; served at `/inbox`)
      description: |
        The app shell, served at **`/inbox`** — documented under a distinct key
        because OpenAPI paths are unique per document and `/inbox` above
        describes the same URL for the `/v1` collection.

        Unauthenticated HTML; every data fetch carries the viewer's bearer token,
        and answering requires the `human` scope. Talks to `/v1/questions*`.

        Answering is one press followed by a 30-second undo window: the question
        leaves Open immediately and the write happens when the window closes, so
        working through a full inbox never waits on the network. Several windows
        run side by side, each with its own countdown.

        Served from `web/` — the same shell as the other three page routes.
      security: []
      responses:
        "200": { description: HTML page }

  /initiatives-page:
    servers: [{ url: / }]
    get:
      operationId: initiativesPage
      tags: [initiatives]
      summary: Initiatives page (the app shell; served at `/initiatives`)
      description: |
        The app shell, served at **`/initiatives`** — documented under a
        distinct key because the `/v1` collection route already claims
        `/initiatives` in this document, and OpenAPI paths are unique per
        document regardless of `servers`. (A duplicate key is not a parse error
        in every YAML reader: PyYAML keeps the last one silently, so only
        Redocly's parser catches it.)

        Unauthenticated HTML; every data fetch carries the viewer's bearer token,
        and appending an entry requires the `write` scope. Talks to
        `/v1/initiatives*`.

        It is the one page that writes, which is why `/v1/initiatives` grew POST
        and PATCH handlers: an initiative is fed by people as well as agents, and
        a browser cannot call an MCP tool.

        Served from `web/`. All five page routes return the same document; the
        router picks the surface from the path.
      security: []
      responses:
        "200": { description: HTML page }

  /settings-page:
    servers: [{ url: / }]
    get:
      operationId: settingsPage
      tags: [admin]
      summary: Settings — the admin console (the app shell; served at `/settings`)
      description: |
        The app shell, served at **`/settings`**. Documented under a distinct key
        for the same reason as `/initiatives-page`: OpenAPI paths are unique per
        document regardless of `servers`.

        The console over the admin surface — the current token's actor, scopes and
        project allowlist; the whole-database export (`GET /v1/export/sqlite`);
        tokens (list, mint, revoke); and projects (list, create, delete). Almost
        none of that is new: those endpoints existed long before the page, and an
        operator reached them through the CLI or curl. The export is the
        exception, and the reason this page exists.

        Unauthenticated HTML, like every page route, even though everything ON it
        requires `admin`. The document carries no data and each request behind it
        is refused without the scope, so gating the HTML would protect nothing
        while breaking the one thing a page route owes a caller: answering a typed
        URL. A non-admin token is told so in one message rather than left to watch
        four sections fail.
      security: []
      responses:
        "200": { description: HTML page }

  /verification:
    servers: [{ url: / }]
    get:
      tags: [admin]
      summary: Verification checklist page (the app shell)
      description: |
        Self-contained page served at `/verification`. Unauthenticated HTML;
        data fetches carry the viewer's bearer token. Talks to `/v1/checks*`,
        `/v1/cases*`, and checklist report routes under `/v1/projects/{project}/checklist/*`.

        Served from `web/` — the same shell as the other page routes; the router
        picks the surface from the path.
      security: []
      responses:
        "200": { description: HTML page }

  /documents:
    servers: [{ url: / }]
    get:
      tags: [admin]
      summary: Collaborative documents page (the app shell)
      description: |
        Self-contained page served at `/documents`. Unauthenticated HTML; data
        fetches carry the viewer's bearer token, and the editor opens a sync
        socket with a `tkd_` ticket it mints from it.

        This is the one route whose JavaScript is **code-split**: the editor
        pulls in Tiptap, ProseMirror and Yjs, which together outweigh the rest of
        the app, so they load only when somebody comes here.

        Served from `web/` — the same shell as the other page routes.
      security: []
      responses:
        "200": { description: HTML page }

  /environments:
    servers: [{ url: / }]
    get:
      tags: [admin]
      summary: Environments registry page (the app shell)
      description: |
        Self-contained page served at `/environments`. Unauthenticated HTML;
        data fetches carry the viewer's bearer token. Talks to
        `/v1/projects/{project}/environments` and `/v1/environments/{id}*`.

        Served from `web/` — the same shell as the other page routes.
      security: []
      responses:
        "200": { description: HTML page }

  /assets/{file}:
    servers: [{ url: / }]
    get:
      operationId: appAsset
      tags: [admin]
      summary: The app's JavaScript and CSS (unauthenticated, ETag-revalidated)
      description: |
        The bundle the page shell loads, embedded in the binary by `build.rs` from
        the committed `web/dist/assets/` and served by exact name. This is NOT a
        static-file handler: the manifest is an exact compile-time lookup table, so
        there is no directory to traverse and no path to sanitize — `..` is simply
        a name that is not in the table, and any unknown name 404s
        (`notfound.asset`).

        The set is not fixed. It was four names until routes started being
        code-split; a dynamic `import()` emits a chunk whose name is not knowable
        when Rust compiles, so the binary embeds whatever the bundler produced.
        `web/vite.config.ts` enforces the one shape the route requires: everything
        flat under `assets/`, since this path has a single segment.

        The filenames carry no content hash, deliberately: the server embeds and
        serves them by name, which needs those names stable across builds within a
        deploy. Cache correctness
        therefore comes from a strong `ETag` over the body plus
        `Cache-Control: public, max-age=0, must-revalidate`, so a browser
        revalidates and normally gets a `304` with no body. `immutable` would be
        wrong here — it is only safe when the URL changes with the content.
      security: []
      parameters:
        - name: file
          in: path
          required: true
          description: 'An embedded asset name, e.g. `app.js`, `vendor.js`, `runtime.js`, `app.css`, or a code-split route chunk. Deliberately not an enum: the set depends on what the bundler emitted.'
          schema: { type: string }
        - name: If-None-Match
          in: header
          required: false
          description: A previously returned ETag; a match answers 304.
          schema: { type: string }
      responses:
        "200":
          description: The asset.
          headers:
            ETag:
              description: Strong validator over the body.
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
        "304": { description: The client's copy is current; no body. }
        "404": { description: Not one of the embedded asset names. }

  /:
    servers: [{ url: / }]
    get:
      tags: [admin]
      summary: Redirect to the board (open — no auth)
      description: |
        A bare hostname would otherwise fall through to the `/v1` bearer
        middleware and answer `401 auth.missing`. Only `/` is redirected; a
        typo'd path is left to the client router.
      security: []
      responses:
        "307":
          description: Temporary redirect to `/board`
          headers:
            Location:
              schema: { type: string, example: /board }

  /healthz:
    servers: [{ url: / }]
    get:
      tags: [admin]
      summary: Liveness/readiness (open — no auth)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }

  /favicon.svg:
    servers: [{ url: / }]
    get:
      tags: [admin]
      summary: Site icon — the takomo octopus mark as an SVG (static, no auth)
      description: |
        The mark ("tako" = octopus) served as `image/svg+xml`. `/board` and
        `/inbox` link it explicitly; `/favicon.ico` serves the same bytes to
        catch the bare request legacy browsers make on their own.
      security: []
      responses:
        "200":
          description: SVG image
          content:
            image/svg+xml: {}

  /favicon.ico:
    servers: [{ url: / }]
    get:
      tags: [admin]
      summary: Site icon (alias of /favicon.svg; same SVG bytes)
      security: []
      responses:
        "200":
          description: SVG image
          content:
            image/svg+xml: {}

  /projects/{project}/documents:
    get:
      tags: [documents]
      summary: Collaborative documents in a project (read scope)
      description: |
        Prose that humans and agents edit AT THE SAME TIME.

        These routes carry a document's **filing** — title, folder, status, how
        much history it holds. They never carry the prose, and no route here
        accepts any: the text is a Yjs CRDT synchronised over the WebSocket
        session, because a `body` field would be last-write-wins, and losing what
        somebody typed while an agent was thinking is the exact failure this
        surface exists to remove.

        `path` is a folder, and a folder exists only because a document names it
        — the last document to leave takes the folder with it. Same convention
        `/initiatives` derives its tree from, with no folder table and no
        orphaned-directory problem.
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - name: status
          in: query
          schema: { type: string, enum: [draft, review, settled, archived] }
          description: narrow to one status
        - name: initiative
          in: query
          schema: { type: string }
          description: 'the initiative a document was distilled from; the literal `none` narrows to documents no initiative claims'
        - { name: q, in: query, schema: { type: string }, description: substring match on title or folder }
        - name: archived
          in: query
          schema: { type: string, enum: [include] }
          description: include archived documents
        - { name: limit, in: query, schema: { type: integer }, description: '1..=200 (default 200)' }
      responses:
        "200":
          description: The documents, ordered by folder then title.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Document" }
                  total: { type: integer, description: 'Documents matching the filter, ignoring limit.' }
                  limit: { type: integer }
                  note: { type: string, description: 'Present only when the page left documents out.' }
    post:
      tags: [documents]
      summary: Open a document (write scope)
      description: |
        The document starts **empty**. There is deliberately no `body` field: the
        first paragraph is typed into the session like every later one, which
        keeps exactly one write path into the prose.

        Takes `write`, not `human`, matching environments — an agent distilling a
        conversation into a document is a caller this serves.
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentCreate" }
      responses:
        "201":
          description: The new, empty document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404":
          description: No such project, or `initiative` names nothing (`notfound.document`, `notfound.initiative`).
        "422":
          description: A field is invalid — see `x-error-codes` for the vocabulary.

  /documents/{id}:
    get:
      tags: [documents]
      summary: One document's filing (read scope)
      description: |
        Title, folder, status and history size. **Not the prose** — join the
        WebSocket session for that.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { description: 'No document with that id (`notfound.document`).' }
    patch:
      tags: [documents]
      summary: Rename, refile or restatus a document (write scope)
      description: |
        `initiative` accepts an explicit null to clear it. Bumps `version`, which
        counts metadata edits only — CRDT updates arrive by the thousand and
        would make an `If-Match` precondition meaningless.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentPatch" }
      responses:
        "200":
          description: The updated document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { description: 'No document with that id (`notfound.document`).' }
        "422":
          description: A field is invalid — see `x-error-codes` for the vocabulary.
    delete:
      tags: [documents]
      summary: Archive a document (write scope)
      description: |
        Archive, not delete, and the update log is left exactly as it was. That
        is what makes unarchiving honest: the prose comes back, not a copy that
        lost the record of how it was argued into shape.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The archived document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { description: 'No document with that id (`notfound.document`).' }

  /documents/{id}/unarchive:
    post:
      tags: [documents]
      summary: Bring an archived document back (write scope)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The restored document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { description: 'No document with that id (`notfound.document`).' }

  /documents/{id}/run:
    post:
      tags: [documents]
      summary: Ask the document agent for a proposal (write scope)
      description: |
        The prompt bar. **The one route in this server that calls a language
        model**, and a deliberate exception to the "Takomo stores, the agent
        computes" division the rest of the API keeps.

        It is OFF unless `TAKOMO_TENSORX_API_KEY` is configured; without it this
        answers `503 document.agent_not_configured` and everything else on
        `/documents` works unchanged. `GET /v1/whoami` reports
        `features.doc_agent` so a client knows before it offers the bar.

        What the exception does NOT change: the model is constrained by JSON
        Schema to answer with **operations against block ids**, its answer goes
        through the same validation a fleet agent's ops do — ids checked against
        the live document, `scope` enforced, unusable ops dropped and reported —
        and the result is a **proposal** a person still has to accept. It has no
        privileged path into the prose.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction:
                  type: string
                  description: 'What should change, in a sentence. 1..=2000 characters.'
                scope:
                  type: [array, "null"]
                  items: { type: string }
                  description: 'Block ids the run may touch. ENFORCED server-side, not merely stated in the prompt — an op outside the list is dropped and reported in `skipped`.'
                model:
                  type: string
                  description: 'Override the configured model for this run.'
      responses:
        "200":
          description: A proposal was written. Nothing is live text.
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal: { type: string, description: 'prop-xxxxxxxx' }
                  document: { type: string }
                  status: { type: string, enum: [pending] }
                  summary: { type: string, description: "The model's one-sentence account of the change." }
                  operations: { type: integer, description: 'Ops actually offered.' }
                  skipped:
                    type: array
                    items: { type: string }
                    description: 'One sentence per dropped op. Shown to the reviewer too: a proposal smaller than intended must not be accepted as if it were whole.'
                  model: { type: string }
        "409": { description: 'The document is archived (`conflict.document_archived`).' }
        "422": { description: 'The instruction is empty or too long (`validation.document_instruction`), or no op could be applied (`validation.document_ops`).' }
        "502": { description: 'The provider failed or answered unusably (`document.agent_failed`). Nothing was written.' }
        "503": { description: 'No document agent is configured (`document.agent_not_configured`).' }

  /documents/{id}/session:
    post:
      tags: [documents]
      summary: Mint a ticket for the sync socket (read scope)
      description: |
        A browser `WebSocket` cannot set an `Authorization` header — the same
        limitation that keeps `/board` polling `/v1/events` rather than using the
        SSE stream. Polling is not an option for a CRDT, so the credential has to
        ride the handshake, and putting the caller's real `tk_` token in a query
        string would scatter it through every access log on the path.

        This mints a `tkd_` ticket instead: **one document, expiring, revocable**,
        and carrying no more than the token that asked for it — `can_write` is
        copied from the caller's scopes, so a `read`-only reader joins as a
        read-only peer whose edits are never applied.

        The same ticket now serves mindmaps (`POST /v1/mindmaps/{id}/session`),
        so the reply names the object generically in `object` and `kind` as well
        as under its kind-specific key. The kind is checked against the id rather
        than assumed from the route: an `mm-…` id presented here is a
        `notfound.document`, not a ticket for something the caller did not ask
        for.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The ticket and where to use it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, description: 'The object the ticket reaches — the field to read. `document` below is the same value, kept because a client written against this route already reads it.' }
                  kind: { type: string, enum: [document, mindmap], description: 'Always `document` here.' }
                  document: { type: string }
                  session: { type: string, description: 'ds-xxxxxxxx, the revocable handle.' }
                  token: { type: string, description: '`tkd_…`. Shown once; stored hashed.' }
                  can_write: { type: boolean, description: 'Copied from the minting token scopes.' }
                  display: { type: string, description: 'The name collaborators see next to a caret.' }
                  expires_at: { type: string, format: date-time }
                  url: { type: string, description: 'The socket BASE, without the room — y-websocket appends the room and params itself.' }
                  room: { type: string, description: 'The room to append: the document id.' }
                  note: { type: string }
        "404": { description: 'No document with that id (`notfound.document`).' }

  /checks/{id}/session:
    post:
      tags: [checks]
      summary: Mint a scoped collaboration ticket for check definition text
      description: Requires read scope and project access. The nodes map contains a definition map with title, body and precondition Y.Text fields. Verdicts remain separate validated actions.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Shared collaboration session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollaborationSession' }
        "404": { description: Object not found. }
  /projects/{id}/session:
    post:
      tags: [projects]
      summary: Mint a scoped ticket for project change notifications
      description: Requires read scope and project access. Connect a plain WebSocket to url/room with the ticket query parameter. Receives a JSON refresh notification on connection and after committed changes; re-read project resources through the authenticated API. Notifications can be coalesced and carry no record payload.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Project notification session; room is project followed by a colon and the project id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollaborationSession' }
        "404": { description: Project not found. }
  /sync/{id}:
    get:
      tags: [documents, mindmaps, checks]
      summary: Shared collaboration WebSocket authenticated by an object-scoped ticket
      description: Standard binary Yjs sync and awareness for documents, mindmaps and check definitions. Project rooms instead emit JSON refresh notifications. Structured content commits its CRDT and SQL projection before broadcast. Document content uses the existing debounced persistence. Revoked or expired sessions are disconnected; the ticket must match this room exactly. The older /docsync route remains compatible.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: ticket, in: query, required: true, schema: { type: string } }
      responses:
        "101": { description: WebSocket upgraded. }
        "401": { description: Missing or invalid ticket. }
        "403": { description: Ticket belongs to a different object. }
        "410": { description: Ticket revoked or expired. }

  /docsync/{id}:
    get:
      tags: [documents]
      summary: The y-protocols sync socket (WebSocket, ticket auth)
      description: |
        A WebSocket speaking the standard Yjs sync protocol, served in-process by
        `yrs` — so a stock `y-websocket` provider connects to it unmodified and
        there is no Node sidecar to deploy.

        **This route sits outside every bearer middleware**, for the reason
        `/oauth/*` does: it authenticates with a credential of its own, and a
        middleware demanding a different one would make it unreachable. Pass a
        `tkd_` ticket from `POST /v1/documents/{id}/session` as `?ticket=`.

        The document id is the LAST path segment, and that is a wire requirement:
        `y-websocket` composes its address as `serverUrl + "/" + room + "?" +
        params`, so a route with anything after the room — or a base handed over
        with a query string already on it — is silently assembled wrong.

        Frames are lib0-varint-framed binary:

        ```
        varuint messageType
          0 SYNC       varuint syncType
                         0 STEP1   varbytes state vector  -> server replies STEP2
                         1 STEP2   varbytes update        -> applied
                         2 UPDATE  varbytes update        -> applied and relayed
          1 AWARENESS  varbytes awareness update          -> relayed verbatim
        ```

        Awareness is relayed and never parsed: the server is not a participant, so
        a replica of who is where could only be a stale third opinion about a fact
        the peers already hold.

        Edits are broadcast from memory and persisted by a debounced background
        flush, never per keystroke — every write in this process is serialized
        behind one mutex, and that serialization is the exactly-one-claimant
        guarantee for the ready queue.

        This one route serves BOTH kinds of collaborative object. The room id
        carries its own kind — `doc-…` is a document, `mm-…` is a mindmap — so a
        map's canvas connects here exactly as the editor does, and the error a
        refusal carries is phrased for whichever kind the id names. An id whose
        prefix is neither reaches nothing (`notfound.object`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: ticket, in: query, required: true, schema: { type: string }, description: 'A `tkd_` sync ticket.' }
      responses:
        "101": { description: 'Switching protocols — the sync session begins.' }
        "401": { description: 'Missing or unrecognized ticket (`document.session_missing`, `document.session_invalid`; `mindmap.session_missing`, `mindmap.session_invalid`).' }
        "403": { description: 'The ticket is for another object (`document.session_wrong_document`, `mindmap.session_wrong_mindmap`) — including a ticket minted for the other kind.' }
        "404": { description: 'The id names no collaborative object (`notfound.object`, `notfound.document`, `notfound.mindmap`).' }
        "410": { description: 'The ticket expired or was revoked (`document.session_expired`, `mindmap.session_expired`).' }
        "503": { description: 'The object is at its live-editor ceiling (`document.too_many_peers`, `mindmap.too_many_peers`).' }

  /projects/{project}/environments:
    get:
      tags: [environments]
      summary: The places a check can be run (read scope)
      description: |
        The registry an agent reads BEFORE running a check: base URL, how to
        bring each environment up and give it back, what data is in it, and
        whether writing to it is safe.

        It exists because a verdict with no environment behind it is a claim
        nobody can reproduce, and because all of this used to travel out of band
        — which is exactly the context that goes stale without anyone noticing.

        Takomo runs none of it. `bring_up` and `teardown` are prose handed to
        whoever needs them next, `writable` is advisory, and `credentials_hint`
        is a POINTER to where a credential lives and never a credential.
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - name: kind
          in: query
          schema: { type: string, enum: [local, ephemeral, shared, staging, production, other] }
          description: narrow to one kind
        - name: archived
          in: query
          schema: { type: string, enum: [include] }
          description: include archived environments, which are kept because past verdicts still reference them
        - { name: limit, in: query, schema: { type: integer }, description: '1..=200 (default 200)' }
      responses:
        "200":
          description: The environments, sorted by slug — the reader is usually picking one.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Environment" }
                  total: { type: integer, description: 'Environments matching the filter, ignoring limit.' }
                  limit: { type: integer }
                  note: { type: string, description: 'Present only when the page left environments out.' }
    post:
      tags: [environments]
      summary: Register an environment (write scope)
      description: |
        Takes `write`, not `human`: an agent that has just leased an ephemeral
        instance is exactly the caller this registry exists for, and gating it
        on a person would push that registration back out of band.

        `kind: production` defaults `writable` to false. That is a default and
        not a rule — a project that really does test writes against production
        can send `writable: true` — but it errs toward refusing a destructive
        run rather than permitting one.
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentCreate" }
      responses:
        "201":
          description: The registered environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "409":
          description: The slug is already taken in this project (`conflict.environment_slug`).
        "422":
          description: A field is invalid — see `x-error-codes` for the vocabulary.

  /environments/{id}:
    get:
      tags: [environments]
      summary: One environment (read scope)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "404": { description: No environment with that id (`notfound.environment`). }
    patch:
      tags: [environments]
      summary: Update an environment (write scope)
      description: |
        `base_url` and `credentials_hint` accept an explicit null to clear them,
        so a value can be removed once set.

        There is deliberately no `slug`: it is the handle checks and tool calls
        carry, so renaming one would silently break every reference to it. A new
        name is a new environment, and the old one is archived.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentPatch" }
      responses:
        "200":
          description: The updated environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
    delete:
      tags: [environments]
      summary: Archive an environment (write scope)
      description: |
        Archiving, not deletion. A decommissioned box is still the evidence
        behind every verdict ever taken there, and deleting the row would orphan
        that history — the same reason a check is archived rather than dropped.

        An archived environment leaves the default list and stays readable by id.
        Reversible with `/unarchive`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The archived environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }

  /environments/{id}/unarchive:
    post:
      tags: [environments]
      summary: Restore an archived environment (write scope)
      description: |
        Archiving changed nothing else about the environment, so this is a pure
        reversal.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The restored environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }

  /initiatives/{id}/verification:
    get:
      tags: [checklist]
      summary: One initiative's verification standing (read scope)
      description: |
        "3 stale, 1 never run, 6 verified, last verified when" for the checks
        filed under this initiative — the answer to whether the tests a feature
        was agreed on still pass.

        A SUB-RESOURCE rather than a field on the initiative, for cost: the
        rollup scans the checks and cases beneath it, and the initiative's JSON
        shape is shared by the list read, so inlining this would make listing
        200 initiatives pay that scan 200 times.

        `blocked` counts only `blocking`-severity checks with outstanding work.
        Advisory and low nag; a gate that fires on everything gets overridden
        out of habit and stops meaning anything.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The standing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  initiative: { type: string }
                  project: { type: string }
                  title: { type: string }
                  checks: { type: integer, description: 'live checks filed under this initiative' }
                  cases: { $ref: "#/components/schemas/CheckCounts" }
                  percent: { type: integer, description: 'verified or approved over verifiable cases' }
                  last_verified_at: { type: [string, "null"], format: date-time }
                  blocked: { type: boolean }
                  blocking_outstanding: { type: integer }
                  check_detail:
                    type: array
                    items: { $ref: "#/components/schemas/Check" }
        "404": { description: No initiative with that id (`notfound.initiative`). }

  /projects/{project}/releases:
    get:
      tags: [checklist]
      summary: List the project's releases, newest first (read scope)
      description: |
        Releases are an ordered spine: `seq` is monotonic per project, which is
        what makes a release-count expiry policy arithmetic rather than a date
        comparison.
      parameters:
        - { $ref: "#/components/parameters/project" }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: The releases.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Release" } }
        "403": { description: Token lacks the read scope or the project }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [checklist]
      summary: Record a release and learn what it invalidated (write scope)
      description: |
        Pushed by the agent that merged the work. There is deliberately no direct
        integration: the pusher supplies `touched_paths` and `orphan_globs`
        because it has the tree checked out, and the server clones nothing.

        Every check claiming a glob that matches a touched path has its verified
        cases marked stale. A case that was NEVER verified stays `never` — calling
        it stale would report re-testing for work nobody has done once. Globs
        listed in `orphan_globs` matched no file, so those checks are flagged and
        stop counting toward coverage.

        A `ref` is immutable: pushing one twice is a 409, not an update.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleasePush" }
      responses:
        "201":
          description: The release, with what it invalidated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseWithImpact" }
        "403": { description: Token lacks the write scope or the project }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "That ref is already recorded for this project" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /projects/{project}/nodes:
    get:
      tags: [mindmaps]
      summary: The project plan's sections, flat (read scope)
      description: |
        Every section of the project's plan as `{id, mindmap, title, parent}`.

        What resolves a check's `node` into the name of the thing it verifies,
        and what fills the picker when somebody files a check against a section.
        A plan caps at 500 sections, so this is one call rather than a page.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      responses:
        "200":
          description: The sections, in tree order per plan.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        mindmap: { type: string }
                        title: { type: string }
                        parent: { type: [string, "null"] }
                  total: { type: integer }
                  limit: { type: integer }
        "403": { description: Token lacks the read scope or the project }

  /projects/{project}/checks:
    get:
      tags: [checklist]
      summary: List the project's checklist checks (read scope)
      description: |
        Each check carries its case counts, its resolved policy, and any globs that
        matched nothing in the newest release.
      parameters:
        - { $ref: "#/components/parameters/project" }
        - { name: epic, in: query, schema: { type: string }, description: 'an epic ticket id; the literal "none" narrows to ungrouped checks' }
        - { name: initiative, in: query, schema: { type: string }, description: 'an initiative id; the literal "none" narrows to checks no initiative claims — the gap between what was agreed and what got written down' }
        - { name: node, in: query, schema: { type: string }, description: 'a plan section node id; the literal "none" narrows to checks attached to no part of the plan' }
        - { name: severity, in: query, schema: { type: string, enum: [blocking, advisory, low] } }
        - { name: layer, in: query, schema: { type: string, enum: [ui, api, other] } }
        - { name: archived, in: query, schema: { type: string, enum: [include] }, description: 'include archived checks' }
        - name: limit
          in: query
          schema: { type: integer, default: 200, minimum: 1, maximum: 200 }
          description: |
            Page size, clamped rather than refused. Applied after the severity
            and layer filters, so a narrowed page is never short for the wrong
            reason.
      responses:
        "200":
          description: |
            The checks. Bounded since 0.4 — this used to return every check a
            project had, each hydrated with three further queries. `total`
            reports how many matched, so a capped read is visible as one.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Check" } }
                  total: { type: integer, description: 'Checks matching the filter, ignoring limit.' }
                  limit: { type: integer }
                  note: { type: string, description: 'Present only when the page left checks out.' }
        "403": { description: Token lacks the read scope or the project }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [checklist]
      summary: Declare a checklist check (write scope)
      description: |
        A check is ONE action with ONE entry precondition at ONE layer. Draw the
        boundary at a state transition rather than a screen: if something needs a
        persisted record, has its own permission gate, or is reachable only from
        another check's terminal state, it is a separate check.

        Takomo stores what you file and does not judge whether the model is right.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckCreate" }
      responses:
        "201":
          description: The created check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Check" }
        "403": { description: Token lacks the write scope or the project }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /checks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [checklist]
      summary: One check, with its resolved policy and case counts (read scope)
      responses:
        "200":
          description: The check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Check" }
        "403": { description: Token lacks the read scope or the project }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [checklist]
      summary: Update a check (write scope)
      description: |
        Send an override field as `null` to clear it so inheritance resumes. That
        is why the wire format distinguishes absent from null: collapsing them
        would make an inherited policy impossible to restore once overridden.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckPatch" }
      responses:
        "200":
          description: The updated check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Check" }
        "403": { description: Token lacks the write scope or the project }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [checklist]
      summary: Archive a check (write scope)
      description: |
        Archiving removes the check from coverage and from the default list, and
        keeps its cases and their verdict history: a check no longer worth running
        is still evidence of what was once verified.
      responses:
        "200":
          description: The archived check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Check" }
        "403": { description: Token lacks the write scope or the project }
        "404": { $ref: "#/components/responses/NotFound" }

  /checks/{id}/cases:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [checklist]
      summary: A check's cases (read scope)
      parameters:
        - { name: retired, in: query, schema: { type: string, enum: [include] }, description: 'include cases retired by a later regeneration' }
        - name: limit
          in: query
          schema: { type: integer, default: 500, minimum: 1, maximum: 500 }
          description: Page size, clamped rather than refused.
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
          description: |
            Skip this many. An offset is honest here where it would not be on the
            ready queue - cases are ordered by `key`, which is stable and does not
            reshuffle as agents work, so page 2 means the same thing on a second read.
      responses:
        "200":
          description: |
            The cases. Bounded since 0.4: cases are generated, and a PICT model can
            land thousands under a single check, all of which this used to return.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit]
                properties:
                  check: { type: string }
                  items: { type: array, items: { $ref: "#/components/schemas/Case" } }
                  total: { type: integer, description: 'Cases in the check, ignoring limit and offset.' }
                  limit: { type: integer }
                  offset: { type: integer }
                  note: { type: string, description: 'Present only when cases remain beyond this page.' }
        "403": { description: Token lacks the read scope or the project }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [checklist]
      summary: File the generated case set for a check (write scope)
      description: |
        Upsert is by `key`, which you derive from the parameter assignment. A case
        still present keeps its id and its verdicts; one that vanished is retired
        rather than deleted; one that returns is revived. That is what makes
        regenerating a model after adding a parameter safe — history follows the
        assignment, not the row order.

        `prune: false` extends the set instead of replacing it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseFile" }
      responses:
        "200":
          description: What filing the set did.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseFileOutcome" }
        "403": { description: Token lacks the write scope or the project }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /cases/{id}:
    get:
      tags: [checklist]
      summary: One case, with its full verdict history (read scope)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseWithHistory" }
        "403": { description: Token lacks the read scope or the project }
        "404": { $ref: "#/components/responses/NotFound" }

  /cases/{id}/verdict:
    post:
      tags: [checklist]
      summary: Record a verdict on a case (write scope; human scope for a human verdict)
      description: |
        The agent's verdict and the human's are stored as separate facts, because
        a policy of `agent_then_human` needs both and collapsing them would make
        "a person looked at this" unrecoverable. A verdict clears staleness — that
        is the point of re-running it.

        `actor_kind` defaults to `agent`. Sending `human` requires the `human`
        scope: an agent may record what it observed, but only a person's token may
        assert that a person approved a case.

        `unreachable` is not a failure. It says the check's declared layer gives no
        way to reach this configuration, which is a finding worth reporting, and it
        is counted apart from both covered and uncovered.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerdictCreate" }
      responses:
        "200":
          description: The case after the verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "403": { description: "Token lacks the write scope, the project, or the human scope for a human verdict" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The case was retired by a later regeneration" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /projects/{project}/checklist/policy:
    get:
      tags: [checklist]
      summary: The project's checklist policies (read scope)
      description: |
        One row per scope. The row whose `epic` is null is the project-level
        default; a row with an epic id overrides it for that epic's checks.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      responses:
        "200":
          description: The policies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ChecklistPolicy" } }
        "403": { description: Token lacks the read scope or the project }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [checklist]
      summary: Set the project default or an epic override (write scope)
      description: |
        Policy resolves project then epic then check, and every resolved value says
        which level supplied it — an inherited setting nobody can trace is worse
        than no setting. Send a field as `null` to clear the override.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistPolicyInput" }
      responses:
        "200":
          description: The stored policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecklistPolicy" }
        "403": { description: Token lacks the write scope or the project }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /projects/{project}/checklist/coverage:
    get:
      tags: [checklist]
      summary: Coverage, rolled up per epic (read scope)
      description: |
        `percent` is verified-or-approved over *verifiable* cases. Stale, failed and
        never are outside the numerator: a percentage that counts a case nobody has
        re-run since the code changed is the exact comfort this feature exists to
        remove.

        `unreachable` is outside the **denominator** as well — that is what "counted
        apart from both covered and uncovered" means arithmetically. Leaving it in
        would cap a fully-verified project below 100% forever with no action that
        could close the gap, and a ceiling nobody can reach is a number people learn
        to ignore. The count stays on the report as its own finding.

        This measures coverage of the DECLARED surface — hand-written globs that
        are known to rot — not measured execution. `orphan_globs` is how the rot
        stays visible.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      responses:
        "200":
          description: The coverage report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coverage" }
        "403": { description: Token lacks the read scope or the project }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{project}/checklist/worklist:
    get:
      tags: [checklist]
      summary: What must be re-verified, split by who can clear it (read scope)
      description: |
        Human time is the scarce resource — a hundred cases cost an agent minutes
        and cost a person a day — so the split is the product rather than a
        formatting choice. A stale case under `agent_then_human` appears on the
        AGENT list until it has a fresh agent verdict, so it never sits in a
        person's queue waiting for work only an agent can do.

        `reason` is one of stale, expired, failed, blocked, never or awaiting_human.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      responses:
        "200":
          description: The worklist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Worklist" }
        "403": { description: Token lacks the read scope or the project }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{project}/checklist/gate:
    get:
      tags: [checklist]
      summary: Is verification good enough to ship (read scope)
      description: |
        Only `blocking` severity blocks. Advisory and low checks nag: a gate that
        fires on everything gets overridden out of habit and stops meaning
        anything.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      responses:
        "200":
          description: The gate verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecklistGate" }
        "403": { description: Token lacks the read scope or the project }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{project}/schedule-approval:
    put:
      tags: [schedules, admin]
      summary: Require (or stop requiring) a human to activate an agent-proposed schedule
      description: |
        Requires the `admin` scope, like every other project setting.

        A schedule outlives the token that created it, so a `write` credential able
        to start one could keep writing tickets long after it was revoked. With this
        on — the default — a schedule created by a caller **without** the `human`
        scope lands `pending` and fires nothing until a human activates it. Turn it
        off to let a fleet schedule its own recurring work.

        A `human` caller's own schedule is born active either way: asking someone to
        approve their own proposal is theatre when they already hold the authority
        the flag protects.
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [required]
              properties:
                required: { type: boolean }
      responses:
        "200":
          description: The setting as stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  schedule_approval: { type: boolean }

  /schedules:
    get:
      tags: [schedules]
      summary: List schedules
      description: |
        Requires the `read` scope; bounded by the token's project allowlist.

        Ordered the way the page renders: waiting-for-you (`pending`) first, then
        `active`, then stopped — so a client never has to re-sort. Each row carries
        the single next slot in `upcoming`.
      parameters:
        - { name: project, in: query, required: false, schema: { type: string } }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, active, paused, rejected, retired] }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 200, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: The project's schedules.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedules:
                    type: array
                    items: { $ref: "#/components/schemas/Schedule" }

    post:
      tags: [schedules]
      summary: Create a schedule
      description: |
        Requires the `write` scope for the named project — deliberately not
        `human`. An agent noticing "this keeps coming back every week" and
        proposing a cadence is a behaviour worth having, and what it creates is
        inert: unless the caller carries `human`, a project with
        `schedule_approval` on lands the schedule `pending` with no next slot, so
        the sweep cannot see it. **Activating** is what needs `human`.

        The response always carries `upcoming` — the first three slots the cadence
        produces — so the caller can see what it just bought without running the
        rule in its head. When the schedule landed `pending` it also carries a
        `message` saying so in words an agent will act on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, name, cadence, template]
              properties:
                project: { type: string }
                name: { type: string, maxLength: 300, description: 'what the cadence is called, e.g. "Weekly review"' }
                cadence: { $ref: "#/components/schemas/Cadence" }
                template: { $ref: "#/components/schemas/ScheduleTemplate" }
                starts_at:
                  type: string
                  format: date-time
                  description: |
                    The interval anchor and the earliest slot; defaults to now.
                    `interval` counts from here rather than from calendar parity,
                    which is what keeps "every 2 weeks" landing on the same weeks a
                    year later.
                ends_at: { type: string, format: date-time, description: 'after this the schedule retires rather than firing forever' }
                rationale: { type: string, description: 'why the proposer thinks this recurs; shown to whoever reviews it' }
      responses:
        "201":
          description: The new schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }

  /schedules/{id}:
    get:
      tags: [schedules]
      summary: Fetch one schedule with its next slots and occurrence history
      description: |
        Requires the `read` scope. The project check runs against the schedule's
        own project, so naming an id never grants access to it.

        `occurrences` carries the history newest-first with each `outcome`
        **derived** from the ticket rather than stored — which is why it can never
        disagree with the ticket, and why re-opening an old ticket changes what its
        slot looks like.

        Returns an `ETag` (the version) for `If-Match` on PATCH.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: occurrences, in: query, required: false, schema: { type: integer, default: 8, minimum: 1, maximum: 200 }, description: 'how much history to include' }
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }

    patch:
      tags: [schedules]
      summary: Edit a schedule
      description: |
        Requires the `human` scope. Send `If-Match: "<version>"` from the ETag;
        a mismatch is a 409 carrying the current version.

        Changing the cadence or the window recomputes the next slot immediately.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: If-Match, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 300 }
                cadence: { $ref: "#/components/schemas/Cadence" }
                template: { $ref: "#/components/schemas/ScheduleTemplate" }
                ends_at: { type: [string, "null"], format: date-time, description: 'null clears the window; omit to keep it' }
      responses:
        "200":
          description: The updated schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "409": { $ref: "#/components/responses/Conflict" }

    delete:
      tags: [schedules]
      summary: Delete a schedule
      description: |
        Requires the `human` scope.

        The tickets it created are **kept**: they are real work with real history,
        and the `schedule` field on them stays as the record of where they came
        from. That column carries no foreign key for exactly this reason.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Confirmation, and a note that the tickets were kept.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string }
                  note: { type: string }

  /schedules/{id}/occurrences:
    get:
      tags: [schedules]
      summary: A schedule's occurrence history
      description: |
        Requires the `read` scope. The same list the detail view previews, over a
        longer window — one row per slot that produced a ticket, newest first.

        A slot that never produced a ticket (the server was down across it) is not
        here: it leaves a gap rather than a row. The `schedule_missed` event
        records how many were passed over, so a hole reads as "nothing was running"
        rather than "nothing was scheduled".
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 40, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: The history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedule: { type: string }
                  occurrences:
                    type: array
                    items: { $ref: "#/components/schemas/ScheduleOccurrence" }

  /schedules/{id}/activate:
    post:
      tags: [schedules]
      summary: Activate a pending schedule
      description: |
        Requires the `human` scope — this is the half of the flow that cannot be
        automated, and the reason an agent may propose a schedule at all.

        Computes the next slot, so the schedule starts firing. Legal only from
        `pending`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The now-active schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "409": { $ref: "#/components/responses/Conflict" }

  /schedules/{id}/reject:
    post:
      tags: [schedules]
      summary: Turn down a proposed schedule
      description: |
        Requires the `human` scope. Legal only from `pending`, and terminal: a
        rejected schedule is re-created rather than revived, so the record stays
        honest about what was agreed when.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The rejected schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "409": { $ref: "#/components/responses/Conflict" }

  /schedules/{id}/pause:
    post:
      tags: [schedules]
      summary: Stop a schedule firing, keeping its history
      description: |
        Requires the `human` scope. Clears the next slot, which is what makes a
        paused schedule inert by construction rather than by a check: the sweep's
        partial index cannot see a row with no next slot.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The paused schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "409": { $ref: "#/components/responses/Conflict" }

  /schedules/{id}/resume:
    post:
      tags: [schedules]
      summary: Resume a paused schedule
      description: |
        Requires the `human` scope. Computes forward from now and **never**
        backfills the pause, so unpausing a long-paused schedule cannot dump
        history into the ready queue.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The resumed schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "409": { $ref: "#/components/responses/Conflict" }

  /schedules/{id}/run:
    post:
      tags: [schedules]
      summary: Fire a schedule now, off-cycle
      description: |
        Requires the `human` scope. Creates the ticket for the slot the schedule
        would next have used, without shifting the cadence — the next slot still
        advances normally, so a manual run is an extra occurrence rather than a
        moved one.

        `created: false` is **not** an error: it means that slot already has a
        ticket, which is the `UNIQUE(schedule, occurrence)` index doing its job.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The ticket that was created, or a note that the slot already had one.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedule: { type: string }
                  ticket: { type: [string, "null"] }
                  created: { type: boolean }
                  note: { type: string }
        "409": { $ref: "#/components/responses/Conflict" }


components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: See auth.md — `tk_`-prefixed tokens, scoped, hashed at rest.
    shareBearer:
      type: http
      scheme: bearer
      description: |
        A SHARE token (`tks_`-prefixed), minted by `POST /v1/shares` and hashed
        at rest like a normal token. It is a distinct auth path: it authorizes
        ONLY the read-only `/v1/shares/self*` endpoints, bounded to its scope,
        and is rejected on every normal endpoint. Expired/revoked shares return
        `410 Gone`. See auth.md.
    answerBearer:
      type: http
      scheme: bearer
      description: |
        An ANSWER-LINK token (`tka_`-prefixed), minted by
        `POST /v1/questions/{id}/answer-link`. A distinct auth path: it
        authorizes ONLY `/v1/answer/self` for the one referenced question,
        is single-use (spent in the same transaction that records the answer, so
        simultaneous submissions on one link resolve to exactly one applied
        answer), auto-expires, and is rejected on every other endpoint.
        Expired/used/revoked links return `410 Gone`.

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Ticket id, e.g. "rvp-x7k2"
    project:
      name: project
      in: path
      required: true
      schema: { type: string }

  responses:
    NotFound:
      description: Unknown id
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Version mismatch, claim held by another, or stale fence
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: The request body failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    CollaborationSession:
      type: object
      required: [object, kind, session, token, can_write, display, expires_at, url, room]
      properties:
        object: { type: string }
        document: { type: string, description: Legacy alias for object. }
        kind: { type: string, enum: [document, mindmap, check, project] }
        session: { type: string }
        token: { type: string, description: Short-lived tkd_ ticket; stored hashed. }
        can_write: { type: boolean }
        display: { type: string }
        actor: { type: string, description: Stable actor identity for partitioning local draft storage. }
        durability_ack: { type: boolean, description: Supports ordered WebSocket persistence acknowledgements (message type 4). }
        expires_at: { type: string, format: date-time }
        url: { type: string, description: WebSocket base path without the room. }
        room: { type: string }

    Project:
      type: object
      properties:
        id: { type: string, description: 'short slug, also the ticket id prefix' }
        name: { type: string }
        workflow: { type: string, description: workflow name in effect }
        question_language: { type: [string, "null"], description: 'Human-facing language agents should phrase ask-a-human questions in (e.g. "German"); null = no preference' }
        style_guide: { type: [string, "null"], description: "House style for the text agents write on this project — ticket titles/bodies, comments, and human-facing questions; null = no preference" }
        answer_link_ttl_seconds:
          type: [integer, "null"]
          minimum: 1
          maximum: 2592000
          description: "Default lifetime of an answer link minted for one of this project's questions; null = unset, so minting falls back to the built-in 604800 seconds (7 days)"
        claim_ttl_seconds:
          type: [integer, "null"]
          minimum: 1
          description: |
            The lease a claim on one of this project's tickets gets when it names
            no ttl_seconds; null = unset, so claiming falls back to the built-in
            900 seconds. A different setting from answer_link_ttl_seconds above —
            that bounds a credential handed outside the org, this bounds how long
            a worker may hold a ticket.
        max_claim_ttl_seconds:
          type: [integer, "null"]
          minimum: 1
          description: |
            The ceiling an explicit ttl_seconds on a claim or heartbeat is checked
            against; null = unset, so the built-in 3600 seconds applies. There is
            deliberately no upper bound: a deployment may set whatever its fleet
            needs. Note this value is also the ready queue's recovery time — only
            expired leases are swept, so a crashed worker parks its ticket for
            exactly this long.
        archived:
          type: boolean
          description: |
            True while the project is archived — a GATE, not a status. Every write
            under it is refused with a 409 `project.archived` (tickets, claims,
            transitions, comments, questions, tags, schedules, checklist, and the
            project's own settings), and its tickets are dropped from the ready
            queue so no agent is handed work it would then be refused. Reads are
            untouched. Reversible: `POST /projects/{project}/unarchive` restores
            the project exactly as it stood, because archiving changed nothing
            about it.
        archived_at:
          type: [string, "null"]
          format: date-time
          description: 'When the project was archived; null while it is live'
        created_at: { type: string, format: date-time }

    ProjectCreate:
      type: object
      required: [id, name]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9-]{1,15}$" }
        name: { type: string }
        workflow: { $ref: "#/components/schemas/Workflow" }
        question_language: { type: string, description: 'Optional: the human-facing question language for the project' }
        style_guide: { type: string, description: "Optional: the project's house style for agent-written text (max 2000 characters)" }
        answer_link_ttl_seconds:
          type: integer
          minimum: 1
          maximum: 2592000
          description: "Optional: the project's default answer-link lifetime in seconds (max 2592000; omit to use the built-in 7 days)"
        claim_ttl_seconds:
          type: integer
          minimum: 1
          description: "Optional: the default lease a claim gets, in seconds (omit to use the built-in 900). Must not exceed max_claim_ttl_seconds, or the built-in 3600 when that is omitted."
        max_claim_ttl_seconds:
          type: integer
          minimum: 1
          description: "Optional: the ceiling an explicit ttl_seconds may ask for, in seconds (omit to use the built-in 3600). No upper bound."

    Tag:
      type: object
      description: |
        A project-scoped named entity of some `kind` (person, component, team, …)
        that tickets reference by `kind:handle`. Generic by design — a new kind
        is just a new string, no schema change — with per-kind attributes in the
        free-form `meta` object. Identity is (project, kind, handle).
      properties:
        id: { type: string }
        project: { type: string }
        kind: { type: string, description: 'entity kind slug, e.g. person, component, team' }
        handle: { type: string, description: 'identity within (project, kind)' }
        ref: { type: string, description: 'canonical kind:handle reference stored on tickets' }
        label: { type: string, description: human-facing display name }
        person:
          description: |
            Present only on a `person:` reference whose handle names somebody in the
            people directory — `null` otherwise, including for a person handle nobody
            was added under.

            A `person:ada` tag and the user `ada` are the same person by
            construction (they share the handle rule), so the *authority* on their
            name is the directory and this tag row is a reference to it. That matters
            because tagging a ticket lazy-creates a stub whose `label` is the handle
            again; `person.label` is what a reader should see.
          oneOf:
            - { type: "null" }
            - type: object
              properties:
                handle: { type: string }
                name: { type: [string, "null"] }
                label: { type: string, description: 'the name, falling back to the handle' }
                disabled: { type: boolean, description: 'true = cannot be handed new work' }
        meta: { type: object, description: 'free-form per-kind attributes, e.g. {"email": "..."}; 64 KiB cap' }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TagCreate:
      type: object
      required: [kind, handle]
      properties:
        kind: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}$" }
        handle: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$" }
        label: { type: string, description: 'display name; defaults to the handle' }
        meta: { type: object }

    UserRef:
      type: object
      description: |
        A person, as *referenced* rather than listed — a question's `assignee`,
        `whoami`'s `user`. Enough to render a name without a second request.
      properties:
        id: { type: string, description: 'e.g. "usr-9f3ka2xz"' }
        handle: { type: string }
        name: { type: string }
        label: { type: string, description: 'what to show a human: the name, falling back to the handle' }
        ref: { type: string, description: 'the canonical person:<handle> tag reference for this person' }
        disabled: { type: boolean }

    User:
      type: object
      description: |
        A person: the directory entry work can be addressed to.

        **A user says who work is waiting on; a scope says what a credential may
        do.** This is not a login and grants nothing on its own — takomo has four
        independent token paths and no password anywhere. What it adds is
        addressing: a question can be waiting on Ada rather than on whoever holds
        `expert:domain:billing`.

        Global to the server, unlike a `Tag`, so every `answered_by` and `assignee`
        reference resolves to the same human from anywhere; `projects` (membership)
        is what bounds where they can be handed work.

        `handle` is validated by the *tag* handle rule, which is what keeps
        `person:<handle>` a legal reference to this person and stops the tag
        convention that predates the directory forking away from it.

        There is no delete — see `/users/{handle}/disable`.
      properties:
        id: { type: string, description: 'e.g. "usr-9f3ka2xz"' }
        handle: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$" }
        name: { type: string }
        label: { type: string, description: 'name, falling back to the handle; sanitized for terminal display' }
        ref: { type: string, description: 'the canonical person:<handle> tag reference' }
        email: { type: [string, "null"], description: 'for a human reader — takomo never sends mail' }
        meta: { type: object, description: 'free-form attributes; 64 KiB cap' }
        disabled: { type: boolean, description: 'true = cannot be assigned new work; every past record still resolves' }
        disabled_at: { type: [string, "null"], format: date-time }
        projects:
          type: array
          items: { type: string }
          description: |
            Project memberships, ascending. Present only on a read that joined them
            (`GET /v1/users`, `GET /v1/users/{handle}`) — absent rather than empty
            elsewhere, so it never claims "member of nothing".
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserCreate:
      type: object
      required: [handle]
      properties:
        handle: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$", description: 'lowercase identity, e.g. "ada" or "j.chen". The real name goes in `name`.' }
        name: { type: string }
        email: { type: string }
        meta: { type: object }
        projects:
          type: array
          items: { type: string }
          description: 'memberships to create alongside the person, in one transaction'

    UserPatch:
      type: object
      description: |
        The handle is deliberately absent: it is what every reference resolves
        through. Send `email: null` to clear the address — absent and null mean
        different things here.
      properties:
        name: { type: string }
        email: { type: [string, "null"] }
        meta_merge: { type: object, description: 'RFC 7386 merge into `meta`; a null value deletes a key' }

    UserMembership:
      type: object
      description: |
        One person's membership of one project: who may be *handed work* there.
        Directory scoping, not access control — a token's `projects` allowlist
        still decides what that credential may read or write.
      properties:
        user: { type: string, description: 'the usr- id' }
        project: { type: string }
        added_by: { type: string }
        created_at: { type: string, format: date-time }

    TagPatch:
      type: object
      description: At least one of label / meta_merge is required
      properties:
        label: { type: string }
        meta_merge: { type: object, description: RFC 7386 merge-patch; null deletes a key }

    ShareCreate:
      type: object
      required: [kind, ref]
      properties:
        kind:
          type: string
          enum: [project, epic]
          description: "project = all tickets in the project; epic = a ticket + its full recursive subtree"
        ref: { type: string, description: project id (kind=project) or root ticket id (kind=epic) }
        ttl_seconds:
          type: integer
          description: link lifetime in seconds (default 86400 = 24h, max 2592000 = 30d)

    Share:
      type: object
      description: Share metadata — never carries the plaintext token or its hash.
      properties:
        id: { type: string, description: 'public handle for list/revoke, e.g. "share_a8f2k1x9q7z3"' }
        kind: { type: string, enum: [project, subtree], description: "stored kind; an 'epic' request is stored as 'subtree'" }
        ref: { type: string, description: project id or root ticket id }
        project: { type: string, description: denormalized project the share is scoped to }
        expires_at: { type: string, format: date-time }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }

    ShareCreated:
      allOf:
        - $ref: "#/components/schemas/Share"
        - type: object
          properties:
            token: { type: string, description: "the SHARE token plaintext — shown ONCE (tks_-prefixed)" }
            path: { type: string, description: "fragment URL to open, e.g. /board#s=<token>" }
            warning: { type: string }

    ShareSelf:
      type: object
      description: A share's own scope plus the project workflow, for board rendering.
      properties:
        kind: { type: string, enum: [project, subtree] }
        ref: { type: string }
        project: { type: string }
        expires_at: { type: string, format: date-time }
        workflow: { $ref: "#/components/schemas/Workflow" }

    WhoAmI:
      type: object
      properties:
        token_id: { type: string, description: 'public token handle, e.g. "tok_a8f2k1x9"' }
        actor: { type: string, description: this token's actor identity }
        scopes: { type: array, items: { type: string } }
        projects:
          description: array of project ids, or the string "*" for all projects
          oneOf:
            - { type: string, const: "*" }
            - { type: array, items: { type: string } }
        user:
          description: |
            The person in the directory this credential belongs to, or null for a
            machine token. Distinct from `actor`, which is a free-form string the
            credential carries: this one the server can vouch for, which is why it
            is what `?mine=true` reads and one of the two authorities that can
            answer an `approve`.
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/UserRef" }

    Token:
      type: object
      description: Token metadata — never carries the plaintext or the at-rest hash.
      properties:
        id: { type: string, description: 'public handle for list/revoke, e.g. "tok_a8f2k1x9"' }
        actor: { type: string }
        scopes: { type: array, items: { type: string } }
        projects:
          description: array of project ids, or "*" for all
          oneOf:
            - { type: string, const: "*" }
            - { type: array, items: { type: string } }
        rate_limit: { type: integer, description: per-minute write budget }
        user:
          type: [string, "null"]
          description: |
            The `usr-` id of the person this credential belongs to, or null for a
            machine token. Set only at mint, by an admin: a named assignee may answer
            an `approve`, so binding a token to a person grants authority rather than
            labelling a row.
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        oauth_client:
          type: object
          description: |
            Present ONLY on a token the OAuth flow issued, and absent (not null) on
            a hand-minted one — which is how you tell them apart, and which
            connection a row is. It matters because revoking such a row ends that
            whole connection: an OAuth access token is deliberately an ordinary
            token row, so nothing else on it says so.
          properties:
            client_id: { type: string, examples: ["oc_a8f2k1x9q7z3n4m6"] }
            client_name:
              type: [string, "null"]
              description: null when the client registered without one (RFC 7591 makes it optional), or when its registration has since been swept
            label:
              type: string
              description: |
                what to show a human — `client_name`, falling back to `client_id`, with
                control characters and bidirectional overrides replaced by `?`. Prefer
                it over raw `client_name` anywhere the value is displayed.

    TokenCreate:
      type: object
      required: [actor, scopes]
      properties:
        actor: { type: string, description: "identity, e.g. agent:runner-1, human:alice" }
        scopes:
          type: array
          minItems: 1
          items: { type: string }
          description: "e.g. read, write, human, autoland, admin (free-form scopes allowed)"
        projects:
          description: array of project ids, or "*"/omitted for all projects
          oneOf:
            - { type: string, const: "*" }
            - { type: array, items: { type: string }, minItems: 1 }
        expires_seconds: { type: integer, description: optional TTL in seconds from now }
        rate_limit: { type: integer, default: 120, description: per-minute write budget }
        user:
          type: string
          description: |
            Bind this credential to a person in the directory, by handle or `usr-` id.
            An unknown or disabled person is refused rather than stored as a dangling
            string.

            This is an authorization act: it is what makes the caller *be* that
            person, so an `approve` addressed to them can be answered, and what
            `?mine=true` reads. Identity deliberately lives here rather than in a
            scope — scopes are free-form, so a `user:usr-…` scope would be a forgeable
            identity. Omit it for a machine token.

    TokenCreated:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          properties:
            token: { type: string, description: 'the plaintext tk_ token — shown ONCE, never again' }
            warning: { type: string }

    Cadence:
      type: object
      description: |
        A recurrence rule. See `spec/schedule-format.md`.

        Unknown fields are refused, and so is a field that does not apply to the
        unit: `{"every":"day","on":["mon"]}` is a 422 rather than an ignored extra,
        because accepting it would fire seven times a week when the author asked
        for one. A cron-shaped string is answered with its translation instead of
        being parsed.

        The finest cadence is daily. There is no sub-daily unit on purpose: a
        ticket a fleet churns through every few minutes is a worker loop, not a
        task store's job.
      required: [every, at]
      additionalProperties: false
      properties:
        every: { type: string, enum: [day, week, month] }
        interval: { type: integer, default: 1, minimum: 1, maximum: 52, description: 'repeat every N units, counted from the schedule''s starts_at' }
        on:
          type: array
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
          description: 'week cadences only, and required there'
        day: { type: integer, minimum: 1, maximum: 31, description: 'month cadences only; a day past the end of a short month is clamped to that month''s last day' }
        at: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', description: 'local wall-clock time, 24-hour, zero-padded' }
        tz:
          type: string
          description: |
            IANA zone name, default UTC. Slots are computed in LOCAL time, so
            "every Monday at 09:00" stays 09:00 across a daylight-saving boundary.
            Where local time is not a total function: a wall clock deleted by
            spring-forward clamps to the first minute that exists (never dropping
            the occurrence), and one that happens twice on fall-back fires on the
            earlier.

    ScheduleTemplate:
      type: object
      description: |
        The ticket each occurrence creates — a ticket create minus `project`, and
        minus `parent` and `blocked_by`. Those two are absent on purpose: an
        occurrence that inherited a dependency would stop being independent of its
        siblings, which is the invariant the whole feature rests on.
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 300
          description: |
            May contain four placeholders, and deliberately only four:
            `{date}` → 2026-08-03, `{week}` → 2026-W32, `{month}` → 2026-08 (all
            local to the cadence's zone, because they label the occurrence for a
            human) and `{slot}` → 2026-08-03T07:00:00Z (UTC, because it is the
            occurrence's identity).
        body: { type: string, maxLength: 131072, description: 'markdown; the same placeholders apply' }
        type: { type: string, enum: [epic, task, bug, spike], default: task }
        priority: { type: string, enum: [critical, high, normal, low], default: normal }
        labels: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string }, description: '`kind:handle` references' }

    Schedule:
      type: object
      properties:
        id: { type: string }
        project: { type: string }
        name: { type: string }
        cadence: { $ref: "#/components/schemas/Cadence" }
        template: { $ref: "#/components/schemas/ScheduleTemplate" }
        status:
          type: string
          enum: [pending, active, paused, rejected, retired]
          description: |
            `pending` = proposed by an agent, waiting on a human, firing nothing.
            `active` = firing. `paused` = stopped, history kept. `rejected` and
            `retired` (window elapsed) are terminal.
        proposed_by: { type: [string, "null"], description: 'the agent that proposed it, when it needed approval' }
        rationale: { type: [string, "null"] }
        next_slot:
          type: [string, "null"]
          format: date-time
          description: |
            The next slot to fire. Always null unless `status` is `active` — that
            invariant is what makes a pending or paused schedule inert by
            construction, because the sweep's partial index cannot see a row
            without one.
        starts_at: { type: string, format: date-time, description: 'the interval anchor and earliest slot' }
        ends_at: { type: [string, "null"], format: date-time }
        upcoming: { type: array, items: { type: string, format: date-time }, description: 'the next slots this cadence produces, so a caller can see what it bought' }
        occurrences:
          type: array
          items: { $ref: "#/components/schemas/ScheduleOccurrence" }
          description: 'present on the detail view only'
        message: { type: string, description: 'present when the schedule landed pending: what happened and what to do about it' }
        cadence_error: { type: string, description: 'present only when the stored cadence no longer parses — a corrupt row, reported rather than silently defaulted' }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, description: 'monotonic; ETag value' }

    ScheduleOccurrence:
      type: object
      description: |
        One slot that produced a ticket, with its outcome derived from that ticket
        rather than stored — so it can never disagree with the ticket, at the cost
        of re-opening an old ticket changing what its slot looks like.
      properties:
        ticket: { type: string }
        slot: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        title: { type: string }
        state: { type: string }
        state_category: { type: string }
        outcome:
          type: string
          enum: [done, open, not_fulfilled]
          description: |
            `done` = the state is terminal. `open` = not terminal and the deadline
            has not passed — this is the one to do. `not_fulfilled` = not terminal
            and the deadline has passed: nobody finished it in time. Nothing on the
            server closes a not_fulfilled occurrence; a maintenance agent does,
            through the ordinary API.
        claimed_by: { type: [string, "null"], description: 'who holds or last held the lease — evidence for the outcome, not part of it' }
        archived_at: { type: [string, "null"], format: date-time }

    Ticket:
      type: object
      properties:
        id: { type: string }
        project: { type: string }
        type: { type: string, enum: [epic, task, bug, spike] }
        parent: { type: [string, "null"] }
        title: { type: string, maxLength: 300 }
        body: { type: string, maxLength: 131072, description: markdown }
        state: { type: string, description: workflow state id }
        state_category: { type: string, enum: [todo, in_progress, blocked, review, done, cancelled] }
        priority: { type: string, enum: [critical, high, normal, low], default: normal }
        labels: { type: array, items: { type: string } }
        tags:
          type: array
          items: { type: string }
          maxItems: 50
          description: 'canonical `kind:handle` references into the project tag registry (e.g. person:ada); reference metadata only, at most 50 per ticket'
        metadata:
          type: object
          description: freeform JSON; keys namespaced "<actor-or-tool>.<key>"; 64 KiB cap
        links:
          type: object
          description: well-known evidence pointers
          properties:
            branch: { type: string }
            pr: { type: string, format: uri }
            env: { type: string, format: uri }
            run: { type: string }
        blocked_by: { type: array, items: { type: string } }
        claim:
          type: [object, "null"]
          properties:
            holder: { type: string, description: actor name from token }
            expires_at:
              type: [string, "null"]
              format: date-time
              description: >-
                null on an active claim = it never expires: an epic claim taken
                without a TTL, held until released or force-released.
            since:
              type: [string, "null"]
              format: date-time
              description: >-
                when the claim was granted (null only for claims from before
                this field existed).
        version: { type: integer, description: monotonic per ticket; ETag value }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time, description: 'when archived (hidden from default views), or null when active' }
        schedule: { type: [string, "null"], description: 'the schedule that materialized this ticket, or null for a hand-made one. Provenance and a link back, not a relationship: two occurrences of one schedule have no edge between them.' }
        occurrence: { type: [string, "null"], format: date-time, description: 'the calendar slot this ticket stands for. Unique per schedule, which is what makes exactly-one-ticket-per-slot structural.' }
        expires_at: { type: [string, "null"], format: date-time, description: 'when this ticket stops counting as LIVE work — the moment its schedule''s next occurrence is due. Past it the ticket leaves the ready queue and reads as not_fulfilled; nothing archives or transitions it.' }

    TicketCreate:
      type: object
      required: [project, title]
      properties:
        project: { type: string }
        type: { type: string, default: task }
        parent: { type: string }
        title: { type: string }
        body: { type: string }
        priority: { type: string }
        labels: { type: array, items: { type: string } }
        tags:
          type: array
          items: { type: string }
          maxItems: 50
          description: '`kind:handle` tag references to attach; unknown handles are registered on the fly. At most 50 per ticket — each reference is a statement inside the write transaction — else 422 `tag.too_many`'
        metadata: { type: object }
        blocked_by: { type: array, items: { type: string } }
        state: { type: string, description: "optional; must be a legal initial state, defaults to workflow initial" }

    ConventionHints:
      type: object
      description: |
        The project's advisory writing conventions, attached to the work-loop
        responses an agent reads before it writes: create a ticket, read one,
        claim one, pop the ready queue. Each key is absent when the project sets
        nothing, so a project with no conventions carries no extra payload.
        Neither is enforced server-side. Set them with
        `PUT /projects/{project}/style` and `PUT /projects/{project}/language`,
        and read them back as plain fields on `GET /projects`.
      properties:
        style_hint:
          type: object
          description: Present only when the project has a style guide set.
          properties:
            style_guide: { type: string, description: "the project's house style for ticket titles/bodies, comments, and human-facing questions" }
            note: { type: string, description: "what to do with it, written for an LLM reader" }
        language_hint:
          type: object
          description: Present only when the project has a question language set.
          properties:
            question_language: { type: string, description: 'the human-facing language ask-a-human questions and their options belong in (e.g. "German")' }
            note: { type: string, description: "what to do with it, written for an LLM reader" }

    TicketCreated:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - $ref: "#/components/schemas/ConventionHints"
        - type: object
          properties:
            similar:
              type: array
              description: |
                Open tickets that look like possible duplicates, scored by
                title-token overlap (Jaccard) with a nudge when the ticket types
                match, and thresholded so an incidental single shared word does
                not cry wolf. Sorted by descending score. Check before proceeding.
              items:
                type: object
                properties:
                  id: { type: string }
                  title: { type: string }
                  state: { type: string }
                  type: { type: string }
                  score: { type: number, description: 'blended similarity, 0..1 (2 d.p.)' }
                  matched_terms: { type: array, items: { type: string }, description: title tokens that overlapped }

    TicketPatch:
      type: object
      description: All fields optional; state is absent by design (use /transition)
      properties:
        title: { type: string }
        body: { type: string, description: requires If-Match }
        priority: { type: string }
        labels: { type: array, items: { type: string } }
        labels_add: { type: array, items: { type: string } }
        labels_remove: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string }, maxItems: 50, description: 'whole-set replace of `kind:handle` tag references. At most 50 per array, and the resulting set is capped at 50 too, else 422 `tag.too_many` with the count and limit in `details`' }
        tags_add: { type: array, items: { type: string }, maxItems: 50, description: 'tag references to add (commutative); refused when the resulting set would exceed 50' }
        tags_remove: { type: array, items: { type: string }, maxItems: 50, description: 'tag references to remove (commutative)' }
        parent: { type: [string, "null"] }
        links: { type: object, description: "per-key merge: string value sets a key, null deletes it, untouched keys survive" }
        metadata_merge: { type: object, description: RFC 7386 merge-patch; null deletes a key }
        fence: { type: integer, description: required while ticket is claimed and caller is holder }

    Comment:
      type: object
      properties:
        id: { type: string }
        ticket: { type: string }
        author: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }

    InitiativeRollup:
      type: object
      description: |
        The derived size and shape of an initiative: how much has accumulated on
        it, and how much of it is waiting on a person. Not stored anywhere —
        recomputed from the entries on every read, so it cannot drift from what it
        describes.

        `open_notes` and `pending_amendments` are the attention pair, and the only
        fields here that tell a caller where to look next rather than how big
        something is. They apply the same rules the document view does: a note
        stops counting once it is resolved or superseded, an amendment once a
        decision has accepted or rejected it, and document entries naming no real
        pane are skipped because no reader can reach them.
      properties:
        entries: { type: integer, description: 'number of entries' }
        attachments: { type: integer, description: 'entries carrying attachment bytes' }
        chars: { type: integer, description: 'characters of entry text, summed — the "how long is this" number, counting characters rather than UTF-8 bytes' }
        bytes: { type: integer, description: 'total stored bytes: entry text (UTF-8) plus attachment content' }
        attachment_bytes: { type: integer, description: 'of which attachment content, so a wall of text is distinguishable from a pile of PDFs without fetching either' }
        megabytes: { type: number, description: 'bytes as MiB, rounded to two decimals — precomputed because every surface wants it and each would round differently' }
        last_entry_at: { type: [string, "null"], format: date-time }
        open_notes: { type: integer, description: 'unresolved notes anchored in the document — a thread nothing supersedes and nobody resolved. Someone''s unanswered question' }
        pending_amendments: { type: integer, description: 'proposed wording no decision has accepted or rejected: an agent is offering a rewrite that is not live until a person says so' }

    Mindmap:
      type: object
      description: |
        A tree grown at conversation speed, before any of it is an idea.

        What separates it from an `Initiative` is not the shape but the stakes: an
        initiative is nurtured, a mindmap is scratch and deleting one is ordinary.
        There is no workflow, no claim, no lease and no assignment here — it is a
        brainstorming method and nothing more.

        `title` is the root: a map starts from one thing and everything hangs off
        it.
      properties:
        id: { type: string, description: 'e.g. "mm-9f3ka2xz"' }
        project: { type: string }
        title: { type: string, description: 'the root — what this is about' }
        summary: { type: string }
        status:
          type: string
          enum: [open, parked, distilled]
          description: |
            A label an owner sets, not a workflow state — the same vocabulary an
            initiative uses. `distilled` = its branches have graduated.
        metadata: { type: object }
        nodes:
          type: integer
          description: |
            How many thoughts hang off it — a denormalised count, written by
            whichever call last read the map's document.

            The nodes are no longer rows to count: they live in a Yjs document,
            and a count would mean opening and replaying that document for every
            row of a list. So on `GET /v1/mindmaps/{id}` this is **exact** — that
            read has the whole map in hand and stores the number it found — while
            in a list it is as fresh as the last writer left it, and may lag a
            live editing session by one flush interval. Read the map itself when
            the number has to be exact.
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    MindmapNode:
      type: object
      description: |
        One thought. The `title` is capped at 280 characters — see
        `validation.mindmap_node_text` — and `notes` is the escape hatch that
        keeps that cap honest.

        The brevity is the method rather than a limitation: the title is what the
        outline and the canvas render, and a branch you cannot read at a glance
        has stopped being a brainstorm. Detail no longer has to be truncated or
        promoted away — it goes in `notes`, which appear only on a node somebody
        opened.
      properties:
        id: { type: string, description: 'e.g. "mn-9f3ka2xz"' }
        mindmap: { type: string }
        parent:
          type: [string, "null"]
          description: 'null = a first-ring branch off the root'
        title: { type: string, maxLength: 280, description: 'The field''s real name. A sentence or two — what the outline and the canvas render.' }
        text:
          type: string
          maxLength: 280
          description: |
            The same value as `title`, under the name it had before `notes`
            existed. Still returned, and still accepted on write, because renaming
            a field is not a good enough reason to break somebody's script.
        notes:
          type: string
          maxLength: 8000
          description: |
            The long form of one thought. Does not appear in the outline; you open
            a node to read it. Past this length the branch wants to be an
            initiative, and the refusal (`validation.mindmap_notes`) says so.
        position:
          type: integer
          description: |
            **Rank among this node's SIBLINGS** — 0, 1, 2, … within one ring, not
            a gapped global integer and not unique across the map.

            It used to be a gapped column (1000, 2000, …). Order is now a
            fractional index, because gapped integers cannot survive concurrency:
            two peers inserting between the same pair both pick 1500. The index
            key itself is deliberately not on the wire — it is an opaque string
            that has to stay free to change shape — so what a reader gets is the
            rank the old integer always meant to them.
        edge_label:
          type: string
          maxLength: 80
          description: |
            Labels the hierarchy edge **to this node's parent**. Unambiguous
            because a node has exactly one parent; `MindmapRelationship.label`
            describes every other kind of edge.
        kind:
          type: string
          enum: [thought, question, decision, screen, component]
          description: |
            `thought` is the default and the overwhelming majority. The rest exist
            because a map of a system wants to say what a box *is*.
        origin:
          type: string
          enum: [human, agent]
          description: |
            Who put it there. Stored from the start even though nothing renders it
            yet, because adding a field to a shared document later means converting
            everybody's map a second time.
        reviewed:
          type: boolean
          description: 'An agent-written node a person has looked at. Settable on the node PATCH; nothing renders it yet.'
        icons:
          type: array
          maxItems: 8
          items: { type: string }
          description: 'Short tokens. Anything longer belongs in the title or the notes.'
        color: { type: string, description: 'Explicit field, deliberately NOT part of a style blob: a blob merges as a whole, so two people changing different things about one node would clobber each other.' }
        shape: { type: string, description: 'As `color` — its own field so it merges on its own.' }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/MindmapAttachment" }
          description: 'Pointers to things that live elsewhere. Sorted by name, then id, because a map has no order of its own.'
        at:
          description: |
            Hand placement, or `null` to let the layout place it. Null by default,
            which is what keeps a map growing at typing speed tidy; a map that has
            been arranged stays exactly where it was left.

            The pair is one field rather than two nullable numbers because half a
            coordinate places nothing.
          oneOf:
            - { type: "null" }
            - type: object
              properties:
                x: { type: number }
                y: { type: number }
        promoted:
          description: |
            What this branch became, once it graduated — and the whole reason a map
            keeps earning its place after the brainstorming is over.
          oneOf:
            - { type: "null" }
            - type: object
              properties:
                kind: { type: string, enum: [epic, initiative] }
                id: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MindmapNodeAdd:
      type: object
      description: |
        One thought to add. `title` is the field's name and `text` is the name it
        had before `notes` existed; send either, and exactly one is required.
      properties:
        parent: { type: string, description: 'omitted = a first-ring branch off the root' }
        title: { type: string, maxLength: 280, description: 'a sentence or two' }
        text: { type: string, maxLength: 280, description: 'accepted alias for `title`' }
        notes: { type: string, maxLength: 8000, description: 'the long form, which does not render in the outline' }
        position:
          type: integer
          description: |
            The **index among the new node's siblings** to place it at — 0 puts it
            first in its ring. Omitted appends to the end, which is what typing
            does; a value is what splitting one thought into two needs.
        kind: { type: string, enum: [thought, question, decision, screen, component], description: 'defaults to `thought`' }
        edge_label: { type: string, maxLength: 80, description: 'labels the edge to `parent`' }
      anyOf:
        - { required: [title] }
        - { required: [text] }

    MindmapRelationship:
      type: object
      description: |
        An edge that is **not** part of the hierarchy — a question hanging off the
        thing it questions, a screen that navigates to another, a "see also".

        One whose `from` or `to` no longer resolves is dropped when the map is
        read, not repaired: a dangling edge is not a node and there is nothing to
        keep.
      properties:
        id: { type: string, description: 'e.g. "mr-9f3ka2xz"' }
        from: { type: string, description: 'a node id on this map' }
        to: { type: string, description: 'a different node id on this map' }
        label: { type: string, maxLength: 80 }

    MindmapAttachment:
      type: object
      description: |
        A **pointer**, never the bytes. Bytes in a CRDT log are replayed by every
        peer that joins, so a map holding a file would get slower to open for
        everybody, forever.
      properties:
        id: { type: string, description: 'e.g. "ma-9f3ka2xz"' }
        kind: { type: string, enum: [pdf, code, table, diagram, audio, link] }
        name: { type: string, maxLength: 200, description: 'what somebody reads before deciding to follow it' }
        gist: { type: string, maxLength: 500, description: 'one line of what it says' }
        ref: { type: string, maxLength: 2000, description: 'where it is — a URL or a path' }

    MindmapAttachmentAdd:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, enum: [pdf, code, table, diagram, audio, link] }
        name: { type: string, maxLength: 200 }
        gist: { type: string, maxLength: 500 }
        ref: { type: string, maxLength: 2000 }

    Initiative:
      type: object
      description: |
        An idea being nurtured, with a collection of research inputs appended over
        time. Deliberately **not** a ticket: no workflow, no claim, no lease, no
        fence, no ready queue — nothing races for an initiative, because appending
        is not exclusive. Two agents adding findings at once both belong, and the
        append-only entry log keeps both.

        `status` is a plain lifecycle label, not a state machine: `open` is being
        fed, `parked` is deliberately set aside (still readable, still appendable),
        `distilled` records that its substance became tickets — the only outcome an
        initiative has, since it is never "done" on its own terms.
      properties:
        id: { type: string, description: '`ini-…`' }
        project: { type: string }
        title: { type: string, description: 'the quick name the idea goes by' }
        summary: { type: string, description: 'a very short description; the long form belongs in an entry, where it carries provenance' }
        status: { type: string, enum: [open, parked, distilled] }
        labels: { type: array, items: { type: string } }
        tags:
          type: array
          items: { type: string }
          description: '`kind:handle` references into the same project tag registry tickets use, so `person:ada` means the same thing here'
        metadata: { type: object }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: 'moves when an entry is appended too — the collection is part of the initiative' }
        version: { type: integer, description: 'guards the description against a concurrent edit. Appending an entry does NOT move it: an append never conflicts with a description change.' }
        rollup: { $ref: "#/components/schemas/InitiativeRollup" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/InitiativeEntry" }
          description: 'present only on the MCP `takomo_initiative_show` payload, which returns a page of entries inline; the REST detail route leaves them to /initiatives/{id}/entries'

    InitiativeEntry:
      type: object
      description: |
        One contribution to an initiative: a note, a research finding, a
        colleague's feedback, a transcript, an uploaded document. Append-only —
        the accumulated record IS the initiative, so nothing here is edited in
        place.

        Generic in two directions. `kind` is a free-form slug, so a new sort of
        input needs no schema change; and every entry may carry text, an
        attachment, or both.

        Provenance is first-class rather than left to a note: `source` says where
        the input came from, `source_uri` points at it, and `origin_at` records
        when the content was *written* as opposed to `created_at`, when it landed
        here. A transcript pasted in a week later has two different, both correct,
        timestamps.

        A handful of `kind` + `meta` combinations are RESERVED, and `/initiatives`
        reduces them into a document of three panes. They are conventions over
        this same schema, not new fields: see `docs/initiatives.md`.

          kind `view`     meta { pane, cites: [entryId, …] } — one pane's prose,
                          `pane` being business | technical | verification. A
                          `[n]` mark in the text cites the n-th id in `cites`
                          (1-based, local to that entry).
                          With `proposed: true` it is an AMENDMENT: offered to a
                          human as a diff, never live until accepted.
          kind `thread`   meta { pane, para, state?, ticket?, supersedes? } — a
                          margin note anchored to paragraph `para` (0-based).
                          `state` is open | running | resolved.
          kind `decision` meta { accepts | rejects: <entryId> } — a verdict on an
                          amendment.
          any kind        meta { origin: true } — the words the idea ARRIVED in,
                          quoted above every pane.

        Everything is still append-only. A pane is revised by appending a new
        `view`; a thread changes state by appending one that `supersedes` it.
      properties:
        id: { type: string, description: '`ie-…`' }
        initiative: { type: string }
        project: { type: string }
        kind: { type: string, description: 'free-form slug matching ^[a-z][a-z0-9-]*$ — conventionally note, research, feedback, transcript, document, decision' }
        title: { type: [string, "null"] }
        text: { type: string, description: 'the markdown content' }
        has_content: { type: boolean, description: 'whether there are attachment bytes to download' }
        mime: { type: [string, "null"], description: 'bare `type/subtype`; served back as the attachment Content-Type' }
        filename: { type: [string, "null"] }
        chars: { type: integer, description: 'characters of `text`' }
        bytes: { type: integer, description: 'this entry total: text UTF-8 bytes plus attachment bytes' }
        content_bytes: { type: integer, description: 'attachment bytes, 0 when text-only. Capped at 5 MiB per entry.' }
        source: { type: string, description: 'REQUIRED where this came from — an agent id, a person, a conversation' }
        source_uri: { type: [string, "null"] }
        origin_at: { type: [string, "null"], format: date-time, description: 'when the content originated, as opposed to created_at' }
        meta: { type: object, description: 'free-form JSON the appender attached. Reserved shapes above are read by /initiatives; anything else is ignored by the server and carried verbatim.' }
        author: { type: string, description: 'the actor that appended it' }
        created_at: { type: string, format: date-time }

    TicketMove:
      type: object
      required: [tickets, to_project]
      properties:
        tickets:
          type: array
          minItems: 1
          items: { type: string }
          description: |
            Ticket ids to move. An epic id moves the epic; whether its children
            come along is `descendants`.
        to_project:
          type: string
          description: The project these tickets should live in afterwards.
        descendants:
          type: boolean
          default: true
          description: |
            Move each named ticket's full descendant subtree with it. false moves
            only the named tickets and leaves their children behind with `parent`
            cleared, because a parent and child must share a project.

    TicketMoveResult:
      type: object
      properties:
        to_project: { type: string }
        total: { type: integer, description: 'How many tickets actually moved.' }
        moved:
          type: array
          items:
            type: object
            properties:
              id: { type: string, description: 'Unchanged by the move.' }
              from_project: { type: string }
              to_project: { type: string }
              from_state: { type: string }
              to_state: { type: string, description: 'Equals from_state unless the target workflow lacks that state.' }
              state_reset: { type: boolean, description: "The ticket landed on the target workflow's initial state." }
              parent_cleared: { type: boolean, description: "The ticket's parent stayed behind, so the link was cut." }
        unchanged:
          type: array
          items: { type: string }
          description: Named or reached but already in the target project.
        orphaned:
          type: array
          items: { type: string }
          description: Tickets left behind whose parent moved away, so their parent was cleared.
        checks_detached:
          type: array
          items: { type: string }
          description: Checklist checks whose epic left the project; the checks stayed.
        policies_dropped:
          type: array
          items: { type: string }
          description: Epics whose epic-level checklist policy override was dropped with them.
        note:
          type: string
          description: Prose for anything the move had to reconcile — state resets, orphans, detached checks.

    Promotion:
      type: object
      description: A record that a ticket's work reached a named target/stage. Free-form and domain-agnostic.
      properties:
        id: { type: string, description: 'e.g. "pr-9f3ka2xz"' }
        ticket: { type: string }
        project: { type: string }
        target: { type: string, description: 'Free-form stage, e.g. "staging", "production", "published"' }
        url: { type: [string, "null"] }
        ref: { type: [string, "null"], description: version/commit/build id }
        note: { type: [string, "null"] }
        actor: { type: string }
        created_at: { type: string, format: date-time }

    Lease:
      type: object
      properties:
        ticket: { type: string }
        holder: { type: string }
        fence: { type: integer, description: echo in every mutating call while claimed }
        expires_at:
          type: [string, "null"]
          format: date-time
          description: >-
            null = the lease never expires — an epic claimed without
            `ttl_seconds`, held until released. Everything else always carries
            a timestamp.
        resumed:
          type: boolean
          description: >-
            Present and true only when this claim resumed the holder's own lapsed
            lease in a state the workflow does not mark claimable. Absent on an
            ordinary claim, a renewal, and every heartbeat.

    ClaimStatus:
      type: object
      description: >-
        The claim on a ticket as a judgeable fact: who, for how long, and what
        has moved beneath it since the grant.
      properties:
        ticket: { type: string }
        type: { type: string, description: the ticket's type; epic is the one whose claim reserves the subtree }
        holder: { type: [string, "null"], description: null = unclaimed }
        held_since: { type: [string, "null"], format: date-time }
        held_for_seconds: { type: [integer, "null"] }
        expires_at:
          type: [string, "null"]
          format: date-time
          description: null while held = never expires (an epic claim without a TTL)
        indefinite: { type: boolean, description: true for an active claim with no expiry }
        movement:
          type: [object, "null"]
          description: >-
            What moved in the subtree since the claim. Null when unclaimed, or
            when the claim predates grant-time recording.
          properties:
            since: { type: string, format: date-time, description: the claim grant — the anchor every count is relative to }
            created: { type: integer, description: subtree tickets created since the claim }
            closed: { type: integer, description: distinct subtree tickets that entered a terminal state since the claim }
            in_progress: { type: integer, description: currently in an in_progress-category state }
            blocked: { type: integer, description: currently in a blocked-category state or carrying an open dependency }
            open: { type: integer, description: currently non-terminal and not archived }
            last_activity_at: { type: [string, "null"], format: date-time, description: "newest subtree event since the claim, if any" }
            idle_seconds: { type: integer, description: "seconds since the last movement, anchored at the claim when nothing has moved" }

    AnswerGrant:
      type: object
      description: Metadata for a per-question answer link (the plaintext token is never returned here).
      properties:
        id: { type: string, description: 'e.g. "ag_…"' }
        question: { type: string }
        project: { type: string }
        actor: { type: string, description: 'Who a use of this link is attributed to' }
        expires_at: { type: string, format: date-time }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        used_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }

    Question:
      type: object
      description: An agent's request for a human decision, tied to a ticket. See the ask-a-human board.
      properties:
        id: { type: string, description: 'e.g. "q-9f3ka2xz"' }
        project: { type: string }
        ticket: { type: string }
        asked_by: { type: string }
        mode: { type: string, enum: [blocking, advisory], description: 'blocking parks+resumes the ticket; advisory records a routed decision with no state change' }
        kind: { type: string, enum: [confirm, choose, clarify, approve] }
        title: { type: string }
        body: { type: string }
        options: { type: array, items: { type: string } }
        option_notes: { type: array, items: { type: string }, description: 'Per-option descriptions, parallel to options (empty when none)' }
        multi: { type: boolean, description: 'A choose question that takes several options' }
        recommended_multi: { type: array, items: { type: string }, description: 'For a multi choose, the recommended set' }
        recommended: { description: "The agent's suggested answer (any JSON), or null" }
        recommended_note: { type: [string, "null"], description: Short rationale for the recommendation }
        confidence: { type: [integer, "null"], minimum: 1, maximum: 4, description: Recommendation strength (1 tentative … 4 very strong) }
        summary: { type: [string, "null"], description: One-line list-preview summary }
        expertise: { type: array, items: { type: string }, description: 'Routing tags, e.g. ["domain:billing"]' }
        assignee:
          description: |
            The person this decision is waiting on, resolved, or null for the open
            queue. Orthogonal to `expertise` and both may be set: expertise says
            what a qualified answerer must be, this says who was actually asked.

            An object carrying only `id` and `label` means the row names somebody a
            read did not resolve — degraded display, never "unassigned", because
            reading it as null would leave the decision sitting in an open pool
            while its person waited to be asked.
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/UserRef" }
        urgency: { type: string, enum: [critical, high, normal, low] }
        status: { type: string, enum: [open, answered, withdrawn, expired] }
        answer: { description: 'The recorded human answer ({ value, note? }), or null while open' }
        answered_by: { type: [string, "null"] }
        answered_at: { type: [string, "null"], format: date-time }
        resolved_to: { type: [string, "null"], description: State the ticket was resumed into }
        expires_at: { type: [string, "null"], format: date-time }
        on_timeout: { type: [string, "null"], enum: [recommended, escalate, cancel, null] }
        awaiting: { type: string, enum: [human, agent], description: 'Whose turn on the follow-up thread while open: human (ready to answer) or agent (a human asked for more research)' }
        thread:
          type: array
          description: 'Follow-up messages, oldest first (present on GET /questions/{id}). Each { id, question, author, role: human|agent, body, created_at }.'
          items: { type: object }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    AnswerResume:
      type: object
      description: |
        What an answer did to its ticket. `resumed` and `to` say whether this
        answer moved the ticket out of its blocked state and where to.

        When a blocking answer cleared the barrier but no transition out of the
        parked state could carry the resume, the answer is still recorded and
        the ticket stays parked — and `code`, `message` and `remedy` say why and
        what to call next, so a caller never has to infer "still parked" from a
        null `resolved_to`. Those three are absent when nothing went wrong.
      properties:
        resumed: { type: boolean, description: Whether this answer moved the ticket }
        to: { type: [string, "null"], description: State the ticket was resumed into }
        code: { type: string, description: "Machine-readable reason the ticket could not be resumed: a question code (e.g. question.no_resume) or, since the resume runs through the transition machinery, a transition one (e.g. claim.held)" }
        message: { type: string, description: "What is wrong, including every exit from the parked state and what each would take" }
        remedy: { type: string, description: The exact next call that gets the ticket moving again }

    Event:
      type: object
      properties:
        seq: { type: integer, description: 'global, strictly increasing' }
        ticket: { type: string }
        project: { type: string }
        actor: { type: string }
        kind:
          type: string
          description: |
            Event log discriminator. Every kind the server emits is listed here;
            kinds in `x-event-kinds-reserved` are also listed but are never
            emitted — reserved so clients filtering the log can tell a dead arm
            from a missing one.
          enum: [archived, checklist.cases_filed, checklist.check_archived, checklist.check_created, checklist.check_updated, checklist.policy_set, checklist.verdict, claimed, commented, created, dep_added, dep_removed, document.archived, document.created, document.unarchived, document.updated, environment.archived, environment.created, environment.unarchived, environment.updated, heartbeat, initiative_created, initiative_deleted, initiative_entry_added, initiative_updated, lease_expired, lease_revoked, mindmap_created, mindmap_deleted, mindmap_grown, mindmap_moved, mindmap_promoted, mindmap_pruned, mindmap_updated, project_archived, project_deleted, project_unarchived, project_updated, question_answered, question_assigned, question_asked, question_escalated, question_expired, question_followup_requested, question_options_revised, question_reopened, question_replied, question_withdrawn, release.pushed, released, schedule_activated, schedule_created, schedule_deleted, schedule_fired, schedule_missed, schedule_paused, schedule_proposed, schedule_rejected, schedule_updated, tag_created, tag_deleted, tag_updated, ticket_created, ticket_moved, ticket_orphaned, ticket_promoted, transitioned, unarchived, updated, user_created, user_disabled, user_enabled, user_project_added, user_project_removed, user_updated, workflow_changed]
        payload: { type: object, description: kind-specific; transitions carry from/to/reason }
        at: { type: string, format: date-time }

    WorkflowEntry:
      type: object
      description: |
        One entry in the workflow library: a named state machine, plus where its
        nodes sit in the editor.

        `layout` is deliberately a SIBLING of `workflow`, not a key inside it.
        The workflow document is `deny_unknown_fields`, so positions carried
        inside it would be rejected the moment the document was applied.
      required: [id, name, workflow, builtin, created_at, created_by, updated_at]
      properties:
        id: { type: string, description: "e.g. wf-9f3ka2xz" }
        name: { type: string }
        description: { type: [string, "null"] }
        workflow: { $ref: "#/components/schemas/Workflow" }
        layout:
          type: [object, "null"]
          additionalProperties: true
          description: state id to an x/y position; null when never laid out
        builtin:
          type: boolean
          description: >-
            ships with the server and is reseeded on every start, so it cannot be
            edited, renamed or deleted through the API
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        updated_at: { type: string, format: date-time }

    Workflow:
      type: object
      description: See workflow-format.md for authoring format and semantics
      required: [name, initial, states, transitions]
      properties:
        name: { type: string }
        initial: { type: string }
        states:
          type: array
          items:
            type: object
            required: [id, category]
            properties:
              id: { type: string }
              category: { type: string, enum: [todo, in_progress, blocked, review, done, cancelled] }
              claimable: { type: boolean, default: false }
              terminal: { type: boolean, default: false }
        transitions:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: string }
              to: { type: string }
              requires:
                type: array
                items: { type: string }
                description: >-
                  any of: claim | scope:<scope> | guard:<guard-id> |
                  guard:has_link:<key>. Guard ids are no_open_children and
                  no_open_blockers; guard:has_link:<key> requires a non-empty
                  links.<key> on the ticket (guard:has_link:commit is the
                  evidence gate for done — see spec/workflow-format.md).
        guards:
          type: object
          description: named guard configs, e.g. no_open_children on done-category entry

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            stable machine code, e.g. conflict.version, claim.held, fence.stale
            (superseded lease), fence.invalid (fence never issued — a client bug).
            `x-error-codes` at the root of this document lists every code the
            server can emit, with what each means; it is kept complete by a test,
            not by hand. Branch on the code, never on the message.
        message: { type: string, description: written for LLM readers — states what is wrong AND what to do }
        remedy: { type: string, description: 'the exact next call to make, when one exists' }
        current_version: { type: integer }
        details: { type: object }

    OauthError:
      type: object
      description: |
        The error body of the `/oauth/*` endpoints and the two `.well-known`
        documents — RFC 6749 §5.2's shape, NOT takomo's `Error` schema above.

        This is the contract's one deliberate inconsistency, and it is forced: an
        OAuth client parses `error` and nothing else, so a `code` field would be
        invisible to it. `remedy` is takomo's addition; RFC 6749 permits extra
        members and clients ignore them, which keeps the teaching-error habit for
        the human who ends up reading this in a log.

        `x-oauth-errors` at the root of this document lists the values `error` can
        take.
      required: [error, error_description]
      properties:
        error: { type: string, examples: [invalid_grant] }
        error_description: { type: string, description: 'what is wrong, in prose' }
        remedy: { type: string, description: 'the next thing to do, when there is one' }

    TransitionError:
      allOf:
        - $ref: "#/components/schemas/Error"
      type: object
      properties:
        current_state: { type: string }
        allowed_transitions:
          type: array
          items:
            type: object
            properties:
              to: { type: string }
              requires: { type: array, items: { type: string } }
        details:
          type: object
          description: |
            extra context keyed to the `code`. For `transition.claim_required`:
            `claimable_states`, every state of this workflow in which a lease may
            be taken, and — when the current state is not one of them —
            `reentry_states`, the states reachable from here that are, i.e. the
            route back to a claimable position. For `transition.guard`: the
            `guard` that failed and any `offending_tickets`.
          properties:
            claimable_states: { type: array, items: { type: string } }
            reentry_states: { type: array, items: { type: string } }
            guard: { type: string }
            offending_tickets: { type: array, items: { type: string } }

# ---------------------------------------------------------------------------
# The error-code vocabulary (takomo-b6cg).
#
# Every `code` an error body can carry, with what it means. `ApiError`
# (src/error.rs) is the only thing in the tree that builds an error body, so this
# is the whole set — for REST, for MCP (which serialises the same body into its
# tool result) and for the `resume.code` an answer response carries when the
# ticket could not be resumed.
#
# It is gated, not aspirational. tests/api.rs
# `every_emitted_error_code_is_documented_in_the_spec` scans the `ApiError`
# constructor call sites under src/ and fails when the two sides disagree in
# either direction: a code emitted but not listed here, and a code listed here
# that nothing emits any more. `the_error_code_scan_can_see_every_construction_
# site` is the other half — it fails if a code is minted somewhere that scan
# cannot read, so the coverage above cannot quietly become partial.
#
# Codes are stable. Renaming one is a breaking change to the contract, not a
# refactor: clients branch on them. Read the families left to right —
# `validation.` a rejected input, `notfound.` a missing entity, `claim.`/`fence.`
# lease trouble, `transition.` an illegal or ungated state move, `question.`
# ask-a-human, `auth.`/`share.`/`answer.` the three token kinds.
#
# The HTTP status a code rides on is documented per route, under that route's
# `responses`. It is deliberately not restated here: a second copy would be one
# nothing checks.
    Document:
      type: object
      description: |
        A collaborative document's FILING. Note what is absent: the prose. The
        text is a Yjs CRDT synchronised over the WebSocket session, because a
        text field here would be last-write-wins — and losing what somebody typed
        while an agent was thinking is the failure this surface exists to remove.
      properties:
        id: { type: string, description: 'doc-xxxxxxxx' }
        project: { type: string }
        title: { type: string }
        path:
          type: string
          description: 'Folder, `/`-separated. Empty is the top level. A folder exists because a document names it; the last one to leave takes the folder with it.'
        status:
          type: string
          enum: [draft, review, settled, archived]
          description: 'A label, not a state machine. Nothing enforces an order between them.'
        initiative:
          type: [string, "null"]
          description: 'The initiative this was distilled from, if any. Validated on write, so a reader never meets a reference naming nothing.'
        metadata: { description: 'Free-form JSON, or null.' }
        version:
          type: integer
          description: 'Counts METADATA edits only. CRDT updates do not bump it — they arrive by the thousand and would make an If-Match precondition meaningless.'
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: 'Last metadata edit or CRDT flush, whichever came later.'
        archived_at: { type: [string, "null"], format: date-time }
        bytes:
          type: integer
          description: 'Bytes held by this document history. Derived on read, never stored.'
        updates:
          type: integer
          description: 'Rows in the update log. Derived on read; a high number means a compaction is due.'

    DocumentCreate:
      type: object
      required: [title]
      description: 'Opens an EMPTY document. There is deliberately no prose field — the first paragraph is typed into the session like every later one.'
      properties:
        title: { type: string, description: '1..=200 characters.' }
        path: { type: string, description: 'Folder. Omit or send "" for the top level.' }
        status: { type: string, enum: [draft, review, settled, archived] }
        initiative: { type: string, description: 'The initiative this was distilled from. Must exist in the same project.' }
        metadata: { description: 'Free-form JSON.' }

    DocumentPatch:
      type: object
      description: 'Every field optional. `initiative` accepts an explicit null to clear it.'
      properties:
        title: { type: string }
        path: { type: string }
        status: { type: string, enum: [draft, review, settled, archived] }
        initiative: { type: [string, "null"] }
        metadata_merge:
          type: object
          description: 'Shallow key merge; an explicit null deletes a key.'

    Environment:
      type: object
      description: |
        A place a check can be run. Takomo stores it and never touches it: the
        server runs nothing here, polls nothing, and deploys nothing.
      properties:
        id: { type: string, description: 'env-xxxxxxxx' }
        project: { type: string }
        slug:
          type: string
          description: 'The handle a person types and an agent passes. Immutable.'
        name: { type: string }
        kind:
          type: string
          enum: [local, ephemeral, shared, staging, production, other]
        base_url:
          type: [string, "null"]
          description: 'Where the application answers. Null when it has no HTTP surface.'
        bring_up:
          type: string
          description: 'How to get it running. Prose handed to whoever needs it next — Takomo never executes it, which is why it is not a structured command.'
        teardown:
          type: string
          description: 'How to give it back when the run is over. The half nobody writes down.'
        data_state:
          type: string
          enum: [seeded, empty, production_like, unknown]
          description: 'What is in it, which decides whether a case preconditions can be met at all.'
        writable:
          type: boolean
          description: 'Whether a destructive case may run here. ADVISORY — Takomo executes nothing and cannot enforce it. Defaults to false for kind=production.'
        credentials_hint:
          type: [string, "null"]
          description: 'WHERE a credential lives, e.g. env:STAGING_TOKEN or a vault path. NEVER a credential: every token with read scope can see this field.'
        notes:
          type: string
          description: 'Caveats that would make a verdict untrustworthy — reset cadence, shared sandboxes.'
        metadata: { description: 'Free-form JSON, or null.' }
        version: { type: integer }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time }

    EnvironmentCreate:
      type: object
      required: [slug]
      properties:
        slug: { type: string, description: '2-32 chars, leading lowercase letter, then lowercase letters, digits or dashes' }
        name: { type: string, description: 'Defaults to the slug.' }
        kind: { type: string, enum: [local, ephemeral, shared, staging, production, other] }
        base_url: { type: string }
        bring_up: { type: string }
        teardown: { type: string }
        data_state: { type: string, enum: [seeded, empty, production_like, unknown] }
        writable: { type: boolean, description: 'Defaults to false for kind=production, true otherwise.' }
        credentials_hint: { type: string, description: 'A pointer, never a credential.' }
        notes: { type: string }
        metadata: { description: 'Free-form JSON.' }

    EnvironmentPatch:
      type: object
      description: |
        No `slug`: it is the handle checks and tool calls carry, so renaming one
        would silently break every reference to it.
      properties:
        name: { type: string }
        kind: { type: string, enum: [local, ephemeral, shared, staging, production, other] }
        base_url: { type: [string, "null"], description: 'Explicit null clears it.' }
        bring_up: { type: string }
        teardown: { type: string }
        data_state: { type: string, enum: [seeded, empty, production_like, unknown] }
        writable: { type: boolean }
        credentials_hint: { type: [string, "null"], description: 'Explicit null clears it.' }
        notes: { type: string }
        metadata_merge: { description: 'Merged key by key into metadata; a null value removes that key.' }

    Release:
      type: object
      description: |
        An ordered marker in a project's release history, pushed by the agent that
        merged the work. `seq` is monotonic per project, which is what makes a
        release-count expiry policy arithmetic.
      properties:
        id: { type: string }
        project: { type: string }
        ref: { type: string, description: 'the tag or FULL commit sha this release stands for' }
        seq: { type: integer, description: 'monotonic per project, starting at 1' }
        note: { type: [string, "null"] }
        pushed_by: { type: string }
        created_at: { type: string, format: date-time }
        touched_paths: { type: integer, description: 'how many paths the diff carried' }
        orphan_globs:
          type: array
          items: { type: string }
          description: 'check globs that matched no file in this tree'

    ReleasePush:
      type: object
      required: [ref]
      properties:
        ref: { type: string, description: 'the tag or FULL commit sha; short shas are ambiguous' }
        note: { type: string }
        touched_paths:
          type: array
          items: { type: string }
          description: |
            Paths the release's diff touched. Supplied by the pusher because it has
            the tree checked out; the server clones nothing.
        orphan_globs:
          type: array
          items: { type: string }
          description: |
            Check globs that matched NO file in this tree. An orphaned glob reads as
            "still covered" while covering nothing, which is this feature's worst
            failure mode, so reporting them takes those checks out of coverage.

    ReleaseImpact:
      type: object
      description: What the push invalidated, returned so the pusher needs no second call.
      properties:
        stale_cases: { type: integer, description: 'DISTINCT cases staled — a check across three environments does not report its work three times over' }
        stale_pairs: { type: integer, description: '(case, environment) pairs staled: the units of work to redo. Zero for checks that declare no environments.' }
        stale_checks: { type: array, items: { type: string } }
        expired_checks: { type: array, items: { type: string }, description: 'checks whose policy clock ran out at this release' }
        orphaned_checks: { type: array, items: { type: string }, description: 'checks whose every glob matched nothing' }

    ReleaseWithImpact:
      allOf:
        - { $ref: "#/components/schemas/Release" }
        - type: object
          properties:
            impact: { $ref: "#/components/schemas/ReleaseImpact" }

    CheckCounts:
      type: object
      description: |
        A check's live cases by state. `total` is the sum of the rest. `unreachable`
        is deliberately its own bucket rather than folded into covered or uncovered,
        and `blocked` is deliberately its own rather than folded into `never`.
      properties:
        total: { type: integer }
        approved: { type: integer, description: 'a human passed it' }
        verified: { type: integer, description: 'an agent passed it' }
        stale: { type: integer, description: 'was verified, then the claimed code moved' }
        failed: { type: integer }
        unreachable: { type: integer, description: 'the declared layer cannot reach this configuration' }
        blocked: { type: integer, description: 'the runner could not get far enough to judge. Counted apart from `never` because they call for different work — usually an environment to fix rather than a case to write — and inside the coverage denominator, because a blocked case is verifiable and simply was not verified this time.' }
        never: { type: integer, description: 'no verdict has ever been recorded' }

    ResolvedPolicy:
      type: object
      description: |
        The policy in force for a check after resolving project then epic then check.
        The `*_from` fields name the level that supplied the value, because an
        inherited setting nobody can trace is worse than no setting.
      properties:
        verification: { type: string, enum: [agent, human, agent_then_human] }
        verification_from: { type: string, enum: [default, project, epic, check] }
        expiry_days: { type: [integer, "null"] }
        expiry_releases: { type: [integer, "null"] }
        expiry_from: { type: string, enum: [default, project, epic, check] }

    Check:
      type: object
      description: |
        ONE action with ONE entry precondition at ONE layer. `body` is free-form
        prose an agent or a human follows — there is deliberately no step model and
        no dependency graph, because the precondition is a statement about data
        state, which is what keeps checks independently runnable.
      properties:
        id: { type: string }
        project: { type: string }
        epic: { type: [string, "null"], description: 'a ticket of type epic this check groups under' }
        initiative: { type: [string, "null"], description: 'the initiative whose conversation agreed this check should exist. Direct rather than derived through the epic tag: the agreement usually predates any epic, so deriving it would make the link unstateable exactly when it is made' }
        node: { type: [string, "null"], description: 'the section of the project plan this check verifies — a mindmap node id. Resolved rather than copied, so a section renamed on the map is renamed here at once; null is a legitimate steady state, meaning a check about no part in particular' }
        title: { type: string }
        body: { type: string, description: 'the traversal to follow' }
        precondition: { type: string, description: 'the data state and permissions needed to start' }
        layer: { type: string, enum: [ui, api, other] }
        severity: { type: string, enum: [blocking, advisory, low] }
        verification: { type: [string, "null"], description: 'override; null means inherit' }
        expiry_days: { type: [integer, "null"] }
        expiry_releases: { type: [integer, "null"] }
        cost_agent_minutes: { type: [integer, "null"] }
        cost_human_minutes: { type: [integer, "null"] }
        metadata: { description: free-form }
        version: { type: integer }
        globs:
          type: array
          items: { type: string }
          description: 'paths of the app under test this check claims, e.g. src/claims/**'
        orphan_globs:
          type: array
          items: { type: string }
          description: 'of those globs, the ones that matched nothing in the newest release'
        environments:
          type: array
          description: 'the environments this check must be verified in; empty means environment-agnostic'
          items:
            type: object
            properties:
              environment: { type: string }
              slug: { type: string }
        cases: { $ref: "#/components/schemas/CheckCounts" }
        environment_cases:
          type: array
          description: |
            The same case set broken out per environment. `cases` above counts one
            row per CASE, taking the WORST of its environments, so declaring a
            second environment does not double the denominator — what it changes
            is each case's state. This array says where the gap actually is.
          items:
            type: object
            properties:
              environment: { type: string }
              slug: { type: string }
              cases: { $ref: "#/components/schemas/CheckCounts" }
        policy: { $ref: "#/components/schemas/ResolvedPolicy" }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time }

    CheckCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        epic: { type: string }
        environments: { type: array, items: { type: string }, description: 'environments this check must be verified in, by id or slug. Each case is then tracked per environment, so "passes on staging, never run on production" is expressible instead of collapsing into one verdict. Empty leaves the check environment-agnostic, which is the original behaviour and still the right one for a check whose result does not depend on where it runs' }
        initiative: { type: string, description: 'the initiative whose conversation agreed this check should exist. Direct rather than derived through the epic tag: the agreement usually predates any epic, so deriving it would make the link unstateable exactly when it is made' }
        node: { type: string, description: 'the section of the project plan this check verifies. Validated against the plan, because a node id that names nothing is a link nobody can follow' }
        body: { type: string }
        precondition: { type: string }
        layer: { type: string, enum: [ui, api, other], default: api }
        severity: { type: string, enum: [blocking, advisory, low], default: advisory }
        verification: { type: string, enum: [agent, human, agent_then_human] }
        expiry_days: { type: integer, minimum: 0 }
        expiry_releases: { type: integer, minimum: 0 }
        cost_agent_minutes: { type: integer, minimum: 0 }
        cost_human_minutes: { type: integer, minimum: 0 }
        globs: { type: array, items: { type: string } }
        metadata: { type: object }

    CheckPatch:
      type: object
      description: |
        Every override field accepts `null` to clear it so inheritance resumes.
        Absent and null mean different things here on purpose.
      properties:
        title: { type: string }
        body: { type: string }
        precondition: { type: string }
        layer: { type: string, enum: [ui, api, other] }
        severity: { type: string, enum: [blocking, advisory, low] }
        epic: { type: [string, "null"] }
        initiative: { type: [string, "null"] }
        environments:
          type: array
          items: { type: string }
          description: 'replaces the declared set; an empty array clears it. Undeclaring an environment KEEPS the verdicts recorded there — it stops being required, which is not the same as never having been verified — so re-declaring it later finds the history intact.'
        verification: { type: [string, "null"] }
        expiry_days: { type: [integer, "null"] }
        expiry_releases: { type: [integer, "null"] }
        cost_agent_minutes: { type: [integer, "null"] }
        cost_human_minutes: { type: [integer, "null"] }
        globs: { type: array, items: { type: string }, description: 'replaces the whole set' }
        metadata_merge: { type: object }

    Case:
      type: object
      description: |
        A check crossed with one parameter assignment: the unit that actually gets
        executed. One check can be dozens of these. `key` is stable across
        regeneration so history survives.
      properties:
        id: { type: string }
        check: { type: string }
        key: { type: string, description: 'stable identity derived from the assignment' }
        label: { type: string, description: 'what makes this case different from its siblings' }
        assignment: { type: object, description: 'the setup a person or agent must reproduce' }
        seeded: { type: boolean, description: 'a hand-written happy path rather than a generated case' }
        state:
          type: string
          enum: [approved, verified, stale, failed, unreachable, never, retired]
          description: |
            `stale` outranks `unreachable` deliberately: once the claimed code
            moved, an earlier "the interface cannot reach this" is a statement about
            code that no longer exists.
        agent: { $ref: "#/components/schemas/CaseVerdictFact" }
        human: { $ref: "#/components/schemas/CaseVerdictFact" }
        stale_since: { type: [string, "null"], description: 'the release id that invalidated it' }
        retired_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CaseVerdictFact:
      type: object
      description: |
        The last verdict from one kind of actor. Agent and human are separate facts
        because `agent_then_human` needs both.
      properties:
        verdict: { type: [string, "null"], enum: [pass, fail, blocked, unreachable, null] }
        at: { type: [string, "null"], format: date-time }
        by:
          type: [string, "null"]
          description: |
            The free-form actor string the credential carried, e.g. `human:alice`.
            A claim about a name, not a resolvable identity: two tokens can share
            one, and nothing about it survives its owner leaving.
        user:
          type: [string, "null"]
          description: |
            WHICH person gave it (`usr-…`), or null for a credential bound to
            nobody — which every verdict recorded before the people directory
            existed reads as, honestly rather than absently.

            Present on the `human` fact only: "a person approved this" is the
            claim that needs a resolvable who, and an agent's own binding lives on
            the history row instead.

            An id rather than a name, because lists answer "where does verification
            stand" and resolving a name per row would be a lookup for a question
            nobody asked there. `GET /v1/cases/{id}` resolves every id in its
            payload once, under `people`.
        release: { type: [string, "null"] }

    CaseWithHistory:
      allOf:
        - { $ref: "#/components/schemas/Case" }
        - type: object
          properties:
            people:
              type: object
              description: |
                Every `user` id named anywhere in this payload — on the case, on
                each environment, on each history row — resolved once and keyed by
                that id. `{}` when nothing here names anybody.

                Keyed rather than inlined so a person who gave six verdicts appears
                once, and resolved here rather than by sending the reader to
                `/v1/users` because "who approved this?" is the question this read
                exists to answer. A disabled person still resolves, which is why the
                directory has no delete.
              additionalProperties: { $ref: "#/components/schemas/UserRef" }
            history:
              type: array
              items: { $ref: "#/components/schemas/RecordedVerdict" }
              description: 'append-only, newest first'

    RecordedVerdict:
      type: object
      properties:
        id: { type: string }
        case: { type: string }
        environment:
          type: string
          description: |
            Where you observed it, by slug or id. REQUIRED when the check declares
            more than one environment: a bare verdict there does not say what was
            observed, and it is refused (`conflict.environment_ambiguous`) rather
            than defaulted, because filing a staging run as production is worse
            than no record. Omit for a check that declares one (that one is meant)
            or none.
        actor_kind: { type: string, enum: [agent, human] }
        actor: { type: string }
        user:
          type: [string, "null"]
          description: |
            The person behind the credential that recorded this verdict, or null for
            a machine token. **This** is the permanent record of who — the `user` on
            a case's `human` fact only mirrors the latest.

            Kept for an agent verdict too, not just a human one: an agent token can
            belong to somebody's own automation, and "whose agent" is worth knowing.
        verdict: { type: string, enum: [pass, fail, blocked, unreachable] }
        note: { type: [string, "null"] }
        release: { type: [string, "null"] }
        at: { type: string, format: date-time }

    CaseFile:
      type: object
      required: [cases]
      properties:
        prune:
          type: boolean
          default: true
          description: 'retire live cases the set no longer contains; false extends instead of replacing'
        cases:
          type: array
          items: { $ref: "#/components/schemas/CaseInput" }

    CaseInput:
      type: object
      required: [key]
      properties:
        key: { type: string, description: 'derive from the assignment so regeneration matches existing cases' }
        label: { type: string }
        assignment: { type: object }
        seeded: { type: boolean }

    CaseFileOutcome:
      type: object
      properties:
        added: { type: integer }
        updated: { type: integer }
        retired: { type: integer, description: 'live cases the new set dropped; verdicts are kept' }
        revived: { type: integer, description: 'previously retired cases the new set brought back' }
        live: { type: integer }

    VerdictCreate:
      type: object
      required: [verdict]
      properties:
        verdict:
          type: string
          enum: [pass, fail, blocked, unreachable]
          description: |
            `unreachable` is not a failure: the declared layer gives no way to reach
            this configuration, which is a finding worth reporting.
        note: { type: string, description: 'required on a fail' }
        release: { type: string, description: 'the release this verdict was taken against' }
        actor_kind:
          type: string
          enum: [agent, human]
          default: agent
          description: '`human` requires the human scope'

    ChecklistPolicy:
      type: object
      properties:
        project: { type: string }
        epic: { type: [string, "null"], description: 'null is the project-level default' }
        verification: { type: [string, "null"] }
        expiry_days: { type: [integer, "null"] }
        expiry_releases: { type: [integer, "null"] }

    ChecklistPolicyInput:
      type: object
      properties:
        epic: { type: string, description: 'omit to set the project-level default' }
        verification: { type: [string, "null"], enum: [agent, human, agent_then_human, null] }
        expiry_days: { type: [integer, "null"] }
        expiry_releases: { type: [integer, "null"] }

    Coverage:
      type: object
      properties:
        project: { type: string }
        release: { type: [object, "null"], description: 'the newest release, if any' }
        checks: { type: integer }
        cases: { $ref: "#/components/schemas/CheckCounts" }
        percent: { type: integer, description: 'verified or approved, over verifiable cases — unreachable is excluded from both sides' }
        epics:
          type: array
          items:
            type: object
            properties:
              epic: { type: [string, "null"] }
              title: { type: [string, "null"] }
              checks: { type: integer }
              cases: { $ref: "#/components/schemas/CheckCounts" }
              percent: { type: integer }
              orphan_globs: { type: array, items: { type: string } }
        check_detail:
          type: array
          items: { $ref: "#/components/schemas/Check" }

    WorkItem:
      type: object
      properties:
        check: { type: string }
        check_title: { type: string }
        severity: { type: string, enum: [blocking, advisory, low] }
        layer: { type: string, enum: [ui, api, other] }
        case: { type: string }
        case_key: { type: string }
        case_label: { type: string }
        environment: { type: [string, "null"], description: 'where to run it; null when the check declares no environments' }
        environment_slug: { type: [string, "null"] }
        base_url: { type: [string, "null"], description: 'carried on the item so a runner needs no second request — an item that does not say where is not actionable' }
        reason:
          type: string
          enum: [stale, expired, failed, blocked, never, awaiting_human]
          description: |
            `stale` the release diff touched the claimed code, `expired` a policy
            clock ran out, `never` no verdict was ever recorded, `blocked` somebody
            ran it and could not get far enough to judge (usually an environment to
            fix rather than a case to write), `awaiting_human` an agent has passed
            it and the policy still wants a person.
        verification: { type: string, enum: [agent, human, agent_then_human] }
        cost_minutes: { type: [integer, "null"] }

    WorklistBucket:
      type: object
      properties:
        cases: { type: integer }
        minutes: { type: [integer, "null"] }
        items: { type: array, items: { $ref: "#/components/schemas/WorkItem" } }

    Worklist:
      type: object
      properties:
        project: { type: string }
        release: { type: [object, "null"] }
        agent: { $ref: "#/components/schemas/WorklistBucket" }
        human: { $ref: "#/components/schemas/WorklistBucket" }

    ChecklistGate:
      type: object
      properties:
        project: { type: string }
        release: { type: [object, "null"] }
        blocked: { type: boolean, description: 'true when a blocking-severity case is outstanding' }
        blocking:
          type: object
          properties:
            agent_cases: { type: integer }
            human_cases: { type: integer }
            items: { type: array, items: { $ref: "#/components/schemas/WorkItem" } }
        advisory_outstanding:
          type: integer
          description: 'outstanding cases that do NOT block, because a gate firing on everything gets overridden out of habit'

# ---------------------------------------------------------------------------
x-event-kinds-reserved:
  heartbeat: |
    Reserved — never emitted. Lease renewal is deliberately silent bookkeeping;
    observe lease lifecycle through `claimed`, `released`, and `lease_expired`
    instead. The enum entry stays so a client filtering `GET /v1/events?kind=`
    can distinguish "this kind exists but is unused" from "this kind was never
    part of the contract." Emitting per beat was rejected earlier as event-log
    noise with no consumer.

x-error-code-families:
  lease_and_fence:
    summary: |
      Lease, claim, and fencing — eight codes for exactly-one-claimant safety.
      An agent author needs all eight together: they share 409 Conflict and
      describe who may write to a ticket and whether the presented fence still
      matches the lease. Implementation map: `src/error_codes.rs`.
    members:
      claim.held:
        when: "Mutating a ticket claimed by someone else."
        routes: "PATCH /tickets/{id}, POST …/comments, POST …/transition, POST /v1/questions (blocking), …"
      claim.none:
        when: "Release or force-release when no claim exists."
        routes: "POST /tickets/{id}/release, POST …/force-release"
      claim.state:
        when: "Claim in a non-claimable workflow state (not a resume)."
        routes: "POST /tickets/{id}/claim, POST /ready/claim"
      claim.blocked:
        when: "Claim while open blockers exist."
        routes: "POST /tickets/{id}/claim, POST /ready/claim"
      fence.required:
        when: "You hold the lease but omitted `fence` on a mutating call."
        routes: "PATCH, comment, transition, ask, … while holder"
        distinct_from: "fence.stale — lease is still yours; token was omitted."
      fence.stale:
        when: "Presented fence was issued but superseded, or lease is gone."
        routes: "Any fenced write after fence_seq moved"
        distinct_from: "fence.invalid — this number was real once."
      fence.invalid:
        when: "Presented fence exceeds any value the ticket ever reached."
        routes: "Any fenced write with a fabricated or wrong-ticket fence"
        distinct_from: "fence.stale — store never issued this number."
      release.no_lease:
        when: "Release without holding a lease and without an explicit fence."
        routes: "POST /tickets/{id}/release"

