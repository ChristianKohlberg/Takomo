openapi: 3.1.0
info:
  title: Takomo
  version: "1.0.0-draft1"
  description: |
    Central task store for agent fleets. One authority, bearer-token auth,
    hierarchical tickets, enforced per-project workflows, atomic claim/lease,
    append-only event log.

    Design rules this contract encodes:
    - Most writes are commutative (comments, field sets, metadata merge); CAS
      (`If-Match` on `version`) is only needed for whole-body replacement.
    - Every rejection teaches: error bodies state what is allowed and how to
      proceed (`allowed_transitions`, `remedy`).
    - Claiming is one atomic operation (`POST /ready/claim`), never read-then-claim.
    - The event log (`global_seq`) is the only push/poll surface; all delivery
      mechanisms (SSE, hooks, channels) layer on the `since` cursor.
    - `/v1` is frozen: additive evolution only; experiments live in `metadata`.

servers:
  - url: /v1

security:
  - bearer: []

tags:
  - { name: tickets }
  - { name: workflow }
  - { name: claims }
  - { name: events }
  - { name: questions }
  - { name: admin }
  - { name: identity }
  - { name: shares }
  - { name: tags }

paths:
  /whoami:
    get:
      tags: [identity]
      summary: Who am I — echo the calling token's actor, scopes, and projects
      description: |
        Any valid token may call this; it removes the need for a client-side
        TAKOMO_ACTOR env var by letting the caller ask the store for its own
        identity (used by `takomo whoami` and by `ls --mine`-style filters).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhoAmI" }

  /tokens:
    get:
      tags: [identity]
      summary: List token metadata (admin scope)
      description: |
        Returns metadata only — never the plaintext token or its at-rest hash.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Token" } }
        "403":
          description: Token lacks the admin scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [identity]
      summary: Mint a token over HTTP (admin scope)
      description: |
        Reuses the same store logic as the `takomo token create` CLI: the
        plaintext is returned exactly ONCE in the response and only its SHA-256
        is stored. This is a deliberate posture shift from auth.md's original
        "minting requires shell access" stance — see auth.md for the rationale.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenCreate" }
      responses:
        "201":
          description: Minted; plaintext shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenCreated" }
        "403":
          description: Token lacks the admin scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Invalid body (missing scopes, bad projects, etc.)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tokens/{id}:
    delete:
      tags: [identity]
      summary: Revoke a token by its public id (admin scope)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: 'token id, e.g. "tok_a8f2k1x9"' }
      responses:
        "204": { description: Revoked }
        "403":
          description: Token lacks the admin scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects:
    get:
      tags: [admin]
      summary: List projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Project" } }
    post:
      tags: [admin]
      summary: Create a project (admin scope)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /projects/{project}:
    delete:
      tags: [admin]
      summary: Delete a project and everything under it (admin scope)
      description: |
        Cascade-deletes the project together with ALL of its tickets, comments,
        dependency edges, events, questions (including their follow-up threads
        and any minted answer links), promotions, and tag registry entries, in a
        single transaction. Dependency edges that point INTO this project from
        another project's tickets are cleared too. A store-level
        `project_deleted` audit event (with a null `project`, so per-project
        event queries stay empty) records the deletion; its `deleted` payload
        carries the per-table row counts removed.

        Refused with `409 project.active_claims` when any ticket still holds an
        active (unexpired) claim — deleting under a live lease would yank work
        out from under a running worker. Pass `?force=true` to delete anyway,
        abandoning those leases.

        Tokens scoped to this project are deliberately left as-is: once the
        project is gone they simply stop resolving against it. Revoke them
        separately with `DELETE /v1/tokens/{id}` if desired.
      parameters:
        - { $ref: "#/components/parameters/project" }
        - name: force
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: delete even when tickets hold active claims (abandons those leases)
      responses:
        "204": { description: Deleted }
        "403":
          description: Token lacks the admin scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A ticket holds an active claim and force was not set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /projects/{project}/workflow:
    get:
      tags: [workflow]
      summary: Get the project's workflow definition
      parameters: [ { $ref: "#/components/parameters/project" } ]
      responses:
        "200":
          description: The active workflow (see workflow-format.md)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
    put:
      tags: [workflow]
      summary: Replace the project's workflow (admin scope; must remain valid for existing tickets)
      parameters: [ { $ref: "#/components/parameters/project" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Workflow" }
      responses:
        "200": { description: Replaced }
        "422":
          description: Invalid workflow (unreachable states, tickets stranded)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /projects/{project}/roadmap:
    get:
      tags: [workflow]
      summary: Epic progress rollup (read scope)
      description: |
        For each `epic` in the project, returns the epic plus a rollup over its
        FULL descendant subtree (walked recursively via `parent`): ticket counts
        by state and by category, the subtree `total`, a `done` count (states in
        the `done` category), and a whole-number completion `percent`. The epic
        itself is the container and is not counted in its own rollup. Counts
        include archived descendants so historical completion is not understated.

        Each epic also carries `flags`: short codes for an epic whose own state
        contradicts its subtree (empty when consistent).

        Alongside `epics`, `unparented` is a rollup of the same shape (minus the
        ticket identity fields) over every non-epic ticket in the project whose
        `parent` chain never reaches an epic — a NULL parent, a chain of
        non-epic ancestors, or a parent id pointing at a row that no longer
        exists. Without it, work outside every epic would be invisible while the
        per-epic percentages read as complete.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  generated_at: { type: string, format: date-time }
                  epics:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        state: { type: string }
                        state_category: { type: string }
                        priority: { type: string }
                        total: { type: integer, description: descendants in the subtree }
                        done: { type: integer, description: descendants in a done-category state }
                        percent: { type: integer, description: done/total as a whole percent (0 when empty) }
                        by_state: { type: object, additionalProperties: { type: integer } }
                        by_category: { type: object, additionalProperties: { type: integer } }
                        flags:
                          type: array
                          description: |
                            Epic/child state contradictions, empty when the epic is consistent.
                            `done_with_open_children`: the epic's own state category is `done`
                            but `done < total`. `open_with_all_children_done`: the epic is not
                            done, `total > 0`, and every descendant is done. `empty_epic`:
                            `total == 0` — a flag, not an error, so a client can render an epic
                            filed ahead of its work differently from a 0%-complete epic that
                            does have children.
                          items:
                            type: string
                            enum: [done_with_open_children, open_with_all_children_done, empty_epic]
                  unparented:
                    type: object
                    description: |
                      Rollup over the project's non-epic tickets that no epic owns. Same shape
                      as an epic's rollup, without `id`/`title`/`state`/`priority` — it is a
                      bucket, not a ticket.
                    properties:
                      total: { type: integer }
                      done: { type: integer }
                      percent: { type: integer, description: done/total as a whole percent (0 when empty) }
                      by_state: { type: object, additionalProperties: { type: integer } }
                      by_category: { type: object, additionalProperties: { type: integer } }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{project}/language:
    put:
      tags: [workflow]
      summary: Set the project's ask-a-human question language (admin scope)
      description: |
        The human-facing language agents should phrase ask-a-human questions
        (and options) in for this project. Surfaced back to agents as a
        `language_hint` on the work loop of both surfaces — `POST /tickets`,
        `GET /tickets/{id}`, `POST /tickets/{id}/claim`, `POST /ready/claim`, and
        the MCP tools over the same ground — plus `question_language` on
        `takomo_workflow`, and shown as a nudge on the inbox. Soft — never
        enforced. Send `{"language": null}` to clear it.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language: { type: [string, "null"], description: 'e.g. "German"; null clears it' }
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { description: Token lacks the admin scope }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{project}/tags:
    get:
      tags: [tags]
      summary: List the project's tag registry (read scope)
      description: |
        The project's tag registry — named entities of some `kind` (person,
        component, team, …) that tickets reference by `kind:handle`. Ordered by
        (kind, handle). Reference metadata only: tags never affect ticket state,
        claims, or question routing.
      parameters:
        - { $ref: "#/components/parameters/project" }
        - { name: kind, in: query, schema: { type: string }, description: 'restrict to one kind, e.g. person' }
        - { name: q, in: query, schema: { type: string }, description: 'case-insensitive substring match on handle or label' }
      responses:
        "200":
          description: The registry entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        "403": { description: Token lacks the read scope or the project }
    post:
      tags: [tags]
      summary: Register a tag (write scope)
      description: |
        Register a named entity. Conflicts (409 `tag.exists`) if the
        (kind, handle) pair already exists in the project. Tagging a ticket with
        an unknown handle also creates a stub here, so explicit registration is
        only needed to set a display label or `meta` up front.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagCreate" }
      responses:
        "201":
          description: The created tag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "403": { description: Token lacks the write scope or the project }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "A tag with this (kind, handle) already exists" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /projects/{project}/tags/{kind}/{handle}:
    parameters:
      - { $ref: "#/components/parameters/project" }
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: handle, in: path, required: true, schema: { type: string } }
    get:
      tags: [tags]
      summary: Get one tag (read scope)
      responses:
        "200":
          description: The tag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [tags]
      summary: Update a tag's label and/or meta (write scope)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagPatch" }
      responses:
        "200":
          description: The updated tag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [tags]
      summary: Delete a tag (write scope)
      description: |
        Removes the registry entry. Ticket references (`kind:handle` strings)
        are deliberately left intact — the reference is the source of truth, the
        registry row an enrichment — so the response reports how many tickets
        still point at it.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  still_referenced: { type: integer, description: 'tickets still carrying this kind:handle reference' }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{project}/style:
    put:
      tags: [workflow]
      summary: Set the project's style guide for agent-written text (admin scope)
      description: |
        The project's house style for the text agents write — ticket titles and
        bodies, comments, and human-facing questions. Surfaced back to agents as
        a `style_hint` on the work loop of both surfaces — `POST /tickets`,
        `GET /tickets/{id}`, `POST /tickets/{id}/claim`, `POST /ready/claim`, and
        the MCP tools (`takomo_next`/`claim`/`start`/`show`/`new`) over the same
        ground — as `style_guide` on `takomo_workflow`, and echoed on the
        `POST /v1/questions` response note. Soft — never enforced, exactly like
        the language setting.

        Capped at 2000 characters: it rides along on every work-loop response, so
        it has to stay a short set of conventions rather than a second copy of the
        project's documentation. Over the cap is a `422
        project.style_guide_too_long`. A blank string is treated as a clear, and
        `{"style_guide": null}` clears it explicitly.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [style_guide]
              properties:
                style_guide:
                  type: [string, "null"]
                  maxLength: 2000
                  description: 'e.g. "Two sentences max. Plain language, no marketing voice."; null clears it'
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { description: Token lacks the admin scope }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: The style guide exceeds 2000 characters }

  /projects/{project}/claim-ttl:
    put:
      tags: [workflow]
      summary: Set the project's lease policy — default and maximum claim lifetime (admin scope)
      description: |
        How long a worker may hold a ticket in this project. Two settings, one
        endpoint:

        - `ttl_seconds` — the lease a claim gets when it names no `ttl_seconds` of
          its own. Built-in fallback 900 seconds.
        - `max_ttl_seconds` — the ceiling an explicit `ttl_seconds` on
          `POST /tickets/{id}/claim`, `POST /ready/claim` or
          `POST /tickets/{id}/heartbeat` is checked against. Built-in fallback
          3600 seconds. Deliberately **unbounded above**: a deployment may set
          whatever its fleet needs.

        Not to be confused with `/projects/{project}/answer-link-ttl`. That bounds
        the lifetime of a credential handed to someone outside the org; this
        bounds how long work may be held.

        Both are sent together because they are validated as a pair — a default
        above the ceiling would be silently clamped on every claim, so no claim
        would ever get the configured default. That combination is a
        `422 project.claim_ttl` naming both numbers. Either field may be omitted
        to leave it as it is, or sent as `null` to clear it and fall back to the
        built-in; sending neither is a `400`, so a typo'd field name cannot
        silently reset the policy.

        Raising the maximum trades recovery latency for fewer heartbeats. The
        sweeper frees only *expired* leases, so this value is how long a crashed
        worker parks its ticket before it returns to the ready queue on its own —
        `POST /tickets/{id}/release` cannot shorten that, since it requires the
        holder's identity and a matching fence. To reclaim it sooner, an admin
        forces it: `POST /tickets/{id}/force-release`.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                ttl_seconds:
                  type: [integer, "null"]
                  minimum: 1
                  description: 'default lease a claim gets, in seconds; null clears the setting (falls back to 900)'
                max_ttl_seconds:
                  type: [integer, "null"]
                  minimum: 1
                  description: 'ceiling an explicit ttl_seconds may request, in seconds; null clears the setting (falls back to 3600). No upper bound.'
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400":
          description: Neither field was sent, or one was neither an integer nor null.
        "422":
          description: |
            `project.claim_ttl` — a non-positive value, or a default above the
            ceiling that would apply. `details` carries both numbers and the
            effective maximum.
        "404": { description: Unknown project. }

  /projects/{project}/answer-link-ttl:
    put:
      tags: [workflow]
      summary: Set the project's default answer-link lifetime (admin scope)
      description: |
        How long an answer link minted for one of this project's questions
        (`POST /questions/{id}/answer-link`) stays valid, in seconds.

        Unlike the language and style settings this one is **enforced**, not
        advisory: an answer link is a bearer credential handed to someone outside
        the org, so its lifetime is not a preference a worker token gets to
        change — hence `admin`, and hence a hard maximum.

        Precedence when minting, most specific first: an explicit `ttl_seconds`
        on the mint call, then this project setting, then the built-in default of
        604800 seconds (7 days). Send `{"ttl_seconds": null}` to clear the
        project default and fall back to that built-in.

        Bounds are exactly those of an explicit `ttl_seconds`: a positive integer
        no larger than 2592000 (30 days, the same cap share links carry). Outside
        them is a `422 project.answer_link_ttl`.
      parameters: [ { $ref: "#/components/parameters/project" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ttl_seconds]
              properties:
                ttl_seconds:
                  type: [integer, "null"]
                  minimum: 1
                  maximum: 2592000
                  description: 'seconds an answer link stays valid; null clears the project default (falls back to 7 days)'
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { description: Token lacks the admin scope }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: The lifetime is not a positive integer of at most 2592000 seconds }

  /tickets:
    post:
      tags: [tickets]
      summary: Create a ticket
      description: |
        `Idempotency-Key` is required for agent clients: retries with the same
        key return the original ticket (200) instead of creating a twin (201).
        The response includes `similar` — existing open tickets with matching
        title keywords — so a client can notice a semantic duplicate.
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketCreated" }
        "200":
          description: Idempotent replay of a prior create
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketCreated" }
        "422":
          description: Validation failure (unknown project, bad parent, cycle)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [tickets]
      summary: List/search tickets
      parameters:
        - { name: project, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string }, description: state id or category }
        - { name: type, in: query, schema: { type: string } }
        - { name: label, in: query, schema: { type: string }, description: 'repeatable, AND semantics' }
        - { name: tag, in: query, schema: { type: string }, description: 'exact `kind:handle` tag reference; repeatable, AND semantics' }
        - { name: tag_kind, in: query, schema: { type: string }, description: 'match any tag of this kind (e.g. person); repeatable, AND semantics' }
        - { name: parent, in: query, schema: { type: string }, description: direct children of this id }
        - { name: q, in: query, schema: { type: string }, description: full-text over title+body }
        - { name: claimed_by, in: query, schema: { type: string } }
        - { name: fields, in: query, schema: { type: string }, description: comma list for sparse responses }
        - { name: include_archived, in: query, schema: { type: boolean, default: false }, description: include archived tickets alongside active ones }
        - { name: archived, in: query, schema: { type: string, enum: [only, all, active] }, description: "only = archived only; all = both; active = default (non-archived)" }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Ticket" } }
                  next_cursor: { type: [string, "null"] }

  /tickets/{id}:
    get:
      tags: [tickets]
      summary: Get a ticket
      description: |
        Also carries the project's `style_hint` / `language_hint` (see
        ConventionHints) when it sets them: reading a ticket is the start of
        working on it, and the conventions have to arrive before the agent
        writes. The list endpoint deliberately does not — hints are per project,
        not per ticket, and would be a per-row cost for a repeated value.
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: include, in: query, schema: { type: string }, description: "comma list: comments,children,deps,events,promotions" }
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string }, description: 'current version, e.g. "7"' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Ticket"
                  - $ref: "#/components/schemas/ConventionHints"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [tickets]
      summary: Update fields (commutative; CAS only for body)
      description: |
        Field-level sets (`title`, `priority`, `labels`) and `metadata_merge`
        (RFC 7386 merge-patch semantics, namespaced keys) are commutative and
        never require `If-Match`. `links` MERGES per key: each key in the patch
        is set (string value) or deleted (null value) while untouched keys
        survive, so concurrent writers attaching different link keys never
        clobber each other. Replacing `body` requires `If-Match: "<version>"`;
        on mismatch the 409 carries the current version and body hash. State is
        NOT patchable — use /transition.
        While a ticket is claimed, non-holders may only patch `metadata_merge`
        under their own namespace and add comments; other fields 409.
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: If-Match, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "409": { $ref: "#/components/responses/Conflict" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tickets/{id}/transition:
    post:
      tags: [workflow]
      summary: Move a ticket to another state (the only way state changes)
      description: |
        Validated against the project workflow: transition must exist from the
        current state, all `requires` must hold (active claim held by caller,
        token scope, guards like no-open-children). Illegal transitions return
        409 with `allowed_transitions` and a `remedy` — errors are written for
        LLM readers.

        Checks run in the order legality → scope → claim/fence, and the headline
        `code`/`message` names the first real blocker in that order: an illegal
        target is `transition.illegal`, a missing scope is `transition.scope`
        (403), and only then are claim ownership and fence echoing checked. So a
        lease holder attempting a human gate they lack the scope for sees the
        403, not a fencing error.

        Human approval is authoritative over a lease: a transition whose
        `requires` includes `scope:human`, performed by a caller holding the
        `human` scope, succeeds even while another actor holds the claim, and
        auto-releases that claim as a side effect (emitting a `released` event
        alongside `transitioned`). This override is scoped to human-required
        transitions; ordinary `claim`-required transitions keep the holder lock.

        A `claim`-required transition attempted without a lease is
        `transition.claim_required` (409), and its `remedy` depends on where the
        ticket sits, because a lease can only be taken in a state the workflow
        marks `claimable`. From a claimable state the remedy is the claim itself
        plus the transition to retry with the new fence. From a non-claimable one
        — the usual shape of a lease that expired while the work ran — claiming
        would be refused with `claim.state`, so the remedy instead names the
        re-entry edges out of the current state that land in a claimable state,
        and warns that taking one returns the ticket to the ready queue. Either
        way `details` carries `claimable_states`, and the non-claimable case also
        carries `reentry_states`.
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, description: target state id }
                reason: { type: string, maxLength: 2000 }
                fence: { type: integer, description: required while ticket is claimed }
      responses:
        "200":
          description: Transitioned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "409":
          description: Illegal transition, missing claim, stale fence, or guard failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransitionError" }
        "403":
          description: Transition requires a scope this token lacks (e.g. human)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransitionError" }

  /tickets/{id}/comments:
    post:
      tags: [tickets]
      summary: Append a comment (always allowed, commutative)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 65536 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }

  /tickets/{id}/deps:
    get:
      tags: [tickets]
      summary: The dependency graph around a ticket (reverse + transitive, cycle-safe)
      description: |
        Returns the dependency graph reachable from the ticket. `direction`
        selects which edges to follow: `blocked_by` (default) walks to the
        tickets that block this one; `blocks` walks the inverse (the tickets
        this one blocks); `both` walks both. With `transitive=true` the walk
        chases the whole chain to its ends; otherwise only the ticket's direct
        neighbours are returned. The traversal is cycle-safe (a visited set
        bounds it even when A blocks B blocks A). Edges are canonical
        `{ticket, blocked_by}` pairs (ticket is blocked by blocked_by)
        regardless of traversal direction, so `both` never duplicates an edge.
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: direction, in: query, schema: { type: string, enum: [blocked_by, blocks, both], default: blocked_by } }
        - { name: transitive, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  root: { type: string }
                  direction: { type: string, enum: [blocked_by, blocks, both] }
                  transitive: { type: boolean }
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        state: { type: string }
                        state_category: { type: string }
                        type: { type: string }
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        ticket: { type: string, description: the blocked ticket }
                        blocked_by: { type: string, description: the ticket that blocks it }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [tickets]
      summary: Add a blocked_by edge (cycle-checked)
      description: |
        Dependency edges drive readiness and the no_open_blockers guard, so
        they follow the claimed-ticket write rules: while the ticket is
        claimed, only the holder may change deps and must echo the lease
        `fence` (per the Lease schema's fence-on-every-mutating-call rule).
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked_by]
              properties:
                blocked_by: { type: string, description: ticket id that blocks this one }
                fence: { type: integer, description: required while ticket is claimed }
      responses:
        "201": { description: Added }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Would create a cycle, or unknown id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [tickets]
      summary: Remove a blocked_by edge
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: blocked_by, in: query, required: true, schema: { type: string } }
        - { name: fence, in: query, required: false, schema: { type: integer }, description: required while ticket is claimed }
      responses:
        "204": { description: Removed }
        "409": { $ref: "#/components/responses/Conflict" }

  /tickets/{id}/archive:
    post:
      tags: [tickets]
      summary: Archive a ticket (hide from default views; write scope)
      description: |
        Sets `archived_at` so the ticket drops out of the default list, ready
        queue, board, and metrics. The ready queue and metrics always exclude
        archived tickets; `GET /v1/tickets` re-includes them with
        `include_archived=true` or `archived=only`. Any state may be archived —
        terminal done/cancelled is the typical case. Idempotent.
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tickets/{id}/unarchive:
    post:
      tags: [tickets]
      summary: Unarchive a ticket (return to default views; write scope)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses:
        "200":
          description: Unarchived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tickets/{id}/promote:
    post:
      tags: [tickets]
      summary: Record that the ticket's work reached a target/stage (write scope)
      description: |
        Append a promotion: the ticket's work reached a named `target` —
        free-form ("staging", "production", "published", "delivered", …), so
        this is not tied to software deployment. History is kept; the latest per
        ticket drives the board badge. Independent of workflow state.
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string, description: 'Stage reached, e.g. "staging", "production"' }
                url: { type: string, description: 'Optional link (deploy, published page, …)' }
                ref: { type: string, description: 'Optional reference (version, commit, build id)' }
                note: { type: string }
      responses:
        "201":
          description: The recorded promotion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promotion" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tickets/{id}/promotions:
    get:
      tags: [tickets]
      summary: Promotion history for a ticket (newest first; read scope)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses:
        "200":
          description: Promotions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Promotion" } }

  /promotions:
    get:
      tags: [tickets]
      summary: Latest promotion per ticket across a project (read scope)
      description: One row per ticket (the most recent) — the board's badge source.
      parameters:
        - { name: project, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Latest promotions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Promotion" } }

  /tickets/{id}/claim:
    post:
      tags: [claims]
      summary: Claim this specific ticket (atomic)
      description: |
        Succeeds only if the ticket is in a claimable state, unclaimed (or the
        caller already holds it — idempotent renewal), and unblocked. Returns
        the lease with the fencing token all subsequent mutating calls must echo,
        plus the project's `style_hint` / `language_hint` (see ConventionHints)
        when it sets them.

        **Resuming a lapsed lease.** One narrow exception to "a claimable state":
        the caller may claim a ticket in a state the workflow does **not** mark
        claimable when it is the holder whose own lease expired there and nobody
        has claimed since. Without it, an agent whose work outlived its lease
        could not finish the ticket at all — `done` requires a claim, and the
        claim was refused because the in-progress state is not claimable, so the
        two errors pointed at each other and the only escape was to walk the
        ticket backwards into the ready queue, where another worker could take it.
        The response carries `resumed: true`.

        Nothing about fencing is relaxed. The resume bumps `fence_seq` like any
        claim, so every echo of the old lease's fence now 409s; a **different**
        actor is refused `claim.state` exactly as before (the message names whose
        lapsed lease it is); a state that is terminal or `blocked`-category is
        never resumable; and an admin `force-release` clears the right to resume
        along with the claim. What makes it safe is that a new claim by anyone
        else — the only thing that creates a competing writer — ends it.
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds: { type: integer, default: 900, maximum: 3600 }
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Lease"
                  - $ref: "#/components/schemas/ConventionHints"
        "409":
          description: |
            Already claimed by another holder (`claim.held`), blocked
            (`claim.blocked`), or the state is not claimable and this caller is not
            the holder whose lease lapsed there (`claim.state` — `details`
            carries `claimable_states` and `lapsed_holder`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tickets/{id}/heartbeat:
    post:
      tags: [claims]
      summary: Renew the lease (harness/orchestrator responsibility, not the model's)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fence]
              properties:
                fence: { type: integer }
                ttl_seconds: { type: integer, default: 900, maximum: 3600 }
      responses:
        "200":
          description: Renewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lease" }
        "409":
          description: |
            Fence mismatch. `fence.stale` (presented < current) means the lease
            expired and was superseded by a later claim — stop writing.
            `fence.invalid` (presented > current, a value never issued) is a
            client bug — re-read the fence from your claim response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tickets/{id}/release:
    post:
      tags: [claims]
      summary: Voluntarily release the claim
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fence]
              properties:
                fence: { type: integer }
                reason: { type: string }
      responses:
        "204": { description: Released }
        "409": { $ref: "#/components/responses/Conflict" }

  /tickets/{id}/force-release:
    post:
      tags: [claims]
      summary: Drop a ticket's claim regardless of who holds it (admin scope)
      description: |
        The recovery path for a ticket held by a worker that is gone.
        `POST /tickets/{id}/release` answers only to the holder — it wants that
        actor's identity and a matching `fence` — and the sweeper frees a lease
        exactly when it expires, not a moment sooner. Since
        `max_ttl_seconds` (`PUT /projects/{project}/claim-ttl`) has no upper
        bound, "when it expires" can be arbitrarily far away, so without this
        route a crashed worker parks its ticket with direct database access as
        the only way out.

        A **separate route rather than a `force` flag** on `/release`: a flag is
        one typo away from an ordinary worker turning its own release into a
        force. This path needs the `admin` scope, and no `fence` is accepted —
        the caller is displacing a holder whose fence it has no way to know.

        **The fence is bumped.** That is the point: the displaced worker may
        still be alive and mid-write, and after the force its `fence` is stale,
        so its next mutating call gets a `409 fence.stale` instead of winning a
        ticket someone else now holds. The response returns both the fence the
        old holder is carrying (`previous_fence`) and the new one (`fence`).

        An already-lapsed lease is force-released too rather than refused: the
        holder is still recorded on the row, and natural expiry does *not* bump
        the fence, so a zombie echoing that fence would still be accepted.
        `lease_expired: true` in the response says that is what happened.

        That holds once the sweeper has cleared the claim row as well, where all
        that remains is the lapsed holder's right to **resume** the lease in place
        (see `POST /tickets/{id}/claim`). Forcing it is how an operator takes an
        in-flight ticket away for good; a ticket with neither an active claim nor a
        lapsed one is the only `claim.none`.

        Emits `lease_revoked` — its own event kind, not `released` with a flag,
        because `kind` is the only server-side event filter
        (`GET /events?kind=lease_revoked`) and a `released` event whose actor is
        not the holder would read as the holder letting go voluntarily. The
        event carries the ousted `holder`, both fences, `lease_expired`, and the
        `reason`, attributed to the admin actor that forced it.

        Also reachable as `takomo ticket force-release <id>` against the
        database file — the command you need when the reason the ticket is stuck
        is that the server itself is wedged, or when the admin token is what got
        lost.
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: 'why the claim was taken; recorded on the lease_revoked event and echoed back'
      responses:
        "200":
          description: Released; the claim is gone and the fence has advanced.
          content:
            application/json:
              schema:
                type: object
                required: [ticket, project, previous_holder, previous_fence, fence, lease_expired]
                properties:
                  ticket: { type: string }
                  project: { type: string }
                  previous_holder: { type: string, description: 'the actor that was displaced' }
                  previous_fence: { type: integer, description: 'the fence that actor is still carrying; now stale' }
                  fence: { type: integer, description: 'the bumped fence — one greater than previous_fence' }
                  lease_expired: { type: boolean, description: 'true when the lease had already lapsed; the claim row was still there and the holder is now fenced off regardless' }
                  reason: { type: [string, "null"] }
        "403":
          description: '`auth.scope` — the token does not carry `admin`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { description: Unknown ticket. }
        "409":
          description: |
            `claim.none` — the ticket holds no claim, so there was nothing to
            displace. Not idempotent bookkeeping: a second force-release on the
            same ticket lands here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ready:
    get:
      tags: [claims]
      summary: Peek the ready queue (no side effects)
      parameters:
        - { name: project, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: label, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Ready = claimable state, unclaimed, unblocked (directly or via ancestors), ordered by priority then age
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Ticket" } }

  /ready/claim:
    post:
      tags: [claims]
      summary: Atomically claim the next ready ticket (the worker primitive)
      description: |
        Long-poll: with `wait`, the request blocks until a matching ticket
        becomes ready or the wait elapses (204). Exactly one caller receives a
        given ticket. This is the intended worker loop: claim → work →
        transition → repeat; the blocking call is the sleep. The claimed ticket
        comes back with its `lease` and, when the project sets them, its
        `style_hint` / `language_hint` (see ConventionHints).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project: { type: string }
                type: { type: string }
                labels: { type: array, items: { type: string } }
                wait_seconds: { type: integer, default: 0, maximum: 120 }
                ttl_seconds: { type: integer, default: 900 }
      responses:
        "200":
          description: A ticket was claimed for you
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Ticket"
                  - $ref: "#/components/schemas/ConventionHints"
                  - type: object
                    properties:
                      lease: { $ref: "#/components/schemas/Lease" }
        "204": { description: No matching ready work within the wait window }

  /events:
    get:
      tags: [events]
      summary: Read the event log from a cursor (the only source of truth for "what changed")
      parameters:
        - { name: since, in: query, required: true, schema: { type: integer }, description: last seen global_seq; 0 for from-start }
        - { name: project, in: query, schema: { type: string } }
        - { name: ticket, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string }, description: comma list of event kinds }
        - { name: wait, in: query, schema: { type: integer, default: 0, maximum: 120 }, description: long-poll seconds }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        "200":
          description: Events after `since`, oldest first; empty array on wait timeout
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/Event" } }
                  cursor: { type: integer, description: pass as next `since` }

  /events/stream:
    get:
      tags: [events]
      summary: SSE stream of events (doorbell; cursor remains the source of truth)
      description: |
        `text/event-stream`. Each event's `id:` is its global_seq, so
        `Last-Event-ID` resumes seamlessly. Consumers must treat the stream as
        lossy and reconcile via GET /events on reconnect.
      parameters:
        - { name: since, in: query, schema: { type: integer } }
        - { name: project, in: query, schema: { type: string } }
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema: { type: string }

  /export:
    get:
      tags: [admin]
      summary: Export tickets (with comments and deps) as JSONL — read scope
      description: |
        Streams one JSON object per line (`application/x-ndjson`): each line is
        a full ticket (its `blocked_by` array carries the dependency edges) plus
        a `comments` array. `metadata` and `links` ride along verbatim, so the
        export is a faithful snapshot. Round-trips through the `takomo import
        --from takomo` CLI verb. Honors token project scoping; `project`
        narrows to one project.
      parameters:
        - { name: project, in: query, schema: { type: string }, description: narrow to one project (else all readable projects) }
      responses:
        "200":
          description: JSONL stream, one ticket object per line
          content:
            application/x-ndjson:
              schema: { type: string }

  /metrics:
    get:
      tags: [admin]
      summary: Store metrics — read scope, scoped to readable projects
      description: |
        Observability over the store: ticket counts by state and by category
        per project, open (unexpired) claim counts, and the total event count.
        A token scoped to a subset of projects only sees those projects.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at: { type: string, format: date-time }
                  totals:
                    type: object
                    properties:
                      projects: { type: integer }
                      tickets: { type: integer }
                      open_claims: { type: integer }
                      events: { type: integer }
                  projects:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        total: { type: integer }
                        open_claims: { type: integer }
                        by_state: { type: object, additionalProperties: { type: integer } }
                        by_category: { type: object, additionalProperties: { type: integer } }

  /shares:
    post:
      tags: [shares]
      summary: Mint a shareable, read-only, expiring web link — write scope
      description: |
        Creates a scoped, read-only, auto-expiring view of the board and mints a
        distinct **share token** for it. The share token grants ONLY the
        `/v1/shares/self*` read endpoints; it can neither read arbitrary
        projects nor write anything. Two scopes:

        - `kind: project` — every ticket in the referenced project.
        - `kind: epic` — the referenced ticket plus its FULL recursive
          descendant subtree (walked via `parent`). Any ticket can be a subtree
          root; `epic` is just the common case. The stored/echoed `kind` for
          this scope is `subtree`.

        The plaintext `token` is returned ONCE (only its SHA-256 is stored). The
        returned `path` (`/board#s=<token>`) carries the token in the URL
        FRAGMENT so it stays out of server logs and Referer headers. Anyone with
        the link can view the scoped board (read-only) until it expires.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareCreate" }
      responses:
        "201":
          description: Created — `token` and `path` are shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareCreated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Invalid kind or ttl
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [shares]
      summary: List share metadata — read scope (admin sees all; else own shares)
      description: |
        Lists share metadata. An `admin`-scoped token sees every share; any
        other reader sees only the shares it created. Never returns the token or
        its hash.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Share" }

  /shares/{id}:
    delete:
      tags: [shares]
      summary: Revoke a share — write scope (creator or admin)
      description: |
        Revokes a share immediately; its token then returns `410 Gone` on every
        `self*` endpoint. Allowed for the share's creator or any admin.
        Idempotent — revoking an already-revoked share still returns 204.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: 'share id, e.g. "share_a8f2k1x9q7z3"' }
      responses:
        "204": { description: Revoked }
        "403":
          description: Not the creator and not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /shares/self:
    get:
      tags: [shares]
      summary: The share's own scope + workflow — share token
      security:
        - shareBearer: []
      description: |
        Authenticated by the SHARE token (not a normal `tk_` token). Returns the
        share's scope and the project workflow, enough for the board to render
        the columns. An expired or revoked share returns `410 Gone`.

        Every request on the `/shares/self*` routes is charged to this share's
        per-link sliding window of 120 requests/minute, shared by every viewer
        holding the link. Unlike the `tk_` budget, **reads are charged** — a share is
        a read-only bearer capability meant to be pasted around, so reads are the
        whole of what it can do. See spec/auth.md.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareSelf" }
        "401":
          description: Missing or unrecognized share token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: The shared link has expired or been revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: |
            `share.rate_limited` — this link exceeded 120 requests/minute. Carries
            `Retry-After`; the link itself still works.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: |
            `share.kind_unrecognized` — the share's stored scope kind is neither
            `project` nor `subtree`, so it cannot be resolved to a scope. The
            share is refused rather than widened; nothing is readable through it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /shares/self/tickets:
    get:
      tags: [shares]
      summary: The tickets in the share's scope (read-only) — share token
      security:
        - shareBearer: []
      description: |
        Authenticated by the SHARE token. Returns **one page** of the tickets in
        scope (project: all in the project; epic/subtree: the root plus recursive
        descendants), oldest first, read-only. Archived tickets are excluded unless
        `include_archived=true`.

        **Paged, and bounded whatever the caller asks for.** This used to return the
        entire scope with no `LIMIT`, which behind a credential designed to be
        pasted around meant an arbitrarily large scan anyone holding the link could
        trigger repeatedly. `limit` defaults to 200 and is clamped to 200; `cursor`
        takes the previous page's `next_cursor`.

        **It never truncates silently.** `next_cursor` is non-null exactly when more
        tickets remain, and a page that leaves rows behind also carries a `warning`
        naming the call that fetches the rest. Keep paging while `next_cursor` is
        set, carrying `include_archived` along.

        Requests on this path are charged to the share's own per-link budget — see
        the `429` below and spec/auth.md.
      parameters:
        - { name: include_archived, in: query, schema: { type: boolean, default: false }, description: include archived tickets }
        - { name: limit, in: query, schema: { type: integer, default: 200, minimum: 1, maximum: 200 }, description: 'page size; values above the maximum are clamped, not refused' }
        - { name: cursor, in: query, schema: { type: string }, description: the previous page's next_cursor }
      responses:
        "200":
          description: One page of the share's scope.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Ticket" } }
                  next_cursor:
                    type: [string, "null"]
                    description: pass as `cursor` for the next page; null when this is the last one
                  warning:
                    type: string
                    description: >-
                      Present only when tickets remain beyond this page, spelling out
                      the next call. A partial view of a shared board must never look
                      complete.
        "410":
          description: The shared link has expired or been revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: |
            `share.rate_limited` — this link has exceeded its budget of 120
            requests/minute (see spec/auth.md). Carries `Retry-After`. The budget is
            per link and shared by every viewer holding it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: |
            `share.kind_unrecognized` — the share's stored scope kind is neither
            `project` nor `subtree`. No tickets are returned: an unresolvable
            scope fails closed, never back to the whole project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /shares/self/tickets/{id}:
    get:
      tags: [shares]
      summary: One in-scope ticket with comments + deps — share token
      security:
        - shareBearer: []
      description: |
        Authenticated by the SHARE token. Returns one ticket (with `comments`
        and `deps`) for the board's detail panel. A ticket outside the share's
        scope returns `404` — the share cannot reach it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: The shared link has expired or been revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: |
            `share.rate_limited` — this link exceeded 120 requests/minute, counted
            across all `/shares/self*` routes together. Carries `Retry-After`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: |
            `share.kind_unrecognized` — the share's stored scope kind is neither
            `project` nor `subtree`, so membership in its scope cannot be decided.
            The ticket is withheld rather than assumed in scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /mcp:
    servers:
      - url: /
    post:
      tags: [identity]
      summary: Hosted MCP endpoint (Model Context Protocol, streamable HTTP transport)
      description: |
        A Model Context Protocol server hosted in-process, so an agent can attach
        with `claude mcp add --transport http https://<host>/mcp` instead of
        running the Node stdio wrapper in `clients/mcp`. This is NOT part of the
        frozen `/v1` REST surface — it lives at the root path and speaks
        JSON-RPC 2.0 over the MCP Streamable HTTP transport (spec 2025-06-18).

        Mode: stateless, `application/json` responses. Every POST is a
        self-contained JSON-RPC message (`initialize`, `tools/list`,
        `tools/call`, ...); no session id is issued and none is required, which
        lets the endpoint scale horizontally with no session affinity.

        Auth: the SAME bearer-token path as the REST API. Send
        `Authorization: Bearer tk_...` on every request; missing, invalid, and
        SHARE (`tks_`) tokens are rejected with 401 before any MCP frame is
        processed. Each tool re-checks scope and project access exactly like the
        equivalent REST endpoint, and calls the internal store directly (no HTTP
        round-trip back to this process).

        Rate limiting: the per-token write budget is charged **per tool call**,
        not per HTTP request — every MCP frame is a POST, so the method cannot
        tell a read from a write. The read-only tools (`takomo_show`,
        `takomo_list`, `takomo_ready`, `takomo_deps`, `takomo_questions`,
        `takomo_projects`, `takomo_workflow`, `takomo_roadmap`,
        `takomo_whoami`) cost nothing, and neither do `initialize`,
        `tools/list`, or an unknown tool name; every other tool debits one
        write. Exhausting the budget comes back as a tool-level error (HTTP
        200, `result.isError`) whose payload carries `code: rate.limited`,
        `status: 429`, and the same message and remedy the REST surface sends.

        Tools (mirroring the Node MCP work loop): `takomo_new`,
        `takomo_list`, `takomo_ready`, `takomo_show`, `takomo_claim`,
        `takomo_next`, `takomo_start`, `takomo_transition`,
        `takomo_done`, `takomo_block`, `takomo_cancel`,
        `takomo_comment`, `takomo_link`, `takomo_dep`, `takomo_deps`,
        `takomo_heartbeat`, `takomo_release`, `takomo_archive`,
        `takomo_projects`, `takomo_workflow`, `takomo_roadmap`, `takomo_ask`,
        `takomo_answer`, `takomo_questions`, `takomo_withdraw`,
        `takomo_answer_link`, `takomo_whoami`. Claimed
        tickets track a fencing token that later transitions echo automatically;
        convenience verbs (start/done/block/cancel) resolve target states from
        the project workflow by category.

        Links: `takomo_link` writes only the key it names and lets the store
        merge it, exactly like `PATCH /v1/tickets/{id}` with
        `links: {"<key>": "<value>"}` — a concurrent writer's other keys survive,
        and `value: null` (or omitted) deletes the key, deleting one that is not
        set being a no-op. It does not read-modify-write the whole `links`
        object, which would resurrect a key deleted between its read and its
        write.

        Leases: `takomo_claim`, `takomo_next` and `takomo_start` take
        `ttl_seconds` (1-3600, default 900) and `takomo_heartbeat` renews a lease
        the caller holds — the MCP equivalents of the `ttl_seconds` body field on
        `POST /v1/tickets/{id}/claim`, `POST /v1/ready/claim`, and
        `POST /v1/tickets/{id}/heartbeat`. Both transports resolve the fence the
        same way (holding the active claim means the ticket's current
        `fence_seq`), so an MCP caller does not have to track the token to renew
        its own lease; an explicit `fence` still overrides. A lapsed lease cannot
        be revived on either transport.
      requestBody:
        required: true
        description: A single JSON-RPC 2.0 request or notification (an MCP message).
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, const: "2.0" }
                id:
                  description: Present for requests, omitted for notifications.
                  oneOf:
                    - { type: string }
                    - { type: integer }
                method:
                  type: string
                  examples: [initialize, tools/list, tools/call]
                params: { type: object }
      responses:
        "200":
          description: |
            A JSON-RPC 2.0 response. For `tools/call`, `result.content[0].text`
            carries the tool's JSON payload; tool-level failures set
            `result.isError` and relay the store's `message` / `remedy` /
            `allowed_transitions` so the agent can self-correct.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc: { type: string, const: "2.0" }
                  id:
                    oneOf:
                      - { type: string }
                      - { type: integer }
                  result: { type: object }
                  error: { type: object }
        "202":
          description: Accepted — returned for a JSON-RPC notification (no id).
        "401":
          description: Missing, invalid, or share (`tks_`) token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /questions:
    get:
      tags: [questions]
      summary: List questions on the ask-a-human board (the inbox read-model)
      description: |
        Open questions by default, ordered by urgency then age. Filter by
        `project`, `ticket`, or `status` (comma-separated). `mine=true` scopes
        the list to the caller's own expertise, derived from its `expert:<tag>`
        scopes; `expertise` (repeatable) filters by explicit tags.

        The result is paginated: `limit` (clamped 1..500, default 500) bounds a
        page and `cursor` (an opaque row offset) fetches the next one. When more
        rows remain the response carries a non-null `next_cursor` to pass back as
        `cursor`.
      parameters:
        - { name: project, in: query, schema: { type: string } }
        - { name: ticket, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string }, description: "Comma-separated: open (default), answered, withdrawn, expired" }
        - { name: mine, in: query, schema: { type: boolean }, description: "Only questions routed to your expert:<tag> scopes" }
        - { name: expertise, in: query, schema: { type: string }, description: Repeatable tag filter (match any) }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 }, description: Max questions per page }
        - { name: cursor, in: query, schema: { type: integer, minimum: 0 }, description: Row offset from a previous next_cursor }
      responses:
        "200":
          description: The matching questions (one bounded page).
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Question" }
                  next_cursor:
                    type: [integer, "null"]
                    description: Pass as `cursor` to fetch the next page; null when the last page was returned.
    post:
      tags: [questions]
      summary: Ask a human — raise a question and park the ticket (block-and-resume)
      description: |
        Requires the `write` scope. Parks the ticket in a blocked state and
        releases the caller's lease, then records the question. End the run and
        resume the ticket once a human answers. Echo the lease `fence` while you
        hold it. A ticket may hold several open questions; it resumes only when
        all are answered (a barrier). A re-sent ask with the same asker + kind +
        title is an idempotent retry (returns the existing question).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, kind, title]
              properties:
                ticket: { type: string }
                mode:
                  type: string
                  enum: [blocking, advisory]
                  default: blocking
                  description: blocking parks+resumes the ticket (needs a parkable state); advisory records a routed decision with no state change (e.g. an epic-level question)
                kind: { type: string, enum: [confirm, choose, clarify, approve] }
                title: { type: string }
                body: { type: string }
                options:
                  type: array
                  description: 'For kind=choose (>= 2). Each item is a string, or an object {value, desc} to give the option a one-line trade-off description shown in the inbox.'
                  items:
                    oneOf:
                      - { type: string }
                      - type: object
                        required: [value]
                        properties:
                          value: { type: string }
                          desc: { type: string }
                option_notes:
                  type: array
                  items: { type: string }
                  description: 'Alternative to {value,desc}: per-option descriptions parallel to `options` (same length).'
                multi: { type: boolean, description: 'For kind=choose, allow selecting several options (multi-select)' }
                recommended_multi: { type: array, items: { type: string }, description: 'For a multi choose, the recommended set of options; every entry must be one of `options`' }
                recommended: { description: "The agent's suggested answer. For a question with `options` it must be one of them exactly (a string) or null — `on_timeout=recommended` stores it as the answer, so a recommendation that is not an option could never be one. For a kind that carries no options (confirm/approve/clarify) it is free-form JSON." }
                recommended_note: { type: string, description: A short rationale for the recommendation ("why") }
                confidence: { type: integer, minimum: 1, maximum: 4, description: How strong the recommendation is (1 tentative … 4 very strong) }
                summary: { type: string, description: One-line summary for the inbox list preview }
                expertise:
                  type: array
                  items: { type: string }
                  description: Routing tags, e.g. ["domain:billing"]
                urgency: { type: string, enum: [critical, high, normal, low] }
                expires_in_seconds: { type: integer, description: Auto-expire deadline }
                on_timeout: { type: string, enum: [recommended, escalate, cancel] }
                fence: { type: integer }
      responses:
        "201":
          description: The created question plus the parked ticket.
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: { $ref: "#/components/schemas/Question" }
                  ticket: { $ref: "#/components/schemas/Ticket" }
                  note: { type: string }
                  hints:
                    type: array
                    items: { type: string }
                    description: Non-blocking suggestions for optional fields that would make the inbox render richer.
        "400":
          description: Malformed body (unknown field, missing/mistyped ticket/kind/title).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            Invalid value: bad kind/urgency/on_timeout, choose with < 2 options,
            an `approve` question with no expertise tag, `on_timeout=recommended`
            with a window under the required minimum, or a `recommended` /
            `recommended_multi` that is not among `options`
            (`validation.recommended`, `validation.recommended_multi`) — the same
            rule POST /v1/questions/{id}/options enforces on a revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The ticket has no self-service edge into a blocked state, so it can't be parked (question.no_park).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /questions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Question id, e.g. "q-9f3ka2xz"
    get:
      tags: [questions]
      summary: Fetch one question
      responses:
        "200":
          description: The question.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "404": { $ref: "#/components/responses/NotFound" }

  /questions/{id}/answer:
    post:
      tags: [questions]
      summary: Answer a question (the human authorization gate) and resume the ticket
      description: |
        Requires the `human` scope. Records the reply and resumes the ticket.
        `answer` may be a scalar (`true`, an option string, or clarification
        text) or `{ "value": ..., "note": ... }` (a top-level `note` sibling is
        rejected). An `approve` question additionally requires the answerer to
        hold a matching `expert:<tag>` scope.

        The resume goes through the workflow's human-gated (`scope:human`)
        transition out of the parked state. Where the parked state has no
        human-gated exit at all — the `simple` workflow has none anywhere, by
        design — it goes instead through any exit the answerer can take
        (scope satisfied, no claim, no guard) that leads somewhere non-terminal
        and unblocked, preferring a claimable `todo` so the ticket re-enters the
        ready queue. A human gate that exists but is not takeable is never
        routed around.

        The resume is performed by the same transition machinery as
        `POST /v1/tickets/{id}/transition`, with the answerer as the actor and
        their scopes as the authority — so it can also be refused for the
        ordinary transition reasons, and those codes appear in the `resume`
        block. In particular, a lease someone took on the ticket while it was
        parked (possible only where a workflow marks a blocked state
        `claimable`) is superseded only by a `scope:human` resume edge; where the
        workflow declares no human authority there, the answer is recorded but
        the ticket stays parked with `resume.code: claim.held` rather than being
        moved out from under the holder.

        An explicit `resume_to` is strict (a bad target errors). With no
        `resume_to`, the answer is recorded even if the ticket cannot be
        auto-resumed: `resolved_to` is then null and the `resume` block of the
        response carries a `code`, a `message` and a `remedy` saying why the
        ticket is still parked and what to call next. That case also posts a
        second comment on the ticket.

        The answer is mirrored onto the ticket as a comment so the resuming
        agent sees the decision in its normal work loop. The comment names the
        question by **id**, not by restating its title (`Human answered
        q-9f3ka2xz: yes / approved — <note>`); the id resolves to the full
        question via `GET /v1/questions/{id}`. The other question endpoints that
        mirror onto the ticket — `reopen`, `followup`, `reply`, `options` — use
        the same shape. Comment prose is not a contract: do not parse it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { description: "Scalar or { value, note }" }
                resume_to: { type: string, description: Override the resume state }
      responses:
        "200":
          description: The answered question and resumed ticket.
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: { $ref: "#/components/schemas/Question" }
                  ticket: { $ref: "#/components/schemas/Ticket" }
                  resume: { $ref: "#/components/schemas/AnswerResume" }
        "400":
          description: Missing `answer`, or an unknown top-level field.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Token lacks the `human` scope (or the `expert:<tag>` an approve needs).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Answer invalid for the kind (non-bool confirm/approve, unknown choose option, empty clarify).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }

  /questions/{id}/answer-link:
    post:
      tags: [questions]
      summary: Mint a per-question answer link for an outside expert
      description: |
        Requires the `human` scope (and, for an `approve` question, the matching
        `expert:<tag>` — you can only delegate authority you hold). Returns a
        scoped, expiring, single-use `tka_` token (shown once) plus the
        `#a=<token>` board path. The holder can read and answer ONLY this
        question, via `/v1/answer/self`, and nothing else.

        Lifetime precedence, most specific first: an explicit `ttl_seconds` here,
        then the question's project `answer_link_ttl_seconds` (see
        `PUT /projects/{project}/answer-link-ttl`), then the built-in default of
        604800 seconds (7 days). The response echoes the lifetime applied as
        `ttl_seconds` and where it came from as `ttl_source`.

        The MCP tool `takomo_answer_link` runs the same implementation, so every
        rule above — the delegation gate included — holds identically there.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds:
                  type: integer
                  minimum: 1
                  maximum: 2592000
                  description: 'Link lifetime in seconds. Omit to use the project default and then the built-in 7 days; max 30 days.'
                actor: { type: string, description: 'Who the answer is attributed to (default human:link:<qid>)' }
      responses:
        "201":
          description: The grant metadata plus the one-time token and board path.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/AnswerGrant" }
                  - type: object
                    properties:
                      token: { type: string, description: 'tka_… — shown once' }
                      path: { type: string, description: '/board#a=<token>' }
                      url: { type: string, description: 'Full URL when TAKOMO_PUBLIC_URL is set' }
                      ttl_seconds: { type: integer, description: 'The lifetime actually applied, in seconds' }
                      ttl_source:
                        type: string
                        enum: [explicit, project, default]
                        description: 'Where that lifetime came from: this request, the project setting, or the built-in default'
                      warning: { type: string, description: 'The token is shown once and anyone holding the link can answer this question' }
        "403":
          description: Token lacks `human` (or the `expert:<tag>` an approve link needs).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The question is not open.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /answer-links/{id}:
    delete:
      tags: [questions]
      summary: Revoke an answer link (creator or admin, `human` scope)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: 'answer-grant id, e.g. "ag_…"' }
      responses:
        "204": { description: Revoked (idempotent) }
        "403": { description: Not the creator and not an admin }
        "404": { $ref: "#/components/responses/NotFound" }

  /answer/self:
    get:
      tags: [questions]
      summary: The one question an answer link can answer (answer-grant auth)
      description: |
        Authenticated by a `tka_` answer-link token (in the `#a=` fragment), NOT
        a normal token. Returns the question plus minimal ticket context.
      security:
        - answerBearer: []
      responses:
        "200":
          description: The question and its ticket context.
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: { $ref: "#/components/schemas/Question" }
                  ticket: { type: [object, "null"] }
                  expires_at: { type: string, format: date-time }
        "410": { description: 'The link is expired, used, or revoked.' }
    post:
      tags: [questions]
      summary: Answer the one question the link grants (answer-grant auth, single-use)
      description: |
        Authenticated by the `tka_` answer-link token. The grant IS the human
        authorization: it answers as its recorded actor with exactly the scope
        needed for this question.

        Single-use is atomic: the link is marked used in the SAME transaction
        that records the answer. Of any number of simultaneous submissions on one
        link exactly one is applied; every other gets `410` and changes nothing.
        A rejected answer (bad option, missing expert scope) rolls the spend back
        with it, so a link is never burned by an attempt that did not land.
      security:
        - answerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { description: "Scalar or { value, note }" }
                resume_to: { type: string }
      responses:
        "200":
          description: The answered question and (for a blocking question) the resumed ticket.
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: { $ref: "#/components/schemas/Question" }
                  ticket: { $ref: "#/components/schemas/Ticket" }
                  resume: { $ref: "#/components/schemas/AnswerResume" }
        "410":
          description: >-
            The link is expired, used, or revoked (`answer.expired`); or it was
            spent by a simultaneous submission while this one was in flight
            (`answer_link.spent`, raised inside the answering transaction — this
            request recorded nothing).

  /questions/{id}/withdraw:
    post:
      tags: [questions]
      summary: Withdraw an open question (the agent no longer needs the answer)
      description: Requires the `write` scope. The ticket stays parked.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: The withdrawn question.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "409": { $ref: "#/components/responses/Conflict" }

  /questions/{id}/reopen:
    post:
      tags: [questions]
      summary: Reopen an answered question — a conditional undo beyond the 30s window
      description: |
        Requires the `human` scope (and, for an `approve` question, the matching
        domain expert). Takes back the decision: the question returns to `open`
        and, for a blocking question that resumed a ticket, the ticket is
        re-parked in a blocked state. Refused with a teaching `409` when the
        ticket already relies on the answer — it has been claimed
        (`question.reopen_claimed`), moved past the state it resumed into
        (`question.reopen_moved`), or archived (`question.reopen_archived`). In
        that case re-ask instead of reopening. Advisory questions (no state
        change) just reopen.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The reopened question and the (re-parked) ticket.
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: { $ref: "#/components/schemas/Question" }
                  ticket: { $ref: "#/components/schemas/Ticket" }
        "409": { $ref: "#/components/responses/Conflict" }

  /questions/{id}/followup:
    post:
      tags: [questions]
      summary: Ask the agent for more research before answering
      description: |
        Requires the `human` scope. Bounces an open question back to the asking
        agent with a message, records it on the follow-up thread, and flips
        `awaiting` to `agent`. The question stays open and a blocking question's
        ticket stays parked — you still own the eventual answer.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 32768, description: What the agent should look into }
      responses:
        "200":
          description: The question, now awaiting the agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "409": { $ref: "#/components/responses/Conflict" }

  /questions/{id}/reply:
    post:
      tags: [questions]
      summary: Agent replies to a follow-up with the requested research
      description: |
        Requires the `write` scope. The asking agent posts the context the human
        asked for; records it on the thread and flips `awaiting` back to `human`
        so the inbox shows the question ready to answer again.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 32768, description: The research/context the human asked for }
      responses:
        "200":
          description: The question, now awaiting the human.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "409": { $ref: "#/components/responses/Conflict" }

  /questions/{id}/options:
    post:
      tags: [questions]
      summary: Revise a still-open choose question's options
      description: |
        Requires the `write` scope. Replaces the option set of an open `choose`
        question, so an agent that learns something while answering a follow-up
        can fix the choices instead of withdrawing the question and losing the
        whole thread.

        `options` is required and **replaces** the set (it does not merge).
        `recommended`, `recommended_multi` and `recommended_note` are only touched
        when present in the body — send `recommended: null` to clear it. A
        recommendation left pointing at an option that no longer exists is a 422,
        not a silent drop: the caller decides what it should now be.

        Whose turn it is (`awaiting`) is deliberately unchanged — revising is
        orthogonal to the thread. A human still holding the old option list is
        protected by the answer path, which validates the chosen option against
        the current set. Revising an answered, withdrawn or expired question is a
        409: it would rewrite what was decided.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [options]
              properties:
                options:
                  type: array
                  minItems: 2
                  description: "The full replacement set: strings, or {value, desc} objects."
                  items:
                    oneOf:
                      - type: string
                      - type: object
                        required: [value]
                        properties:
                          value: { type: string }
                          desc: { type: string }
                option_notes:
                  type: array
                  items: { type: string }
                  description: One-line trade-off per option, parallel to options (1:1 or omitted).
                recommended:
                  description: New recommendation; must be one of the revised options. null clears it. Omit to keep.
                recommended_multi:
                  type: array
                  items: { type: string }
                  description: For a multi choose — the new recommended subset. Empty list clears it. Omit to keep.
                recommended_note: { type: [string, "null"], description: Rationale for the recommendation. null clears it. Omit to keep. }
                reason: { type: string, maxLength: 32768, description: Why the options changed — recorded on the ticket for a human who read the old set. }
      responses:
        "200":
          description: The question with its revised options.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "409": { $ref: "#/components/responses/Conflict" }

  /board:
    servers: [{ url: / }]
    get:
      tags: [admin]
      summary: Read-only kanban board (static SPA; carries the viewer's token in-browser)
      security: []
      responses:
        "200": { description: HTML page }

  /inbox:
    servers: [{ url: / }]
    get:
      tags: [questions]
      summary: Ask-a-human inbox (static email-style SPA; folder rail + list + answer pane)
      description: |
        Self-contained page served at `/inbox`. Unauthenticated HTML; every data
        fetch carries the viewer's bearer token, and answering requires the
        `human` scope. Talks to `/v1/questions*` and `/v1/events`.
      security: []
      responses:
        "200": { description: HTML page }

  /healthz:
    servers: [{ url: / }]
    get:
      tags: [admin]
      summary: Liveness/readiness (open — no auth; the only unauthenticated endpoint)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }

  /favicon.svg:
    servers: [{ url: / }]
    get:
      tags: [admin]
      summary: Site icon — the takomo octopus mark as an SVG (static, no auth)
      description: |
        The mark ("tako" = octopus) served as `image/svg+xml`. `/board` and
        `/inbox` link it explicitly; `/favicon.ico` serves the same bytes to
        catch the bare request legacy browsers make on their own.
      security: []
      responses:
        "200":
          description: SVG image
          content:
            image/svg+xml: {}

  /favicon.ico:
    servers: [{ url: / }]
    get:
      tags: [admin]
      summary: Site icon (alias of /favicon.svg; same SVG bytes)
      security: []
      responses:
        "200":
          description: SVG image
          content:
            image/svg+xml: {}

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: See auth.md — `tk_`-prefixed tokens, scoped, hashed at rest.
    shareBearer:
      type: http
      scheme: bearer
      description: |
        A SHARE token (`tks_`-prefixed), minted by `POST /v1/shares` and hashed
        at rest like a normal token. It is a distinct auth path: it authorizes
        ONLY the read-only `/v1/shares/self*` endpoints, bounded to its scope,
        and is rejected on every normal endpoint. Expired/revoked shares return
        `410 Gone`. See auth.md.
    answerBearer:
      type: http
      scheme: bearer
      description: |
        An ANSWER-LINK token (`tka_`-prefixed), minted by
        `POST /v1/questions/{id}/answer-link`. A distinct auth path: it
        authorizes ONLY `/v1/answer/self` for the one referenced question,
        is single-use (spent in the same transaction that records the answer, so
        simultaneous submissions on one link resolve to exactly one applied
        answer), auto-expires, and is rejected on every other endpoint.
        Expired/used/revoked links return `410 Gone`.

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Ticket id, e.g. "rvp-x7k2"
    project:
      name: project
      in: path
      required: true
      schema: { type: string }

  responses:
    NotFound:
      description: Unknown id
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Version mismatch, claim held by another, or stale fence
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: The request body failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Project:
      type: object
      properties:
        id: { type: string, description: 'short slug, also the ticket id prefix' }
        name: { type: string }
        workflow: { type: string, description: workflow name in effect }
        question_language: { type: [string, "null"], description: 'Human-facing language agents should phrase ask-a-human questions in (e.g. "German"); null = no preference' }
        style_guide: { type: [string, "null"], description: "House style for the text agents write on this project — ticket titles/bodies, comments, and human-facing questions; null = no preference" }
        answer_link_ttl_seconds:
          type: [integer, "null"]
          minimum: 1
          maximum: 2592000
          description: "Default lifetime of an answer link minted for one of this project's questions; null = unset, so minting falls back to the built-in 604800 seconds (7 days)"
        claim_ttl_seconds:
          type: [integer, "null"]
          minimum: 1
          description: |
            The lease a claim on one of this project's tickets gets when it names
            no ttl_seconds; null = unset, so claiming falls back to the built-in
            900 seconds. A different setting from answer_link_ttl_seconds above —
            that bounds a credential handed outside the org, this bounds how long
            a worker may hold a ticket.
        max_claim_ttl_seconds:
          type: [integer, "null"]
          minimum: 1
          description: |
            The ceiling an explicit ttl_seconds on a claim or heartbeat is checked
            against; null = unset, so the built-in 3600 seconds applies. There is
            deliberately no upper bound: a deployment may set whatever its fleet
            needs. Note this value is also the ready queue's recovery time — only
            expired leases are swept, so a crashed worker parks its ticket for
            exactly this long.
        created_at: { type: string, format: date-time }

    ProjectCreate:
      type: object
      required: [id, name]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9-]{1,15}$" }
        name: { type: string }
        workflow: { $ref: "#/components/schemas/Workflow" }
        question_language: { type: string, description: 'Optional: the human-facing question language for the project' }
        style_guide: { type: string, description: "Optional: the project's house style for agent-written text (max 2000 characters)" }
        answer_link_ttl_seconds:
          type: integer
          minimum: 1
          maximum: 2592000
          description: "Optional: the project's default answer-link lifetime in seconds (max 2592000; omit to use the built-in 7 days)"
        claim_ttl_seconds:
          type: integer
          minimum: 1
          description: "Optional: the default lease a claim gets, in seconds (omit to use the built-in 900). Must not exceed max_claim_ttl_seconds, or the built-in 3600 when that is omitted."
        max_claim_ttl_seconds:
          type: integer
          minimum: 1
          description: "Optional: the ceiling an explicit ttl_seconds may ask for, in seconds (omit to use the built-in 3600). No upper bound."

    Tag:
      type: object
      description: |
        A project-scoped named entity of some `kind` (person, component, team, …)
        that tickets reference by `kind:handle`. Generic by design — a new kind
        is just a new string, no schema change — with per-kind attributes in the
        free-form `meta` object. Identity is (project, kind, handle).
      properties:
        id: { type: string }
        project: { type: string }
        kind: { type: string, description: 'entity kind slug, e.g. person, component, team' }
        handle: { type: string, description: 'identity within (project, kind)' }
        ref: { type: string, description: 'canonical kind:handle reference stored on tickets' }
        label: { type: string, description: human-facing display name }
        meta: { type: object, description: 'free-form per-kind attributes, e.g. {"email": "..."}; 64 KiB cap' }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TagCreate:
      type: object
      required: [kind, handle]
      properties:
        kind: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}$" }
        handle: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$" }
        label: { type: string, description: 'display name; defaults to the handle' }
        meta: { type: object }

    TagPatch:
      type: object
      description: At least one of label / meta_merge is required
      properties:
        label: { type: string }
        meta_merge: { type: object, description: RFC 7386 merge-patch; null deletes a key }

    ShareCreate:
      type: object
      required: [kind, ref]
      properties:
        kind:
          type: string
          enum: [project, epic]
          description: "project = all tickets in the project; epic = a ticket + its full recursive subtree"
        ref: { type: string, description: project id (kind=project) or root ticket id (kind=epic) }
        ttl_seconds:
          type: integer
          description: link lifetime in seconds (default 86400 = 24h, max 2592000 = 30d)

    Share:
      type: object
      description: Share metadata — never carries the plaintext token or its hash.
      properties:
        id: { type: string, description: 'public handle for list/revoke, e.g. "share_a8f2k1x9q7z3"' }
        kind: { type: string, enum: [project, subtree], description: "stored kind; an 'epic' request is stored as 'subtree'" }
        ref: { type: string, description: project id or root ticket id }
        project: { type: string, description: denormalized project the share is scoped to }
        expires_at: { type: string, format: date-time }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }

    ShareCreated:
      allOf:
        - $ref: "#/components/schemas/Share"
        - type: object
          properties:
            token: { type: string, description: "the SHARE token plaintext — shown ONCE (tks_-prefixed)" }
            path: { type: string, description: "fragment URL to open, e.g. /board#s=<token>" }
            warning: { type: string }

    ShareSelf:
      type: object
      description: A share's own scope plus the project workflow, for board rendering.
      properties:
        kind: { type: string, enum: [project, subtree] }
        ref: { type: string }
        project: { type: string }
        expires_at: { type: string, format: date-time }
        workflow: { $ref: "#/components/schemas/Workflow" }

    WhoAmI:
      type: object
      properties:
        token_id: { type: string, description: 'public token handle, e.g. "tok_a8f2k1x9"' }
        actor: { type: string, description: this token's actor identity }
        scopes: { type: array, items: { type: string } }
        projects:
          description: array of project ids, or the string "*" for all projects
          oneOf:
            - { type: string, const: "*" }
            - { type: array, items: { type: string } }

    Token:
      type: object
      description: Token metadata — never carries the plaintext or the at-rest hash.
      properties:
        id: { type: string, description: 'public handle for list/revoke, e.g. "tok_a8f2k1x9"' }
        actor: { type: string }
        scopes: { type: array, items: { type: string } }
        projects:
          description: array of project ids, or "*" for all
          oneOf:
            - { type: string, const: "*" }
            - { type: array, items: { type: string } }
        rate_limit: { type: integer, description: per-minute write budget }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }

    TokenCreate:
      type: object
      required: [actor, scopes]
      properties:
        actor: { type: string, description: "identity, e.g. agent:runner-1, human:alice" }
        scopes:
          type: array
          minItems: 1
          items: { type: string }
          description: "e.g. read, write, human, autoland, admin (free-form scopes allowed)"
        projects:
          description: array of project ids, or "*"/omitted for all projects
          oneOf:
            - { type: string, const: "*" }
            - { type: array, items: { type: string }, minItems: 1 }
        expires_seconds: { type: integer, description: optional TTL in seconds from now }
        rate_limit: { type: integer, default: 120, description: per-minute write budget }

    TokenCreated:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          properties:
            token: { type: string, description: 'the plaintext tk_ token — shown ONCE, never again' }
            warning: { type: string }

    Ticket:
      type: object
      properties:
        id: { type: string }
        project: { type: string }
        type: { type: string, enum: [epic, task, bug, spike] }
        parent: { type: [string, "null"] }
        title: { type: string, maxLength: 300 }
        body: { type: string, maxLength: 131072, description: markdown }
        state: { type: string, description: workflow state id }
        state_category: { type: string, enum: [todo, in_progress, blocked, review, done, cancelled] }
        priority: { type: string, enum: [critical, high, normal, low], default: normal }
        labels: { type: array, items: { type: string } }
        tags:
          type: array
          items: { type: string }
          maxItems: 50
          description: 'canonical `kind:handle` references into the project tag registry (e.g. person:ada); reference metadata only, at most 50 per ticket'
        metadata:
          type: object
          description: freeform JSON; keys namespaced "<actor-or-tool>.<key>"; 64 KiB cap
        links:
          type: object
          description: well-known evidence pointers
          properties:
            branch: { type: string }
            pr: { type: string, format: uri }
            env: { type: string, format: uri }
            run: { type: string }
        blocked_by: { type: array, items: { type: string } }
        claim:
          type: [object, "null"]
          properties:
            holder: { type: string, description: actor name from token }
            expires_at: { type: string, format: date-time }
        version: { type: integer, description: monotonic per ticket; ETag value }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time, description: 'when archived (hidden from default views), or null when active' }

    TicketCreate:
      type: object
      required: [project, title]
      properties:
        project: { type: string }
        type: { type: string, default: task }
        parent: { type: string }
        title: { type: string }
        body: { type: string }
        priority: { type: string }
        labels: { type: array, items: { type: string } }
        tags:
          type: array
          items: { type: string }
          maxItems: 50
          description: '`kind:handle` tag references to attach; unknown handles are registered on the fly. At most 50 per ticket — each reference is a statement inside the write transaction — else 422 `tag.too_many`'
        metadata: { type: object }
        blocked_by: { type: array, items: { type: string } }
        state: { type: string, description: "optional; must be a legal initial state, defaults to workflow initial" }

    ConventionHints:
      type: object
      description: |
        The project's advisory writing conventions, attached to the work-loop
        responses an agent reads before it writes: create a ticket, read one,
        claim one, pop the ready queue. Each key is absent when the project sets
        nothing, so a project with no conventions carries no extra payload.
        Neither is enforced server-side. Set them with
        `PUT /projects/{project}/style` and `PUT /projects/{project}/language`,
        and read them back as plain fields on `GET /projects`.
      properties:
        style_hint:
          type: object
          description: Present only when the project has a style guide set.
          properties:
            style_guide: { type: string, description: "the project's house style for ticket titles/bodies, comments, and human-facing questions" }
            note: { type: string, description: "what to do with it, written for an LLM reader" }
        language_hint:
          type: object
          description: Present only when the project has a question language set.
          properties:
            question_language: { type: string, description: 'the human-facing language ask-a-human questions and their options belong in (e.g. "German")' }
            note: { type: string, description: "what to do with it, written for an LLM reader" }

    TicketCreated:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - $ref: "#/components/schemas/ConventionHints"
        - type: object
          properties:
            similar:
              type: array
              description: |
                Open tickets that look like possible duplicates, scored by
                title-token overlap (Jaccard) with a nudge when the ticket types
                match, and thresholded so an incidental single shared word does
                not cry wolf. Sorted by descending score. Check before proceeding.
              items:
                type: object
                properties:
                  id: { type: string }
                  title: { type: string }
                  state: { type: string }
                  type: { type: string }
                  score: { type: number, description: 'blended similarity, 0..1 (2 d.p.)' }
                  matched_terms: { type: array, items: { type: string }, description: title tokens that overlapped }

    TicketPatch:
      type: object
      description: All fields optional; state is absent by design (use /transition)
      properties:
        title: { type: string }
        body: { type: string, description: requires If-Match }
        priority: { type: string }
        labels: { type: array, items: { type: string } }
        labels_add: { type: array, items: { type: string } }
        labels_remove: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string }, maxItems: 50, description: 'whole-set replace of `kind:handle` tag references. At most 50 per array, and the resulting set is capped at 50 too, else 422 `tag.too_many` with the count and limit in `details`' }
        tags_add: { type: array, items: { type: string }, maxItems: 50, description: 'tag references to add (commutative); refused when the resulting set would exceed 50' }
        tags_remove: { type: array, items: { type: string }, maxItems: 50, description: 'tag references to remove (commutative)' }
        parent: { type: [string, "null"] }
        links: { type: object, description: "per-key merge: string value sets a key, null deletes it, untouched keys survive" }
        metadata_merge: { type: object, description: RFC 7386 merge-patch; null deletes a key }
        fence: { type: integer, description: required while ticket is claimed and caller is holder }

    Comment:
      type: object
      properties:
        id: { type: string }
        ticket: { type: string }
        author: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }

    Promotion:
      type: object
      description: A record that a ticket's work reached a named target/stage. Free-form and domain-agnostic.
      properties:
        id: { type: string, description: 'e.g. "pr-9f3ka2xz"' }
        ticket: { type: string }
        project: { type: string }
        target: { type: string, description: 'Free-form stage, e.g. "staging", "production", "published"' }
        url: { type: [string, "null"] }
        ref: { type: [string, "null"], description: version/commit/build id }
        note: { type: [string, "null"] }
        actor: { type: string }
        created_at: { type: string, format: date-time }

    Lease:
      type: object
      properties:
        ticket: { type: string }
        holder: { type: string }
        fence: { type: integer, description: echo in every mutating call while claimed }
        expires_at: { type: string, format: date-time }
        resumed:
          type: boolean
          description: >-
            Present and true only when this claim resumed the holder's own lapsed
            lease in a state the workflow does not mark claimable. Absent on an
            ordinary claim, a renewal, and every heartbeat.

    AnswerGrant:
      type: object
      description: Metadata for a per-question answer link (the plaintext token is never returned here).
      properties:
        id: { type: string, description: 'e.g. "ag_…"' }
        question: { type: string }
        project: { type: string }
        actor: { type: string, description: 'Who a use of this link is attributed to' }
        expires_at: { type: string, format: date-time }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        used_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }

    Question:
      type: object
      description: An agent's request for a human decision, tied to a ticket. See the ask-a-human board.
      properties:
        id: { type: string, description: 'e.g. "q-9f3ka2xz"' }
        project: { type: string }
        ticket: { type: string }
        asked_by: { type: string }
        mode: { type: string, enum: [blocking, advisory], description: 'blocking parks+resumes the ticket; advisory records a routed decision with no state change' }
        kind: { type: string, enum: [confirm, choose, clarify, approve] }
        title: { type: string }
        body: { type: string }
        options: { type: array, items: { type: string } }
        option_notes: { type: array, items: { type: string }, description: 'Per-option descriptions, parallel to options (empty when none)' }
        multi: { type: boolean, description: 'A choose question that takes several options' }
        recommended_multi: { type: array, items: { type: string }, description: 'For a multi choose, the recommended set' }
        recommended: { description: "The agent's suggested answer (any JSON), or null" }
        recommended_note: { type: [string, "null"], description: Short rationale for the recommendation }
        confidence: { type: [integer, "null"], minimum: 1, maximum: 4, description: Recommendation strength (1 tentative … 4 very strong) }
        summary: { type: [string, "null"], description: One-line list-preview summary }
        expertise: { type: array, items: { type: string }, description: 'Routing tags, e.g. ["domain:billing"]' }
        urgency: { type: string, enum: [critical, high, normal, low] }
        status: { type: string, enum: [open, answered, withdrawn, expired] }
        answer: { description: 'The recorded human answer ({ value, note? }), or null while open' }
        answered_by: { type: [string, "null"] }
        answered_at: { type: [string, "null"], format: date-time }
        resolved_to: { type: [string, "null"], description: State the ticket was resumed into }
        expires_at: { type: [string, "null"], format: date-time }
        on_timeout: { type: [string, "null"], enum: [recommended, escalate, cancel, null] }
        awaiting: { type: string, enum: [human, agent], description: 'Whose turn on the follow-up thread while open: human (ready to answer) or agent (a human asked for more research)' }
        thread:
          type: array
          description: 'Follow-up messages, oldest first (present on GET /questions/{id}). Each { id, question, author, role: human|agent, body, created_at }.'
          items: { type: object }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    AnswerResume:
      type: object
      description: |
        What an answer did to its ticket. `resumed` and `to` say whether this
        answer moved the ticket out of its blocked state and where to.

        When a blocking answer cleared the barrier but no transition out of the
        parked state could carry the resume, the answer is still recorded and
        the ticket stays parked — and `code`, `message` and `remedy` say why and
        what to call next, so a caller never has to infer "still parked" from a
        null `resolved_to`. Those three are absent when nothing went wrong.
      properties:
        resumed: { type: boolean, description: Whether this answer moved the ticket }
        to: { type: [string, "null"], description: State the ticket was resumed into }
        code: { type: string, description: "Machine-readable reason the ticket could not be resumed: a question code (e.g. question.no_resume) or, since the resume runs through the transition machinery, a transition one (e.g. claim.held)" }
        message: { type: string, description: "What is wrong, including every exit from the parked state and what each would take" }
        remedy: { type: string, description: The exact next call that gets the ticket moving again }

    Event:
      type: object
      properties:
        seq: { type: integer, description: 'global, strictly increasing' }
        ticket: { type: string }
        project: { type: string }
        actor: { type: string }
        kind:
          type: string
          enum: [created, updated, commented, transitioned, claimed, heartbeat, released, lease_expired, lease_revoked, dep_added, dep_removed, workflow_changed, archived, unarchived, question_asked, question_answered, question_withdrawn, question_expired, question_escalated, question_followup_requested, question_replied, question_reopened, ticket_promoted]
        payload: { type: object, description: kind-specific; transitions carry from/to/reason }
        at: { type: string, format: date-time }

    Workflow:
      type: object
      description: See workflow-format.md for authoring format and semantics
      required: [name, initial, states, transitions]
      properties:
        name: { type: string }
        initial: { type: string }
        states:
          type: array
          items:
            type: object
            required: [id, category]
            properties:
              id: { type: string }
              category: { type: string, enum: [todo, in_progress, blocked, review, done, cancelled] }
              claimable: { type: boolean, default: false }
              terminal: { type: boolean, default: false }
        transitions:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: string }
              to: { type: string }
              requires:
                type: array
                items: { type: string }
                description: >-
                  any of: claim | scope:<scope> | guard:<guard-id> |
                  guard:has_link:<key>. Guard ids are no_open_children and
                  no_open_blockers; guard:has_link:<key> requires a non-empty
                  links.<key> on the ticket (guard:has_link:commit is the
                  evidence gate for done — see spec/workflow-format.md).
        guards:
          type: object
          description: named guard configs, e.g. no_open_children on done-category entry

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            stable machine code, e.g. conflict.version, claim.held, fence.stale
            (superseded lease), fence.invalid (fence never issued — a client bug).
            `x-error-codes` at the root of this document lists every code the
            server can emit, with what each means; it is kept complete by a test,
            not by hand. Branch on the code, never on the message.
        message: { type: string, description: written for LLM readers — states what is wrong AND what to do }
        remedy: { type: string, description: 'the exact next call to make, when one exists' }
        current_version: { type: integer }
        details: { type: object }

    TransitionError:
      allOf:
        - $ref: "#/components/schemas/Error"
      type: object
      properties:
        current_state: { type: string }
        allowed_transitions:
          type: array
          items:
            type: object
            properties:
              to: { type: string }
              requires: { type: array, items: { type: string } }
        details:
          type: object
          description: |
            extra context keyed to the `code`. For `transition.claim_required`:
            `claimable_states`, every state of this workflow in which a lease may
            be taken, and — when the current state is not one of them —
            `reentry_states`, the states reachable from here that are, i.e. the
            route back to a claimable position. For `transition.guard`: the
            `guard` that failed and any `offending_tickets`.
          properties:
            claimable_states: { type: array, items: { type: string } }
            reentry_states: { type: array, items: { type: string } }
            guard: { type: string }
            offending_tickets: { type: array, items: { type: string } }

# ---------------------------------------------------------------------------
# The error-code vocabulary (takomo-b6cg).
#
# Every `code` an error body can carry, with what it means. `ApiError`
# (src/error.rs) is the only thing in the tree that builds an error body, so this
# is the whole set — for REST, for MCP (which serialises the same body into its
# tool result) and for the `resume.code` an answer response carries when the
# ticket could not be resumed.
#
# It is gated, not aspirational. tests/api.rs
# `every_emitted_error_code_is_documented_in_the_spec` scans the `ApiError`
# constructor call sites under src/ and fails when the two sides disagree in
# either direction: a code emitted but not listed here, and a code listed here
# that nothing emits any more. `the_error_code_scan_can_see_every_construction_
# site` is the other half — it fails if a code is minted somewhere that scan
# cannot read, so the coverage above cannot quietly become partial.
#
# Codes are stable. Renaming one is a breaking change to the contract, not a
# refactor: clients branch on them. Read the families left to right —
# `validation.` a rejected input, `notfound.` a missing entity, `claim.`/`fence.`
# lease trouble, `transition.` an illegal or ungated state move, `question.`
# ask-a-human, `auth.`/`share.`/`answer.` the three token kinds.
#
# The HTTP status a code rides on is documented per route, under that route's
# `responses`. It is deliberately not restated here: a second copy would be one
# nothing checks.
# ---------------------------------------------------------------------------
x-error-codes:
  # -- bearer tokens (tk_): authentication, scopes, project allowlist, budget --
  auth.missing: "no Authorization header. Every /v1 and /mcp call needs `Bearer tk_...`; only /healthz is open."
  auth.invalid: "the bearer token is not recognised, was revoked, or has expired. Mint a fresh one with `takomo token create`."
  auth.scope: "the token authenticates but does not carry the scope this operation requires. The message names the missing scope and the ones the token holds."
  auth.project: "the token is restricted to a project allowlist that does not cover the project addressed."
  rate.limited: "the token's sliding-window write budget is spent. Reads are not charged and keep working; `Retry-After` says how long to wait."

  # -- share tokens (tks_): read-only, /v1/shares/self only -------------------
  share.missing: "no share token. A shared link carries it in the URL fragment (#s=...), which browsers never send — the page reads it and sends it as the bearer."
  share.invalid: "the share token is not recognised. The link is mistyped, or the share was revoked."
  share.expired: "the share existed but its window has closed. Ask the owner for a fresh link."
  share.rate_limited: "one link has made more requests in the last minute than viewing a board takes, so it is being throttled. The budget is per link and shared by everyone holding it."
  share.kind: "`kind` on share creation must be `project` (a whole project) or `epic` (a ticket plus its descendant subtree)."
  share.ttl: "`ttl_seconds` on share creation must be a positive integer no larger than the 30-day maximum."
  share.kind_unrecognized: "the share's stored scope kind is neither `project` nor `subtree`, so it cannot be served. The share is refused rather than widened to a scope it may not cover."
  share.not_owner: "only the share's creator, or an admin, may revoke it."

  # -- answer grants (tka_): one question, one answer, then spent -------------
  answer.missing: "no answer-link token. An answer link carries it in the URL fragment (#a=...)."
  answer.invalid: "the answer-link token is not recognised. The link is mistyped, or the grant was revoked."
  answer.expired: "the answer link existed but its window has closed. Ask for a fresh one."
  answer_link.spent: "the grant is single-use and has already been spent. Nothing was recorded for this attempt; the answer already on the question stands."
  answer_link.ttl: "`ttl_seconds` on answer-link creation must be a positive integer no larger than the 30-day maximum — the link is a credential handed outside the org."
  answer_link.not_owner: "only the link's creator, or an admin, may revoke it."

  # -- claims and leases ------------------------------------------------------
  claim.held: "the ticket is already claimed by someone else, until the time the message states. Only the lease holder may mutate it: comment instead, pick different work, or wait for the lease to expire."
  claim.none: "the ticket holds no claim and no lapsed one, so there is nothing to release or force-release."
  claim.state: "the ticket's state is not claimable in this project's workflow. The message lists the claimable states and the route back to one."
  claim.blocked: "the ticket has open blockers, so it never enters the ready queue. Finish or cancel the blockers first."
  fence.required: "the ticket is claimed by you and this call mutates it, so it must echo the lease's fencing token. Send the `fence` from the claim or heartbeat response."
  fence.stale: "the fence presented was superseded by a later claim, or the lease is simply gone. Stop writing — work in flight may duplicate another worker's. Re-claim if the work is still yours."
  fence.invalid: "the fence presented is higher than any this ticket has reached, so it was never issued. A client bug: the value was fabricated, hand-incremented, or belongs to another ticket."
  heartbeat.no_lease: "no active lease of yours on this ticket, so there is nothing to renew. Claim it first, then heartbeat before the `expires_at` you were given."
  release.no_lease: "no active lease of yours on this ticket to release. Pass an explicit fence to release one anyway."

  # -- optimistic concurrency, on whole-body replacement only -----------------
  conflict.if_match_required: "replacing `body` needs `If-Match: \"<version>\"`, the value of the ticket's ETag. Field sets and `metadata_merge` never need it."
  conflict.version: "the `If-Match` version is not the current one, so the body changed since you read it. Re-read the ticket, re-apply your edit to the fresh body, retry."

  # -- workflow transitions ---------------------------------------------------
  transition.illegal: "no transition from the ticket's state to the one requested exists in this project's workflow. `allowed_transitions` on the error lists the legal moves."
  transition.unknown_state: "the target state requested does not exist in this project's workflow at all."
  transition.claim_required: "the transition carries `requires: [claim]` and you hold no lease. `details.claimable_states` says where a lease may be taken; `details.reentry_states` is the route back when the current state is not one of them."
  transition.scope: "the transition carries a `requires: [scope:<s>]` authorisation gate — human approval, typically — and the token lacks that scope. Not a workflow mistake."
  transition.guard: "a `requires: [guard:<id>]` on the transition is unsatisfied. `details.guard` names it and `details.offending_tickets` the children or blockers in the way."
  transition.requirements: "the transition's requirements are unmet and no more specific code applies."
  transition.no_target: "an MCP convenience tool (`takomo_start`, `takomo_done`, …) found no legal transition into the state category it aims for. Pass an explicit `to`."
  patch.state_not_patchable: "`state` is workflow-controlled and cannot be set by PATCH. Use POST /tickets/{id}/transition, which validates the move and reports the legal ones."

  # -- ask-a-human ------------------------------------------------------------
  question.not_open: "the question is not open, so there is nothing to answer — or nothing to answer again."
  question.not_answered: "only an answered question can be reopened."
  question.not_awaiting_reply: "the question is not waiting on an agent reply; it is the human's turn. Reply only after a human asks for more."
  question.no_park: "a blocking question has to park its ticket, and the ticket's state has no self-service transition into a blocked one. Move it to a blocked state first, ask from an in-progress state, or use `mode=advisory`."
  question.no_resume: "no transition out of the parked state can resume the ticket automatically: every exit is gated by a claim, a guard, or a scope this token lacks, or leads only to a terminal or blocked state. The answer is still recorded."
  question.resume_claim: "the resume edge requires an active claim, which nobody holds while a question is open. Choose a `resume_to` that is not claim-gated, or claim the ticket and transition it normally."
  question.resume_guard: "the resume edge is guarded. Satisfy the guard and transition explicitly; the recorded answer stays on the ticket."
  question.answer_scope: "resuming into the chosen state needs a scope the answerer's token lacks. Have someone holding it answer, or pass a `resume_to` this token can reach."
  question.approve_expertise: "an `approve` question names required `expertise`, so answering it — or minting an answer link for it — needs a matching `expert:<tag>` scope. A general `human` token is not sufficient; you can only delegate authority you hold."
  question.reopen_archived: "the ticket is archived, so the answer is settled. Re-ask instead of reopening."
  question.reopen_claimed: "a worker holds the ticket and is relying on the answer, so it cannot be reversed. Reopen only while the ticket is free."
  question.reopen_moved: "the ticket has moved on since the answer resumed it, so the answer is already in use. Re-ask if you need a new decision."
  question.reopen_no_park: "this project's workflow has no blocked state to re-park the ticket into. Move it by hand and re-ask."

  # -- projects, workflows, tokens, tags --------------------------------------
  project.id: "the project id is invalid. It becomes the ticket-id prefix, so it must match ^[a-z][a-z0-9-]{1,15}$."
  project.exists: "a project with that id already exists."
  project.active_claims: "the project has tickets under a live lease, and deleting it would yank work out from under a worker. Wait for the leases, or re-issue with `?force=true`."
  project.claim_ttl: "a claim-TTL setting is not a positive number of seconds, or the default exceeds the maximum — which would clamp every claim, so no claim would get the default set. Send null to fall back to the built-in bounds."
  project.answer_link_ttl: "`answer_link_ttl_seconds` must be a positive number of seconds no larger than the 30-day maximum, the same bound an explicit `ttl_seconds` carries."
  project.style_guide_too_long: "the project style guide is over its character limit. It rides along on every work-loop response, so it holds the few conventions that change how an agent writes; anything longer belongs in a ticket or repo docs."
  workflow.parse: "the workflow document does not match the expected shape. `name`, `initial`, `states` (id and category each) and `transitions` (from and to each) are required; see spec/workflow-format.md."
  workflow.invalid: "the workflow parsed but is not a usable state machine — an unreachable state, a transition to a state that does not exist, no terminal state. The message lists every problem found."
  token.actor: "`actor` must be non-empty and at most 200 characters. It is who the token acts as, and it lands in the event log."
  token.scopes: "`scopes` is required and must be a non-empty array of strings, e.g. [\"read\", \"write\"]."
  token.projects: "`projects` must be an array of project ids, or the string \"*\" for all of them — never an empty array."
  token.rate_limit: "`rate_limit`, in writes per minute, must be a positive integer."
  token.expires_seconds: "`expires_seconds` must be a positive integer number of seconds."
  tag.exists: "that `kind:handle` is already registered in the project. PATCH the tag to change its label or meta."
  tag.too_many: "too many tag references in one request, or the patch would leave the ticket over the cap. `details` carries `count` and `max`. Send fewer, or use `tags` to replace the whole set with one under the limit. The cap exists because attaching tags is per-reference work inside the single-writer transaction every claim and transition waits on."

  # -- missing entities. `notfound.<kind>` names the kind the handler looked ---
  # -- for, so this family grows with the addressable kinds. -------------------
  notfound.ticket: "no ticket with that id."
  notfound.project: "no project with that id. GET /projects lists them."
  notfound.question: "no question with that id."
  notfound.token: "no token with that id."
  notfound.tag: "no tag with that `kind:handle` in the project."
  notfound.share: "no share with that id."
  notfound.answer-link: "no answer-link grant with that id."

  # -- rejected input. `validation.<field-or-concept>`: 400 when the request ---
  # -- is malformed, 422 when it is well-formed but unacceptable. --------------
  validation.json: "the request body is not valid JSON, or was sent without `Content-Type: application/json`."
  validation.body_json: "the request body parsed, but is not a JSON object."
  validation.unknown_field: "the body carries field names this endpoint does not accept. The message lists the unknown ones and the accepted set — a typo is refused, never silently dropped."
  validation.field_required: "a required field is absent. The message names it."
  validation.field_type: "a field is present with the wrong JSON type. The message names the field and the type expected."
  validation.query: "a query parameter is missing, or is not the type expected."
  validation.cursor: "the pagination cursor is not one this endpoint issued. Pass the exact `next_cursor` from the previous page."
  validation.if_match: "the `If-Match` header is not a ticket version as returned in the ETag, e.g. `If-Match: \"7\"`."
  validation.idempotency_key: "the `Idempotency-Key` header is over its 128-character limit."
  validation.empty_patch: "the patch contains no changes. Send at least one settable field."
  validation.no_changes: "the request asks for no change at all — an empty tag add and remove, or a tag patch with neither `label` nor `meta_merge`."
  validation.title: "the title is empty, or over its length limit."
  validation.body: "the body is over its byte limit."
  validation.comment: "the comment body is empty, or over its byte limit."
  validation.type: "the ticket type is not one of the known values."
  validation.priority: "the priority is not one of the known values."
  validation.label: "a label is empty, or over its length limit."
  validation.state: "tickets are created in the workflow's initial state, and another was requested. Create the ticket, then transition it."
  validation.project: "the project named does not exist."
  validation.project_required: "this endpoint needs an explicit `project` query parameter."
  validation.parent: "the parent ticket does not exist, or belongs to a different project — parent and child must share one."
  validation.parent_cycle: "setting that parent would make the ticket tree cyclic."
  validation.blocked_by: "a `blocked_by` entry names a ticket that does not exist."
  validation.dep_cycle: "adding that dependency would create a cycle — the would-be blocker already depends on this ticket, directly or transitively."
  validation.links: "`links` must be a JSON object of string values, with null to delete a key."
  validation.metadata: "`metadata` must be a JSON object with namespaced keys, e.g. `myagent.run_id`."
  validation.metadata_merge: "`metadata_merge` must be a JSON object (RFC 7386 merge-patch; null deletes a key)."
  validation.metadata_size: "serialized `metadata` is over its cap. Trim keys by setting them to null via `metadata_merge`, or move bulk content into the body or a comment."
  validation.include: "an `include=` value is not one this endpoint offers. The message lists the valid ones."
  validation.include_archived: "`include_archived` must be true or false."
  validation.archived: "the `archived` filter must be one of `only`, `all`, `active`."
  validation.transitive: "`transitive` must be true or false."
  validation.direction: "the dependency `direction` must be one of `blocked_by`, `blocks`, `both`."
  validation.target: "a promotion needs a non-empty `target` — the stage the work reached, e.g. staging, production."
  validation.promotion: "a promotion field is over its byte limit."
  validation.ttl: "`ttl_seconds` on a claim is outside this project's bounds. An admin can change them with PUT /projects/{id}/claim-ttl."
  validation.kind: "the question kind is not one of the four, or the operation asked for something that kind does not carry — only a `choose` question has options."
  validation.mode: "the question mode must be `blocking`, which parks and resumes the ticket, or `advisory`, which is routed and recorded with no state change."
  validation.urgency: "the urgency is not one of the known values."
  validation.on_timeout: "`on_timeout` is not one of `recommended`, `escalate`, `cancel` — or is `cancel` on an advisory question, which gates nothing."
  validation.options: "`options` must be an array of strings, or of {value, desc} objects each carrying a string `value`."
  validation.option_notes: "option descriptions must pair 1:1 with the options, and each stay within its length limit."
  validation.multi: "`multi` is only meaningful on a `choose` question."
  validation.recommended: "the recommendation is not among the options."
  validation.recommended_multi: "a `recommended_multi` entry is not among the options."
  validation.recommended_note: "`recommended_note` must be a string, or null to clear it, within its length limit."
  validation.confidence: "`confidence` must be an integer 1-4 — 1 tentative, 2 moderate, 3 strong, 4 very strong."
  validation.expertise: "too many expertise tags, or one outside its length bounds."
  validation.summary: "`summary` is over its length limit."
  validation.answer: "the answer does not fit the question's kind: a boolean for confirm and approve, an option string (an array when `multi`) for choose, text for clarify."
  validation.answer_required: "`answer` is required. A note goes inside it: {\"answer\": {\"value\": …, \"note\": \"…\"}}."
  validation.resume_to: "the `resume_to` requested is not a legal next state from where the ticket is parked. The message lists the legal targets."
  validation.message: "a follow-up message is empty, or over its byte limit."
  validation.reason: "the reason is over its byte limit."
  validation.tag_kind: "a tag kind must match ^[a-z][a-z0-9-]*$ within its length bound, e.g. person, component, team."
  validation.tag_handle: "a tag handle must match ^[a-z0-9][a-z0-9._-]*$ within its length bound. The display name goes in `label`."
  validation.tag_ref: "a tag reference must be `kind:handle`, e.g. `person:ada`. It names an entity in the project's tag registry."
  validation.tag_label: "a tag label is over its length limit."
  validation.tag_meta: "tag `meta`, or `meta_merge`, must be a JSON object."
  validation.tag_meta_size: "serialized tag `meta` is over its cap."

  # -- the catch-all ----------------------------------------------------------
  internal: "an invariant failed server-side — a database error, a poisoned lock. The message is deliberately generic so SQL text and schema names never reach a client; the detail is in the server log. Nothing a caller can act on beyond retrying."
