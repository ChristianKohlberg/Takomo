[package]
name = "takomo"
version = "0.3.0"
edition = "2021"
description = "Central task store for AI agent fleets: tickets, enforced workflows, atomic claims/leases, append-only event log"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.8", features = ["json", "ws"] }
# Named features rather than "full": this binary uses `time` (sleep, sleep_until,
# interval, timeout), `net` (TcpListener), `sync` (Notify), `rt-multi-thread` (the
# runtime and tokio::spawn) and `macros` (#[tokio::main], #[tokio::test], select!).
# Nothing here touches tokio's fs, process, signal or io stacks. Adding a feature
# back is a one-line change — leaving "full" hides which of them the server relies on.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Workflow definitions are authored in YAML (workflows/*.yaml, spec/workflow-format.md),
# so the parser is what makes a typo like `require:` a hard error instead of a silently
# dropped approval gate — see the deny_unknown_fields note in src/workflow.rs.
# serde_norway is a maintained fork of dtolnay's serde_yaml, which was archived in March
# 2024 and publishes as 0.9.34+deprecated. Picked over the other live fork (serde_yaml_ng)
# because it is still the 0.9 API, so the parse behaviour this depends on is unchanged; it
# keeps the MIT OR Apache-2.0 licensing; and it also replaces the archived `unsafe-libyaml`
# backend — where the unsafe parsing code actually lives — with a fork that is not archived.
serde_norway = "0.9"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
# Attachment transport for initiative entries. JSON cannot carry bytes, so an
# uploaded document arrives as `content_base64` and is decoded before it ever
# reaches the store — the store's byte caps then bound the real payload, not its
# 4/3-inflated encoding. Standard alphabet with padding, strictly validated: a
# malformed upload must be a 422, never silently truncated bytes.
base64 = "0.22"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
# IANA time-zone data for chrono, used by src/schedule.rs to compute a recurring
# slot in LOCAL time. Without it slots could only be UTC, and "every Monday at
# 09:00" would silently become 10:00 for the half of the year a zone is on
# summer time — wrong for the feature's headline case. Data-only (a generated
# table plus a `TimeZone` impl): no unsafe, no network, no build-time download,
# and it tracks the IANA database rather than encoding today's rules.
chrono-tz = "0.10"
async-stream = "0.3"
futures-core = "0.3"
# Official Rust MCP SDK. Hosts the streamable-HTTP MCP server transport in-process
# so agents can `claude mcp add --transport http .../mcp` instead of running the
# Node stdio wrapper. Tool input schemas use rmcp's re-exported `schemars`.
rmcp = { version = "2.2", features = ["server", "macros", "transport-streamable-http-server"] }
# Outbound notifications for the "ask a human" board. Both are OFF unless the
# operator configures TAKOMO_NOTIFY (see src/notify.rs), keeping the default
# deploy secret-free. reqwest drives the Slack/generic-webhook transports;
# lettre drives the SMTP email transport. rustls everywhere — no system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "tokio1", "hostname"] }
yrs = "0.27"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures = "0.3"
tempfile = "3"
# Also a normal dependency; declared here so integration tests can build a
# pre-migration (old-schema) database by hand to prove the additive migration.
rusqlite = { version = "0.32", features = ["bundled"] }
# Also a normal dependency; declared here so the MCP tests can encode an
# attachment the way a caller would — including one byte over the cap, which is
# the only honest way to prove the cap is enforced on the decoded bytes.
base64 = "0.22"
# Also a normal dependency; declared here so the document tests can build real
# Yjs updates the way a browser peer would. Asserting the sync protocol against
# hand-written bytes would only prove this server agrees with itself.
yrs = "0.27"
# A real WebSocket client for the sync tests. The properties worth checking here
# — does a second peer see the first one's edit, does the text survive a restart
# — only exist over an actual socket, so these are integration tests on purpose.
tokio-tungstenite = "0.29"

[profile.release]
lto = true
