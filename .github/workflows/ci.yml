name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (build · clippy · fmt · test)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Build (release)
        run: cargo build --release

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (release)
        run: cargo test --release

  deps:
    name: No unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cargo.toml is how a reader learns what this crate actually uses, and it
      # had drifted: `tower` and `tokio-stream` were declared with zero call
      # sites, kept alive only transitively by axum/rmcp — so nothing failed and
      # nothing noticed. cargo-machete reads the sources rather than building, so
      # this whole job is a download plus ~0.1s of work; it is not on the
      # critical path of the Rust job.
      #
      # Pinned release tarball rather than the upstream composite action, which
      # is only published at @main: this repo pins its other third-party tools
      # (@redocly/cli@2.40.0) and an unpinned action is remote code. The checksum
      # is the published one for this asset — bump both lines together.
      #
      # False positives are possible (a dep used only through a macro can look
      # unused). The fix is `[package.metadata.cargo-machete] ignored = [...]` in
      # Cargo.toml with a comment saying why, never deleting the check.
      - name: Unused dependency check (cargo-machete)
        run: |
          set -euo pipefail
          ver=0.9.2
          url="https://github.com/bnjbvr/cargo-machete/releases/download/v${ver}/cargo-machete-v${ver}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSLf -o "$RUNNER_TEMP/machete.tar.gz" "$url"
          echo "48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9  $RUNNER_TEMP/machete.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/machete.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/cargo-machete-v${ver}-x86_64-unknown-linux-musl/cargo-machete"

  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck is preinstalled on GitHub-hosted ubuntu runners.
      # .handrail/*.sh was outside this list until takomo-u2k4: the gate scripts
      # are the repo's own norm detectors, and a syntax slip in one of them
      # degrades to a silent skip rather than a visible failure. -x follows the
      # `source=` directive into .handrail/hr-changed.sh. scripts/ is globbed
      # rather than listed file by file, so the next script added there is
      # covered by existing, rather than by remembering.
      - name: ShellCheck
        run: shellcheck -x clients/cli/takomo clients/cli/install.sh scripts/*.sh .handrail/*.sh .handrail/adapters/*.sh

  copies:
    name: Duplicated files stay in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The plugin ships the same agent-facing skill as clients/claude-skill,
      # because a plugin must be self-contained — a marketplace install gets only
      # plugins/takomo/. That makes it a copy, and copies drift: the plugin's
      # went two features stale (the commit-proof rule and tagging) while both
      # files were still being edited. Cheap to assert, expensive to miss, since
      # the symptom is an agent quietly following outdated instructions.
      - name: Agent skill (client vs plugin)
        run: diff -u clients/claude-skill/takomo/SKILL.md plugins/takomo/skills/takomo/SKILL.md

  spec:
    name: OpenAPI spec (valid 3.1 + loadable everywhere)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The spec is the published contract (README points at it), but nothing
      # used to load it — so it drifted twice over, in ways a human reading the
      # file cannot see:
      #   * unquoted plain scalars in flow mappings broke parsing outright, and
      #   * a comma inside an unquoted description silently truncated the
      #     sentence and turned its tail into a junk key, while `nullable: true`
      #     (3.0 syntax) was ignored outright by 3.1 tooling.
      # The second class PARSES FINE, so a parse check alone is false comfort —
      # hence the schema validation below is the primary gate.
      - name: Validate against the OpenAPI 3.1 schema (Redocly)
        run: npx --yes @redocly/cli@2.40.0 lint spec/openapi.yaml --config spec/redocly.yaml

      # Cross-language loadability, on top of schema validity: the spec is meant
      # to be consumed by whatever a client is written in. Two parsers on purpose
      # — PyYAML and Psych reject *different* constructs (a bare `:` in a flow
      # scalar passes PyYAML and fails Psych), so either one alone gives false
      # confidence. Both are preinstalled on the runner.
      # Explicit setup rather than trusting the runner image's system Python to
      # carry PyYAML — a red build from a missing dev dependency teaches nothing.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Loads in Python (PyYAML)
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import sys, yaml
          with open("spec/openapi.yaml", encoding="utf-8") as f:
              doc = yaml.safe_load(f)
          missing = [k for k in ("openapi", "info", "paths") if k not in doc]
          if missing:
              sys.exit(f"spec/openapi.yaml parses but is not an OpenAPI document: missing {missing}")
          print(f"ok - OpenAPI {doc['openapi']}, {len(doc['paths'])} paths")
          PY

      - name: Loads in Ruby (Psych — stricter on flow scalars)
        run: ruby -ryaml -e 'YAML.load_file("spec/openapi.yaml"); puts "ok - Psych accepts it too"'

  web:
    name: web (typecheck, lint, tests, size, dist is current)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # This replaces the old `spa` job, which ran eslint over JavaScript
      # extracted from inside the hand-written HTML pages. Those pages are gone;
      # `web/` is an ordinary TypeScript project, so it gets ordinary gates —
      # and four the old arrangement could not have: a typechecker, unit tests,
      # a per-page size budget, and the check below.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # `web/dist/*.html` is COMMITTED, because `cargo build --release` embeds it
      # with `include_str!` and must stay node-free on Render and in the
      # Dockerfile. That makes it the one build output that can go stale in the
      # repo: edit `web/src/`, forget `npm run build`, and the binary keeps
      # serving the previous page while every test here passes. So rebuild it and
      # fail if the result differs from what was committed.
      - name: Build the four pages
        run: npm run build

      - name: web/dist is current
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::web/dist/ is stale — run 'npm run build' in web/ and commit the result."
            git diff --stat -- dist
            exit 1
          fi
          echo "ok - web/dist matches a fresh build"

      - name: Per-page size budget
        run: npm run size

  docker:
    name: Docker image (builds · serves all four pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This job exists because the Dockerfile's "anything the source embeds
      # from outside src/ has to be copied here too" comment had nothing behind
      # it. The four pages used to be src/*.html, carried by `COPY src ./src`;
      # once they moved to web/dist/*.html the image stopped building entirely,
      # and every other job stayed green because none of them builds it.
      # Render is unaffected (it uses the native rust runtime, not this file),
      # which is exactly what made the break easy to miss.
      - name: Build the image
        run: docker build -t takomo-ci .

      # Building is not enough: `include_str!` could be satisfied by an empty or
      # stale file. Run it and check the pages actually come out.
      - name: It serves all four pages
        run: |
          docker run -d --name takomo-ci -p 8080:8080 takomo-ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz >/dev/null || {
            echo "::error::container never became healthy"; docker logs takomo-ci; exit 1;
          }
          for page in board inbox initiatives schedules; do
            if ! curl -fsS "http://127.0.0.1:8080/$page" | grep -q 'id="root"'; then
              echo "::error::/$page did not serve the web build (no React mount point)"
              exit 1
            fi
            echo "ok - /$page"
          done
          docker rm -f takomo-ci >/dev/null

  mcp:
    name: MCP typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/mcp
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc typecheck)
        run: npm run build
