id: route-test-pairing
# Instance of cookbook/patterns/pairing-detector. Waivable, not blocking: the
# heuristic has legitimate misses (pure refactors, error-message tweaks) — fix
# it by adding a test, or put the reason on the record with `handrail waive`.
#
# CEILING: this asks whether anything under tests/ carries a SUBSTANTIVE
# (non-whitespace) change alongside the surface change. It cannot tell whether
# that test exercises the code you changed — tests here drive the HTTP surface
# through TestApp helpers, so the route under test rarely appears as a literal
# anywhere near the diff. Whether a changed line is actually executed by the
# suite is a coverage question, not a git-diff question.
expectation: New or changed HTTP surface ships with an integration test that exercises it.
desc: Flags touched src/api/*, src/server.rs route wiring, src/mcp.rs, or src/store with no substantive change under tests/.
kind: detector
semantics: waivable
cmd: HR_PRIMARY='src/api src/mcp.rs src/store' HR_PAIRED='tests' bash .handrail/route-test-pairing.sh
paths: [src/api, src/server.rs, src/mcp.rs, src/store]
order: 30
