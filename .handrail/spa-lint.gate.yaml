id: spa-lint
# Mechanical verdict over the thousands of lines of JavaScript inside the single-file
# SPAs, which had no lint lane of any kind until takomo-rrjg — clippy
# had the Rust, shellcheck the shell, Redocly the spec, and nothing at all the
# SPAs. The ruleset is small and defect-only (no style), so a red here is always
# something to fix, never something to argue with.
#
# Marked slow: unlike every other gate here it is not offline. It fetches a
# pinned eslint through npx, which is a few seconds warm and rather longer cold.
# With no network the script exits 2 — "cannot check", the same posture
# openapi-sane.sh takes on a missing PyYAML — so being offline reports as
# skipped rather than as a defect. CI has the network and is the wall.
expectation: The JavaScript in the single-file SPAs stays free of duplicate keys, undefined names, dead bindings and parse errors.
desc: Runs a pinned eslint over the inline <script> of every SPA in src/, reporting at the real HTML line. Skips (exit 2) when eslint cannot be fetched.
kind: verdict
semantics: blocking
cmd: bash scripts/lint-spa.sh
# One entry per SPA, and adding a page means adding it here too. This list is what
# binds the recorded verdict to the content it was taken over, so a page missing
# from it keeps a green verdict alive across edits that could have broken it —
# which is what takomo-z1ko left behind when it added the third page and updated
# only the script.
#
# It does NOT make `--changed` pick this gate up: the gate is `slow`, and
# `--changed` runs the non-slow ones. Name it (`handrail run spa-lint`) or let CI
# be the wall.
paths: [src/board.html, src/inbox.html, src/initiatives.html, src/spa-common.js, scripts/lint-spa.sh, scripts/spa-eslint.config.mjs]
slow: true
order: 50
