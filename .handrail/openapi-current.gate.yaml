id: openapi-current
# Instance of cookbook/patterns/process-norm. Waivable: the OpenAPI spec is the
# published HTTP contract, so route changes should update it — but internal-only
# handler edits legitimately don't, so record the reason instead of hard-failing.
#
# CEILING, stated so nobody reads more into a green than is there: this asks
# whether spec/openapi.yaml carries a SUBSTANTIVE (non-whitespace) change
# alongside the surface change. It does not check that the spec change describes
# the route you touched — a git diff cannot know that. The check that compares
# the real router against the real spec belongs in tests/, where CI runs it on
# every commit and neither a waiver nor an untouched file can dodge it. Treat
# this gate as a prompt, not as proof the contract is current.
expectation: When the HTTP surface changes, spec/openapi.yaml is updated to match — the spec is the contract.
desc: Flags touched src/api/*, src/server.rs route wiring, src/mcp.rs, or src/store shipping without a substantive spec/openapi.yaml change.
kind: detector
semantics: waivable
cmd: HR_SURFACE='src/api src/mcp.rs src/store' HR_RECORD='spec/openapi.yaml' bash .handrail/openapi-current.sh
paths: [src/api, src/server.rs, src/mcp.rs, src/store]
order: 40
