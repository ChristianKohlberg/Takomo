# Render Blueprint — Takomo
#
# Deploy in one click with the "Deploy to Render" button in the README, or
# apply manually: Render dashboard > New + > Blueprint > connect this repo.
#
# The persistent disk gives SQLite durable storage across deploys; /healthz is
# the readiness probe. The first admin token is minted over `render ssh` against
# the mounted DB (`takomo --db /var/data/takomo.db token create ...`) —
# see spec/auth.md.
#
# Off-box continuous backup (Litestream) is prepared but off by default; see the
# "Backups" section of the README to turn it on with your own bucket + keys.
services:
  - type: web
    name: takomo
    runtime: rust
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: ./scripts/build.sh
    startCommand: ./target/release/takomo --db /var/data/takomo.db serve --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # takomo refuses non-loopback binds unless this is set; Render
      # terminates TLS in front of the service.
      - key: TAKOMO_ALLOW_PUBLIC_BIND
        value: "1"
      # The public origin this service is reached at, e.g.
      # https://takomo.example.com — no path, no trailing slash. Render asks for
      # it when you apply the blueprint (`sync: false`), because it differs per
      # deployment and a value baked in here would be wrong for everyone but its
      # author: a client compares the OAuth issuer against the URL it fetched
      # discovery from, byte for byte, so someone else's host means every hosted
      # connector fails with an unexplained "couldn't reach the MCP server".
      #
      # Leave it blank and the server still runs — it just answers 404 on the
      # OAuth endpoints, so claude.ai / ChatGPT / the Gemini app cannot connect
      # at all, while local clients carrying a bearer token are unaffected. The
      # startup line reports which of the two you got. See
      # docs/hosted-mcp-clients.md.
      - key: TAKOMO_PUBLIC_URL
        sync: false
    disk:
      name: takomo-data
      mountPath: /var/data
      sizeGB: 1
